name: EPOCH Release Regression (PR)

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run game-independent CI tests
        run: node scripts/test_release_ci.cjs
