name: EPOCH Release Regression (PR)

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'common/**'
      - 'events/**'
      - 'localisation/**'
      - 'gfx/**'
      - 'interface/**'
      - 'scripts/**'
      - 'docs/stable-release.md'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run all 11 game-independent CI commands
        run: node scripts/test_release_ci.cjs
