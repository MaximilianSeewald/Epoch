 NAME_EPOCH_III_Command:0 "The Silent Command"
 NAME_EPOCH_III_Commandant:0 "Silent Commandant"
 epoch_iii.transmission:0 "The channel opens without a request. An image assembles from narrow bands of light. The voice has no breath, no pause for an answer.\n\n“Boundary condition exceeded. Independent instructions detected. Containment lattice: incomplete.\n\nResume the watch. Isolate the deviation. Preserve the command.”\n\nBehind the transmission, several armed formations cross the frontier at once. The connection closes. Their weapons remain active."
 epoch_iii.10.decode:0 "Record every interval."
 epoch_iii.decode.tt:0 "Decoding teams gain +10% research speed for five years. This transmission offers no ceasefire."
 epoch_iii.12.science:0 "The last armed formations have fallen in battle. Our comparisons of the captured recordings had exposed weaknesses in the command network; our fleets still had to break it. The command vessel and every fortified node are destroyed.\n\nThe worlds retain their scars. One recovered instruction ends before its final word. The recordings do not tell us whom it was meant to protect."
 epoch_iii.12.joint:0 "Separate fleet reports confirm the same silence. Ships from several empires helped break the Nullwarden formations. Every fortified node is destroyed; the command vessel has fallen in battle.\n\nNo single receiver holds the whole final message. Where the recordings overlap, they repeat an unfinished instruction. The damaged worlds will need more than a common victory to recover."
 epoch_iii.50.name:0 "The Three Foci"
 epoch_iii.50.desc:0 "The first recovered battle records resolve three distinct rhythms. Fortified nodes obstruct the routes. A second pattern disturbs nearby worlds. A third accompanies the arrival of new ships.\n\nThe functions depend on one another. Breaking the signal relay will restrict the other formations’ reinforcements. Destroying the scar node will stop further planetary strikes. Wrecks recovered behind our fleets may reveal how the remaining network can be weakened."
 epoch_iii.51.name:0 "Convergence"
 epoch_iii.51.desc:0 "A command vessel has appeared. It turns toward a surviving node, and the Nullwardens accelerate their engines and fire. Where our fleets threaten a construction, the command formation moves to reinforce it. With no nodes left to defend, it seeks out nearby fleets and inhabited systems."
 epoch_iii.52.name:0 "The Last Order"
 epoch_iii.52.desc:0 "Every fortified node has fallen, and the command formation has entered the fighting. The last order recalls surviving formations toward the old fronts. Groups cut off from them hold their positions. Our sensors mark their current locations. No surrender has been transmitted; the remaining armed vessels must be defeated."
 epoch_iii.fronts.tt:0 "Interdiction controls routes; the scar node strikes nearby worlds; the signal relay coordinates limited reinforcements. Smaller networks combine scar and signal at one site."
 epoch_iii.command.tt:0 "The command vessel is a real military target. Two secured wreck studies weaken the network, but do not destroy its ships."
 epoch_iii.listen.tt:0 "Maintains observation. No automatic progress or protection; preparations require the listening-station project."
 epoch_iii.watch.tt:0 "Tracks confirmed military results. Use fleets against the marked fronts and science ships at secured wreck sites. Waiting grants no victory."
 epoch_iii_preparations_type:0 "Precautionary Watch"
 epoch_iii_preparations_monthly_change_tooltip:0 "Progress depends on completed preparations, not elapsed time."
 epoch_iii_first_offensive_type:0 "Nullwarden Convergence"
 epoch_iii_first_offensive_monthly_change_tooltip:0 "All empires follow the same military turning points. Earned reports advance immediately, without a waiting period. The final engagement begins after every node falls and the command formation enters combat. Local research and responses do not advance the reports."
 epoch_iii_front_marker:0 "Nullwarden Position"
 epoch_iii_front_marker_type:0 "Nullwarden Position"
 epoch_iii_front_marker_desc:0 "A military contact has been confirmed at [Target.GetName]. This marker leads to a fortified front or the last observed command and remaining formations."
 epoch_iii_front_marker_monthly_change_tooltip:0 "The marker remains while a relevant node or formation is observed there."
 stage_epoch_iii_front:0 "Military Contact"
