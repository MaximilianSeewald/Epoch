 NAME_EPOCH_III_Signal_Relay:0 "Signal Relay"
 NAME_EPOCH_III_Reserve:0 "Reserve Anchor"
 epoch_iii.front.interdiction:0 "This node also strengthens every Nullwarden shield by 20%. Destroying it weakens the other fronts. The bastion at [Target.GetName] obstructs the routes and supplies attack formations. Destroy its armed node in combat to stop its reinforcements and open a wreck study. Other fronts remain active."
 epoch_iii.front.scar:0 "The node at [Target.GetName] strikes worlds belonging to adjacent empires. Destroying its armed node stops further strikes. In smaller networks it also coordinates the other fronts' supply rhythm. Signal Buffering protects affected worlds; existing damage remains."
 epoch_iii.front.signal:0 "The relay at [Target.GetName] coordinates arrivals throughout the network. Destroying it stops local reinforcement and restricts every other source to three lifetime sorties. Already deployed formations remain dangerous."
 epoch_iii.front.reserve:0 "The reserve anchor at [Target.GetName] supplies another independent attack front. It still depends on the signal network. Destroy it in combat to stop its local reinforcement and expose the wreck site."
 NAME_EPOCH_III_Hunters:0 "Nullwarden Spearhead"
 NAME_EPOCH_III_Enforcer:0 "Nullwarden Enforcer"
 NAME_EPOCH_III_Anchor:0 "Convergence Anchor"
 epoch_iii.5.name:0 "An Answer Without a Voice"
 epoch_iii.5.desc:0 "The recordings from the silent network have changed. Gaps that once seemed random now recur at precise intervals. Every receiver hears the same absence. Someone on the watch calls it an answer. No one can say what question was asked.\n\nOur scientists propose independent listening stations and isolated control circuits. They cannot predict what is coming. They can keep a disturbance from reaching every system at once."
 epoch_iii.10.name:0 "The Answering Signal"
 epoch_iii.10.desc:0 "Across unrelated worlds, instruments have begun correcting measurements that were never wrong. Harvest controls stop in perfect synchrony. Power grids repeat instructions from an unknown source.\n\nAn armed formation has appeared near [epoch_iii_front_location.GetName]. Its vessels ignore hails and advance along the hyperlanes. Behind them hangs a stationary construction. Each time it pulses, distant receivers fall silent. We have begun calling these vessels Nullwardens."
 epoch_iii.10.hive:0 "A silence has entered the shared rhythm. Drones on distant worlds pause together, waiting for an impulse that does not belong to us. Maintaining their separation consumes effort.\n\nAn armed formation advances from [epoch_iii_front_location.GetName]. A stationary construction remains behind it, repeating the same interval. The vessels we call Nullwardens answer neither challenge nor invitation."
 epoch_iii.10.machine:0 "Independent processing nodes report identical corrections from an unrecognized sender. The checksums agree. The instructions do not. Isolating affected circuits reduces productive capacity.\n\nArmed vessels advance from [epoch_iii_front_location.GetName]. A stationary construction repeats the disturbance behind them. The designation Nullwarden has been assigned. Their origin and intent remain undetermined."
 epoch_iii.10.respond:0 "Mobilize the shipyards."
 epoch_iii.11.desc:0 "In the recovered targeting records, our colonies appear as interruptions in an otherwise regular pattern. The crews have begun turning off their receivers between watches. The same interval is audible in the silence between engine cycles.\n\nThe laboratories disagree about its meaning. They agree that it can be measured."
 epoch_iii.12.name:0 "The Unfinished Order"
 epoch_iii.12.desc:0 "The command vessel breaks apart. Across the old fronts, the surviving Nullwardens turn away. Their weapons cease searching for targets. Some follow the hyperlanes toward the silent constructions; others scatter beyond our tracking range.\n\nThe damaged worlds remain. In the wreckage, an instruction repeats without an addressee: Preserve... Nothing follows it. The remaining emplacements go dark."
 epoch_iii.12.continue:0 "Keep listening."
 epoch_iii.acknowledge:0 "Understood."
 epoch_iii.prepare:0 "Build independent listening stations."
 epoch_iii.prepare.tt:0 "Opens a project costing 900 Physics Research. It must finish before the disturbance begins. Completed precautions reduce initial planetary disruption and allow immediate Signal Buffering; they cannot prevent hostile fleets."
 epoch_iii.research:0 "Isolate the recurring interval."
 epoch_iii.research.tt:0 "Opens a project costing 1200 Physics Research. Grants +10% damage against Nullwardens while the crisis lasts, for at most ten years, and unlocks Signal Buffering. Removes additional fleet upkeep for mobile empires."
 epoch_iii.first_objectives:0 "Destroy all marked anchors and the unique command ship in combat. Secured wreck studies weaken hostile weapons and reinforcements. Remaining formations withdraw after the command network collapses."
 epoch_iii.anchor_goal:0 "Fortified nodes supply several mobile formations. Destroying one stops its own reinforcements; the signal relay also restricts other nodes."
 epoch_iii.remaining_goal:0 "Destroy the unique command ship in combat. Once it and all anchors are destroyed, the crisis ends and surviving formations withdraw. No hunt for minor fleets is required."
 epoch_iii.buffer.tt:0 "Only the additional signal disruption is reduced. Existing planetary features, investigations and permanent damage remain."
 EPOCH_III_PREPARE:0 "Independent Listening Stations"
 EPOCH_III_PREPARE_DESC:0 "Separate receiver circuits and compare their readings with recovered network recordings. The work must finish before the expected disturbance; unfinished stations offer no protection."
 EPOCH_III_COUNTERHARMONICS:0 "The Recurring Interval"
 EPOCH_III_COUNTERHARMONICS_DESC:0 "Independent laboratories study the interference. Calibrated weapons gain 10% damage against Nullwardens; affected worlds can enact Signal Buffering. This research does not destroy hostile vessels."
 decision_epoch_iii_buffer:0 "Signal Buffering"
 decision_epoch_iii_buffer_desc:0 "Separate planetary control systems from the repeating signal. Requires listening stations or counterharmonic research during the crisis; available directly afterward. Stops further escalation and reduces initial disruption. Existing escalation and older damage require treatment."
 epoch_iii_preparations:0 "The Unanswered Watch"
 epoch_iii_preparations_desc:0 "The silent network's intervals are changing. Use the listening-station briefing to fund precautions while there is still time. Preparations require actual research; waiting grants no protection."
 epoch_iii_first_offensive:0 "The Nullwarden Convergence"
 epoch_iii_first_offensive_desc:0 "Across the threatened routes, the Nullwardens repeat an order no one remembers giving. The constructions answer one another. Worlds between them have begun to answer too."
 stage_epoch_iii_listening:0 "Listening in the Silence"
