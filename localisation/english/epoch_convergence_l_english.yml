 epoch_iii.5.name:0 "An Answer Without a Voice"
 epoch_iii.5.desc:0 "The recordings from the silent network have changed. Gaps that once seemed random now recur at precise intervals. Every receiver hears the same absence. Someone on the watch calls it an answer. No one can say what question was asked.\n\nOur scientists propose independent listening stations and isolated control circuits. They cannot predict what is coming. They can keep a disturbance from reaching every system at once."
 epoch_iii.10.name:0 "The Answering Signal"
 epoch_iii.10.desc:0 "Across unrelated worlds, instruments have begun correcting measurements that were never wrong. Harvest controls stop in perfect synchrony. Power grids repeat instructions from an unknown source.\n\nAn armed formation has appeared near [epoch_iii_front_location.GetName]. Its vessels ignore hails and advance along the hyperlanes. Behind them hangs a stationary construction. Each time it pulses, distant receivers fall silent. We have begun calling these vessels Nullwardens."
 epoch_iii.10.hive:0 "A silence has entered the shared rhythm. Drones on distant worlds pause together, waiting for an impulse that does not belong to us. Maintaining their separation consumes effort.\n\nAn armed formation advances from [epoch_iii_front_location.GetName]. A stationary construction remains behind it, repeating the same interval. The vessels we call Nullwardens answer neither challenge nor invitation."
 epoch_iii.10.machine:0 "Independent processing nodes report identical corrections from an unrecognized sender. The checksums agree. The instructions do not. Isolating affected circuits reduces productive capacity.\n\nArmed vessels advance from [epoch_iii_front_location.GetName]. A stationary construction repeats the disturbance behind them. The designation Nullwarden has been assigned. Their origin and intent remain undetermined."
 epoch_iii.10.respond:0 "Mobilize the shipyards."
 epoch_iii.11.desc:0 "In the recovered targeting records, our colonies appear as interruptions in an otherwise regular pattern. The crews have begun turning off their receivers between watches. The same interval is audible in the silence between engine cycles.\n\nThe laboratories disagree about its meaning. They agree that it can be measured."
 epoch_iii.12.name:0 "The Unfinished Order"
 epoch_iii.12.desc:0 "The command vessel breaks apart. Across the old fronts, the surviving Nullwardens turn away. Their weapons cease searching for targets. Some follow the hyperlanes toward the silent constructions; others scatter beyond our tracking range.\n\nThe damaged worlds remain. In the wreckage, an instruction repeats without an addressee: Preserve... Nothing follows it. The remaining emplacements go dark."
 epoch_iii.12.continue:0 "Keep listening."
 epoch_iii.acknowledge:0 "Understood."
