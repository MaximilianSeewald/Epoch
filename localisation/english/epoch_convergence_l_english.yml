 epoch_iii_listen:0 "Maintain the watch"
 epoch_iii_listen_desc:0 "Continue normal operations while deciding whether to prepare."
 epoch_iii_prepare_report:0 "Listening-station briefing"
 epoch_iii_prepare_report_desc:0 "Reopen the proposal and its funding choices."
 epoch_iii_watch:0 "Defend the routes"
 epoch_iii_watch_desc:0 "Rebuild fleets and engage hostile formations."
 epoch_iii_briefing:0 "Defensive briefing"
 epoch_iii_briefing_desc:0 "Review military objectives and fund counterharmonic research."
 epoch_iii_pressure_prepared:0 "Buffered Interference"
 epoch_iii_pressure_experienced:0 "Resonant Interference"
 epoch_iii_pressure_unprepared:0 "Unshielded Interference"
 epoch_iii_pressure_buffered:0 "Isolated Control Systems"
 epoch_iii_mobile_disruption:0 "Disrupted Fleet Coordination"
 epoch_iii_counterharmonics:0 "Counterharmonic Calibration"
 epoch_iii_pressure_prepared_desc:0 "Independent receivers limit the disturbance, but cannot prevent every interruption."
 epoch_iii_pressure_experienced_desc:0 "Familiar intervals recur across planetary control systems. Knowledge alone does not isolate them."
 epoch_iii_pressure_unprepared_desc:0 "The repeating signal reaches unshielded control systems, interrupting work and coordination."
 epoch_iii_pressure_buffered_desc:0 "Isolated control circuits reduce the additional disturbance. Older planetary damage remains."
 epoch_iii_mobile_disruption_desc:0 "Repeated false instructions increase the effort needed to maintain our fleets."
 epoch_iii_counterharmonics_desc:0 "Knowledge of the recurring interval improves weapon calibration."
 decision_epoch_iii_briefing:0 "Counterharmonic Research"
 decision_epoch_iii_briefing_desc:0 "Reopen the research proposal. It remains available after the fighting ends, allowing damaged worlds to obtain Signal Buffering."
 epoch_iii_mobile_disruption_experienced:0 "Recognized Signal Disruption"
 epoch_iii_mobile_disruption_experienced_desc:0 "Knowledge of the signal limits the additional effort required to maintain our fleets."
 epoch_iii_mobile_disruption_prepared:0 "Buffered Fleet Coordination"
 epoch_iii_mobile_disruption_prepared_desc:0 "Independent receivers limit the additional effort required to maintain our fleets."

