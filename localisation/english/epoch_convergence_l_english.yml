 NAME_EPOCH_III_Commandant:0 "Silent Commandant"
 epoch_iii.transmission:0 "The channel opens without a request. An image assembles from narrow bands of light. The voice has no breath, no pause for an answer.\n\n'Boundary condition exceeded. Independent instructions detected. Containment lattice: incomplete.\n\nResume the watch. Isolate the deviation. Preserve the command.'\n\nBehind the transmission, several armed formations cross the frontier at once. The connection closes. Their weapons remain active."
 epoch_iii.10.decode:0 "Record every interval."
 epoch_iii.decode.tt:0 "Research speed: +10% for 5 years."
 epoch_iii.12.science:0 "The interval our scientists traced breaks off with the command vessel. Every fortified construction is silent. Surviving formations abandon their attack vectors and disperse toward the old fronts.\n\nOur recordings explain how the network held together. They do not tell us whom it was meant to protect. On the affected worlds, the damage outlasts the signal. The remaining emplacements go dark."
 epoch_iii.12.joint:0 "Reports from separate fleets record the same sudden silence. The command vessel is destroyed; every fortified node has fallen. Surviving Nullwardens abandon their attacks and scatter toward the old fronts.\n\nNo single receiver holds the whole final message. Where the recordings overlap, they repeat an unfinished instruction. The damaged worlds will need more than a common victory to recover. The remaining emplacements go dark."
 epoch_iii.50.name:0 "The Three Foci"
 epoch_iii.50.desc:0 "Three rhythms emerge from the battle recordings. One passes between the fortified constructions. Another is answered by instruments on inhabited worlds. The third precedes each arrival of new ships.\n\nA damaged Nullwarden continues to transmit after its weapons fall silent. For a moment, the other vessels turn toward it. Then they resume firing."
 epoch_iii.51.name:0 "Convergence"
 epoch_iii.51.desc:0 "Every receiver opens on the same empty image. The old voice returns, stripped of its pauses.\n\nBOUNDARY WATCH: FAILED.\nLOCAL AUTHORITY: REVOKED.\nFINAL CUSTODY PROTOCOL: ACTIVE.\n\nA vast vessel crosses the interference. Around it, the scattered formations turn in perfect unison.\n\nPRESERVE THE COMMAND. NO FURTHER ACKNOWLEDGMENT REQUIRED."
 epoch_iii.52.name:0 "The Last Order"
 epoch_iii.52.desc:0 "The constructions are silent. Their last pulses arrive out of order, as though distance has briefly lost its meaning. The command vessel repeats a single instruction. None of the broken nodes answers.\n\nFor the first time, there is hesitation in the Nullwardens' movements."
