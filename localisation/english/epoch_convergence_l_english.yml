 stage_epoch_iii_answer:0 "The Answering Signal"
 epoch_iii_first_offensive_stage_epoch_iii_answer:0 "$stage_epoch_iii_answer$"
 epoch_iii.answer_goal:0 "Hostile contacts have appeared at the marked fronts. The shared watch follows their first crossing of an inhabited border or their first confirmed combat loss."
 epoch_iii.local_response:0 "This response affects our own defenses. Monthly allocations double at 8 colonies, quadruple at 20 and reach eight times the base amount at 40 colonies. Galactic reports still follow shared military turning points."
 epoch_iii_mobilize:0 "Mobilize the shipyards"
 epoch_iii_mobilize_desc:0 "Accelerate shipyard construction by 10%, paying 10% more for ships and 5% more ship upkeep. Monthly allocations increase with the number of colonies. These costs also apply while rebuilding after a defeat."
 epoch_iii_analyze:0 "Analyze hostile systems"
 epoch_iii_analyze_desc:0 "Target analysis grants 10% more damage against Nullwardens only. Diverted specialists reduce technology research speed by 5% and shipyard build speed by 10%. Reopens the paid counterharmonic proposal. Monthly energy allocations increase with colony count."
 epoch_iii_shield:0 "Prioritize planetary shielding"
 epoch_iii_shield_desc:0 "Relieve additional signal disruption on affected worlds only. Precautions divert 2% of job output throughout our empire and consume monthly energy and minerals, increasing with colony count. Permanent Signal Buffering remains a separate planetary decision."
 epoch_iii_counterattack:0 "Prepare a coordinated counteroffensive"
 epoch_iii_counterattack_desc:0 "Concentrated targeting grants 20% more damage against Nullwardens only. Ship upkeep rises by 15% and technology research speed falls by 10%. Monthly energy and alloy allocations increase with colony count."
 epoch_iii_command_pressure:0 "The Command Rhythm"
 epoch_iii_command_pressure_desc:0 "The living command vessel accelerates Nullwarden movement and fire. Its destruction breaks this coordination."
 epoch_iii_interdiction_field:0 "Linked Shields"
 epoch_iii_interdiction_field_desc:0 "The first interdiction node reinforces the shields of every Nullwarden formation. Destroying it interrupts the field."
 epoch_iii.11.machine:0 "The received command carries a valid structure and an unknown authority. Isolated nodes continue to acknowledge it after their external links are severed. We purge their queues. The acknowledgment returns.\n\nA comparison of weapon telemetry reveals the same interval. Something is listening inside the response."
 epoch_iii.11.hive:0 "The foreign interval presses against the shared rhythm. Several drones anticipate an impulse we have not sent. We hold their thoughts apart until the compulsion passes.\n\nAcross the void, the hostile constructions answer one another. Their timing is exact. Their silence between answers is worse."
 epoch_iii.11.veteran:0 "An analyst recognizes a gap in the recording. It matches an interval we once heard in the silent network. This time it is followed by weapons fire.\n\nThe crews ask whether our earlier answer has finally reached its destination. We have no answer for them."

 epoch_iii.shield_effects:0 "On unbuffered worlds under signal disruption, restore up to 5% job output and 3 stability according to the damage. Intact and permanently buffered worlds gain no bonus. Relief ends when this response is abandoned."
 epoch_iii_defense_light:0 "Isolated Receiver Teams"
 epoch_iii_defense_light_desc:0 "Temporary teams relieve a small part of this world's additional signal disruption."
 epoch_iii_defense_medium:0 "Separated Control Circuits"
 epoch_iii_defense_medium_desc:0 "Temporary control circuits relieve part of the additional signal disruption. Older planetary damage remains."
 epoch_iii_defense_heavy:0 "Emergency Signal Shielding"
 epoch_iii_defense_heavy_desc:0 "Dedicated teams relieve severe signal disruption. Their support ends if the empire changes its defensive response."
 epoch_iii_studied_network:0 "Exposed Firing Intervals"
 epoch_iii_studied_network_desc:0 "The first secured wreck study reduces Nullwarden weapon damage by 10%. A second distinct study replaces this with deeper disruption."
 mod_damage_vs_country_type_epoch_convergence_mult:0 "Damage against Nullwardens"
 epoch_iii.final_location:0 "Nullwarden formations have been observed at [Target.GetName]. Follow this marker to intercept them. In the final fighting they regroup at the first front they can reach; isolated groups remain marked where they hold. The command vessel reinforces threatened nodes while any survive."

 epoch_iii_sites_title:0 "Unclassified Constructions"

 epoch_iii_sites_desc:0 "Recorded locations of the stationary Nullwarden constructions. Combat observations identify their functions. Destroyed contacts are removed."

 epoch_iii.poi.unknown:0 "Unclassified Nullwarden Construction"

 epoch_iii.poi.unknown.desc:0 "A stationary armed construction repeats the signal. Its function is unknown."

 epoch_iii.poi.1:0 "Interdiction Anchor"

 epoch_iii.poi.1.desc:0 "Sustains hostile shields (+20%) and local reinforcements. Military destruction stops this source and removes the shield support."

 epoch_iii.poi.2:0 "Contamination Anchor"

 epoch_iii.poi.2.desc:0 "Drives planetary resonance strikes and the annual worsening of untreated exposure. Destruction stops both; existing harm remains. In a two-anchor network it also relays reinforcement signals."

 epoch_iii.poi.3:0 "Signal Relay"

 epoch_iii.poi.3.desc:0 "Coordinates reinforcements. Destruction caps each other source at three lifetime sorties; deployed ships remain."

 epoch_iii.poi.4:0 "Reserve Anchor"

 epoch_iii.poi.4.desc:0 "Supplies another independent attack front. Destruction ends its reinforcements."

 decision_epoch_iii_contain:0 "Contain Resonance Exposure"

 decision_epoch_iii_contain_desc:0 "Isolate affected habitats, drone pathways and processing circuits. Stops further local worsening at a cost of 2% job output; existing damage remains."

 decision_epoch_iii_investigate:0 "Probe the Active Resonance"

 decision_epoch_iii_investigate_desc:0 "Keep one isolated receiver open long enough to trace what answers it."

 epoch_iii.sample.tt:0 "Once per world: +400 Physics Research. Contained worlds also grant +5% Physics research speed for two years. Without containment: 70% chance of that insight, 30% chance of 10 devastation and severe local disruption. No military objectives are completed."

 decision_epoch_iii_treat:0 "Stabilize Resonance Damage"

 decision_epoch_iii_treat_desc:0 "Replace compromised control circuits and stabilize affected habitats. Treatment remains available after the signal ends."

 epoch_iii.treat.tt:0 "Stops further local worsening, removes additional escalation and containment penalties, and reduces initial disruption to -1 stability and -1% job output. Contains untouched contamination introduced by this crisis. Older features, active investigations and devastation remain."

 epoch_iii_force_base:0 "Convergent Formation"

 epoch_iii_force_base_desc:0 "Convergent Formation."

 epoch_iii_force_late:0 "Reinforced Convergent Formation"

 epoch_iii_force_late_desc:0 "Reinforced Convergent Formation."

 epoch_iii_force_hard:0 "Hardened Convergent Formation"

 epoch_iii_force_hard_desc:0 "Hardened Convergent Formation."

 epoch_iii_bastion_hull:0 "Fortified Anchor"

 epoch_iii_bastion_hull_desc:0 "Fortified Anchor."

 epoch_iii_contamination_rising:0 "Spreading Resonance"

 epoch_iii_contamination_rising_desc:0 "The repeating interval has penetrated local work cycles. Untreated exposure can worsen once more after twelve months while the contamination anchor survives. Containment or Signal Buffering stops further worsening; stabilization treats the additional damage."

 epoch_iii_contamination_severe:0 "Entrenched Resonance"

 epoch_iii_contamination_severe_desc:0 "Local resonance has become entrenched. This is the final escalation level. Destroying the contamination anchor prevents new worsening but does not heal existing damage. Planetary stabilization remains available after victory."

 epoch_iii_containment:0 "Resonance Containment"

 epoch_iii_containment_desc:0 "Isolated habitats, drone pathways and processing circuits prevent further local escalation. Maintaining the separation diverts planetary work. Stabilization can remove this burden."

 epoch_iii_sample_insight:0 "Isolated Resonance Samples"

 epoch_iii_sample_insight_desc:0 "Safely isolated samples reveal how the signal repeats within physical systems."

 NAME_EPOCH_III_Fortification:0 "Nullwarden Fortification"
