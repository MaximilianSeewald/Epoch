 epoch_iii.11.machine:0 "The received command carries a valid structure and an unknown authority. Isolated nodes continue to acknowledge it after their external links are severed. We purge their queues. The acknowledgment returns.\n\nA comparison of weapon telemetry reveals the same interval. Something is listening inside the response."
 epoch_iii.11.hive:0 "The foreign interval presses against the shared rhythm. Several drones anticipate an impulse we have not sent. We hold their thoughts apart until the compulsion passes.\n\nAcross the void, the hostile constructions answer one another. Their timing is exact. Their silence between answers is worse."
 epoch_iii.11.veteran:0 "An analyst recognizes a gap in the recording. It matches an interval we once heard in the silent network. This time it is followed by weapons fire.\n\nThe crews ask whether our earlier answer has finally reached its destination. We have no answer for them."

