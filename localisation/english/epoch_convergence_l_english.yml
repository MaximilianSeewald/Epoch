l_english:
 NAME_EPOCH_III_Convergence:0 "The Silent Convergence"
 NAME_EPOCH_III_Hunters:0 "Nullwarden Spearhead"
 NAME_EPOCH_III_Enforcer:0 "Nullwarden Enforcer"
 NAME_EPOCH_III_Anchor:0 "Convergence Anchor"
 epoch_iii.5.name:0 "An Answer Without a Voice"
 epoch_iii.5.desc:0 "The recordings from the silent network have changed. Gaps that once seemed random now recur at precise intervals. Every receiver hears the same absence. Someone on the watch calls it an answer. No one can say what question was asked.\n\nOur scientists propose independent listening stations and isolated control circuits. They cannot predict what is coming. They can keep a disturbance from reaching every system at once."
 epoch_iii.10.name:0 "The Silent Borders"
 epoch_iii.10.desc:0 "Across unrelated worlds, instruments have begun correcting measurements that were never wrong. Harvest controls stop in perfect synchrony. Power grids repeat instructions from an unknown source.\n\nAn armed formation has appeared near [epoch_iii_front_location.GetName]. Its vessels ignore hails and advance along the hyperlanes. Behind them hangs a stationary construction. Each time it pulses, distant receivers fall silent. We have begun calling these vessels Nullwardens."
 epoch_iii.10.hive:0 "A silence has entered the shared rhythm. Drones on distant worlds pause together, waiting for an impulse that does not belong to us. Maintaining their separation consumes effort.\n\nAn armed formation advances from [epoch_iii_front_location.GetName]. A stationary construction remains behind it, repeating the same interval. The vessels we call Nullwardens answer neither challenge nor invitation."
 epoch_iii.10.machine:0 "Independent processing nodes report identical corrections from an unrecognized sender. The checksums agree. The instructions do not. Isolating affected circuits reduces productive capacity.\n\nArmed vessels advance from [epoch_iii_front_location.GetName]. A stationary construction repeats the disturbance behind them. The designation Nullwarden has been assigned. Their origin and intent remain undetermined."
 epoch_iii.10.respond:0 "Establish a defensive watch."
 epoch_iii.11.desc:0 "The construction near [epoch_iii_front_location.GetName] remains our clearest point of reference. Attack it with our fleets to interrupt the arrival of further formations. Vessels already underway remain dangerous.\n\nOur laboratories can isolate the recurring interval. The findings should improve weapon calibration and let affected worlds protect their control systems. The work remains available if we must withdraw and rebuild."
 epoch_iii.12.name:0 "The Interrupted Answer"
 epoch_iii.12.desc:0 "The construction has broken apart. The last ships of the attacking formations have been destroyed in battle. Along the threatened routes, receivers begin transmitting again.\n\nThe affected worlds still carry the damage. Their protection remains our responsibility. In the recovered recordings, the final interval ends halfway through a sound. We do not know whether it was a warning or an unfinished order."
 epoch_iii.12.continue:0 "Keep listening."
 epoch_iii.acknowledge:0 "Understood."
 epoch_iii.prepare:0 "Build independent listening stations."
 epoch_iii.prepare.tt:0 "Opens a project costing 900 Physics Research. It must finish before the disturbance begins. Completed precautions reduce initial planetary disruption and allow immediate Signal Buffering; they cannot prevent hostile fleets."
 epoch_iii.research:0 "Isolate the recurring interval."
 epoch_iii.research.tt:0 "Opens a project costing 1200 Physics Research. Completion grants +10% weapon damage for ten years and unlocks Signal Buffering on affected worlds. Mobile empires also remove their additional ship upkeep."
 epoch_iii.first_objectives:0 "Locate the marked system in the Situation Log. Destroy the armed anchor to stop reinforcements, then defeat the surviving formations. Research counterharmonics through the situation briefing; use Signal Buffering in affected worlds' Decisions. Retreat and rebuilding remain possible."
 epoch_iii.anchor_goal:0 "Destroy the armed Convergence Anchor at the marked system. A surviving anchor can send a limited number of reinforcements."
 epoch_iii.remaining_goal:0 "The anchor is destroyed. Defeat the remaining hostile formations in actual fleet combat. Disengagement does not end the threat."
 epoch_iii.buffer.tt:0 "Only the additional signal disruption is reduced. Existing planetary features, investigations and permanent damage remain."
 EPOCH_III_PREPARE:0 "Independent Listening Stations"
 EPOCH_III_PREPARE_DESC:0 "Separate receiver circuits and compare their readings with recovered network recordings. The work must finish before the expected disturbance; unfinished stations offer no protection."
 EPOCH_III_COUNTERHARMONICS:0 "The Recurring Interval"
 EPOCH_III_COUNTERHARMONICS_DESC:0 "Independent laboratories study the interference. Calibrated weapons gain 10% damage; affected worlds can enact Signal Buffering. This research does not destroy hostile vessels."
 decision_epoch_iii_buffer:0 "Signal Buffering"
 decision_epoch_iii_buffer_desc:0 "Separate planetary control systems from the repeating signal. Requires completed listening stations or counterharmonic research. Installation takes 90 days. Existing contamination and older damage require their own treatment."
 epoch_iii_preparations:0 "The Unanswered Watch"
 epoch_iii_preparations_desc:0 "The silent network's intervals are changing. Use the listening-station briefing to fund precautions while there is still time. Preparations require actual research; waiting grants no protection."
 epoch_iii_first_offensive:0 "The Silent Borders"
 epoch_iii_first_offensive_desc:0 "An armed anchor stands at [Target.GetName]. Destroy it to stop further arrivals, then defeat all surviving formations. The situation records military results. Open the defensive briefing for research and planetary countermeasures."
 stage_epoch_iii_listening:0 "Listening in the Silence"
 epoch_iii_preparations_stage_epoch_iii_listening:0 "$stage_epoch_iii_listening$"
 stage_epoch_iii_anchor:0 "The Armed Anchor"
 epoch_iii_first_offensive_stage_epoch_iii_anchor:0 "$stage_epoch_iii_anchor$"
 stage_epoch_iii_remaining:0 "The Remaining Hunters"
 epoch_iii_first_offensive_stage_epoch_iii_remaining:0 "$stage_epoch_iii_remaining$"
 epoch_iii_listen:0 "Maintain the watch"
 epoch_iii_listen_desc:0 "Continue normal operations while deciding whether to prepare."
 epoch_iii_prepare_report:0 "Listening-station briefing"
 epoch_iii_prepare_report_desc:0 "Reopen the proposal and its funding choices."
 epoch_iii_watch:0 "Defend the routes"
 epoch_iii_watch_desc:0 "Rebuild fleets and engage hostile formations."
 epoch_iii_briefing:0 "Defensive briefing"
 epoch_iii_briefing_desc:0 "Review military objectives and fund counterharmonic research."
 epoch_iii_pressure_prepared:0 "Buffered Interference"
 epoch_iii_pressure_experienced:0 "Resonant Interference"
 epoch_iii_pressure_unprepared:0 "Unshielded Interference"
 epoch_iii_pressure_buffered:0 "Isolated Control Systems"
 epoch_iii_mobile_disruption:0 "Disrupted Fleet Coordination"
 epoch_iii_counterharmonics:0 "Counterharmonic Calibration"
 epoch_iii_pressure_prepared_desc:0 "Independent receivers limit the disturbance, but cannot prevent every interruption."
 epoch_iii_pressure_experienced_desc:0 "Familiar intervals recur across planetary control systems. Knowledge alone does not isolate them."
 epoch_iii_pressure_unprepared_desc:0 "The repeating signal reaches unshielded control systems, interrupting work and coordination."
 epoch_iii_pressure_buffered_desc:0 "Isolated control circuits reduce the additional disturbance. Older planetary damage remains."
 epoch_iii_mobile_disruption_desc:0 "Repeated false instructions increase the effort needed to maintain our fleets."
 epoch_iii_counterharmonics_desc:0 "Knowledge of the recurring interval improves weapon calibration."
 decision_epoch_iii_briefing:0 "Counterharmonic Research"
 decision_epoch_iii_briefing_desc:0 "Reopen the research proposal. It remains available after the fighting ends, allowing damaged worlds to obtain Signal Buffering."
 epoch_iii_mobile_disruption_experienced:0 "Recognized Signal Disruption"
 epoch_iii_mobile_disruption_experienced_desc:0 "Knowledge of the signal limits the additional effort required to maintain our fleets."
 epoch_iii_mobile_disruption_prepared:0 "Buffered Fleet Coordination"
 epoch_iii_mobile_disruption_prepared_desc:0 "Independent receivers limit the additional effort required to maintain our fleets."
