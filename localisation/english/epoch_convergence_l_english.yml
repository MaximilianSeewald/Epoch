 epoch_iii_emergency:0 "Emergency Shipyard Mobilization"
 epoch_iii_emergency_desc:0 "Shipyards accelerate reconstruction after the hostile transmission."
 epoch_iii_decoding:0 "Recorded Intervals"
 epoch_iii_decoding_desc:0 "Dedicated teams compare the transmission's repeated intervals."
 epoch_iii_disrupted_network:0 "Disrupted Command Rhythm"
 epoch_iii_disrupted_network_desc:0 "Research at two secured sites has exposed weaknesses in the surviving network's weapons and shields."
 epoch_iii_scar_pressure:0 "Resonance Strike"
 epoch_iii_scar_pressure_desc:0 "A nearby scar node interferes with planetary work and coordination. Signal Buffering can reduce this additional damage."
 epoch_iii_scar_shielded:0 "Buffered Resonance Strike"
 epoch_iii_scar_shielded_desc:0 "Earlier precautions limit a nearby node's interference. Signal Buffering can reduce the remaining damage."
 epoch_iii_veterans:0 "Veterans of the Silent Borders"
 epoch_iii_veterans_desc:0 "Crews who helped defeat the Nullwardens retain their combat experience."
