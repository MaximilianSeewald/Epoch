 EPOCH_III_SITE_1:0 "Secured Node: Wreck Analysis"
 EPOCH_III_SITE_1_DESC:0 "A science ship with a scientist examines the wrecks at this site for 90 days. One distinct site reduces Nullwarden weapon damage by 10% and restricts further reinforcements; two instead expose weaknesses in all surviving Nullwarden weapons and shields. The surviving vessels still require military defeat."
 EPOCH_III_SITE_2:0 "Secured Node: Wreck Analysis"
 EPOCH_III_SITE_2_DESC:0 "A science ship with a scientist examines the wrecks at this site for 90 days. One distinct site reduces Nullwarden weapon damage by 10% and restricts further reinforcements; two instead expose weaknesses in all surviving Nullwarden weapons and shields. The surviving vessels still require military defeat."
 EPOCH_III_SITE_3:0 "Secured Node: Wreck Analysis"
 EPOCH_III_SITE_3_DESC:0 "A science ship with a scientist examines the wrecks at this site for 90 days. One distinct site reduces Nullwarden weapon damage by 10% and restricts further reinforcements; two instead expose weaknesses in all surviving Nullwarden weapons and shields. The surviving vessels still require military defeat."
