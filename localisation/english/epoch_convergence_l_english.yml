 EPOCH_III_SITE_3_DESC:0 "A science ship with a scientist examines the secured wrecks for 90 days. One distinct site reduces Nullwarden weapon damage by 10% and restricts logistics; two replace this with -20% weapon damage and shields. Destroy all anchors and the unique command ship in combat to collapse the command network. Surviving minor formations then withdraw."
