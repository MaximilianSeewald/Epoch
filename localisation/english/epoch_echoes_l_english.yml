l_english:
 epoch_echoes.2.name:0 "A signal without a source"
 epoch_echoes.2.desc:0 "A repeating pulse rises from the surveyed system. It carries the cadence of a research vessel's emergency beacon, though no registry answers our hail. The trace is faint but stable enough to follow."
 epoch_echoes.2.a:0 "Send a science ship to trace it"
 epoch_echoes.2.b:0 "Let the signal fade"
 epoch_echoes.3.name:0 "The silent vessel"
 epoch_echoes.3.desc:0 "The beacon leads to a derelict research ship, its outer hull scored by impacts and its archives partly awake. We can isolate the remaining systems and read them slowly, or force open the damaged core before it fails."
 epoch_echoes.3.a:0 "Recover the records carefully"
 epoch_echoes.3.b:0 "Force the core open"
 epoch_echoes.5.name:0 "A voice in the static"
 epoch_echoes.5.desc:0 "The recovered archive charts supply caches left along the vessel's final route. Some containers may still be intact. The ship's scientific records will also give our researchers a brief lead."
 epoch_echoes.5.a:0 "Follow the cargo manifest"
 epoch_echoes.8.name:0 "Unstable records"
 epoch_echoes.8.desc:0 "The forced extraction has left the ship's archive oscillating between incompatible states. A science team can isolate the unstable record and recover what remains; leaving it alone would strand the evidence."
 epoch_echoes.8.a:0 "Stabilize the data"
 epoch_echoes.10.name:0 "A colony out of rhythm"
 epoch_echoes.10.desc:0 "Production cycles on one of our colonies are falling out of step. Local crews report a low vibration beneath the surface. It has not spread, but the disturbance is already disrupting work."
 epoch_echoes.10.a:0 "Review the colony's available measures"
 epoch_echoes.6.name:0 "The last relay"
 epoch_echoes.6.desc:0 "An abandoned relay has been located in one of our surveyed systems. Its dormant instruments still answer a distant pulse. A defensive network protects the control core; a science ship may be able to map its remaining safeguards."
 epoch_echoes.6.a:0 "Investigate the relay"
 epoch_echoes.7.name:0 "A guarded connection"
 epoch_echoes.7.desc:0 "The relay's defense grid has recognized our ship. We can draw its remaining guard into a real engagement, or spend time mapping the control network and disable it from a science ship."
 epoch_echoes.7.a:0 "Engage the defenders"
 epoch_echoes.7.b:0 "Find a technical way through"
 epoch_echoes.9.name:0 "The secured relay"
 epoch_echoes.9.desc:0 "The relay is secure. Its instruments can support a small listening post, provided we keep its power supply running. We could instead strip the machinery for alloys or leave the station permanently dark."
 epoch_echoes.9.a:0 "Activate the relay"
 epoch_echoes.9.b:0 "Salvage the station"
 epoch_echoes.9.c:0 "Permanently deactivate it"
 EPOCH_ECHOES_GHOST_TRACE:0 "Trace the repeating signal"
 EPOCH_ECHOES_GHOST_TRACE_DESC:0 "A staffed science ship follows the pulse to a derelict research vessel."
 EPOCH_ECHOES_GHOST_CAUTIOUS:0 "Careful archive recovery"
 EPOCH_ECHOES_GHOST_CAUTIOUS_DESC:0 "A long, low-risk effort to isolate the ship's surviving records."
 EPOCH_ECHOES_GHOST_FORCED:0 "Forced archive recovery"
 EPOCH_ECHOES_GHOST_FORCED_DESC:0 "A rapid extraction that costs energy and alloys and may destabilize the archive."
 EPOCH_ECHOES_GHOST_STABILIZE:0 "Stabilize the damaged archive"
 EPOCH_ECHOES_GHOST_STABILIZE_DESC:0 "A science ship isolates the unstable record after the forced extraction."
 EPOCH_ECHOES_RELAY_SURVEY:0 "Survey the old relay"
 EPOCH_ECHOES_RELAY_SURVEY_DESC:0 "A staffed science ship maps the relay's defenses and control links."
 EPOCH_ECHOES_RELAY_DEFUSE:0 "Map the relay's defense grid"
 EPOCH_ECHOES_RELAY_DEFUSE_DESC:0 "A prolonged scientific effort to disable the active defense network."
 EPOCH_ECHOES_RELAY_DEFUSE_AIDED:0 "Use the resonance lead"
 EPOCH_ECHOES_RELAY_DEFUSE_AIDED_DESC:0 "Prior discoveries reveal a shorter route through the relay's control network."
 decision_epoch_echoes_recover:0 "Repair the damaged production cycle"
 decision_epoch_echoes_recover_desc:0 "Repair the production and stability damage left by the failed extraction."
 epoch_echoes_ghost_insight:0 "Recovered signal fragments"
 epoch_echoes_ghost_insight_desc:0 "The archive has left a temporary lead for physics research."
 epoch_echoes_unquiet_organic:0 "Production out of rhythm"
 epoch_echoes_unquiet_organic_desc:0 "The colony's work cycles are disrupted by a persistent resonance."
 epoch_echoes_unquiet_hive:0 "Dissonant synaptic cycles"
 epoch_echoes_unquiet_hive_desc:0 "A recurring pulse is disrupting coordinated drone work."
 epoch_echoes_unquiet_machine:0 "Desynchronized production"
 epoch_echoes_unquiet_machine_desc:0 "A repeating signal is disrupting the colony's machine work cycles."
 epoch_echoes_unquiet_research:0 "Resonance research station"
 epoch_echoes_unquiet_research_desc:0 "The completed study improves local Physics Research from jobs."
 epoch_echoes_unquiet_surge:0 "Harnessed resonance"
 epoch_echoes_unquiet_surge_desc:0 "A controlled resonance briefly raises local production."
 epoch_echoes_unquiet_backlash:0 "Resonance backlash"
 epoch_echoes_unquiet_backlash_desc:0 "Failed extraction has harmed production and stability. The damaged installations require repair."
 epoch_echoes_relay_active:0 "Active Relay"
 epoch_echoes_relay_active_desc:0 "An operating listening post. Its instruments require a reliable energy supply."
 NAME_EPOCH_Relay_Sentinels:0 "Relay Sentinels"
 NAME_EPOCH_Relay_Defenders:0 "Dormant Defenders"
 epoch_echoes.poi_relay:0 "The last relay"
 epoch_echoes.poi_relay.desc:0 "An old relay has begun to answer a repeating signal."
 epoch_echoes_side_stories_title:0 "Echoes in the dark"
 epoch_echoes_side_stories_desc:0 "Optional discoveries at the edge of our early investigations. Each has its own course."
 epoch_echoes.11.name:0 "Restoring the rhythm"
 epoch_echoes.11.desc:0 "The disturbance can be isolated, studied under controlled conditions, or tapped for production. Each approach will occupy local facilities until the work is finished. An attempt to exploit the pulse could leave lasting damage."
 epoch_echoes.11.containment:0 "Isolate the disturbance"
 epoch_echoes.11.research:0 "Study the pulse"
 epoch_echoes.11.exploit:0 "Harness it for production"
 epoch_echoes.11.wait:0 "Postpone the work"
 decision_epoch_echoes_investigate:0 "Investigate the Disturbance"
 decision_epoch_echoes_investigate_desc:0 "Choose a treatment for the disturbance affecting this colony."
 epoch_echoes.trace.tt:0 "Begins a §Y90-day§! investigation by a staffed Science Ship at the signal."
 epoch_echoes.cautious.tt:0 "A staffed Science Ship spends §Y180 days§! recovering the archive. The cargo manifest remains intact, allowing more material to be recovered later."
 epoch_echoes.forced.tt:0 "A staffed Science Ship spends §Y60 days§! opening the core. There is a §Y35%§! chance that another §Y90-day§! stabilization is required. Damage to the manifest reduces the later cargo recovery."
 epoch_echoes.stabilize.tt:0 "A staffed Science Ship must stabilize the archive for §Y90 days§! before it can be recovered."
 epoch_echoes.cache.tt:0 "A §Y120-day§! Science Ship salvage project marks recoverable cargo on the map. Careful recovery preserves §Y250 alloys and 350 minerals§!; forced recovery preserves §Y150 alloys and 200 minerals§!."
 epoch_echoes.investigate.tt:0 "Opens the choice of containment, research or exploitation. Treatment begins only after its resources are committed."
 epoch_echoes.containment.tt:0 "§Y60 days§! of treatment. The disturbance remains during treatment; local job output is reduced by a further §Y2%§!. Containment is reliable and removes the disturbance without a lasting bonus."
 epoch_echoes.research.tt:0 "§Y120 days§! of treatment with a further §Y2%§! reduction in local job output. Completion removes the disturbance, yields §Y180 Physics and 180 Society Research§!, and increases local Physics Research from jobs by §Y5% for 10 years§!."
 epoch_echoes.exploit.tt:0 "§Y45 days§! of treatment with a further §Y2%§! reduction in local job output. §Y65%§! chance: §Y150 alloys, 150 energy§! and §Y+5% job output for 5 years§!. §Y35%§! chance: §Y−10% job output, −5 stability§! until repaired."
 epoch_echoes.relay_survey.tt:0 "Begins a §Y90-day§! investigation by a staffed Science Ship at the relay."
 epoch_echoes.combat.tt:0 "Awakens two hostile defenders in this system. Their fleet must actually be destroyed before the relay can be secured."
 epoch_echoes.defuse.tt:0 "A staffed Science Ship disables the safeguards in §Y180 days§!. A recovered archive or successful colony containment or research reduces this to §Y90 days§!; both together reduce it to §Y45 days§!."
 epoch_echoes.activate.tt:0 "Restores the visible relay as permanent infrastructure: §Y6 Physics Research§! for §Y4 energy upkeep each month§!. Output stops during an energy shortage, after loss of the system, or if the inquiry is permanently abandoned. Its structure panel allows permanent shutdown without further upkeep."
 epoch_echoes.salvage.tt:0 "The relay remains as a stripped, permanently inoperative shell. It has no upkeep."
 epoch_echoes.disable.tt:0 "The relay remains visible and permanently inactive. It has no benefit or upkeep."
 EPOCH_ECHOES_GHOST_CACHE:0 "Recover the lost cargo"
 EPOCH_ECHOES_GHOST_CACHE_DESC:0 "A staffed Science Ship follows the recovered manifest and retrieves surviving cargo. A carefully preserved manifest allows a more complete recovery."
 epoch_echoes_unquiet_treatment:0 "Facilities committed to treatment"
 epoch_echoes_unquiet_treatment_desc:0 "Local facilities are occupied with treating the disturbance, reducing job output until work is finished."
 epoch_echoes_relay_dormant:0 "Dormant Relay"
 epoch_echoes_relay_dormant_DESC:0 "A silent listening post protected by an old defense grid."
 epoch_echoes_relay_active_DESC:0 "An operating listening post. Its instruments require a reliable energy supply."
 epoch_echoes_relay_disabled:0 "Deactivated Relay"
 epoch_echoes_relay_disabled_DESC:0 "An inactive relay. It provides no research and requires no energy upkeep. Shutdown is irreversible."
 epoch_echoes_relay_salvaged:0 "Stripped Relay"
 epoch_echoes_relay_salvaged_DESC:0 "The relay machinery has been salvaged. The empty shell remains in orbit."
 epoch_echoes.10.desc.hive:0 "A low vibration beneath one of our colonies is disrupting the coordination of its drones. Production cycles repeatedly fall out of step. The dissonance remains local, but the affected facilities need attention."
 epoch_echoes.10.desc.machine:0 "A repeating pulse is interfering with production scheduling on one of our colonies. Local units repeatedly lose synchronization. The interference remains contained, but the affected facilities need attention."

 EPOCH_ECHOES_RELAY_DEFUSE_LINKED:0 "Reconstruct the relay protocol"
 EPOCH_ECHOES_RELAY_DEFUSE_LINKED_DESC:0 "The recovered archive and colony measurements together reveal a direct way through the control network."
 epoch_echoes_relay_dormant_MEGASTRUCTURE_DETAILS:0 "$epoch_echoes_relay_dormant_DESC$"
 epoch_echoes_relay_dormant_CONSTRUCTION_INFO_DELAYED:0 "$epoch_echoes_relay_dormant_DESC$"
 epoch_echoes_relay_active_MEGASTRUCTURE_DETAILS:0 "$epoch_echoes_relay_active_DESC$"
 epoch_echoes_relay_active_CONSTRUCTION_INFO_DELAYED:0 "$epoch_echoes_relay_active_DESC$"
 epoch_echoes_relay_disabled_MEGASTRUCTURE_DETAILS:0 "$epoch_echoes_relay_disabled_DESC$"
 epoch_echoes_relay_disabled_CONSTRUCTION_INFO_DELAYED:0 "$epoch_echoes_relay_disabled_DESC$"
 epoch_echoes_relay_salvaged_MEGASTRUCTURE_DETAILS:0 "$epoch_echoes_relay_salvaged_DESC$"
 epoch_echoes_relay_salvaged_CONSTRUCTION_INFO_DELAYED:0 "$epoch_echoes_relay_salvaged_DESC$"
