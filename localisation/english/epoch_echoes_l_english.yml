l_english:
 epoch_echoes.2.name:0 "A signal without a source"
 epoch_echoes.2.desc:0 "A repeating pulse rises from the surveyed system. It carries the cadence of a research vessel's emergency beacon, though no registry answers our hail. The trace is faint but stable enough to follow."
 epoch_echoes.2.a:0 "Send a science ship to trace it"
 epoch_echoes.2.b:0 "Let the signal fade"
 epoch_echoes.3.name:0 "The silent vessel"
 epoch_echoes.3.desc:0 "The beacon leads to a derelict research ship, its outer hull scored by impacts and its archives partly awake. We can isolate the remaining systems and read them slowly, or force open the damaged core before it fails."
 epoch_echoes.3.a:0 "Recover the records carefully"
 epoch_echoes.3.b:0 "Force the core open"
 epoch_echoes.5.name:0 "A voice in the static"
 epoch_echoes.5.desc:0 "The recovered fragments describe a crew that heard the same pulse long before our first transmission. Their notes end mid-sentence. The data is incomplete, but it gives our researchers a short-lived lead."
 epoch_echoes.5.a:0 "Preserve the fragments"
 epoch_echoes.8.name:0 "Unstable records"
 epoch_echoes.8.desc:0 "The forced extraction has left the ship's archive oscillating between incompatible states. A science team can isolate the unstable record and recover what remains; leaving it alone would strand the evidence."
 epoch_echoes.8.a:0 "Stabilize the data"
 epoch_echoes.10.name:0 "A colony out of rhythm"
 epoch_echoes.10.desc:0 "Production cycles on one of our colonies are falling out of step. Local crews report a low vibration beneath the surface. It has not spread, but the disturbance is already disrupting work."
 epoch_echoes.10.a:0 "Review the colony's available measures"
 epoch_echoes.6.name:0 "The last relay"
 epoch_echoes.6.desc:0 "The pulse resolves into an old relay station in the same system. Its signal matches details in the recovered fragments. A defensive network still guards the structure, and a patient technical survey may reveal a way around it."
 epoch_echoes.6.a:0 "Investigate the relay"
 epoch_echoes.7.name:0 "A guarded connection"
 epoch_echoes.7.desc:0 "The relay's defense grid has recognized our ship. We can draw its remaining guard into a real engagement, or spend time mapping the control network and disable it from a science ship."
 epoch_echoes.7.a:0 "Engage the defenders"
 epoch_echoes.7.b:0 "Find a technical way through"
 epoch_echoes.9.name:0 "The relay falls silent"
 epoch_echoes.9.desc:0 "The relay is secure. Its core can be powered for a limited period, dismantled for useful materials, or left dark so the system can settle."
 epoch_echoes.9.a:0 "Power it up"
 epoch_echoes.9.b:0 "Salvage the station"
 epoch_echoes.9.c:0 "Leave it deactivated"
 EPOCH_ECHOES_GHOST_TRACE:0 "Trace the repeating signal"
 EPOCH_ECHOES_GHOST_TRACE_DESC:0 "A staffed science ship follows the pulse to a derelict research vessel."
 EPOCH_ECHOES_GHOST_CAUTIOUS:0 "Careful archive recovery"
 EPOCH_ECHOES_GHOST_CAUTIOUS_DESC:0 "A long, low-risk effort to isolate the ship's surviving records."
 EPOCH_ECHOES_GHOST_FORCED:0 "Forced archive recovery"
 EPOCH_ECHOES_GHOST_FORCED_DESC:0 "A rapid extraction that costs energy and alloys and may destabilize the archive."
 EPOCH_ECHOES_GHOST_STABILIZE:0 "Stabilize the damaged archive"
 EPOCH_ECHOES_GHOST_STABILIZE_DESC:0 "A science ship isolates the unstable record after the forced extraction."
 EPOCH_ECHOES_RELAY_SURVEY:0 "Survey the old relay"
 EPOCH_ECHOES_RELAY_SURVEY_DESC:0 "A staffed science ship maps the relay's defenses and control links."
 EPOCH_ECHOES_RELAY_DEFUSE:0 "Map the relay's defense grid"
 EPOCH_ECHOES_RELAY_DEFUSE_DESC:0 "A prolonged scientific effort to disable the active defense network."
 EPOCH_ECHOES_RELAY_DEFUSE_AIDED:0 "Use the resonance lead"
 EPOCH_ECHOES_RELAY_DEFUSE_AIDED_DESC:0 "Prior discoveries reveal a shorter route through the relay's control network."
 decision_epoch_echoes_containment:0 "Contain the colony disturbance"
 decision_epoch_echoes_containment_desc:0 "Dampen the resonance with a reliable, limited intervention."
 decision_epoch_echoes_research:0 "Study the colony disturbance"
 decision_epoch_echoes_research_desc:0 "Fund a focused study to gain research and a temporary local research benefit."
 decision_epoch_echoes_exploit:0 "Harness the colony disturbance"
 decision_epoch_echoes_exploit_desc:0 "Try to turn the resonance into a short economic gain, accepting the chance of a recoverable backlash."
 decision_epoch_echoes_recover:0 "Repair the damaged production cycle"
 decision_epoch_echoes_recover_desc:0 "Pay to clear the temporary economic and stability damage left by the failed extraction."
 epoch_echoes_ghost_insight:0 "Recovered signal fragments"
 epoch_echoes_ghost_insight_desc:0 "The archive has left a temporary lead for physics research."
 epoch_echoes_unquiet_organic:0 "Production out of rhythm"
 epoch_echoes_unquiet_organic_desc:0 "The colony's work cycles are disrupted by a persistent resonance."
 epoch_echoes_unquiet_hive:0 "Dissonant synaptic cycles"
 epoch_echoes_unquiet_hive_desc:0 "A recurring pulse is disrupting coordinated drone work."
 epoch_echoes_unquiet_machine:0 "Desynchronized production"
 epoch_echoes_unquiet_machine_desc:0 "A repeating signal is disrupting the colony's machine work cycles."
 epoch_echoes_unquiet_research:0 "Resonance research station"
 epoch_echoes_unquiet_research_desc:0 "The completed study briefly improves local society research."
 epoch_echoes_unquiet_surge:0 "Harnessed resonance"
 epoch_echoes_unquiet_surge_desc:0 "A controlled resonance briefly raises local production."
 epoch_echoes_unquiet_backlash:0 "Resonance backlash"
 epoch_echoes_unquiet_backlash_desc:0 "The failed extraction has temporarily harmed production and stability."
 epoch_echoes_relay_active:0 "Powered relay"
 epoch_echoes_relay_active_desc:0 "The restored station briefly extends fleet sensor range and supports physics research."
 NAME_EPOCH_Relay_Sentinels:0 "Relay Sentinels"
 NAME_EPOCH_Relay_Defenders:0 "Dormant Defenders"
 epoch_echoes.poi_relay:0 "The last relay"
 epoch_echoes.poi_relay.desc:0 "An old relay has begun to answer a repeating signal."
 epoch_echoes_side_stories_title:0 "Echoes in the dark"
 epoch_echoes_side_stories_desc:0 "A handful of surveyed discoveries has linked a derelict archive, a troubled colony, and an old relay."
