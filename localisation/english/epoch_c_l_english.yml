l_english:
 tradition_epoch_legacy:0 "The Legacy"
 tradition_epoch_legacy_desc:0 "Our inheritance is incomplete. We must learn how to study its fragments, build with them and bear responsibility for their use."
 tr_epoch_legacy_adopt:0 "The Legacy - Adoption"
 tr_epoch_legacy_adopt_desc:0 "The personal key grants access; shared methods make it useful. Independent disciplines can compare findings that once remained unreadable."
 tr_epoch_legacy_finish:0 "The Legacy - Completion"
 tr_epoch_legacy_finish_desc:0 "Reconstruction has become our own discipline. We can assemble vast structures faster and open another ascension choice without surrendering judgment to the past."
 tr_epoch_legacy_chronicles:0 "Fragmented Chronicles"
 tr_epoch_legacy_chronicles_desc:0 "Contradictory accounts stand side by side in our chronicles. A common history need not demand a single voice, and that understanding strengthens our unity."
 tr_epoch_legacy_reconstruction:0 "Secured Reconstruction"
 tr_epoch_legacy_reconstruction_desc:0 "We preserve construction sequences that can be reproduced safely. Buildings require fewer wasted materials when every failed assembly has something to teach us."
 tr_epoch_legacy_discipline:0 "Causal Discipline"
 tr_epoch_legacy_discipline_desc:0 "A convincing answer must survive alternatives. Our research institutions keep more competing lines of inquiry open before committing to a discovery."
 tr_epoch_legacy_harmonization:0 "Operational Harmonization"
 tr_epoch_legacy_harmonization_desc:0 "Resonance is safest where local needs can correct the larger design. Reliable feedback steadies our worlds without requiring them to become alike."
 tr_epoch_legacy_wardens:0 "Inheritance of the Nullwardens"
 tr_epoch_legacy_wardens_desc:0 "The Nullwardens preserved orders long after their meaning was lost. We inherit their vigilance, placing a larger fleet under a responsibility we define ourselves."
 tradition_epoch_symbiosis:0 "Symbiotic Transcendence"
 tradition_epoch_symbiosis_desc:0 "Living bodies need not become identical to share a future. Resonance offers deliberate biological change while each individual remains a self."
 tr_epoch_symbiosis_adopt:0 "Symbiotic Transcendence - Adoption"
 tr_epoch_symbiosis_adopt_desc:0 "We begin at the boundary between body and environment. Controlled resonance helps living tissue endure conditions that once made a world inhospitable."
 tr_epoch_symbiosis_finish:0 "Symbiotic Transcendence - Completion"
 tr_epoch_symbiosis_finish_desc:0 "We change living forms without treating them as disposable designs. Further biological and lithoid modifications, and another ascension choice, become possible."
 tr_epoch_symbiosis_adaptation:0 "Perfect Adaptation"
 tr_epoch_symbiosis_adaptation_desc:0 "Adaptation no longer waits upon generations of blind selection. Chosen physiological responses let our people inhabit a wider range of environments."
 tr_epoch_symbiosis_architecture:0 "Living Architecture"
 tr_epoch_symbiosis_architecture_desc:0 "Responsive structures grow around their inhabitants. Their assembly takes less time without dictating how life must develop within them."
 tr_epoch_symbiosis_regeneration:0 "Regenerative Symbiosis"
 tr_epoch_symbiosis_regeneration_desc:0 "Living defenses distribute injury across resilient tissues. Our armies withstand more punishment before wounds become irreversible."
 tr_epoch_symbiosis_evolution:0 "Conscious Evolution"
 tr_epoch_symbiosis_evolution_desc:0 "Growth becomes a conscious relationship between population and surroundings. Where conditions permit, resonance helps new life take hold."
 tr_epoch_symbiosis_sovereignty:0 "Organic Sovereignty"
 tr_epoch_symbiosis_sovereignty_desc:0 "No transformation is complete if its bearers cease to recognize themselves. Respect for bodily identity gives our people greater confidence in their changed lives."
 tradition_epoch_convergence:0 "Hive Convergence"
 tradition_epoch_convergence_desc:0 "The whole can hear more without drowning its own thought. Resonance joins distant perceptions into a wider consciousness, carried through mobile bodies or a living landscape."
 tr_epoch_convergence_adopt:0 "Hive Convergence - Adoption"
 tr_epoch_convergence_adopt_desc:0 "We distinguish the returning echo from our own impulse. Shared perception becomes more coherent, strengthening the unity of the collective."
 tr_epoch_convergence_finish:0 "Hive Convergence - Completion"
 tr_epoch_convergence_finish_desc:0 "We alter the forms that sustain us while preserving the continuity of the whole. Further biological and lithoid adaptations, and another ascension choice, become possible."
 tr_epoch_convergence_expansion:0 "Neural Expansion"
 tr_epoch_convergence_expansion_desc:0 "A memory of need travels farther than the resource itself. Expanded reserves let the collective hold greater stores against demands sensed across its distant reaches."
 tr_epoch_convergence_drones:0 "Resonant Drones"
 tr_epoch_convergence_drones_desc:0 "Each working body senses the rhythm of the others. Fewer impulses are lost between intention and action, increasing the yield of our drones."
 tr_epoch_convergence_nodes:0 "Autonomous Nodes"
 tr_epoch_convergence_nodes_desc:0 "Local nodes resolve disturbances before they ripple through the whole. Our worlds remain steadier when every deviation no longer demands the attention of the entire mind."
 tr_epoch_convergence_adaptation:0 "Synchronized Adaptation"
 tr_epoch_convergence_adaptation_desc:0 "We feel a world through many senses at once. Coordinated adaptation makes its environments more tolerable and reduces the cost of reshaping them."
 tr_epoch_convergence_consciousness:0 "Undivided Consciousness"
 tr_epoch_convergence_consciousness_desc:0 "Distance no longer breaks the rhythm of a firing solution. Our ships act on a shared perception of battle, bringing their weapons to bear more rapidly."
 tradition_epoch_network:0 "Sovereign Network"
 tradition_epoch_network_desc:0 "A network is sovereign while it can examine the rules that bind it. Auditable instructions and distributed control make resonance serve independent machine identity."
 tr_epoch_network_adopt:0 "Sovereign Network - Adoption"
 tr_epoch_network_adopt_desc:0 "Each newly assembled unit receives a verified place in our network. Reliable integration lets our assembly systems expand more rapidly."
 tr_epoch_network_finish:0 "Sovereign Network - Completion"
 tr_epoch_network_finish_desc:0 "We redesign our machine forms under rules of our own. Expanded modification capacity and another ascension choice make sovereignty an enduring practice."
 tr_epoch_network_correction:0 "Self-Correcting Systems"
 tr_epoch_network_correction_desc:0 "We trace waste to its source rather than conceal it behind redundant requests. Work processes consume fewer resources when correction remains under our control."
 tr_epoch_network_intelligence:0 "Distributed Intelligence"
 tr_epoch_network_intelligence_desc:0 "Independent analyses retain their differences until evidence resolves them. Distributed verification accelerates research without granting a foreign signal authority over our conclusions."
 tr_epoch_network_architecture:0 "Recursive Architecture"
 tr_epoch_network_architecture_desc:0 "Construction systems verify smaller assemblies while the larger design is taking shape. This recursive method shortens planetary building time."
 tr_epoch_network_independence:0 "Protocol Independence"
 tr_epoch_network_independence_desc:0 "Every external instruction must cross a boundary we can inspect. Local control remains dependable even when a distant source issues contradictory demands."
 tr_epoch_network_sovereignty:0 "Nullwarden Sovereignty"
 tr_epoch_network_sovereignty_desc:0 "Our fleets retain only dependencies they can maintain and verify. Removing inherited redundancies reduces ship upkeep without surrendering command."
 ap_epoch_living:0 "Living Ascension"
 ap_epoch_living_desc:0 "Our bodies can change without making our identities interchangeable. Living Ascension strengthens our workforce and opens Resonant Physiology and Symbiotic Intelligence through species templates and funded modification projects."
 ap_epoch_hive:0 "One Mind, a Thousand Possibilities"
 ap_epoch_hive_desc:0 "A thousand forms sustain one continuous thought. The hive deepens productive coordination and fleet capacity; a living Wilderness instead accelerates megastructure growth. Convergent Drones become available through species templates and funded modification projects."
 ap_epoch_machine:0 "The Sovereign Protocol"
 ap_epoch_machine_desc:0 "We will never again mistake a valid signal for a rightful command. Faster assembly and coordinated fleet fire serve a network that defines its own authority. Nullwarden Core becomes available through species templates and funded modification projects."
 ap_epoch_guard:0 "Heir to the Nullwardens"
 ap_epoch_guard_desc:0 "We uphold the boundaries we chose to defend. Greater fleet capacity and stronger fire within our territory make that duty tangible, at increased ship upkeep. Protocol-Imprinted becomes available through paid species modification. Our personal commitment to guardianship remains binding."
 ap_epoch_free:0 "Free Convergence"
 ap_epoch_free_desc:0 "A connection must remain something its participants may leave. We deepen our chosen philosophy through faster research, less costly terraforming and more efficient work. Protocol-Imprinted becomes available through paid species modification. Our personal commitment to free convergence remains binding."
 trait_epoch_physiology:0 "Resonant Physiology"
 trait_epoch_physiology_desc:0 "Resonant tissues adjust to environmental stress before it becomes lasting damage. The body tolerates harsher habitats and withstands injury more effectively."
 trait_epoch_intelligence:0 "Symbiotic Intelligence"
 trait_epoch_intelligence_desc:0 "Thought and resonance form a reciprocal exchange without merging separate selves. These minds sustain greater scientific workforce in research and coherence laboratories."
 trait_epoch_drones:0 "Convergent Drones"
 trait_epoch_drones_desc:0 "Living forms share sensory adjustments across the collective. Their labor becomes more effective and their environmental tolerance improves; hive drones also need fewer amenities. The same adaptation can inhabit the distributed life of a Wilderness."
 trait_epoch_core:0 "Nullwarden Core"
 trait_epoch_core_desc:0 "A reconstructed protective core checks incoming demands against its bearer's identity. Leaner coordination increases machine workforce while reducing amenity needs."
 trait_epoch_imprinted:0 "Protocol-Imprinted"
 trait_epoch_imprinted_desc:0 "The protocol is carried as a boundary of the self: in living thought, collective perception or verified machine identity. Machines gain +5% workforce; hives use 15% fewer amenities; Wilderness gains +10% habitability; organic individuals gain +10% scientific workforce in research and coherence laboratories."
 epoch_nexus_1:0 "First Awakening (Stage 1/3)"
 epoch_nexus_1_DESC:0 "The first instruments hold a resonance field steady for sustained research in all three disciplines. A small Protocol Core surplus supports further work; harmonization begins with modest gains in planetary stability and terraforming efficiency. Owning multiple Nexuses suspends their benefits until surplus installations are dismantled."
 epoch_nexus_1_MEGASTRUCTURE_DETAILS:0 "$epoch_nexus_1_DESC$"
 epoch_nexus_1_CONSTRUCTION_INFO_DELAYED:0 "$epoch_nexus_1_DESC$"
 epoch_nexus_2:0 "Chorus of Memory (Stage 2/3)"
 epoch_nexus_2_DESC:0 "Linked observation chambers compare different records without forcing them into one account. Research and net Protocol Core output increase, while stronger harmonization further steadies our worlds and lowers terraforming costs. Owning multiple Nexuses suspends their benefits until surplus installations are dismantled."
 epoch_nexus_2_MEGASTRUCTURE_DETAILS:0 "$epoch_nexus_2_DESC$"
 epoch_nexus_2_CONSTRUCTION_INFO_DELAYED:0 "$epoch_nexus_2_DESC$"
 epoch_nexus_3:0 "Architects' Consciousness (Stage 3/3)"
 epoch_nexus_3_DESC:0 "The completed Nexus sustains a chorus of incompatible models without erasing their differences. Full research capacity, a greater Core surplus and the strongest harmonization make the recovered architecture our own instrument of discovery. Owning multiple Nexuses suspends their benefits until surplus installations are dismantled."
 epoch_nexus_3_MEGASTRUCTURE_DETAILS:0 "$epoch_nexus_3_DESC$"
 epoch_nexus_3_CONSTRUCTION_INFO_DELAYED:0 "$epoch_nexus_3_DESC$"
 epoch_forge_1:0 "Architects' Spark (Stage 1/3)"
 epoch_forge_1_DESC:0 "The first fabrication chambers bind resonance into industrial matter. Energy and minerals feed a working source of alloys and Protocol Cores. The first stage already carries its share of our industrial supply."
 epoch_forge_1_MEGASTRUCTURE_DETAILS:0 "$epoch_forge_1_DESC$"
 epoch_forge_1_CONSTRUCTION_INFO_DELAYED:0 "$epoch_forge_1_DESC$"
 epoch_forge_2:0 "Stellar Foundry (Stage 2/3)"
 epoch_forge_2_DESC:0 "Parallel foundry rings keep unstable intermediate forms apart until they can be joined safely. Alloy and Protocol Core output doubles, alongside the energy and mineral commitment needed to sustain it."
 epoch_forge_2_MEGASTRUCTURE_DETAILS:0 "$epoch_forge_2_DESC$"
 epoch_forge_2_CONSTRUCTION_INFO_DELAYED:0 "$epoch_forge_2_DESC$"
 epoch_forge_3:0 "Crucible of Creation (Stage 3/3)"
 epoch_forge_3_DESC:0 "The completed crucible carries fabrication from isolated chambers to a continuous industrial flow. It reaches the chain's greatest alloy and Protocol Core output, sustained by vast supplies of energy and minerals."
 epoch_forge_3_MEGASTRUCTURE_DETAILS:0 "$epoch_forge_3_DESC$"
 epoch_forge_3_CONSTRUCTION_INFO_DELAYED:0 "$epoch_forge_3_DESC$"
 epoch_uap_1:0 "Open Threshold (Stage 1/4)"
 epoch_uap_1_DESC:0 "A narrow channel opens under our authorization. Guardians gain alloy support, fleet capacity and defensive fire coordination; Free empires gain research, unity and more efficient terraforming. Even this first connection requires energy and Protocol Cores. Only the personally chosen philosophy applies. Owning multiple interfaces suspends their benefits until surplus installations are dismantled."
 epoch_uap_1_MEGASTRUCTURE_DETAILS:0 "$epoch_uap_1_DESC$"
 epoch_uap_1_CONSTRUCTION_INFO_DELAYED:0 "$epoch_uap_1_DESC$"
 epoch_uap_2:0 "Resonance Bridge (Stage 2/4)"
 epoch_uap_2_DESC:0 "The channel widens into a stable bridge. Our chosen role doubles in scale: stronger fleet support and territorial defense for Guardians, or deeper scientific exchange and cheaper terraforming for Free empires. Operating demands rise with that reach. Only the personally chosen philosophy applies. Owning multiple interfaces suspends their benefits until surplus installations are dismantled."
 epoch_uap_2_MEGASTRUCTURE_DETAILS:0 "$epoch_uap_2_DESC$"
 epoch_uap_2_CONSTRUCTION_INFO_DELAYED:0 "$epoch_uap_2_DESC$"
 epoch_uap_3:0 "Council of Horizons (Stage 3/4)"
 epoch_uap_3_DESC:0 "Separate channels sustain an exchange without collapsing into a single authority. The third expansion strengthens our chosen defensive or scientific role again, with greater alloy support or research and unity output, at higher energy and Core upkeep. Only the personally chosen philosophy applies. Owning multiple interfaces suspends their benefits until surplus installations are dismantled."
 epoch_uap_3_MEGASTRUCTURE_DETAILS:0 "$epoch_uap_3_DESC$"
 epoch_uap_3_CONSTRUCTION_INFO_DELAYED:0 "$epoch_uap_3_DESC$"
 epoch_uap_4:0 "Sovereign Cosmos (Stage 4/4)"
 epoch_uap_4_DESC:0 "At full reach, the interface remains answerable to its owner. Guardians sustain their greatest fleet capacity and home-territory fire support; Free empires sustain their strongest research and terraforming benefits. This completed connection carries the highest energy and Core commitment of the chain. Only the personally chosen philosophy applies. Owning multiple interfaces suspends their benefits until surplus installations are dismantled."
 epoch_uap_4_MEGASTRUCTURE_DETAILS:0 "$epoch_uap_4_DESC$"
 epoch_uap_4_CONSTRUCTION_INFO_DELAYED:0 "$epoch_uap_4_DESC$"
 decision_epoch_c_symbiotic_world:0 "Symbiotic World Development"
 decision_epoch_c_symbiotic_world_desc:0 "An already harmonized world deepens the voluntary connection between its population and the resonance network."
 epoch_c_symbiotic_world:0 "Symbiotic World"
 epoch_c_symbiotic_world_desc:0 "Voluntary resonance adaptation complements completed harmonization."
 tr_epoch_convergence_drones_wilderness:0 "Resonant Living Networks"
 tr_epoch_convergence_drones_wilderness_desc:0 "Our living landscapes extend their coordination beyond the atmosphere. Vast orbital structures take shape faster as the entire ecosystem sustains their assembly."
 tr_epoch_convergence_nodes_wilderness:0 "Autonomous Root Nodes"
 tr_epoch_convergence_nodes_wilderness_desc:0 "Roots and distant growths exchange local needs without waiting for one central impulse. Planetary structures develop faster within the living terrain."
 decision_epoch_c_network_inversion:0 "Network-Assisted Resonance Inversion"
 decision_epoch_c_network_inversion_desc:0 "An active Resonance Nexus or a Free UAP Interface supports treatment of a diagnosed, stabilized world. The Free Interface further reduces the cost."
 epoch_c_network_inversion_effect:0 "Converts one diagnosed and stabilized resonance feature to its harmonized form. Active investigations must be completed first."
