 EPOCH_TEMPORAL_STABILIZER_DESC:0 "Hardens shields against penetration and improves relative evasion. Uses an auxiliary slot; multiple units are subject to standard caps."
 tech_epoch_iv_sensors_desc:0 "Null-frequency detection extends sensor range and unlocks causal target computers with all six standard combat roles."
 tech_epoch_iv_reconstruction_desc:0 "Integrates recovered causal data into buildable Coherence Research Complexes. Wilderness: adds direct output to Protocol Integration; resonance job buildings remain unavailable."
 tech_epoch_iv_fields_desc:0 "Confines planetary defense fields and enables temporal stabilization hardware. Wilderness: adds direct output to Protocol Integration; resonance job buildings remain unavailable."
 tech_epoch_iv_storage_desc:0 "Stores resonance energy for staffed Null-field Collectors. Wilderness: adds direct output to Protocol Integration; resonance job buildings remain unavailable."
 tech_epoch_iv_shields_desc:0 "Protocol-driven shield arrays absorb more damage while drawing additional reactor power and a steady core supply."
 tech_epoch_iv_phase_emitter_desc:0 "Unlocks medium and large phase emitters that specialize in breaking armor rather than shields."
 tech_epoch_iv_lance_desc:0 "Concentrates a coherent beam along a capital ship's axis for long-range anti-armor strikes."
 tech_epoch_iv_torpedoes_desc:0 "Turns nullwave propagation into interceptable, shield-bypassing warheads with greater impact against larger hulls."
 tech_epoch_iv_hyperdrive_desc:0 "A stabilized hyperlane aperture shortens drive preparation while retaining a retreat opportunity."
 tech_epoch_iv_transcendent_shields_desc:0 "Unlocks a denser shield lattice with greater capacity and regeneration, at increased power and core cost."
 tech_epoch_iv_protocol_breaker_desc:0 "Unlocks a titan-scale protocol beam that combines a heavy opening strike with a localized blast."
 tech_epoch_iv_coupling_desc:0 "Unlocks rank II Phase Generators, combining staffed planetary defense with stronger bombardment protection. Wilderness: adds direct output to Protocol Integration; resonance job buildings remain unavailable."
 tech_epoch_iv_restoration_desc:0 "Unlocks Harmonization Institutes and reduces diagnosis, stabilization and inversion costs by 20% after personal completion."
 tech_epoch_iv_tissue_desc:0 "Unlocks the Tissue Calibration planetary decision: ten years of food output and habitability support, paid with energy and Protocol Cores. Lithoid founder empires receive +10%/+20% mineral output instead."
 tech_epoch_iv_transcription_desc:0 "Unlocks the Synaptic Transcription Grid planetary decision: ten years of society research and reduced deviancy, paid with energy and Protocol Cores."
 tech_epoch_iv_ethics_desc:0 "Establishes Causality Archives and Warden Academies. These are working civil and military institutions, independent of ascension perks. Wilderness: adds direct output to Protocol Integration; resonance job buildings remain unavailable."
 tech_epoch_iv_symbiosis_desc:0 "Unlocks the Symbiotic Habitat planetary decision. Replaces Tissue Calibration with stronger food, habitability and research support for ten years; grants no species traits. Lithoid founder empires receive +10%/+20% mineral output instead."
 tech_epoch_iv_synaptic_nodes_desc:0 "Unlocks the Autonomous Synaptic Nodes planetary decision. Replaces the transcription grid with research, deviancy control and defense armies for ten years; grants no species traits."
 tech_epoch_iv_self_model_desc:0 "Unlocks the Synthetic Self-model Network planetary decision: ten years of energy production and assembly support, paid with energy and Protocol Cores; grants no species traits."
 tech_epoch_iv_harmonization_desc:0 "Unlocks rank II Harmonization Institutes. On positively converted resonance worlds they provide an additional 5% research job output in each discipline. Wilderness: adds direct output to Protocol Integration; resonance job buildings remain unavailable."
 tech_epoch_iv_identity_desc:0 "Unlocks rank II Causality Archives and anchors the paid local class development projects; no ascension perk or trait is granted. Wilderness: adds direct output to Protocol Integration; resonance job buildings remain unavailable."
 tech_epoch_iv_sovereignty_desc:0 "Unlocks rank II Warden Academies with increased staffed naval coordination and planetary defense. Class ascension perks remain a future development. Wilderness: adds direct output to Protocol Integration; resonance job buildings remain unavailable."
 tech_epoch_iv_mandate_desc:0 "Unlocks the sustained Warden Doctrine edict. This research prepares a possible later mandate; it does not grant an ascension perk. Requires the matching personal final choice. The later perk choice must preserve that philosophy."
 tech_epoch_iv_universal_sovereignty_desc:0 "Unlocks the sustained Open Protocol Research edict. This does not grant an ascension philosophy. Requires the matching personal final choice. The later perk choice must preserve that philosophy."
 tech_epoch_iv_steel_desc:0 "Unlocks staffed Architect smelters. Machine and catalytic production methods retain their respective inputs and yields. Wilderness: adds direct output to Protocol Integration; resonance job buildings remain unavailable."
 tech_epoch_iv_cores_desc:0 "Unlocks Protocol Core Factories that manufacture strategic processors from minerals, alloys and energy. No initial cores are required. Wilderness: unlocks or doubles job-free Protocol Fabrication."
 tech_epoch_iv_laboratories_desc:0 "Unlocks rank II Coherence Research Complexes with expanded research capacity and strategic upkeep. Wilderness: adds direct output to Protocol Integration; resonance job buildings remain unavailable."
 tech_epoch_iv_collectors_desc:0 "Unlocks rank II Null-field Collectors, expanding staffed energy production at a continuing core and mineral cost. Wilderness: adds direct output to Protocol Integration; resonance job buildings remain unavailable."
 tech_epoch_iv_artillery_desc:0 "Unlocks heavy shield-breaking artillery and rank II Architect smelters to supply advanced fleets. Wilderness: adds direct output to Protocol Integration; resonance job buildings remain unavailable."
 tech_epoch_iv_reactor_desc:0 "Unlocks hull-scaled protocol reactors with greater power output than dark matter cores, sustained by manufactured processors."
 tech_epoch_iv_armor_desc:0 "Unlocks reinforced phase armor whose plates repair a small fixed amount of armor each day."
 tech_epoch_iv_fighters_desc:0 "Unlocks autonomous shield-bypassing fighters for carrier hangars, preserving their vulnerability to flak."
 tech_epoch_iv_point_defense_desc:0 "Unlocks fractal interception arrays for dedicated point-defense slots against missiles and strike craft."
 tech_epoch_iv_fabrication_desc:0 "Unlocks rank III Architects' Smelters. Establishes fabrication methods for future infrastructure; no megastructure is currently unlocked. Wilderness: adds direct output to Protocol Integration; resonance job buildings remain unavailable."
 tech_epoch_iv_nexus_desc:0 "Unlocks rank III Coherence Research Complexes. Establishes future Nexus architecture; no megastructure is currently unlocked. Wilderness: adds direct output to Protocol Integration; resonance job buildings remain unavailable."
 tech_epoch_iv_uap_core_desc:0 "Unlocks rank II Protocol Core Factories. Establishes future interface manufacturing; no UAP megastructure is currently unlocked. Wilderness: unlocks or doubles job-free Protocol Fabrication."
