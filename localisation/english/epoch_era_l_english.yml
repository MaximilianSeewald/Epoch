 edict_epoch_era_wilderness_cores:0 "Wilderness Protocol Fabrication"
 edict_epoch_era_wilderness_cores_desc:0 "Manufactures 12 Protocol Cores monthly without jobs for 72 minerals, 12 alloys and 48 energy. UAP Core Construction doubles output and upkeep. Input shortages suspend output. Can be deactivated."
 edict_epoch_era_wilderness_integration:0 "Wilderness Protocol Integration"
 edict_epoch_era_wilderness_integration_desc:0 "Converts universal infrastructure research into direct research, energy, alloy and unity output. Costs 3 cores and 12 energy monthly. Core or energy shortages suspend output. Individual contributions are shown in the resource table."
 epoch_era_tissue_lithoid:0 "Lithoid Tissue Calibration"
 epoch_era_tissue_lithoid_desc:0 "Mineral production replaces the food bonus. Habitability and applicable research benefits are retained."
