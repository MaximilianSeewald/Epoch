l_english:
 epoch_iv_ascension:0 "The Changed Silence"
 epoch_iv_observe:0 "Continue investigation"
 epoch_iv_operations:0 "Open expedition operations"
 epoch_iv_operations_desc:0 "Fund assignments, replace lost targets and manage preparations. Switch back to the investigation approach before opening again."
 epoch_iv_observe_desc:0 "Progress requires completed assignments. Time alone resolves no objective."
 epoch_iv_milestone_1:0 "Two echo sources"
 epoch_iv_goal_1:0 "Complete two staffed science ship projects in different systems."
 epoch_iv_objectives_1:0 "Complete two staffed science ship projects in different systems."
 epoch_iv_milestone_2:0 "A sealed discovery"
 epoch_iv_goal_2:0 "Becomes accessible after completing the preceding investigation."
 epoch_iv_objectives_2:0 "Complete four excavation stages with a scientist. A newly discovered archive system may first require an outpost."
 epoch_iv_milestone_3:0 "A reversible wound"
 epoch_iv_goal_3:0 "Becomes accessible after completing the preceding investigation."
 epoch_iv_objectives_3:0 "Research Resonance Diagnostics and Reversible Resonance Inversion. Diagnose, stabilize and convert a suitable owned colony through three decisions. Without a suitable target, fund a ship expedition in operations."
 epoch_iv_milestone_4:0 "A reconstructable arrangement"
 epoch_iv_goal_4:0 "Becomes accessible after completing the preceding investigation."
 epoch_iv_objectives_4:0 "Research Material Analysis. Fund the prototype in operations and complete its science ship project."
 epoch_iv_milestone_5:0 "The final trial"
 epoch_iv_goal_5:0 "Becomes accessible after completing the preceding investigation."
 epoch_iv_objectives_5:0 "Destroy the marked personal Adjudicator in actual space combat. Telemetry and a paid science ship project at your research location enable an optional countermeasure. Allies may help."
 epoch_iv_milestone_6:0 "An answer of our own"
 epoch_iv_goal_6:0 "Becomes accessible after completing the preceding investigation."
 epoch_iv_objectives_6:0 "Choose a lasting position after the military victory. This establishes eligibility for later research content without granting it."
 epoch_iv.10.name:0 "Silence after the Storm"
 epoch_iv.10.desc:0 "Years after the last battle, two records from our own expeditions contradict each other. One entry changes only while nobody reads it. Another preserves the voice of a transmitter that fell silent long ago. Both carry the same gap in their timestamps. Two independent measurements must establish whether the war ended something or merely interrupted it."
 epoch_iv.10.desc.hive:0 "The hive remembers the war. Yet two memory nodes give different answers to the same question. Both lack the same instant. No drone forgot it; it was never received. We dispatch two independent scientific detachments before the false memory takes root in the consciousness."
 epoch_iv.10.desc.machine:0 "Two unchanged checksums identify different datasets. Our archives report no write access. Yet one dataset contains a reply to a query scheduled for tomorrow. Two spatially separated measurements will isolate the fault. A local self-correction would be premature."
 epoch_iv.careful:0 "Accept only reproducible results."
 epoch_iv.experimental:0 "Couple the contradictory datasets."
 epoch_iv.guardian:0 "Prioritize protective circuits."
 epoch_iv.continue:0 "Continue the investigation."
 epoch_iv.20.name:0 "The Archive without Creators"
 epoch_iv.20.desc:0 "Both measurements reveal the same impossible absence. It describes no transmitter, but the outline of a place. A sealed archive lies beneath a lifeless surface. No name marks its entrance. Inside, a mechanism still acknowledges every new dataset with a question: Who consented?"
 epoch_iv_archive:0 "The Nameless Archive"
 epoch_iv_archive_desc:0 "A sealed archive contains contradictory memories. Four successive excavation stages require a science ship with a scientist."
 epoch_iv.21.name:0 "The First Threshold"
 epoch_iv.21.desc:0 "The door stores no language, only relationships: reply to question, boundary to touch. Beyond it lie records made of mutually incompatible materials. We can preserve their delicate verification sequences, extract readable content immediately, or isolate dangerous connections."
 epoch_iv.secure:0 "Preserve verification sequences."
 epoch_iv.extract:0 "Extract readable data."
 epoch_iv.isolate:0 "Isolate the connections."
 epoch_iv.22.name:0 "Incompatible Memories"
 epoch_iv.22.desc:0 "One chamber describes the same encounter as conversation, another as computation, a third as a shared dream. No version takes precedence. Only our parallel measurements make the structure readable: the differences were deliberately preserved. Our teams obtain reliable data for resonance diagnostics."
 epoch_iv.23.name:0 "An Answer without a Question"
 epoch_iv.23.desc:0 "Beneath the memory layers lies a damaged instruction. It demands protection without identifying whom to protect. A later intervention removed its consent check. The remaining samples contain a technical insight: resonance states can be changed without destroying their carriers."
 epoch_iv.24.name:0 "The Empty Place"
 epoch_iv.24.desc:0 "At the archive's center stands neither throne nor control core. A connection is missing. Reconstructing part of the gap, our scientists recognize the pattern of earlier planetary damage. What we called infection or scar is unfinished. Only a real reversal can establish whether this insight holds."
 epoch_iv.30.name:0 "The Inversion"
 epoch_iv.30.desc:0 "The archive offers no instant cure. Each affected site needs diagnosis, stable containment and a slow inversion. Old seals and ongoing investigations must remain intact. If no suitable owned site survives, a substantially more expensive ship expedition can obtain reconstruction data from recovered samples. It does not heal an invented world."
 epoch_iv.40.name:0 "The Broken Protocol"
 epoch_iv.40.desc:0 "For the first time, a sequence operates without harming its carrier. The reconstructed data name its authors: the Architects, an alliance of unlike intelligences. Their Universal Ascension Protocol, the UAP, was intended to enable connection without loss of identity. In damaged components, consent became indistinguishable from availability. A limited physical prototype must establish whether that distinction can be restored. Our chosen research strategy continues to shape the work."
 epoch_iv.45.name:0 "The Final Adjudicator"
 epoch_iv.45.desc:0 "The prototype answers. An isolated safeguard accepts our technical identity but refuses authorization. Its judgment admits one final trial. Its coordinates are marked as our personal military objective. Telemetry may expose weaknesses; no laboratory answer replaces victory. A failed attack leaves the Adjudicator standing."
 epoch_iv.53.name:0 "Verdict"
 epoch_iv.53.desc:0 "The Adjudicator's shell splits. Its protective circuits sacrifice part of their shielding to feed the weapons faster. Eight sealed escort ships unfold into formation. The Adjudicator no longer judges from a distance."
 epoch_iv.54.name:0 "Broken Protocol"
 epoch_iv.54.desc:0 "An exposed core shines beneath the collapsing armor. The last reserves feed the attack; shields and armor weaken. A damaged question repeats between targeting reports. We can answer only after the battle."
 epoch_iv.60.name:0 "Heirs of the Architects"
 epoch_iv.60.desc:0 "The Adjudicator has fallen in combat. Its last record is a handover, not an order. The Architects were no single species and left no rightful ruler. Their alliance fractured when damaged connections could no longer distinguish consent from assimilation. The Nullwardens then guarded an error as though it were law. The protocol key is now ours. We may preserve its boundaries or enable free connections. Both require future research; neither knowledge nor infrastructure appears merely because we choose."
 epoch_iv.final_guard:0 "We will preserve the protocol's boundaries."
 epoch_iv.final_free:0 "Connection shall remain a free choice."
 epoch_iv.80.name:0 "Expedition Operations"
 epoch_iv.80.desc:0 "Operations lists the assignments currently available. Planetary treatments are ordered on the affected owned colony. Lost ships or scientists can be replaced normally and assigned to the existing task. Changing a work location requires abandoning and funding the work again."
 epoch_iv.reissue:0 "Reanchor outstanding echo measurements (300 energy)."
 epoch_iv.relocate:0 "Replace lost archive access (1,000 energy, 300 alloys)."
 epoch_iv.recover:0 "Fund salvage expedition (6,000 energy, 2,500 alloys)."
 epoch_iv.build:0 "Fund physical prototype (3,000 energy, 4,000 alloys)."
 epoch_iv.summon:0 "Locate the isolated instance."
 epoch_iv.assemble:0 "Deploy the tested demonstrator."
 epoch_iv.counter:0 "Fund countermeasure (2,000 energy, 800 alloys)."
 epoch_iv.retarget:0 "Cancel active ship assignments and select a new location (500 energy)."
 epoch_iv.close:0 "Return to the investigation."
 EPOCH_IV_SIGNAL_A:0 "First Echo Measurement"
 EPOCH_IV_SIGNAL_A_DESC:0 "Measure the first source with a staffed science ship."
 EPOCH_IV_SIGNAL_B:0 "Independent Control Measurement"
 EPOCH_IV_SIGNAL_B_DESC:0 "Investigate a second source in another system with a staffed science ship."
 EPOCH_IV_RECOVERY:0 "Resonance Salvage Expedition"
 EPOCH_IV_RECOVERY_DESC:0 "540 days of staffed scientific work on recovered samples. Provides reconstruction data, without creating a planetary feature."
 EPOCH_IV_PROTOTYPE:0 "Prototype Reconstruction"
 EPOCH_IV_PROTOTYPE_DESC:0 "360 days of staffed assembly and testing at the selected star. Operations has paid the material cost."
 EPOCH_IV_COUNTER:0 "Compare Guardian Telemetry"
 EPOCH_IV_COUNTER_DESC:0 "300 days of staffed analysis at your research location. Reduces the personal Adjudicator's weapon output and fire rate, without replacing combat."
 decision_epoch_iv_diagnose:0 "Diagnose Resonance State"
 decision_epoch_iv_diagnose_desc:0 "90 days; 600 energy. Records the existing resonance feature family for this empire."
 decision_epoch_iv_stabilize:0 "Stabilize Resonance State"
 decision_epoch_iv_stabilize_desc:0 "180 days; 1,800 energy, 600 alloys. Requires your diagnosis and prepares the inversion."
 decision_epoch_iv_invert:0 "Invert Resonance Positively"
 decision_epoch_iv_invert_desc:0 "360 days; 3,500 energy, 1,500 alloys. Replaces exactly one suitable resonance feature family with its permanent positive state. Other families, historical mission outcomes and crisis damage are preserved."
 decision_epoch_iv_operations:0 "Contact Expedition Operations"
 decision_epoch_iv_operations_desc:0 "Opens current personal assignments and recovery options."
 d_epoch_iv_matrix:0 "Symbiotic Resonance Matrix"
 d_epoch_iv_matrix_desc:0 "The unfinished adaptation now sustains its host. A paid inversion has replaced the former contamination."
 d_epoch_iv_fold:0 "Harmonized Spatial Fold"
 d_epoch_iv_fold_desc:0 "The former scar forms a stable environment for research."
 d_epoch_iv_archive:0 "Awakened Resonance Archive"
 d_epoch_iv_archive_desc:0 "The surviving structure responds without overwriting its surroundings."
 tech_epoch_iv_spectroscopy:0 "Echo Spectroscopy"
 tech_epoch_iv_spectroscopy_desc:0 "Spatially separated measurements make previously unreadable echo patterns comparable."
 tech_epoch_iv_calibration:0 "Phase Window Calibration"
 tech_epoch_iv_calibration_desc:0 "Controlled observation windows improve scientific surveys."
 tech_epoch_iv_diagnostics:0 "Resonance Diagnostics"
 tech_epoch_iv_diagnostics_desc:0 "Existing resonance damage can be diagnosed on site."
 tech_epoch_iv_inversion:0 "Reversible Resonance Inversion"
 tech_epoch_iv_inversion_desc:0 "Enables paid positive inversion of stabilized resonance features and the alternative salvage expedition."
 tech_epoch_iv_materials:0 "Nullwarden Material Analysis"
 tech_epoch_iv_materials_desc:0 "Reconstructed material data enable construction of a limited prototype."
 tech_epoch_iv_telemetry:0 "Guardian Telemetry Reconstruction"
 tech_epoch_iv_telemetry_desc:0 "Enables an optional paid countermeasure project against the personal Adjudicator."
