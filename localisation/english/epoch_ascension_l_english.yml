 EPOCH_IV_COUNTER:0 "Compare Guardian Telemetry"
 EPOCH_IV_COUNTER_DESC:0 "300 days of staffed analysis at your research location. Reduces the personal Adjudicator's weapon output and fire rate, without replacing combat."
 decision_epoch_iv_diagnose:0 "Diagnose Resonance State"
 decision_epoch_iv_diagnose_desc:0 "Map resonance damage over 90 days, distinguishing contamination, spatial scars and surviving structures before treatment begins."
 decision_epoch_iv_stabilize:0 "Stabilize Resonance State"
 decision_epoch_iv_stabilize_desc:0 "180 days. Requires your diagnosis and prepares the inversion."
 decision_epoch_iv_invert:0 "Invert Resonance Positively"
 decision_epoch_iv_invert_desc:0 "Over 360 days, reverse the diagnosed and stabilized resonance damage into a lasting harmonized state. Other affected features require their own treatment; independent damage from earlier decisions remains."
 decision_epoch_iv_operations:0 "Contact Expedition Operations"
