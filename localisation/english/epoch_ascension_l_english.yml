 EPOCH_IV_DEMONSTRATOR:0 "Reconstructing the Demonstrator"
 EPOCH_IV_DEMONSTRATOR_DESC:0 "The restored world has shown that the protocol can sustain its host. Our engineers must now turn the recovered plans into a connection that brings distinct minds together while preserving their boundaries.\n\nThis empire-wide Engineering research project requires no site or science ship. Completing it constructs the physical demonstrator and begins the next trial. Material Analysis improves our Engineering research, but is not required."
