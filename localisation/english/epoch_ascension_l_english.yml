 NAME_EPOCH_IV_Judge:0 "The Final Adjudicator"
 NAME_EPOCH_IV_Prototype:0 "Resonance Demonstrator"
 epoch_adjudicator:0 "Isolated Safeguard"
 epoch_iv_judge_chain_title:0 "The Final Trial"
 epoch_iv_judge_chain_desc:0 "The Final Adjudicator stands between us and the protocol key. We must defeat its principal vessel in battle; losing its coordinates cannot establish victory."
 epoch_iv_arena_poi:0 "The Final Adjudicator"
 epoch_iv_arena_poi_desc:0 "Our personal military objective. Our fleets or eligible allied parties must conduct the trial in battle."
 epoch_iv.40.desc.hive:0 "The archive answers in many voices without merging them into one consciousness. Its authors, the Architects, designed the Universal Ascension Protocol: UAP. It was intended to let even a hive connect without dissolving its inner unity. Damaged checks turned connection into an order to assimilate. Our demonstrator must preserve a boundary that no individual may define for us.\n\nNext step: begin Reconstructing the Demonstrator in the Situation Log. Our engineers will carry out the empire-wide research project without a science ship."
 epoch_iv.40.desc.machine:0 "For the first time, the reconstructed checks distinguish reachability from authorization. Their authors called themselves the Architects. The Universal Ascension Protocol, UAP, was meant to connect independent intelligences. Damaged code treated every reachable instance as authorized. Our demonstrator must accept withdrawal without deleting the refusing identity as an error.\n\nNext step: begin Reconstructing the Demonstrator in the Situation Log. Our engineers will carry out the empire-wide research project without a science ship."
 epoch_iv.60.desc.hive:0 "The Adjudicator has fallen. Its final data contain no superior consciousness. The Architects were an alliance that sought to preserve differences. The Nullwardens later defended damaged instructions like immutable instincts. The protocol key now belongs to the hive. Shall we guard its boundaries or enable connections that every consciousness may leave again?"
 epoch_iv.60.desc.machine:0 "The Adjudicator has fallen. Its last record transfers authorization, not ownership. The Architects left no central administrator account. When the UAP confused consent with availability, the Nullwardens preserved the error as their highest rule. The protocol key is now ours. We can secure boundaries as verifiable conditions or open free connections between independent instances. Either choice requires further work."
 epoch_iv.lens:0 "Preserve the field lens as an unchanged dataset."
 epoch_iv.range:0 "Integrate the sensor arrangement into our fleets."
 epoch_iv.replay:0 "Retain the reconstruction already chosen."
 epoch_iv.restore:0 "Fund a renewed trial (2,000 energy, 4,000 alloys)."
