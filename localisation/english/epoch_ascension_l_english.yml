 epoch_iv.46.name:0 "An unanswered verdict"

 epoch_iv.46.desc:0 "The Adjudicator has vanished, but no verifiable victory was recovered. We cannot claim its protocol key. The expedition directorate can reconstruct the trial for 2,000 energy and 4,000 alloys, at most twice. The replacement must be defeated in battle."

