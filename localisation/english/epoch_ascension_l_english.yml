 d_epoch_iv_matrix_desc:0 "Restored contamination yields +10% resources from jobs, +5 stability and +5% habitability. Independent emergency damage remains."
 d_epoch_iv_fold:0 "Harmonized Spatial Fold"
 d_epoch_iv_fold_desc:0 "The former scar forms a stable environment for research."
 d_epoch_iv_archive:0 "Awakened Resonance Archive"
 d_epoch_iv_archive_desc:0 "The surviving structure responds without overwriting its surroundings."
 tech_epoch_iv_spectroscopy:0 "Echo Spectroscopy"
 tech_epoch_iv_spectroscopy_desc:0 "Spatially separated measurements make previously unreadable echo patterns comparable."
 tech_epoch_iv_calibration:0 "Phase Window Calibration"
 tech_epoch_iv_calibration_desc:0 "Controlled observation windows improve scientific surveys."
 tech_epoch_iv_diagnostics:0 "Resonance Diagnostics"
 tech_epoch_iv_diagnostics_desc:0 "Existing resonance damage can be diagnosed on site."
 tech_epoch_iv_inversion:0 "Reversible Resonance Inversion"
 tech_epoch_iv_inversion_desc:0 "Enables paid positive inversion of stabilized resonance features and the alternative salvage expedition."
 tech_epoch_iv_materials:0 "Nullwarden Material Analysis"
 tech_epoch_iv_materials_desc:0 "Recovered material data increase Engineering research production by 3%, also supporting reconstruction of the demonstrator. They are not required to begin the project."
 tech_epoch_iv_telemetry:0 "Guardian Telemetry Reconstruction"
 tech_epoch_iv_telemetry_desc:0 "Enables an optional paid countermeasure project against the personal Adjudicator."
