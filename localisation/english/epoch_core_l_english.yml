epoch_res.recontact:0 "Re-establish contact: a new battle is required."
decision_epoch_res_resume:0 "Resume resonance operations"
decision_epoch_res_resume_desc:0 "Reopen the current briefing or fund remote science. No objective is completed by this action."
epoch_res.11.name:0 "A Frequency Beyond the Scar"
epoch_res.11.desc:0 "The survey detects a second component. Move a staffed science ship away from the old site and establish an independent baseline. Only then can we distinguish an approaching vessel from an echo. Remote reconstruction is possible, but costs more and loses detail."
epoch_res.baseline:0 "Fund the independent expedition."
epoch_res.baseline_remote:0 "Fund an archive baseline."
epoch_res.32.name:0 "Inside the Correction"
epoch_res.32.desc:0 "The wreck fragments contain nested instructions. A second scientific pass must isolate the targeting signature before our archive can safely compare it. If the wreck site is lost, secured fragments can be examined at our capital for an additional cost."
epoch_res.signature:0 "Isolate the signature in the field."
epoch_res.signature_remote:0 "Examine the secured fragments remotely."
epoch_res.72.name:0 "Restore the Interrupted Signal"
epoch_res.72.desc:0 "The third station records an interrupted transmission. Reissue its expedition or fund less precise remote sampling at our capital. A staffed science ship must complete either route."
epoch_res.retry_interrupted:0 "Reissue the field project."
epoch_res.remote_interrupted:0 "Fund remote measurements."
epoch_res.53.name:0 "An Interrupted Order"
epoch_res.53.desc:0 "The third station went silent halfway through an instruction. The surviving header names neither a sender nor a destination. It does, however, refer to formations beyond the local perimeter. We have found the edge of a conflict, not its beginning."
