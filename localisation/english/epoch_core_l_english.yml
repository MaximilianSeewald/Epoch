 epoch_core_structure_ruins:0 "Structure remains"
 epoch_core_structure_ruins_desc:0 "The exposed structure has been destroyed, leaving a damaged site."
 epoch_core_permanent_scar_organic:0 "Persistent biological damage"
 epoch_core_permanent_scar_organic_desc:0 "A lasting biological change continues to impair production on this world."
 epoch_core_permanent_scar_hive:0 "Persistent network damage"
 epoch_core_permanent_scar_hive_desc:0 "A lasting discontinuity continues to impair the collective's work on this world."
 epoch_core_permanent_scar_machine:0 "Persistent process damage"
 epoch_core_permanent_scar_machine_desc:0 "A lasting process defect continues to impair production on this world."
 epoch_core_permanent_scar_exacerbated:0 "Severe persistent damage"
 epoch_core_permanent_scar_exacerbated_desc:0 "The losses and disturbances suffered during the inquiry have left an additional, lasting burden on this world."
 epoch_core_permanent_scar_fallback:0 "Persistent empire-wide disruption"
 epoch_core_permanent_scar_fallback_desc:0 "A lasting systems fault continues to reduce the empire's energy production."
 epoch_core_permanent_scar_exacerbated_fallback:0 "Severe persistent systems damage"
 epoch_core_permanent_scar_exacerbated_fallback_desc:0 "The losses and disturbances have left an additional, lasting reduction in energy production."
