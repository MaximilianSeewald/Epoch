 epoch_first_echo_phase_echo_research:0 "Analyze the pulse. At 15 progress, assign a staffed Science Ship to the first investigation."
 epoch_first_echo_phase_expedition_research:0 "Compare the recovered intervals. At 25 progress, authorize an expedition to the signal coordinates."
 epoch_first_echo_phase_contamination_research:0 "Compare the expedition report with local samples. At 35 progress, decide how to handle the contamination."
 epoch_first_echo_phase_structure_research:0 "Locate the source beneath the altered layers. At 45 progress, authorize the excavation."
 epoch_first_echo_phase_report_research:0 "Combine the expedition, sample and excavation records. At 55 progress, review the final assessment."
 epoch_core.23.a.tooltip:0 "Keep the surviving evidence available for further inquiry. The damage already recorded remains."
 epoch_core.23.b.tooltip:0 "Close this inquiry permanently. No further expeditions will be authorized; existing damage and discoveries remain."
 epoch_core.summary.echo_abandoned:0 "The second comparison was abandoned; our signal record remains incomplete."
 epoch_core.summary.echo_degraded:0 "The forced signal lock left a damaged reference which still limits our conclusions."
 epoch_core.summary.echo_cautious:0 "The patient baseline preserves a reliable interval, but no identifiable sender."
 epoch_core.summary.echo_aggressive:0 "The rapid sweep recovered a bearing without explaining what answered it."
 epoch_core.summary.expedition_cancelled:0 "The expedition was recalled before contact was lost; only remote observations connect it to this site."
 epoch_core.summary.expedition_rescued:0 "The recovered expedition personnel report the same gap that our instruments cannot account for."
 epoch_core.summary.expedition_recorder:0 "Only the expedition recorder returned. Its repeated interval outlasted the expedition."
 epoch_core.summary.expedition_wake:0 "The remote survey preserved the distortion, but the expedition never returned."
 epoch_core.summary.expedition_lost:0 "The missing expedition is recorded as lost. Its silence remains part of the evidence."
 epoch_core.summary.contamination_contained:0 "Isolation stopped the active local disturbance. It did not explain the deeper damage."
 epoch_core.summary.contamination_studied:0 "Sampling reduced the disturbance, but a persistent trace remains in local processes."
 epoch_core.summary.contamination_neglected:0 "The unresolved contamination remains a lasting burden; closing the report will not remove it."
 stage_echo_resolution:0 "First Echo: Investigations Pending"
 epoch_resonance_protocol:0 "Resonance Protocol"
 epoch_ii_situation_desc:0 "The old contamination record has begun to answer a signal the empire thought was silent. Resonance stability begins at 60 on a scale of 0–100; decisions, research posture and the hunters' attack change its value. Complete each investigation before the protocol advances."
 epoch_ii_controlled_approach:0 "Controlled Analysis"
 epoch_ii_intensive_approach:0 "Intensive Research"
 epoch_ii_suppress_approach:0 "Suppress Resonance"
 epoch_ii_exploit_approach:0 "Exploit Resonance"
 epoch_ii_progress_controlled:0 "Controlled Analysis"
 epoch_ii_progress_intensive:0 "Intensive Research"
 epoch_ii_progress_suppress:0 "Suppression Protocol"
 epoch_ii_progress_exploit:0 "Resonance Exploitation"
 epoch_ii_stability_bonus:0 "High resonance stability aids the controlled analysis."
 epoch_ii_stability_recovery:0 "Low resonance stability slows progress; suppression helps restore control."
 epoch_ii_stability_risk:0 "Low resonance stability makes exploitation unpredictable."
 epoch_ii_stage_scar:0 "Chapter 1 — The Scar Wakes: choose an investigation posture."
 epoch_ii_stage_scar_report:0 "Chapter 1 — Assign a staffed Science Ship to survey the scar, or use the archive fallback."
 epoch_ii_stage_hunters:0 "Chapter 2 — Choose how to respond to the incoming unknown force."
 epoch_ii_stage_hunters_resolution:0 "Chapter 2 — Resolve the threat through defense, diversion, or recorded withdrawal."
 epoch_ii_stage_code:0 "Chapter 3 — Select a method to analyze the recovered signal or wreck."
 epoch_ii_stage_handoff:0 "Chapter 3 — Review the counter-pattern report to complete Block A."
 epoch_ii.1.name:0 "The Scar Wakes"
 epoch_ii.1.desc.organic:0 "Across the old contamination site, sleeping communities report the same dream: a pulse passing through soil, water and bone. The scar has acquired a geometry that no survey recorded. Somewhere beyond the system, something has answered the signal."
 epoch_ii.1.desc.hive:0 "Peripheral drones register a rhythm outside the synaptic lattice. It repeats through brood chambers and mineral seams, matching the old contamination record. The scar is answering a distant signal."
 epoch_ii.1.desc.machine:0 "Clock drift and reordered memory addresses converge on the archived contamination coordinates. The anomaly is not a biological infection; it is a patterned fault that has begun to answer an external signal."
 epoch_ii.1.a:0 "Reopen the record."
 epoch_ii.2.name:0 "A Pattern in the Scar"
 epoch_ii.2.desc.organic:0 "The old damage now repeats in precise intervals. Survey teams disagree about whether to observe from a distance, establish a research perimeter, or suppress the signal before it spreads."
 epoch_ii.2.desc.hive:0 "A cadence presses against the collective. Isolate it, study it through a bounded perimeter, or damp it before more drones synchronize."
 epoch_ii.2.desc.machine:0 "A recurring clock correction appears in the archived site. Choose passive observation, a constrained research sandbox, or emergency signal suppression."
 epoch_ii.2.a:0 "Observe from a distance."
 epoch_ii.2.b:0 "Open a limited research perimeter."
 epoch_ii.2.c:0 "Impose emergency suppression."
 epoch_ii.3.name:0 "Baseline Recorded"
 epoch_ii.3.desc:0 "The survey finds a reply embedded in the scar's old signal band. The measurements are stable enough to compare with the earlier record, but they identify no sender."
 epoch_ii.3.desc.archive:0 "The archive preserves enough of the old signal to confirm a reply, but the measurements are incomplete and identify no sender."
 epoch_ii.3.a:0 "Preserve the baseline and continue."
 epoch_ii.4.name:0 "The First Hunters"
 epoch_ii.4.desc.organic:0 "A compact formation crosses into the scar system. Its broken pulses match the old record, and its weapons turn toward the responding site. The formation gives no intelligible warning."
 epoch_ii.4.desc.hive:0 "Unknown hulls enter the scar system. Their emissions cancel the same intervals carried by the foreign cadence. They move toward its source."
 epoch_ii.4.desc.machine:0 "An unidentified formation enters the system and targets the resonance source. Its emissions attempt to cancel the same signal recorded in the old contamination archive."
 epoch_ii.4.desc.remote:0 "An unidentified formation enters the system and targets the listening post built around our surviving records. Its broken pulses match the signal archived from the lost contamination world."
 epoch_ii.4.combat:0 "Our forces engage the unknown ships. Their weapons are real and their formation is compact, but the evidence before us cannot establish their purpose. Record the engagement and recover whatever survives."
 epoch_ii.4.defense:0 "The force is approaching the resonance site. Our defense expenditure buys time to concentrate a real fleet in the system. If enough ships reach the system, we can turn the formation back; otherwise we must evacuate sensitive records or withdraw under fire."
 epoch_ii.4.diversion:0 "A science-led signal lure may draw the formation away from the scar. It will take time and expose our research ship to risk."
 epoch_ii.4.a:0 "Engage the formation."
 epoch_ii.4.b:0 "Commit alloys, energy, and a fleet to hold the system."
 epoch_ii.4.c:0 "Prepare a scientific diversion."
 epoch_ii.4.d:0 "Withdraw and preserve a remote signal trace."
 epoch_ii.7.name:0 "The Broken Code"
 epoch_ii.7.desc.wreck:0 "The recovered wreck repeats a correction sequence, not a language. Every attempt to cancel the scar's pulse leaves a smaller echo elsewhere."
 epoch_ii.7.desc.signal:0 "The intercepted trace repeats a correction sequence, not a language. It reacts to deviations in the scar's pulse."
 epoch_ii.7.desc.archive:0 "The archive reconstruction is incomplete, but its surviving intervals reproduce a correction sequence. The original wreck and site remain absent from our reach."
 epoch_ii.7.a:0 "Proceed with cautious forensic analysis."
 epoch_ii.7.b:0 "Reconstruct the pattern intensively."
 epoch_ii.7.c:0 "Use the slower archive comparison."
 epoch_ii.7.report.name:0 "Counter-Pattern"
 epoch_ii.7.report.desc:0 "The comparison confirms a counter-pattern shared by the scar and the attackers' signal. Researchers adopt the provisional name Nullwardens for the unknown formation. Resonance Spectroscopy is now available for normal research, but the analysis does not explain who created either pattern."
 epoch_ii.7.report.a:0 "Record the result and end Block A."
 epoch_ii.recovery.name:0 "Evidence Route Interrupted"
 epoch_ii.recovery.desc:0 "The original world, research vessel, or physical evidence is unavailable. The archive preserves enough of the signal to continue at lower yield, or to record the loss and close this inquiry."
 epoch_ii.recovery.a:0 "Continue using the degraded archive."
 epoch_ii.recovery.wait:0 "Wait until a Science Ship can be assigned."
 epoch_ii.c1_recovery.desc:0 "The research vessel failed to complete its survey. The site remains unchanged, but its signal can still be studied through an incomplete archive or the work can be sealed."
 epoch_ii.18.name:0 "The Diversion Fails"
 epoch_ii.18.desc:0 "The signal replica did not pull the unknown formation away. It continues toward the scar. We can order a costly withdrawal and preserve its signal, or end the investigation."
 epoch_ii.18.a:0 "Withdraw the defenders and secure the signal trace."
 epoch_ii.refuse:0 "Seal the records and end this investigation."
 epoch_ii.science_ship_missing:0 "No staffed Science Ship is available to investigate the scar. Continue with the degraded archive, or wait for a vessel and scientist to become available."
 tech_epoch_resonance_spectroscopy:0 "Resonance Spectroscopy"
 tech_epoch_resonance_spectroscopy_desc:0 "Spectral comparison isolates repeating cancellation intervals in anomalous signals. The method improves ordinary physics research and enables further study of resonance phenomena."
 tech_epoch_adaptive_resonance_armor:0 "Adaptive Resonance Armor"
 tech_epoch_adaptive_resonance_armor_desc:0 "Layered adaptive plating disperses patterned energy across a ship's defensive lattice. It increases armor and hull resilience in ordinary engagements."
 SMALL_EPOCH_RESONANCE_ARMOR:0 "Adaptive Resonance Plating"
 SMALL_EPOCH_RESONANCE_ARMOR_DESC:0 "A small-ship armor component reinforced against repeating energy patterns."
 EPOCH_RESONANCE_ARMOR:0 "Adaptive Resonance Plating"
 EPOCH_RESONANCE_ARMOR_DESC:0 "A modular armor set tuned to resist repeated resonance patterns."
 d_epoch_contamination_active:0 "Resonant Contamination Site"
 d_epoch_contamination_active_desc:0 "The original contamination site remains active in the historical record. Its earlier consequences are preserved."
 d_epoch_contamination_worsened:0 "Worsened Contamination Site"
 d_epoch_contamination_worsened_desc:0 "The original site records the worsened outcome and its persistent local consequences."
 d_epoch_contamination_studied:0 "Studied Contamination Site"
 d_epoch_contamination_studied_desc:0 "Sampling changed the recorded expression but did not erase the original site's consequences."
 d_epoch_contamination_contained:0 "Contained Contamination Site"
 d_epoch_contamination_contained_desc:0 "The original site's active effects were contained; its history and residual evidence remain."
 d_epoch_conclusion_scar_organic:0 "Permanent Conclusion Scar"
 d_epoch_conclusion_scar_organic_desc:0 "The lasting organic-class scar from the earlier inquiry remains on this world."
 d_epoch_conclusion_scar_hive:0 "Permanent Conclusion Scar"
 d_epoch_conclusion_scar_hive_desc:0 "The lasting hive-class scar from the earlier inquiry remains on this world."
 d_epoch_conclusion_scar_machine:0 "Permanent Conclusion Scar"
 d_epoch_conclusion_scar_machine_desc:0 "The lasting machine-class scar from the earlier inquiry remains on this world."
 epoch_ii.4.combat_report:0 "Our forces have intercepted the unknown fleet. It continues to target the resonance source. We must record the battle's outcome or order a withdrawal before this investigation can proceed."
 epoch_ii.4.win:0 "The engagement is won. Recover the wreckage."
 epoch_ii.4.loss:0 "Order a withdrawal and preserve the signal trace."
 epoch_ii.4.hold:0 "Hold the cordon until the formation breaks."
 epoch_ii.4.defense_loss:0 "Abandon the cordon and withdraw."
 epoch_ii.15.evacuate:0 "Evacuate sensitive records and withdraw."
 epoch_ii.11.name:0 "The Evidence Is Incomplete"
 epoch_ii.11.desc:0 "The signal can be reconstructed from the available wreckage or trace, but the analysis requires a staffed Science Ship. A costly archive comparison can substitute, or the work can wait for a ship."
 epoch_ii.11.a:0 "Spend energy and alloys on the remote archive analysis."
 epoch_ii.11.b:0 "Wait for a staffed Science Ship."
 NAME_EPOCH_Unknown_Force:0 "Unidentified Suppression Force"
 NAME_EPOCH_Unknown_Patrol:0 "Unidentified Patrol"
 NAME_EPOCH_Unknown_Skirmisher:0 "Unidentified Skirmisher"
 EPOCH_II_SCAR_SURVEY:0 "Resonance Site Survey"
 EPOCH_II_SCAR_SURVEY_DESC:0 "Measure the changes at the original contamination site and compare them with the archived expedition record."
 EPOCH_II_SIGNAL_DIVERSION:0 "Construct a Signal Diversion"
 EPOCH_II_SIGNAL_DIVERSION_DESC:0 "Build a controlled replica of the scar's signal and lure the unknown fleet away from its source."
 EPOCH_II_CODE_ARCHIVE:0 "Reconstruct the Signal from Archives"
 EPOCH_II_CODE_ARCHIVE_DESC:0 "Compare the recovered intervals with the empire's archived contamination and expedition records."
 EPOCH_II_CODE_FORENSICS:0 "Forensic Wreck Analysis"
 EPOCH_II_CODE_FORENSICS_DESC:0 "Inspect recovered components and map the repeating correction sequence without dismantling the entire wreck."
 EPOCH_II_CODE_RECONSTRUCTION:0 "Intensive Pattern Reconstruction"
 EPOCH_II_CODE_RECONSTRUCTION_DESC:0 "Rapidly reconstruct the correction sequence, accepting added resource cost and lower resonance stability."
 epoch_ii.16.no_target:0 "No owned world can host the diversion. Seal the source records and withdraw."
 epoch_ii.c1_project_failed.desc:0 "The survey failed before it could establish a reliable baseline. The site remains available for another attempt, or the archived records can close the chapter."
 epoch_ii.c1_project_cancelled.desc:0 "The survey was cancelled before completion. We can attempt it again or close the chapter using the archived records."
 epoch_ii.project.retry:0 "Prepare another attempt."
 epoch_ii.18.failed.desc:0 "The signal replica failed to divert the hostile formation. The project has imposed losses, but the surviving force can still be drawn away at a further cost."
 epoch_ii.18.cancelled.desc:0 "The diversion project was cancelled before completion. We can retry the operation or secure the records and withdraw."
 epoch_ii.18.retry:0 "Rebuild the diversion and try again."
 epoch_ii.18.withdraw:0 "Seal the source, secure the signal trace, and withdraw."
 epoch_ii.11.failed.desc:0 "The reconstruction did not produce a stable pattern. The research team can try again or complete the chapter through a costly archive comparison."
 epoch_ii.11.cancelled.desc:0 "The reconstruction was cancelled before completion. The project can be restarted or the chapter can be closed through an archive comparison."
 epoch_ii.11.no_site:0 "Use the surviving remote records to close the chapter without a local research site."
 epoch_ii.11.limited_archive:0 "Close the chapter with an incomplete archive reconstruction."
 epoch_ii_stage_ch4_research:0 "Chapter 4: choose how to contain, observe, or exploit the second resonance expression."
 epoch_ii_stage_ch4_action:0 "Resolve two planetary incidents and record a durable protocol before proceeding."
 epoch_ii_stage_ch5_research:0 "Prepare an interstellar listening plan."
 epoch_ii_stage_ch5_action:0 "Survey two real systems, or pay for the lower yield archive route."
 epoch_ii_stage_silent_system:0 "Choose how the science team responds to the unnatural silence."
 epoch_ii_stage_ch6_research:0 "Review the network evidence and prepare for an adapted hostile force."
 epoch_ii_stage_ch6_action:0 "Resolve the second encounter through battle, a prepared trap, countermeasure, or withdrawal."
 epoch_ii.60.name:0 "The Second Infection"
 epoch_ii.60.desc.organic:0 "Patterns appear in growth rings, soil chemistry, and synchronized sleep. The effect crosses no ordinary biological pathway. A quarantine sacrifices output but may keep the boundary legible; direct study yields better data; deliberate exposure could reveal the pattern at a cost to stability."
 epoch_ii.60.desc.hive:0 "Peripheral drones repeat an impulse absent from the brood's own signaling. Isolation limits disruption, observation may map the cadence, and deliberate exposure could give researchers a stronger return while risking coordination."
 epoch_ii.60.desc.machine:0 "Memory writes drift in synchronized intervals and processed alloys carry repeated microstructure. Sandboxing is safer; direct emulation is richer; a live process mirror could produce exceptional data at stability risk."
 epoch_ii.60.a:0 "Quarantine the boundary. (Safer; lower yield)"
 epoch_ii.60.b:0 "Observe under controlled conditions. (Moderate risk; better data)"
 epoch_ii.60.c:0 "Exploit the resonance. (High risk; highest yield)"
 epoch_ii.61.name:0 "Resonance Anomaly"
 epoch_ii.61.desc.organic:0 "A mineral seam pulses in time with distant vegetation, although no organism or carrier links them. The anomaly can be sampled, quieted, or used as a live instrument."
 epoch_ii.61.desc.hive:0 "A cluster of drones falls into a repeated coordination cycle. The pattern is measurable, but every observation risks teaching it the shape of the collective."
 epoch_ii.61.desc.machine:0 "A processing substrate emits a synchronized clock correction that was never issued by the control network. The correction can be isolated, characterized, or amplified."
 epoch_ii.61.desc.unstable:0 "The active planetary scar has fractured further. A mineral seam now pulses against distant environmental processes, and the signal is disrupting local production. The anomaly can be bound, studied under exposure, or amplified for a live reading."
 epoch_ii.61.a:0 "Contain the anomaly."
 epoch_ii.61.b:0 "Study the anomaly."
 epoch_ii.61.c:0 "Amplify it for a live reading."
 epoch_ii.62.name:0 "Coordination Break"
 epoch_ii.62.desc.organic:0 "Work crews and pollinating systems begin anticipating the same interval, disrupting production."
 epoch_ii.62.desc.hive:0 "Drones at the edge of the affected zone lose synchronization with the central cadence."
 epoch_ii.62.desc.machine:0 "Fabrication and routing processes enter a repeating conflict despite valid instructions."
 epoch_ii.62.a:0 "Sacrifice production to isolate the affected zone."
 epoch_ii.62.b:0 "Keep the zone under observation and preserve its measurements."
 epoch_ii.62.c:0 "Fund an emergency recovery and bind the resonance. (300 alloys and 300 energy)"
 epoch_ii.68.name:0 "Contamination Breach"
 epoch_ii.68.desc.unstable:0 "The active boundary has fractured. Resonance now distorts production and local stability. We can accept permanent economic losses to preserve the data, pay for a security and recovery perimeter, or use the breach as a live experiment and risk a deeper fracture."
 epoch_ii.68.desc.default:0 "The resonance has crossed a stable boundary. Choose whether to sacrifice production, fund a security perimeter, or exploit the breach for research at a stability cost."
 epoch_ii.68.a:0 "Sacrifice local output to preserve the breach measurements. (Permanent 10% planetary job-output loss)"
 epoch_ii.68.b:0 "Fund security and bind the resonance. (300 alloys and 300 energy)"
 epoch_ii.68.c:0 "Use the breach as a live experiment. (High research yield; severe stability loss)"
 epoch_ii.63.name:0 "Protocol Recorded"
 epoch_ii.63.desc:0 "Two incidents and an explicit response establish a durable protocol. Its measurements support research into infrastructure that can tolerate the pattern."
 epoch_ii.63.a:0 "Record the infrastructure research lead."
 epoch_ii.63.b:0 "Authorize controlled seeding on a second owned world. (500 energy; reduced stability)"
 epoch_ii.63.c:0 "Keep the resonance confined to the original site. (Stability recovery)"
 epoch_ii.64.name:0 "The Network of Silence"
 epoch_ii.64.desc:0 "The broken code points to distant systems. Select an expedition posture before dispatching survey teams."
 epoch_ii.64.a:0 "Establish a listening array. (Energy investment; safer observations)"
 epoch_ii.64.b:0 "Send a mobile expedition. (Higher exposure)"
 epoch_ii.64.c:0 "Pair the surveys. (Alloy and energy cost; unlock Phased Sensors research)"
 epoch_ii.65.name:0 "Two Resonance Nodes"
 epoch_ii.65.desc:0 "Survey the delayed reflection and interrupted transmission in reachable star systems. Each offers a real system target; a remote archive can substitute if access or ships are unavailable, at a lower yield."
 epoch_ii.65.a:0 "Dispatch staffed science ships to both nodes."
 epoch_ii.65.b:0 "Use archived telemetry. (500 energy; reduced findings)"
 epoch_ii.67.name:0 "The System That Does Not Answer"
 epoch_ii.67.desc:0 "At a reachable barren moon, parallel grooves fused into dark rock match the Nullwarden weapon harmonics. Navigation beacons, the star's natural oscillation, and background particle noise all vanish at one boundary. A low-power copy of the old carrier interval interrupts the cancellation for one heartbeat; a return matches the last fragment in the expedition archive. Old cancellation passes are visible in the regolith, but no maker or date can be identified. The Nullwardens may be suppressing the signal."
 epoch_ii.67.a:0 "Keep the system dark. (Safer, clean evidence; incomplete return)"
 epoch_ii.67.b:0 "Repeat the impulse under shielding. (More data; stability cost)"
 epoch_ii.67.c:0 "Broadcast a counter-pattern. (Tactical bearing; exposes our presence)"
 epoch_ii.70.name:0 "The Wardens Return"
 epoch_ii.70.desc:0 "A larger force is assembling against the mapped network. Its suppression field has changed in response to the first encounter. Armor, phased sensing, paired survey evidence, and the silent-system choice now shape the available defenses. Research leads are available, but each technology still requires normal engineering or physics research."
 epoch_ii.70.a:0 "Issue the armor and sensor research options."
 epoch_ii.71.name:0 "Second Nullwarden Contact"
 epoch_ii.71.desc.default:0 "A six-ship force moves toward the convergence node, with two additional escorts if the empire fields destroyers. Its weapons are real and the formation is hostile."
 epoch_ii.71.desc.exposed:0 "The counter-pattern broadcast has drawn a larger, alerted formation to the convergence node. The signal jammer is already masking the outer system."
 epoch_ii.71.a:0 "Engage the fleet in battle. (Victory requires destroying the hostile fleet)"
 epoch_ii.71.b:0 "Prepare a node trap. (Requires two surveyed systems, 400 alloys, 300 energy)"
 epoch_ii.71.c:0 "Send a science ship to disrupt the operation. (500 energy; reduced data)"
 epoch_ii.71.d:0 "Withdraw and save the records. (Lose the node and convergence detail)"
 epoch_ii.72.name:0 "Convergence Trace Secured"
 epoch_ii.72.desc:0 "The second force is gone or has been driven from the node. The records describe a Nullwarden suppression pattern and point toward a resonance chamber. Its purpose and authorship remain unknown. The network is mapped, but the next chapter has not begun."
 epoch_ii.72.a:0 "Close the Block B report."
 building_epoch_resonance_laboratory:0 "Resonance Laboratory"
 building_epoch_resonance_laboratory_desc:0 "A staffed planetary laboratory measures resonance without relying on situation progress. Its research output and local risk respond to the world's saved resonance state."
 tech_epoch_phased_sensors:0 "Phased Sensors"
 tech_epoch_phased_sensors_desc:0 "Sensor arrays tuned to phase-shifted returns improve tracking and reveal cancellation patterns."
 d_epoch_resonance_latent:0 "Echo Scar"
 d_epoch_resonance_latent_desc:0 "A latent trace adds a modest research opportunity and little economic disruption."
 d_epoch_resonance_active:0 "Resonant Scar"
 d_epoch_resonance_active_desc:0 "Active resonance improves physics research while disrupting planetary output and stability."
 d_epoch_resonance_unstable:0 "Fractured Resonance"
 d_epoch_resonance_unstable_desc:0 "Unstable resonance produces strong data at a severe productivity and stability cost. Recovery can bind it."
 d_epoch_resonance_controlled:0 "Bound Resonance"
 d_epoch_resonance_controlled_desc:0 "A controlled scar improves research and productivity, with stability safeguards."
 NAME_EPOCH_Second_Force:0 "Nullwarden Convergence Force"
 NAME_EPOCH_Heavy_Suppressor:0 "Heavy Suppressor"
 EPOCH_II_NODE_REFLECTION:0 "Delayed Reflection Survey"
 EPOCH_II_NODE_REFLECTION_DESC:0 "Place an instrument package at the delayed-reflection node and compare its return with the old carrier signal."
 epoch_ii_resonance_latent:0 "Latent Echo Scar"
 epoch_ii_resonance_latent_desc:0 "The latent resonance trace offers a modest Physics research opportunity with little economic disruption."
 epoch_ii_resonance_active:0 "Active Resonant Scar"
 epoch_ii_resonance_active_desc:0 "Active resonance increases Physics research while reducing planetary output and stability."
 epoch_ii_resonance_unstable:0 "Fractured Resonance"
 epoch_ii_resonance_unstable_desc:0 "Unstable resonance yields strong research but sharply reduces planetary output and stability."
 epoch_ii_resonance_controlled:0 "Bound Resonance"
 epoch_ii_resonance_controlled_desc:0 "The bound scar improves research, planetary output, and stability."
 epoch_ii_breakthrough_sacrifice:0 "Breach-Site Production Loss"
 epoch_ii_breakthrough_sacrifice_desc:0 "Permanent local production losses preserve measurements of the contamination breakthrough."
 EPOCH_II_NODE_INTERRUPTED:0 "Interrupted Transmission Survey"
 EPOCH_II_NODE_INTERRUPTED_DESC:0 "Trace the interrupted transmission through its actual star system and recover the missing intervals."
 EPOCH_II_SILENT_SYSTEM:0 "The Silent System"
 EPOCH_II_SILENT_SYSTEM_DESC:0 "Measure the silence boundary and inspect the parallel grooves on the barren moon."
 EPOCH_II_NODE_TRAP:0 "Resonance Node Trap"
 EPOCH_II_NODE_TRAP_DESC:0 "Use the paired node measurements to prepare a counter-pattern at the threatened system."
 EPOCH_II_SCIENCE_COUNTERMEASURE:0 "Disrupt the Suppression Field"
 EPOCH_II_SCIENCE_COUNTERMEASURE_DESC:0 "A staffed Science Ship will tune a counter-signal against the hostile field from a protected site."
 epoch_ii.77.desc:0 "A science ship or accessible node is unavailable, or an expedition did not return interpretable measurements. The surviving archives can provide a lower quality route into the silent-system analysis, at a real resource and stability cost."
 epoch_ii.77.a:0 "Close the missing-node route through the archives."
 epoch_ii.80.desc:0 "The countermeasure project failed or was cancelled. The fleet remains alive and hostile until another project succeeds or the empire withdraws."
 epoch_ii.80.a:0 "Spend another 200 energy and retry with a staffed Science Ship."
 epoch_ii.80.b:0 "Withdraw, preserve the records, and concede the node."
