epoch_res_extraction:0 "Resonance Extraction"
epoch_res_targeting_flaw:0 "Exposed Targeting Pattern"
epoch_res.recontact:0 "Fund a renewed search for the armed formation."
decision_epoch_res_resume:0 "Resume resonance operations"
decision_epoch_res_resume_desc:0 "Convene the teams at the capital to review the current assignment and restore contact with interrupted expeditions."
epoch_res.11.name:0 "A Frequency Beyond the Scar"
epoch_res.11.desc:0 "Beneath the returning pulse, the survey team has isolated a second component. It shifts when measured against the old site, but keeps its interval against the ship's own clock. The scar is affecting the observation itself.\n\nThe scientists request an independent measurement away from this world. Without it, they cannot tell whether the change belongs to the source or to the place from which we are listening."
epoch_res.baseline:0 "Fund the independent expedition."
epoch_res.baseline_remote:0 "Fund an archive baseline."
epoch_res.32.name:0 "Inside the Correction"
epoch_res.32.desc:0 "The recovered fragments contain instructions nested inside corrections to other instructions. Several sequences begin where the older signal records become unreadable. The apparent match survives comparison, but its meaning remains uncertain.\n\nThe team requests a closer examination of the targeting signature. Until we understand what the corrections address, the damaged transmitter will remain isolated from the rest of the archive."
epoch_res.signature:0 "Isolate the signature in the field."
epoch_res.signature_remote:0 "Examine the secured fragments remotely."
epoch_res.72.name:0 "Restore the Interrupted Signal"
epoch_res.72.desc:0 "The third station's interrupted record is still incomplete. A science ship can return to the marked site, or examine the surviving observations from the capital. Neither approach can recover data that was never recorded."
epoch_res.retry_interrupted:0 "Reissue the field project."
epoch_res.remote_interrupted:0 "Fund remote measurements."
epoch_res.53.name:0 "An Interrupted Order"
epoch_res.53.desc:0 "The third station stopped transmitting halfway through an instruction. Its surviving header contains neither a readable sender nor a destination. The interruption is preserved identically in every recovered copy.\n\nThe analysts have laid the fragment beside the hunters' corrections. Both assume an exchange whose other side is missing from our records."
epoch_res_signal_strain:0 "Distant Signal Interference"
EPOCH_RES_BASELINE:0 "Independent Resonance Baseline"
EPOCH_RES_BASELINE_DESC:0 "Establish a reference beyond the old site's influence. Independent instruments must distinguish a shifting signal from a distortion in the observation."
EPOCH_RES_SIGNATURE:0 "Isolate the Correction Signature"
EPOCH_RES_SIGNATURE_DESC:0 "Separate the targeting sequence from the corrections surrounding it. The damaged transmitter must remain isolated while a science ship examines its signature."
EPOCH_RES_INTERRUPTED:0 "Recover the Interrupted Transmission"
EPOCH_RES_INTERRUPTED_DESC:0 "Recover the third station's surviving record without completing its interrupted instruction. Compare the separate copies before interpreting the fragment."
