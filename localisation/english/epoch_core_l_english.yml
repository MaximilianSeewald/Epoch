epoch_res.exit:0 "End our investigation permanently."
epoch_res.ack:0 "Understood."
epoch_res.90.name:0 "A Closed Record"
epoch_res.90.desc:0 "The surviving resonance records cannot support a renewed expedition. Command has suspended the operations attached to them and sealed the incomplete survey. The consequences on our worlds remain."
epoch_res.begin:0 "Fund the scar survey."
epoch_res.archive:0 "Reconstruct the remote signal at our capital."
epoch_res.later:0 "Hold the request for further review."
epoch_res.1.name:0 "The Scar Wakes"
epoch_res.1.desc:0 "The receivers at the old site have begun keeping the interval again. Their new readings fit the archived trace closely enough that our analysts checked the clocks before they checked the signal. Neither was at fault.\n\n[Root.GetEpochEchoSummary] [Root.GetEpochExpeditionSummary]\n\n[Root.GetEpochContaminationSummary] [Root.GetEpochStructureSummary] [Root.GetEpochScarSummary]\n\n[Root.GetEpochResonanceClass] A new survey could establish what has changed since the instruments last fell silent."
epoch_res.recon:0 "Analyze the targeting pattern."
epoch_res.fight:0 "Prepare our fleets and defenses."
epoch_res.20.name:0 "The First Hunters"
epoch_res.20.desc:0 "[Root.GetEpochHunterLocation]\n\nThe independent readings resolve a moving formation where the signal folds back on itself. Our hails receive no answer. Its vessels turn together, and each weapons sweep leaves the same narrow gap in the background transmission.\n\nCommand has identified a guarded perimeter. Scientific staff propose examining the targeting rhythm while our fleets prepare to confront the formation."
epoch_res.salvage:0 "Recover the battle fragments."
epoch_res.battle_archive:0 "Reconstruct secured combat telemetry."
epoch_res.30.name:0 "The Broken Code"
epoch_res.30.desc:0 "The last hostile return has vanished from the tactical display. Among the wreckage, a transmitter continues a sequence that does not resemble a distress call: it repeats corrections to a signal no longer present.\n\n[Root.GetEpochBattleSummary]\n\nThe surviving fragments are drifting apart. A recovery team could preserve their records before distance and damage make the sequence unreadable."
epoch_res.careful:0 "Compare the records cautiously."
epoch_res.risk:0 "Force synchronization."
epoch_res.31.name:0 "A Pattern Against the Signal"
epoch_res.31.desc:0 "The isolated signature fits the gaps in our earliest records. Each comparison makes the correction sequence clearer, but the receiving equipment has begun repeating part of it after the test ends.\n\nThe archive team can proceed with buffered comparisons. Forcing a synchronized reading would recover more of the sequence while exposing our systems to the behavior we are trying to measure."
epoch_res.40.name:0 "The Second Infection"
epoch_res.40.desc:0 "[Root.GetEpochInfectedLocation]\n\nThe interval recovered from the wreckage is now appearing in local production records. Equipment that shares no connection begins a cycle at the same instant; the pattern persists when individual installations are shut down.\n\n[Root.GetEpochResonanceClass]\n\nThe planetary teams need authority to map the affected districts and control access. Their measures are available through the planet's Decisions panel."
epoch_res.listen:0 "Keep the network silent."
epoch_res.pulse:0 "Send a controlled pulse."
epoch_res.repeat:0 "Repeat the hunters' pattern."
epoch_res.50.name:0 "The Network of Silence"
epoch_res.50.desc:0 "With the local reaction contained, the observatories can separate three distant returns that were buried beneath it. One arrives late. One removes part of the surrounding transmission. The third stops in the middle of a repeating sequence.\n\nEach has been marked for investigation. Our receivers can remain silent, send a measured pulse, or reproduce the pattern recovered from the hunters. The last proposal would place the sequence back into an open channel."
epoch_res.51.name:0 "A Delayed Reflection"
epoch_res.51.desc:0 "At the first station, timestamps repeat in the same order across recordings made years apart. The apparatus is relaying a transmission older than our expedition. Its delays follow a measured path rather than local distance.\n\n[Root.GetEpochReflectionSummary]\n\nThe team has preserved the intervals. There is no readable identification in the surviving transmission."
epoch_res.52.name:0 "An Engine of Silence"
epoch_res.52.desc:0 "The second station produces its silence. Instruments placed on either side record the transmission entering intact and leaving with the same narrow frequencies absent. Its control structure matches the correction sequence in the hunters' wreckage.\n\n[Root.GetEpochSilenceSummary]\n\nThe team can describe what the station removes. It has found no record explaining why those frequencies were selected."
epoch_res.60.name:0 "Beyond the Perimeter"
epoch_res.60.desc:0 "On the final survey plot, the old scar's interval passes through the battle recordings, the altered world and all three stations. The observations can now be aligned. They still do not tell us who began the exchange.\n\n[Root.GetEpochBattleSummary] [Root.GetEpochContaminationSummary] [Root.GetEpochStructureSummary]\n\nThe local reaction is contained. The formation that barred our approach is gone. Yet removing its corrections from the record leaves a transmission with pauses in places where our instruments expect a reply. Other returns remain in the noise, too faint to read.\n\nThe assembled evidence is before us. We can keep listening, or seal the inquiry permanently. Neither order will undo what these investigations have left behind.\n\n[Root.GetEpochContainmentSummary] [Root.GetEpochNetworkChoiceSummary]\n\n[Root.GetEpochClosingClass]"
epoch_res.retry_reflection:0 "Reissue the field project."
epoch_res.remote_reflection:0 "Fund remote measurements."
epoch_res.70.name:0 "Restore a Measurement"
epoch_res.70.desc:0 "Contact with the measurement team has broken off before the station's return could be resolved. The marked observation can be repeated in the field. If access is lost, a science ship can examine the surviving records at the capital."
epoch_res.retry_silence:0 "Reissue the field project."
epoch_res.remote_silence:0 "Fund remote measurements."
