epoch_res_observe_tt:0 "The situation records the current chapter. To restore a blocked objective, use Resume Resonance Operations on your capital. Completed chapters stay closed."

epoch_res.recon.tt:0 "Starts an optional native special project: 600 Physics research, no ship or scientist. On completion: Nullwarden weapon damage -15% for 1800 days. Destroying the fleet in battle remains mandatory."

epoch_res.remote.tt:0 "Recovery only while the original target is missing or inaccessible. Higher Energy cost; a staffed science ship must still complete the project at home. No field-data bonus. Existing active projects cannot be purchased twice."

epoch_res.begin.tt:0 "150 Energy; staffed science ship, 180 days at the original site. Completion yields 150 Physics research and preparation: 100 Energy returned when chapter 4 begins."

epoch_res.baseline.tt:0 "200 Energy; staffed science ship, 180 days at the reference star. Completion yields 200 Physics research and chapter-4 preparation (100 Energy once, shared with other preparation)."

epoch_res.salvage.tt:0 "200 Energy; staffed science ship, 210 days at the actual battle site. Intact field data yields 300 Engineering research. Remote combat-data reconstruction costs 600 Energy and forfeits this bonus."

epoch_res.signature.tt:0 "150 Energy; staffed science ship, 150 days at the wreck. Field signature data yields 200 Physics research and chapter-4 preparation (100 Energy once). Archive work costs 450 Energy and grants neither field bonus."

epoch_res.careful.tt:0 "150 Energy; staffed science ship, 180 days at home. Unlocks both research options without adding signal strain or forcing unstable contamination. Existing earlier risks still apply."

epoch_res.risk.tt:0 "100 Energy; staffed science ship, 180 days at home. Unlocks both research options and yields 600 Physics research. Consequences: -2% Energy production for 1800 days and unstable chapter-4 contamination. Quarantine plus isolation (350 Energy, 200 Minerals, 5 devastation) or emergency containment is required before resolution."

epoch_res.hunter_location:0 "The formation is located in [event_target:epoch_res_battle_location.GetName]. Its system has been identified on the map."

epoch_res.hunter_location_missing:0 "No safe reachable staging system is currently available. Resume operations from the capital after opening a route; no battle or victory has been invented."

epoch_res.infected_location:0 "The reaction is centered on [event_target:epoch_res_infected_world.GetName]."

epoch_res.infected_location_missing:0 "No suitable settled planet is available. Restore a colony and resume operations from the capital."

epoch_res.21.name:0 "A Window in the Targeting Pattern"

epoch_res.21.desc:0 "Our research has exposed the hunters' firing cycle. Their weapon damage is reduced by 15% for 1800 days. This is a temporary tactical opportunity; only destroying the formation in real combat opens the wreck investigation."

epoch_res.continue:0 "Continue EPOCH: authorize the Stage III handoff."

epoch_res.stop:0 "End EPOCH permanently. Keep all consequences; no later stage will begin."

