epoch_res.21.name:0 "A Window in the Targeting Pattern"
epoch_res.21.desc:0 "The targeting sweeps overlap at a predictable interval. By comparing them against our independent baseline, the researchers have identified moments when the formation's weapons fail to track a changing return.\n\nThe corrected firing solutions are already with our commanders. The opening will last only as long as the pattern remains unchanged."
