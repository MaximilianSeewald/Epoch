EPOCH_RES_SCAR:0 "Survey the returning scar"
EPOCH_RES_SCAR_DESC:0 "Survey the returning scar. Requires a science ship with a scientist at the marked location. Interrupted expeditions can be reassigned; use Resume resonance operations on the capital if the site is lost."
EPOCH_RES_RECON:0 "Analyze hunter targeting"
EPOCH_RES_RECON_DESC:0 "Optional: invest 600 Physics research through the native project. No science ship or scientist is required. Completion reduces the Nullwardens' weapon damage by 15% for 1800 days. Research it before fighting; victory cancels unfinished work and still requires a real battle."
EPOCH_RES_WRECK:0 "Recover hunter battle fragments"
EPOCH_RES_WRECK_DESC:0 "Recover hunter battle fragments. Requires a science ship with a scientist at the marked location. Interrupted expeditions can be reassigned; use Resume resonance operations on the capital if the site is lost."
EPOCH_RES_COMPARE:0 "Compare the correction code"
EPOCH_RES_COMPARE_DESC:0 "Compare the correction code. Requires a science ship with a scientist at the marked location. Interrupted expeditions can be reassigned; use Resume resonance operations on the capital if the site is lost."
EPOCH_RES_REFLECTION:0 "Measure the delayed reflection"
EPOCH_RES_REFLECTION_DESC:0 "Measure the delayed reflection. Requires a science ship with a scientist at the marked location. Interrupted expeditions can be reassigned; use Resume resonance operations on the capital if the site is lost."
EPOCH_RES_SILENCE:0 "Investigate the suppression station"
EPOCH_RES_SILENCE_DESC:0 "Investigate the suppression station. Requires a science ship with a scientist at the marked location. Interrupted expeditions can be reassigned; use Resume resonance operations on the capital if the site is lost."
decision_epoch_res_quarantine:0 "Establish resonance quarantine"
decision_epoch_res_quarantine_desc:0 "Restrict production and reduce the contamination to a latent state. Required for careful stabilization."
decision_epoch_res_localize:0 "Localize the infection"
decision_epoch_res_localize_desc:0 "Map the infected districts before sampling or emergency containment."
decision_epoch_res_sample:0 "Study resonance samples"
decision_epoch_res_sample_desc:0 "Quarantine or containment infrastructure yields clean data. Unsecured sampling makes the site unstable and causes devastation."
decision_epoch_res_exploit:0 "Extract the resonance"
decision_epoch_res_exploit_desc:0 "Gain research and alloys immediately and boost physics production for a year. The site becomes unstable and suffers devastation."
decision_epoch_res_stabilize:0 "Stabilize the localized pattern"
decision_epoch_res_stabilize_desc:0 "Complete containment of a localized, quarantined, non-unstable site. Preserve the economy and continue the investigation."
decision_epoch_res_emergency:0 "Emergency containment"
decision_epoch_res_emergency_desc:0 "Shut the pattern down at high cost. Completes containment but leaves permanent economic damage and devastation."
decision_epoch_res_isolate:0 "Isolate unstable districts"
decision_epoch_res_isolate_desc:0 "Return a quarantined unstable feature to a latent state. Some districts suffer devastation; careful stabilization becomes possible again."
