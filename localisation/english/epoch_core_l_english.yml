 epoch_first_echo_phase_echo_research:0 "Analyze the pulse. At 15 progress, assign a staffed Science Ship to the first investigation."
 epoch_first_echo_phase_expedition_research:0 "Compare the recovered intervals. At 25 progress, authorize an expedition to the signal coordinates."
 epoch_first_echo_phase_contamination_research:0 "Compare the expedition report with local samples. At 35 progress, decide how to handle the contamination."
 epoch_first_echo_phase_structure_research:0 "Locate the source beneath the altered layers. At 45 progress, authorize the excavation."
 epoch_first_echo_phase_report_research:0 "Combine the expedition, sample and excavation records. At 55 progress, review the final assessment."
 epoch_core.23.a.tooltip:0 "Keep the surviving evidence available for further inquiry. The damage already recorded remains."
 epoch_core.23.b.tooltip:0 "Close this inquiry permanently. No further expeditions will be authorized; existing damage and discoveries remain."
 epoch_core.summary.echo_abandoned:0 "The second comparison was abandoned; our signal record remains incomplete."
 epoch_core.summary.echo_degraded:0 "The forced signal lock left a damaged reference which still limits our conclusions."
 epoch_core.summary.echo_cautious:0 "The patient baseline preserves a reliable interval, but no identifiable sender."
 epoch_core.summary.echo_aggressive:0 "The rapid sweep recovered a bearing without explaining what answered it."
 epoch_core.summary.expedition_cancelled:0 "The expedition was recalled before contact was lost; only remote observations connect it to this site."
 epoch_core.summary.expedition_rescued:0 "The recovered expedition personnel report the same gap that our instruments cannot account for."
 epoch_core.summary.expedition_recorder:0 "Only the expedition recorder returned. Its repeated interval outlasted the expedition."
 epoch_core.summary.expedition_wake:0 "The remote survey preserved the distortion, but the expedition never returned."
 epoch_core.summary.expedition_lost:0 "The missing expedition is recorded as lost. Its silence remains part of the evidence."
 epoch_core.summary.contamination_contained:0 "Isolation stopped the active local disturbance. It did not explain the deeper damage."
 epoch_core.summary.contamination_studied:0 "Sampling reduced the disturbance, but a persistent trace remains in local processes."
 epoch_core.summary.contamination_neglected:0 "The unresolved contamination remains a lasting burden; closing the report will not remove it."
 stage_echo_resolution:0 "First Echo: Investigations Pending"
 tech_epoch_resonance_spectroscopy:0 "Resonance Spectroscopy"
 tech_epoch_resonance_spectroscopy_desc:0 "Spectral comparison isolates repeating cancellation intervals in anomalous signals. The method improves ordinary physics research and enables further study of resonance phenomena."
 SMALL_EPOCH_RESONANCE_ARMOR:0 "Adaptive Resonance Plating"
 SMALL_EPOCH_RESONANCE_ARMOR_DESC:0 "A small-ship armor component reinforced against repeating energy patterns."
 d_epoch_contamination_active:0 "Resonant Contamination Site"
 d_epoch_contamination_active_desc:0 "The original contamination site remains active in the historical record. Its earlier consequences are preserved."
 d_epoch_contamination_worsened:0 "Worsened Contamination Site"
 d_epoch_contamination_worsened_desc:0 "The original site records the worsened outcome and its persistent local consequences."
 d_epoch_contamination_studied:0 "Studied Contamination Site"
 d_epoch_contamination_studied_desc:0 "Sampling changed the recorded expression but did not erase the original site's consequences."
 d_epoch_contamination_contained:0 "Contained Contamination Site"
 d_epoch_contamination_contained_desc:0 "The original site's active effects were contained; its history and residual evidence remain."
 d_epoch_conclusion_scar_organic:0 "Permanent Conclusion Scar"
 d_epoch_conclusion_scar_organic_desc:0 "The lasting organic-class scar from the earlier inquiry remains on this world."
 d_epoch_conclusion_scar_hive:0 "Permanent Conclusion Scar"
 d_epoch_conclusion_scar_hive_desc:0 "The lasting hive-class scar from the earlier inquiry remains on this world."
 d_epoch_conclusion_scar_machine:0 "Permanent Conclusion Scar"
 d_epoch_conclusion_scar_machine_desc:0 "The lasting machine-class scar from the earlier inquiry remains on this world."
 NAME_EPOCH_Unknown_Force:0 "Unidentified Suppression Force"
 NAME_EPOCH_Unknown_Patrol:0 "Unidentified Patrol"
 NAME_EPOCH_Unknown_Skirmisher:0 "Unidentified Skirmisher"
 building_epoch_resonance_laboratory:0 "Resonance Laboratory"
 building_epoch_resonance_laboratory_desc:0 "A staffed planetary laboratory measures resonance without relying on situation progress. It improves local physics production and supplies scientific infrastructure."
 d_epoch_resonance_latent:0 "Echo Scar"
 d_epoch_resonance_latent_desc:0 "A latent trace adds a modest research opportunity and little economic disruption."
 d_epoch_resonance_active:0 "Resonant Scar"
 d_epoch_resonance_active_desc:0 "Active resonance improves physics research while disrupting planetary output and stability."
 d_epoch_resonance_unstable:0 "Fractured Resonance"
 d_epoch_resonance_unstable_desc:0 "Unstable resonance produces strong data at a severe productivity and stability cost. Recovery can bind it."
 d_epoch_resonance_controlled:0 "Bound Resonance"
 d_epoch_resonance_controlled_desc:0 "A controlled scar improves research and productivity, with stability safeguards."
 epoch_ii_resonance_latent:0 "Latent Echo Scar"
 epoch_ii_resonance_latent_desc:0 "The latent resonance trace offers a modest Physics research opportunity with little economic disruption."
 epoch_ii_resonance_active:0 "Active Resonant Scar"
 epoch_ii_resonance_active_desc:0 "Active resonance increases Physics research while reducing planetary output and stability."
 epoch_ii_resonance_unstable:0 "Fractured Resonance"
 epoch_ii_resonance_unstable_desc:0 "Unstable resonance yields strong research but sharply reduces planetary output and stability."
 epoch_ii_resonance_controlled:0 "Bound Resonance"
 epoch_ii_resonance_controlled_desc:0 "The bound scar improves research, planetary output, and stability."
 epoch_ii_breakthrough_sacrifice:0 "Breach-Site Production Loss"
 epoch_ii_breakthrough_sacrifice_desc:0 "Permanent local production losses preserve measurements of the contamination breakthrough."
epoch_ii_ending_boundary:0 "Boundary Monitoring Protocol"
epoch_ii_ending_boundary_desc:0 "Continuous monitoring suppresses the local channel, at recurring energy and research cost."
epoch_ii_ending_guarded_listening:0 "Guarded Resonance Channel"
epoch_ii_ending_guarded_listening_desc:0 "The active channel improves research, but requires security expenditure and carries incident risk."
epoch_ii_ending_outward_signal:0 "Outbound Countermark Posture"
epoch_ii_ending_outward_signal_desc:0 "A redirected signal improves fleet fire rate while exposing the empire and reducing stability."
epoch_ii_ending_broken_instrument:0 "Broken Chamber Record"
epoch_ii_ending_broken_instrument_desc:0 "The instrument is broken. Research and alloy output suffer, and the source world bears a permanent ruin."
epoch_ii_ch7_crisis_scars:0 "Resonance Crisis Scars"
epoch_ii_ch7_crisis_scars_desc:0 "Local processes remain strained after the chamber surge."
epoch_ii_chamber_ruin:0 "Resonance Chamber Ruin"
epoch_ii_chamber_ruin_desc:0 "The chamber has been broken, leaving damaged infrastructure and a persistent research and energy loss."
d_epoch_chamber_ruin:0 "Broken Resonance Chamber"

tech_epoch_contamination_neutral_infrastructure:0 "Contamination-Neutral Infrastructure"
tech_epoch_contamination_neutral_infrastructure_desc:0 "A modular standards package lets ordinary industrial and research networks isolate contaminated processes instead of feeding them. Its infrastructure enables safe sampling without quarantine."
building_epoch_containment_infrastructure:0 "Containment Infrastructure"
building_epoch_containment_infrastructure_desc:0 "Local isolation facilities improve Society research and stability. They allow clean resonance sampling without quarantine."
d_epoch_resonance_contamination_active:0 "Active Resonance Contamination"
d_epoch_resonance_contamination_active_desc:0 "Active contamination is reducing stability and the output of local jobs."
d_epoch_resonance_contamination_worsened:0 "Worsened Resonance Contamination"
d_epoch_resonance_contamination_worsened_desc:0 "The contamination worsened after the investigation failed or was neglected. Its effects are severe and may also spread."
d_epoch_resonance_contamination_studied:0 "Studied Resonance Contamination"
d_epoch_resonance_contamination_studied_desc:0 "Sampling reduced the disturbance, but a small class-specific economic penalty remains."
d_epoch_resonance_contamination_contained:0 "Contained Resonance Contamination"
d_epoch_resonance_contamination_contained_desc:0 "The active contamination has been contained. Its history remains recorded here, without the former planetary penalty."
d_epoch_resonance_contamination_latent:0 "Latent Resonance"
d_epoch_resonance_contamination_latent_desc:0 "A latent resonance increases Physics research slightly and reduces stability. Any unresolved contamination from earlier investigations remains active."
d_epoch_resonance_contamination_resonant:0 "Active Resonance"
d_epoch_resonance_contamination_resonant_desc:0 "The resonance increases Physics research while reducing stability and general job output. Any unresolved contamination from earlier investigations remains active."
d_epoch_resonance_contamination_unstable:0 "Unstable Resonance"
d_epoch_resonance_contamination_unstable_desc:0 "Unstable resonance greatly increases Physics research while sharply reducing stability and job output. Any unresolved contamination from earlier investigations remains active."
d_epoch_resonance_contamination_controlled:0 "Controlled Resonance"
d_epoch_resonance_contamination_controlled_desc:0 "Controlled resonance improves Physics research, general job output, and stability. Any unresolved contamination from earlier investigations remains active."
d_epoch_resonance_scar:0 "Active Resonance Scar"
d_epoch_resonance_scar_desc:0 "The permanent scar reduces stability and the class-specific output of local jobs."
d_epoch_resonance_scar_altered:0 "Altered Resonance Scar"
d_epoch_resonance_scar_altered_desc:0 "The scar has changed. Its remaining penalty is smaller, but the original damage has not fully healed."
d_epoch_resonance_scar_healed:0 "Healed Resonance Scar"
d_epoch_resonance_scar_healed_desc:0 "The resonance scar has healed. Its permanent planetary penalty is no longer active."
d_epoch_silent_structure_unsecured:0 "Unsecured Silent Structure"
d_epoch_silent_structure_unsecured_desc:0 "An unexplained structure remains uninvestigated. It yields a small physics research bonus."
d_epoch_silent_structure_secured:0 "Secured Silent Structure"
d_epoch_silent_structure_secured_desc:0 "The structure is secured. Its survey record and engineering work support research."
d_epoch_silent_structure_investigated:0 "Investigated Silent Structure"
d_epoch_silent_structure_investigated_desc:0 "The structure has been investigated and its survey record supports further study."
d_epoch_silent_structure_destroyed:0 "Destroyed Silent Structure"
d_epoch_silent_structure_destroyed_desc:0 "The structure was destroyed. The damaged site reduces planetary stability."
epoch_res.exit:0 "End our investigation permanently."
epoch_res.ack:0 "Understood."
epoch_res.90.name:0 "A Closed Record"
epoch_res.90.desc:0 "This investigation belongs to an earlier reconstruction of the resonance record. Its operations have been suspended safely. Existing planetary consequences remain. No claim of military victory or network completion has been recorded. A new expedition requires a campaign begun before Resonance."
epoch_res.begin:0 "Fund the scar survey."
epoch_res.archive:0 "Reconstruct the remote signal at our capital."
epoch_res.later:0 "Keep the objective open."
epoch_res.1.name:0 "The Scar Wakes"
epoch_res.1.desc:0 "The old frequency has returned. [Root.GetEpochEchoSummary] [Root.GetEpochExpeditionSummary] [Root.GetEpochContaminationSummary] [Root.GetEpochStructureSummary] [Root.GetEpochScarSummary]\n\n[Root.GetEpochResonanceClass] A staffed science ship must compare the returning signal with the old site. The permanent scars remain; a new survey cannot undo them."
epoch_res.recon:0 "Analyze the targeting pattern."
epoch_res.fight:0 "Prepare our fleets and defenses."
epoch_res.20.name:0 "The First Hunters"
epoch_res.20.desc:0 "[Root.GetEpochHunterLocation] An armed formation answers the old signal. It guards its suppression perimeter and does not pursue a retreat across our empire. Its strength was fixed at first contact. Only destroying it in battle opens its records.\n\nOptional reconnaissance requires 600 Physics research through a special project without a ship. It reduces the hunters' weapon damage by 15% for 1800 days. Defense platforms and allied fleets may assist our combatants."
epoch_res.salvage:0 "Recover the battle fragments."
epoch_res.battle_archive:0 "Reconstruct secured combat telemetry."
epoch_res.30.name:0 "The Broken Code"
epoch_res.30.desc:0 "The hunters have fallen in real combat. Their wreckage transmits a correction sequence, not a distress call. [Root.GetEpochBattleSummary] A science ship must recover the fragments and then compare them with our First Contact archive. The data belongs to this battle; a remote reconstruction will lose detail."
epoch_res.careful:0 "Compare the records cautiously."
epoch_res.risk:0 "Force synchronization."
epoch_res.31.name:0 "A Pattern Against the Signal"
epoch_res.31.desc:0 "The fragments match gaps in our old expedition records. Slow comparison protects the archive. Forced synchronization yields additional physics data but risks amplifying the returning infection. Both routes require a staffed science ship at our capital."
epoch_res.40.name:0 "The Second Infection"
epoch_res.40.desc:0 "[Root.GetEpochInfectedLocation] [Root.GetEpochResonanceClass]\n\nOpen this planet's Decisions panel. Establish quarantine, localize the frequency, then stabilize the site. Scientific sampling can improve our measurements; unsecured sampling and extraction can instead make the feature unstable. A costly emergency shutdown remains available. Research leads are available for normal research, and containment infrastructure improves sampling. The old scar and structure remain independent."
epoch_res.listen:0 "Keep the network silent."
epoch_res.pulse:0 "Send a controlled pulse."
epoch_res.repeat:0 "Repeat the hunters’ pattern."
epoch_res.50.name:0 "The Network of Silence"
epoch_res.50.desc:0 "The stabilized pattern points beyond this world. Three distinct systems carry different parts of it: one delays the signal; another cancels it; a third holds an interrupted order. All three are marked by science projects.\n\nWe may listen in silence, emit a controlled pulse, or repeat the dangerous pattern. Remote measurements remain possible when borders close, but they cost more and cannot recover the finest structure."
epoch_res.51.name:0 "A Delayed Reflection"
epoch_res.51.desc:0 "The first station was a relay. It is repeating a transmission older than our expedition. [Root.GetEpochReflectionSummary] The timing establishes a route toward the suppression system; it does not explain who built it."
epoch_res.52.name:0 "An Engine of Silence"
epoch_res.52.desc:0 "The second site is actively removing part of the transmission. Its structure carries the same correction code as the hunters. [Root.GetEpochSilenceSummary] This was a local perimeter of something much larger."
epoch_res.60.name:0 "Beyond the Perimeter"
epoch_res.60.desc:0 "Five investigations now form one record. The scar, the defeated hunters, the broken code, the infection and the three stations belong to the same conflict. The fleet we destroyed was a small instrument of a wider suppression network.\n\nOur battle losses, planetary damage, research and transmitted signals remain on record. We have secured our immediate perimeter. Beyond it, other formations may already be listening. Their original purpose is still unknown. No new crisis has begun.\n\nContinue to authorize Stage III, or end EPOCH permanently. Both choices preserve all research, damage and signals already recorded."
epoch_res.retry_reflection:0 "Reissue the field project."
epoch_res.remote_reflection:0 "Fund remote measurements."
epoch_res.70.name:0 "Restore a Measurement"
epoch_res.70.desc:0 "We can reissue the marked expedition or fund remote measurements of this specific station at our capital. Remote data is incomplete and must still be collected by a staffed science ship. Completed measurements will not be repeated."
epoch_res.retry_silence:0 "Reissue the field project."
epoch_res.remote_silence:0 "Fund remote measurements."
epoch_res.71.name:0 "Restore a Measurement"
epoch_res.71.desc:0 "We can reissue the marked expedition or fund remote measurements of this specific station at our capital. Remote data is incomplete and must still be collected by a staffed science ship. Completed measurements will not be repeated."
epoch_res.structure.destroyed:0 "The Silent Structure was destroyed."
epoch_res.structure.secured:0 "The Silent Structure was secured."
epoch_res.structure.studied:0 "The Silent Structure supplied comparison data."
epoch_res.structure.unknown:0 "The structure record remains incomplete."
epoch_res.scar:0 "Our permanent resonance scar still burdens the economy."
epoch_res.class.machine:0 "Corrupted processes seek an unauthorized synchronization."
epoch_res.class.hive:0 "Drones fall out of the collective rhythm."
epoch_res.class.organic:0 "Biological cycles and local ecosystems are falling out of step."
epoch_res.battle.loss:0 "Our earlier losses remain in the battle record."
epoch_res.battle.win:0 "Our surviving ships secured the combat telemetry."
epoch_res.reflect.remote:0 "Remote sampling leaves gaps in the timestamps."
epoch_res.reflect.prepared:0 "The old secured structure supplies a matching clock."
epoch_res.reflect.base:0 "The recovered fragments identify a repeating interval."
epoch_res.silence.exposed:0 "Our repeated pattern has drawn a distant answer."
epoch_res.silence.clean:0 "Our clean planetary samples distinguish suppression from corruption."
epoch_res.silence.base:0 "Its missing frequencies point toward further armed stations."
epoch_resonance_protocol:0 "Resonance"
epoch_resonance_protocol_type:0 "Resonance"
epoch_resonance_protocol_desc:0 "Follow the scar, defeat the hunters, analyze their code, contain the infection and chart the silent network."
epoch_resonance_protocol_monthly_change_tooltip:0 "Only completed objectives advance the investigation."
epoch_res_objectives:0 "Science projects mark expedition targets. During the infection, use the affected planet's Decisions. Use Resume resonance operations on the capital to retry interrupted work or fund remote measurements. Military victory is mandatory."
epoch_res_observe:0 "Track objectives"
epoch_res_observe_desc:0 "Carry out the marked projects and planetary decisions."
epoch_res_recover:0 "Restore objectives"
epoch_res_recover_desc:0 "Reopen the current briefing. Already completed work remains complete. Remote science costs more and yields less precise records."
