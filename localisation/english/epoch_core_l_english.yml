epoch_resonance_protocol_desc:0 "The old interval has returned. Compare the new observations with the surviving expedition and excavation records."
epoch_resonance_protocol_monthly_change_tooltip:0 "The inquiry advances with field results and decisions by command."
epoch_res_objectives:0 "Our observatories maintain the current survey record. Science projects mark field assignments. Planetary teams await orders through their world's Decisions panel; interrupted operations can be reviewed at the capital."
epoch_res_observe:0 "Track objectives"
epoch_res_observe_desc:0 "Compare incoming reports with the established resonance record."
epoch_res_recover:0 "Restore objectives"
epoch_res_recover_desc:0 "Reopen the current briefing. Already completed work remains complete. Remote science costs more and yields less precise records."
stage_res_scar:0 "The Scar Wakes"
epoch_res_goal_scar:0 "Survey the old site, then establish an independent reference away from its influence."
stage_res_hunters:0 "The First Hunters"
epoch_res_goal_hunters:0 "Confront the armed formation. Its targeting pattern can be studied before engagement."
stage_res_code:0 "The Broken Code"
epoch_res_goal_code:0 "Recover the battle fragments, isolate their signature, and compare it with the archive."
stage_res_infection:0 "The Second Infection"
epoch_res_goal_infection:0 "Order measures through the affected world's Decisions panel. Localize the reaction and bring it under control."
stage_res_network:0 "The Network of Silence"
epoch_res_goal_network:0 "Complete the independent measurements at all three marked stations."
EPOCH_RES_SCAR:0 "Survey the returning scar"
EPOCH_RES_SCAR_DESC:0 "Compare fresh readings at the old site with the interval preserved in our earliest survey. A science ship and scientist must observe the return directly."
EPOCH_RES_RECON:0 "Analyze hunter targeting"
EPOCH_RES_RECON_DESC:0 "Our physics teams will compare successive targeting sweeps against the independent reference. The study uses the research network directly; no field vessel is needed. Any flaw they identify must be used before the formation changes its pattern."
EPOCH_RES_WRECK:0 "Recover hunter battle fragments"
EPOCH_RES_WRECK_DESC:0 "Recover the damaged transmitters and combat records before the wreckage disperses. A science ship and scientist must secure the fragments for comparison."
EPOCH_RES_COMPARE:0 "Compare the correction code"
EPOCH_RES_COMPARE_DESC:0 "Compare the isolated sequence with the gaps in our expedition archive. A science ship and scientist will carry out the authorized observation protocol at our capital."
EPOCH_RES_REFLECTION:0 "Measure the delayed reflection"
EPOCH_RES_REFLECTION_DESC:0 "Measure the delay between successive returns at the first station. A science ship must establish which intervals belong to the relay rather than the transmission."
EPOCH_RES_SILENCE:0 "Investigate the suppression station"
EPOCH_RES_SILENCE_DESC:0 "Place independent receivers across the second station's transmission path. Compare what enters with what remains on the far side."
decision_epoch_res_quarantine:0 "Establish resonance quarantine"
decision_epoch_res_quarantine_desc:0 "Restrict movement through the affected districts and keep production under supervision. An unstable reaction cannot be quieted by access controls alone."
decision_epoch_res_localize:0 "Localize the infection"
decision_epoch_res_localize_desc:0 "Compare district clocks and production logs to trace the reaction's boundaries. The teams need a reliable map before approaching its center."
decision_epoch_res_sample:0 "Study resonance samples"
decision_epoch_res_sample_desc:0 "Recover material from the mapped districts under observation. Quarantine or dedicated isolation facilities protect the samples; an unsecured approach risks disturbing the reaction."
decision_epoch_res_exploit:0 "Extract the resonance"
decision_epoch_res_exploit_desc:0 "Draw usable material and measurements directly from the reaction. The extraction teams expect severe disruption around the collection sites."
decision_epoch_res_stabilize:0 "Stabilize the localized pattern"
decision_epoch_res_stabilize_desc:0 "Align the quarantined installations with the mapped interval under continuous observation. The teams can attempt this only while the reaction remains quiet."
decision_epoch_res_emergency:0 "Emergency containment"
decision_epoch_res_emergency_desc:0 "Sever the mapped reaction from its surrounding infrastructure. The shutdown can contain it, but will leave ruined districts and lasting damage."
decision_epoch_res_isolate:0 "Isolate unstable districts"
decision_epoch_res_isolate_desc:0 "Cut the unstable districts off from the quarantined network. Some local installations must be sacrificed to quiet the reaction."
