l_english:
 epoch_core.2.name:0 "The First Echo"
 epoch_core.2.desc:0 "During a routine survey, one of our Science Ships records a narrow pulse from this system. It repeats with a precision no natural source should sustain, then vanishes between scans. The ship can hold position for a careful study or begin triangulating the source at once."
 epoch_core.2.a:0 "Map the pulse patiently and preserve every reading."
 epoch_core.2.b:0 "Drive a rapid triangulation before the signal shifts again."
 epoch_core.2.c:0 "Leave the signal undisturbed."
 epoch_core.3.name:0 "A second interval"
 epoch_core.3.desc.cautious:0 "The first measurements have isolated a faint echo beneath the main pulse. We can spend more time calibrating the instruments or preserve the broad baseline and let the ship continue a slower comparison."
 epoch_core.3.desc.aggressive:0 "The fast sweep has caught a moving return in the signal. We can push the array into overdrive for a narrow trace, risking a damaged reading, or throttle back and accept a wider, slower search."
 epoch_core.3.a:0 "Calibrate for a cleaner, safer reading."
 epoch_core.3.b:0 "Keep the broad baseline and continue carefully."
 epoch_core.3.c:0 "Push the array into overdrive."
 epoch_core.3.d:0 "Throttle back before the instruments strain."
 epoch_core.4.name:0 "A patient pattern"
 epoch_core.4.desc:0 "The recovered intervals point beyond the survey route. We can send a Science Ship to inspect the coordinates. Remote observations suggest a violent distortion: the ship may not return. The surviving fragments do not identify what waits there."
 epoch_core.4.a:0 "Send a science ship of your choosing to follow the crew's last trace."
 epoch_core.5.name:0 "Coordinates in the noise"
 epoch_core.5.desc:0 "The recovered intervals point beyond the survey route. We can send a Science Ship to inspect the coordinates. Remote observations suggest a violent distortion: the ship may not return. The surviving fragments do not identify what waits there."
 epoch_core.5.a:0 "Send a science ship of your choosing along the recovered bearing."
 epoch_core.6.name:0 "The missing expedition"
 epoch_core.6.desc.cautious:0 "The search vessel reaches the final telemetry and finds no beacon. A pulse continues just beyond the missing ship's last position, steady enough to follow but too faint to identify what lies ahead."
 epoch_core.6.desc.aggressive:0 "At the end of the recovered bearing, the instruments register a sharp distortion. The expedition is gone. Its recorder may still be intact, though the return pulse is stronger here."
 epoch_core.6.desc.degraded:0 "The overdriven instruments have lost the narrow trace. The expedition is gone, and only a damaged reading points toward the stronger return pulse."
 epoch_core.6.desc.standard:0 "The expedition's last position is silent. A narrow pulse continues beyond the point where its telemetry stopped."
 epoch_core.6.a:0 "Search for survivors and their emergency beacon."
 epoch_core.6.b:0 "Recover the recorder and any useful debris."
 epoch_core.6.c:0 "Survey the wider signal wake from a safe distance."
 epoch_core.6.d:0 "End the search and preserve the last position."
 epoch_core.7.name:0 "A gap in the record"
 epoch_core.7.desc.survivors:0 "The rescued crew independently describe the same missing interval. None remembers what happened inside it, but each heard the survey beacon continue to pulse."
 epoch_core.7.desc.recorder:0 "The recovered recorder isolates a second pulse beginning before the expedition loses contact, as if the signal had anticipated the route."
 epoch_core.7.desc.survey:0 "The wide survey finds no vessel or crew, but records a brief distortion with the same timing as the First Echo."
 epoch_core.7.desc.failed:0 "The search returns fragments too damaged to establish whether anyone survived. The expedition's vessel remains missing, and the records do not explain the gap."
 epoch_core.7.desc.abandoned:0 "The sealed report preserves the last known position and the moment contact ended. The expedition remains unresolved, but its loss is now part of the record."
 epoch_core.7.a:0 "Preserve the account for future study."
 epoch_first_echo_investigation:0 "The First Echo"
 epoch_first_echo_investigation_desc:0 "Follow the five linked inquiries. Each analysis period leads to a decision or field investigation. During an unresolved objective, progress pauses; the stage tooltip names the required action."
 epoch_first_echo_investigation_monthly_change_tooltip:0 "The selected approach sets the monthly pace. Each stage also requires its listed investigation or decision before the next stage can begin."
 epoch_first_echo_waiting_objective:0 "Progress has reached this stage's limit. Complete the investigation or choose an explicit resolution to continue."
 epoch_first_echo_waiting_progress:0 "The required decision is recorded. The selected approach must build more progress before the next stage begins."
 epoch_first_echo_status_active:0 "The selected approach is advancing this inquiry. Its listed report or decision is also required for the next stage."
 epoch_echo_progress_cautious:0 "Careful observation"
 epoch_echo_progress_intensive:0 "Intensive observation"
 epoch_echo_progress_containment:0 "Active containment"
 epoch_echo_progress_minimal:0 "Minimal operation"
 epoch_first_echo_phase_echo:0 "Complete both First Echo investigations, or explicitly abandon the follow-up study."
 epoch_first_echo_phase_expedition:0 "Assign a staffed Science Ship to the expedition project. This ship will be lost on completion. Resolve the subsequent search and acknowledge its report; cancellation offers retry or explicit recall."
 epoch_first_echo_phase_contamination:0 "Complete the sampling project, pay for isolation, or explicitly accept the lasting contamination. Progress stays paused until that decision is resolved."
 epoch_first_echo_phase_structure:0 "Authorize excavation, then assign a staffed Science Ship to all four archaeological chapters. Decide the chamber's fate in the final chapter. A missing or inaccessible site offers remote study or closure."
 epoch_first_echo_phase_report:0 "Read the assessment and choose whether to keep the records open or seal them permanently. Time alone will never conclude this inquiry."
 epoch_echo_cautious_approach:0 "Careful observation"
 epoch_echo_cautious_approach_desc:0 "Steady analysis with low energy upkeep and a modest physics bonus. Both pause while an objective is unresolved."
 epoch_echo_aggressive_approach:0 "Forceful observation"
 epoch_echo_aggressive_approach_desc:0 "Fast analysis with high energy upkeep and an engineering bonus. Intensive work risks one setback per inquiry. Upkeep and bonus pause while an objective is unresolved."
 epoch_echo_containment_approach:0 "Active containment"
 epoch_echo_containment_approach_desc:0 "Maintain containment throughout the contamination inquiry. Its energy and mineral upkeep and society bonus continue while sampling is pending; the field buffers the affected world until resolution."
 epoch_echo_minimal_approach:0 "Minimal operation"
 epoch_echo_minimal_approach_desc:0 "Slow analysis with minimal upkeep and reduced physics output. Both pause while an objective is unresolved."
 EPOCH_FIRST_ECHO_CAUTIOUS:0 "Establish a quiet baseline"
 EPOCH_FIRST_ECHO_CAUTIOUS_DESC:0 "A long, low-power observation will separate the repeating pulse from local background noise."
 EPOCH_FIRST_ECHO_AGGRESSIVE:0 "Triangulate the moving signal"
 EPOCH_FIRST_ECHO_AGGRESSIVE_DESC:0 "A rapid, high-power sweep may catch the signal before it shifts again."
 EPOCH_ECHO_CALIBRATION:0 "Calibrate the long baseline"
 EPOCH_ECHO_CALIBRATION_DESC:0 "A careful calibration isolates a faint second interval in the signal."
 EPOCH_ECHO_BASELINE:0 "Continue the passive comparison"
 EPOCH_ECHO_BASELINE_DESC:0 "A slower comparison preserves a broad record without stressing the instruments."
 EPOCH_ECHO_OVERDRIVE:0 "Force a narrow signal lock"
 EPOCH_ECHO_OVERDRIVE_DESC:0 "A short, powerful sweep may reveal the source's bearing before it moves."
 EPOCH_ECHO_THROTTLED:0 "Trace the weakened return"
 EPOCH_ECHO_THROTTLED_DESC:0 "A reduced-power scan follows the wider, less certain return."
 EPOCH_MISSING_EXPEDITION:0 "Expedition into the signal wake"
 EPOCH_MISSING_EXPEDITION_DESC:0 "Send an owned Science Ship and scientist along the recovered coordinates. The expedition will lose contact and the assigned ship will be lost. A separate search will determine the fate of its personnel."
 EPOCH_EXPEDITION_RESCUE:0 "Search for the missing crew"
 EPOCH_EXPEDITION_RESCUE_DESC:0 "A patient search will prioritize emergency beacons and survivable wreckage."
 EPOCH_EXPEDITION_SALVAGE:0 "Recover the expedition recorder"
 EPOCH_EXPEDITION_SALVAGE_DESC:0 "A focused recovery sweep may find the recorder before the signal shifts again."
 EPOCH_EXPEDITION_SURVEY:0 "Survey the signal wake"
 EPOCH_EXPEDITION_SURVEY_DESC:0 "A broad, slow survey will map the wake while keeping the ship at a distance."
 epoch_first_echo_investigation_type:0 "Signal Investigation"
 stage_signal_analysis:0 "Signal Analysis"
 stage_source_analysis:0 "Missing Expedition"
 stage_contamination:0 "Unfamiliar Changes"
 stage_excavation:0 "The Buried Structure"
 stage_report:0 "An Incomplete Account"
 epoch_core.20.name:0 "An alteration without a source"
 epoch_core.20.desc.organic:0 "Cells from the expedition's last samples no longer match their earlier records. Similar changes appear in organisms on our capital. We can investigate the affected sites, isolate them, or leave the pattern undisturbed. Nothing yet explains the resemblance."
 epoch_core.20.desc.hive:0 "A set of local biological processes has begun repeating a signal interval absent from the rest of the collective. We can inspect the affected nodes, isolate them, or let the deviation continue. The cause remains outside our records."
 epoch_core.20.desc.machine:0 "Processes on our capital are returning data structures absent from their original state. We can trace the affected systems, isolate them, or let the process continue. No source has been identified."
 epoch_core.20.a:0 "Assign a staffed science ship to trace the changes."
 epoch_core.20.b:0 "Isolate the affected sites now."
 epoch_core.20.a.tooltip:0 "A staffed Science Ship must complete the contamination study before the Situation can advance."
 epoch_core.20.b.tooltip:0 "Cost: 500 Energy and 300 Minerals. Containment reduces the active effects and permits the structure investigation to proceed."
 epoch_core.20.c.tooltip:0 "Neglect worsens the damage and may spread it to another owned world."
 epoch_core.26.name:0 "The samples could not be secured"
 epoch_core.26.desc:0 "The sampling could not be concluded, or the affected site is no longer under our control. The disturbance remains unresolved. Repeat the study if the site is still available, or close the inquiry and accept the lasting damage."
 epoch_core.26.a:0 "Assign another Science Ship to repeat the study."
 epoch_core.26.b:0 "Stop the study and proceed with the unresolved effects."
 epoch_core.28.name:0 "The signal has gone quiet"
 epoch_core.28.desc:0 "The survey could not follow the signal to a reliable conclusion. The expedition's last trace remains uncertain."
 epoch_core.28.a:0 "Repeat the survey."
 epoch_core.28.b:0 "Abandon this survey project."
 epoch_core.30.name:0 "The search team lost its trail"
 epoch_core.30.desc:0 "The latest search could not recover a reliable lead. Another staffed ship can continue the selected search, or we can record the uncertainty and move on."
 epoch_core.30.a:0 "Assign another Science Ship and continue the search."
 epoch_core.30.b:0 "Abandon the search and preserve the incomplete report."
 epoch_core.31.name:0 "The first signal study was interrupted"
 epoch_core.31.desc:0 "The assigned study can no longer continue. A replacement Science Ship could repeat the work; otherwise we must formally set aside this line of inquiry."
 epoch_core.31.a:0 "Assign another Science Ship to repeat the study."
 epoch_core.31.b:0 "End the investigation here."
 epoch_core.7.desc.project_abandoned:0 "The survey project was abandoned before it could establish what happened to the expedition. No field vessel has been identified as lost."
 epoch_core.32.name:0 "The follow-up study was interrupted"
 epoch_core.32.desc:0 "The follow-up work stopped before a conclusion was reached. We can assign another Science Ship or formally abandon this investigation and continue with the evidence already gathered."
 epoch_core.32.a:0 "Assign another Science Ship to repeat the study."
 epoch_core.32.b:0 "Abandon the investigation and continue to the expedition."
 epoch_core.44.name:0 "The excavation site is gone"
 epoch_core.44.desc:0 "The target world or its excavation site can no longer be reached. A staffed Science Ship can analyze the recovered survey record remotely, or we can archive the incomplete findings and close the inquiry."
 epoch_core.44.a:0 "Assign a Science Ship to the remote study."
 epoch_core.44.b:0 "Archive the incomplete findings and close the inquiry."
 epoch_core.46.name:0 "The remote study was interrupted"
 epoch_core.46.desc:0 "The remote analysis stopped before a conclusion could be reached. Another staffed Science Ship can repeat the work, or we can archive the incomplete findings and close the inquiry."
 epoch_core.46.a:0 "Assign another Science Ship to repeat the study."
 epoch_core.46.b:0 "Archive the incomplete findings and close the inquiry."
 epoch_core.20.c:0 "Leave the process undisturbed and accept the risk of worsening damage."
 epoch_core.22.name:0 "The silent structure"
 epoch_core.22.desc.organic:0 "The disturbed material forms a regular boundary around a sealed cavity. The surrounding organisms repeat an interval found in the signal and the expedition's records. Nothing in our samples explains how the pattern began."
 epoch_core.22.desc.hive:0 "A structure has surfaced beneath the altered biological network. Its boundary repeats an interval found in the signal and the lost expedition's records. The collective cannot determine whether it is active."
 epoch_core.22.desc.machine:0 "A buried structure is visible beneath the corrupted processes. Its surface carries an interval found in the signal and the expedition records, but no matching construction record exists."
 epoch_core.22.a:0 "Authorize a staffed excavation at the site."
 epoch_core.40.name:0 "A repeated boundary"
 epoch_core.40.desc:0 "The first exposed layer follows a precise curve beneath the surrounding material. Samples taken on opposite sides show the same faint interval, though they share no measurable composition."
 epoch_core.40.a:0 "Map the boundary before removing more material."
 epoch_core.40.b:0 "Clear a direct path to the center."
 epoch_core.41.name:0 "The altered layer"
 epoch_core.41.desc.spread:0 "The surrounding deposits carry the same disruptions already found on other worlds. Excavation instruments register a response whenever the affected layers meet."
 epoch_core.41.desc.contained:0 "The isolated samples remain stable, but the structure's outer layer carries a trace of the earlier contamination."
 epoch_core.41.desc.standard:0 "A second layer sits beneath the boundary. Its surface is intact, yet the measuring equipment records small changes whenever a tool approaches it."
 epoch_core.41.a:0 "Compare the layer against the isolated samples."
 epoch_core.41.b:0 "Cut through before the readings change again."
 epoch_core.42.name:0 "A familiar interval"
 epoch_core.42.desc.degraded:0 "The recovered coordinates are incomplete. The pattern in the lower chamber almost matches them, but a short gap makes the comparison uncertain."
 epoch_core.42.desc.recovered:0 "The recorder recovered from the expedition repeats the interval now visible inside the chamber. The instrument cannot establish whether the source was near or far."
 epoch_core.42.desc.standard:0 "The lower chamber contains marks at regular intervals. Their spacing matches part of the signal, though the rest of the pattern remains unreadable."
 epoch_core.42.a:0 "Record the match and preserve the instruments."
 epoch_core.42.b:0 "Force the mechanism open while the signal persists."
 epoch_core.43.name:0 "The sealed chamber"
 epoch_core.43.desc.risk:0 "The exposed mechanism is unstable after the earlier cuts. The chamber can be sealed in place, dismantled, or examined once more at greater risk."
 epoch_core.43.desc.careful:0 "The final layer opens without a clear transition. The chamber is accessible, but its marks offer no account of their maker or purpose."
 epoch_core.43.desc.standard:0 "The final layer gives way to a silent chamber. Its surface repeats the same interval, with no inscription that identifies who made it or why."
 epoch_core.43.a:0 "Seal the chamber and maintain controlled access."
 epoch_core.43.b:0 "Destroy the exposed structure."
 epoch_core.43.c:0 "Complete the examination and leave the chamber undisturbed."
 site_epoch_core_silent_structure:0 "The Silent Structure"
 site_epoch_core_silent_structure_desc:0 "A buried structure has been detected beneath [From.Planet.GetName]. Its surfaces repeat a measured interval found in recent survey records. No known construction pattern matches the exposed geometry."
 epoch_core.23.name:0 "An incomplete record"
 epoch_core.23.desc.organic:0 "The sealed reports agree on what changed, but not on why. The affected world remains altered. Our instruments preserve several fragments that share a timing pattern; none reveals what produced it or whether it has stopped.\n\n[Root.GetEpochEchoSummary]\n\n[Root.GetEpochExpeditionSummary]\n\n[Root.GetEpochContaminationSummary]"
 epoch_core.23.desc.hive:0 "The collective retains a permanent discontinuity in the affected world's processes. The recovered intervals match, but their origin and relation remain unresolved. The network cannot tell whether the pattern has ended.\n\n[Root.GetEpochEchoSummary]\n\n[Root.GetEpochExpeditionSummary]\n\n[Root.GetEpochContaminationSummary]"
 epoch_core.23.desc.machine:0 "A permanent defect remains in the affected world's production systems. Recovered records contain a repeated interval, but no trace identifies its author, purpose, or present state.\n\n[Root.GetEpochEchoSummary]\n\n[Root.GetEpochExpeditionSummary]\n\n[Root.GetEpochContaminationSummary]"
 epoch_core.23.desc.ruined:0 "The exposed structure is gone, and the site is damaged beyond further examination. The expedition records and the changes on this world remain in the record, but no surviving trace explains who or what caused them.\n\n[Root.GetEpochEchoSummary]\n\n[Root.GetEpochExpeditionSummary]\n\n[Root.GetEpochContaminationSummary]"
 epoch_core.23.desc.secured:0 "The structure is sealed behind controlled access. We recovered fragments from the expedition and from the affected world, yet their repeated intervals explain neither their origin nor whether the process has ended.\n\n[Root.GetEpochEchoSummary]\n\n[Root.GetEpochExpeditionSummary]\n\n[Root.GetEpochContaminationSummary]"
 epoch_core.23.desc.studied:0 "The structure's markings match fragments from the lost expedition and the affected world. The match is measurable; its cause, author, and purpose are not. The record remains incomplete.\n\n[Root.GetEpochEchoSummary]\n\n[Root.GetEpochExpeditionSummary]\n\n[Root.GetEpochContaminationSummary]"
 epoch_core.23.a:0 "Keep the instruments active and follow the remaining traces."
 epoch_core.23.b:0 "Seal the records and forbid further access to the site."
 EPOCH_CONTAMINATION_STUDY:0 "Trace the altered processes"
 EPOCH_CONTAMINATION_STUDY_DESC:0 "Compare affected samples and systems without presuming a common cause."
 EPOCH_STRUCTURE_REMOTE_STUDY:0 "Analyze the excavation record remotely"
 EPOCH_STRUCTURE_REMOTE_STUDY_DESC:0 "Compare the surviving survey record and excavation data to infer the structure's outer signature."
 epoch_core_contamination_active:0 "Unstable local processes"
 epoch_core_containment_buffered:0 "Containment field"
 epoch_core_containment_buffered_desc:0 "An active containment field steadies the affected world while the containment approach is selected."
 epoch_core_contamination_active_desc:0 "An unexplained change is affecting local production and stability."
 epoch_core_contamination_worsened:0 "Severe local disruption"
 epoch_core_contamination_worsened_desc:0 "The unexplained change has deepened and now disrupts production and stability."
 epoch_core_contamination_active_organic:0 "Biological contamination"
 epoch_core_contamination_active_organic_desc:0 "An unexplained biological change reduces food output and stability."
 epoch_core_contamination_active_hive:0 "Disrupted biological network"
 epoch_core_contamination_active_hive_desc:0 "A foreign interval disrupts the collective's local biological processes."
 epoch_core_contamination_active_machine:0 "Foreign process pattern"
 epoch_core_contamination_active_machine_desc:0 "A foreign data pattern reduces energy output and stability."
 epoch_core_contamination_worsened_organic:0 "Severe biological contamination"
 epoch_core_contamination_worsened_organic_desc:0 "The biological change now damages food production and local stability."
 epoch_core_contamination_worsened_hive:0 "Severe network disruption"
 epoch_core_contamination_worsened_hive_desc:0 "The foreign interval now disrupts unity and local biological processes."
 epoch_core_contamination_worsened_machine:0 "Severe process corruption"
 epoch_core_contamination_worsened_machine_desc:0 "The foreign data pattern now damages energy output and local stability."
 epoch_core_contamination_studied_organic:0 "Persistent biological trace"
 epoch_core_contamination_studied_organic_desc:0 "Study has reduced the biological disruption, but a lasting trace remains."
 epoch_core_contamination_studied_hive:0 "Persistent network trace"
 epoch_core_contamination_studied_hive_desc:0 "The collective has isolated the disruption, though its trace remains."
 epoch_core_contamination_studied_machine:0 "Persistent process trace"
 epoch_core_contamination_studied_machine_desc:0 "The foreign process is contained, but its trace remains in local systems."
 epoch_core_silent_structure:0 "Silent structure"
 epoch_core_silent_structure_desc:0 "An unexplained structure has been uncovered here."
 epoch_core_structure_secured:0 "Secured structure"
 epoch_core_structure_secured_desc:0 "Controlled access to the structure supports engineering work."
 epoch_core_structure_investigated:0 "Examined structure"
 epoch_core_structure_investigated_desc:0 "The completed excavation supports continuing social research on this world."
 epoch_core_structure_ruins:0 "Structure remains"
 epoch_core_structure_ruins_desc:0 "The exposed structure has been destroyed, leaving a damaged site."
 epoch_core_permanent_scar_organic:0 "Persistent biological damage"
 epoch_core_permanent_scar_organic_desc:0 "A lasting biological change continues to impair production on this world."
 epoch_core_permanent_scar_hive:0 "Persistent network damage"
 epoch_core_permanent_scar_hive_desc:0 "A lasting discontinuity continues to impair the collective's work on this world."
 epoch_core_permanent_scar_machine:0 "Persistent process damage"
 epoch_core_permanent_scar_machine_desc:0 "A lasting process defect continues to impair production on this world."
 epoch_core_permanent_scar_exacerbated:0 "Severe persistent damage"
 epoch_core_permanent_scar_exacerbated_desc:0 "The losses and disturbances suffered during the inquiry have left an additional, lasting burden on this world."
 epoch_core_permanent_scar_fallback:0 "Persistent empire-wide disruption"
 epoch_core_permanent_scar_fallback_desc:0 "A lasting systems fault continues to reduce the empire's energy production."
 epoch_core_permanent_scar_exacerbated_fallback:0 "Severe persistent systems damage"
 epoch_core_permanent_scar_exacerbated_fallback_desc:0 "The losses and disturbances have left an additional, lasting reduction in energy production."
 stage_expedition_resolution:0 "Expedition: Awaiting the Report"
