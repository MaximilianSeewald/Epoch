l_english:
 epoch_core.2.name:0 "The First Echo"
 epoch_core.2.desc:0 "A narrow-band pulse has appeared in our deep-space observatories. It repeats at intervals too deliberate to dismiss as instrument noise, yet every attempt to trace it ends in empty sky. For now, we know only that the signal was not there before."
 epoch_core.2.a:0 "Build a careful scientific baseline."
 epoch_core.2.b:0 "Triangulate the source with a high-power array."
 epoch_core.2.c:0 "Close the file and leave the EPOCH campaign."
 epoch_core.3.name:0 "The signal leaves a trace"
 epoch_core.3.desc.cautious:0 "A faint, repeating echo remains in the observatory records. We can spend energy maintaining a calibrated long-baseline scan, or keep to passive instruments and let the analysis take longer. Calibration will speed the investigation and may help us find a missing survey team later."
 epoch_core.3.desc.aggressive:0 "The array has narrowed the signal to a moving patch of sky. Keeping it locked will drain energy and may strain reserves; throttling back is safer, but will leave us with a slower, less precise search."
 epoch_core.3.a:0 "Calibrate the long-baseline instruments (100 Energy; +5 monthly progress; unlocks a rescue method)."
 epoch_core.3.b:0 "Keep to the passive baseline."
 epoch_core.3.c:0 "Hold the high-power lock (250 Energy; +10 monthly progress; unlocks a risky recovery method)."
 epoch_core.3.d:0 "Throttle the array (5 monthly progress; stop the Energy upkeep)."
 epoch_core.4.name:0 "A patient pattern"
 epoch_core.4.desc:0 "Months of careful comparison reveal a second pulse hidden between the first one's repetitions. It carries no clear message, only a precise interval that our archives can now recognize."
 epoch_core.4.a:0 "Dispatch a quiet long-baseline survey team."
 epoch_core.5.name:0 "Coordinates in the noise"
 epoch_core.5.desc:0 "The high-power pass returns a narrow direction and a fragment of a repeating coordinate pattern. Something shifted the source between observations; the data is useful, but the array has burned through its reserves."
 epoch_core.5.a:0 "Send a survey ship along the recovered coordinates."
 epoch_core.6.name:0 "The missing expedition"
 epoch_core.6.desc.cautious:0 "The long-baseline survey team has missed two check-ins. Their final telemetry shows a clean, steady signal until it stops mid-transmission. No distress call followed."
 epoch_core.6.desc.aggressive:0 "The survey ship sent along the recovered bearing has disappeared from every sensor. Its last transmission ends with a burst of power readings and then a silence too complete for ordinary communications failure."
 epoch_core.6.desc.throttled:0 "The throttled array could not hold a steady track. The survey ship's last position is uncertain, and its final transmission contains a gap where the navigation record should be."
 epoch_core.6.desc.standard:0 "The survey ship missed its check-in. Its last known position is the edge of the signal's fading track; the telemetry ends without a distress call or any sign of impact."
 epoch_core.6.a:0 "Reconstruct its last known position."
 epoch_core.7.name:0 "The last known position"
 epoch_core.7.desc.calibrated:0 "The calibrated intervals give us a narrow return path. There is no beacon, only a regular pulse arriving from just beyond the ship's final coordinates."
 epoch_core.7.desc.overdrive:0 "The high-power readings point to a short-lived opening in the signal's wake. It may be a way in—or the reason the survey ship never came back."
 epoch_core.7.desc.throttled:0 "With the array throttled, the last coordinates drift across a wide search area. A faint object moves against the local starfield, too slowly to be a passing ship."
 epoch_core.7.desc.standard:0 "The last coordinates are quiet. A handful of fragments and an unexplained blank in the telemetry are all that remain to guide a search."
 epoch_core.7.a:0 "Use the calibrated baseline to attempt a low-risk rescue (100 Energy)."
 epoch_core.7.b:0 "Force a high-power recovery window (250 Energy)."
 epoch_core.7.c:0 "Follow the drifting coordinates with the throttled array."
 epoch_core.7.d:0 "Survey the area slowly and keep the rescue crews clear."
 epoch_core.7.e:0 "Abandon the search and record the expedition as lost."
 epoch_core.8.name:0 "What the silence left behind"
 epoch_core.8.desc.survivors:0 "The calibrated search finds the survey crew in a sealed emergency pod. They are alive, disoriented, and unable to account for the missing interval. Their ship is still gone."
 epoch_core.8.desc.recorder:0 "The high-power recovery finds the survey ship's recorder, but not its crew. The vessel itself is absent from the coordinates. A second pulse appears in the recovered signal log at the exact moment contact ended."
 epoch_core.8.desc.hull:0 "The drifting search locates the survey ship's empty hull. Its clocks disagree by several days, and the navigation record skips the same interval as the original telemetry. No crew are aboard."
 epoch_core.8.desc.survey:0 "The slow survey finds no vessel or crew. At the edge of the search area, instruments register a brief distortion with the same timing as the First Echo."
 epoch_core.8.desc.abandoned:0 "The search is stood down. The expedition remains missing, and the last position is sealed in the archive without further investigation."
 epoch_core.8.a:0 "Archive the recovered evidence."
 epoch_core.9.name:0 "A gap in the record"
 epoch_core.9.desc.survivors:0 "The rescued crew independently describe the same missing interval. None remembers what happened inside it, but each heard the survey beacon continue to pulse."
 epoch_core.9.desc.recorder:0 "A later pass through the recovered recorder isolates the second pulse. It begins before the expedition loses contact, as if the signal had already anticipated the route."
 epoch_core.9.desc.hull:0 "The empty hull's clock drift and navigation gap agree with each other, but not with the surrounding systems. The missing time is now a measurable part of the case."
 epoch_core.9.desc.survey:0 "The slow survey's brief distortion repeats in a narrow window. It leaves no trace on the instruments except the precise interval between pulses."
 epoch_core.9.desc.abandoned:0 "The sealed report preserves the last known position and the time contact ended. The expedition remains unresolved, but its loss is now part of the record."
 epoch_core.9.a:0 "Archive the crew's testimony."
 epoch_core.9.b:0 "Preserve the recovered signal trace."
 epoch_core.9.c:0 "Record the navigation gap."
 epoch_core.9.d:0 "Keep the distortion timing for later comparison."
 epoch_core.9.e:0 "Retain the sealed loss report."
 epoch_first_echo_investigation:0 "The First Echo"
 epoch_first_echo_investigation_desc:0 "The pulse has faded, but its spacing and faint echoes remain in the observatory records. Analysts compare the timing first, then use the pattern to narrow the search. Each pass reveals a little more—and leaves the origin just beyond certainty."
 epoch_first_echo_phase_signal:0 "Phase I: Compare the pulse intervals; calibration, overdrive and throttling change progress and later expedition options."
 epoch_first_echo_phase_source:0 "Phase II: Follow the residual pattern toward its silent source; the selected method shapes the clue recovered."
