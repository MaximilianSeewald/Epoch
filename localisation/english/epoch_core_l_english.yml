l_english:
 epoch_core.2.name:0 "The First Echo"
 epoch_core.2.desc:0 "The survey receiver repeats a pulse that should have faded into the background hours ago. Between each return lies exactly the same silence; between scans, nothing at all. The crew has checked the clock against independent instruments. All agree.\n\nA quiet observation may preserve what little we have. A rapid triangulation might catch the source before it disappears again."
 epoch_core.2.a:0 "Map the pulse patiently and preserve every reading."
 epoch_core.2.b:0 "Drive a rapid triangulation before the signal shifts again."
 epoch_core.2.c:0 "Leave the signal undisturbed."
 epoch_core.3.name:0 "A second interval"
 epoch_core.3.desc.cautious:0 "The long observation has exposed a weaker interval beneath the pulse. It survives every correction for instrument drift. When the team removes the main signal, the faint return still keeps its time.\n\nA closer calibration would help separate the two. Keeping the broader record would spare the array and leave more uncertainty in the comparison."
 epoch_core.3.desc.aggressive:0 "The rapid sweep caught a return moving across the array. Its bearing changes between scans, while the interval remains exact. The engineers can force a narrower lock, but the receiver is already operating beyond its normal tolerance.\n\nReducing power would preserve the instruments at the cost of a less certain trace."
 epoch_core.3.a:0 "Calibrate for a cleaner, safer reading."
 epoch_core.3.b:0 "Keep the broad baseline and continue carefully."
 epoch_core.3.c:0 "Push the array into overdrive."
 epoch_core.3.d:0 "Throttle back before the instruments strain."
 epoch_core.4.name:0 "A patient pattern"
 epoch_core.4.desc:0 "Patient comparison has reduced the scattered bearings to a set of coordinates beyond the survey route. Remote instruments register a violent distortion there; repeated scans cannot establish a safe passage.\n\nAn expedition would have to approach closely enough to measure what our distant receivers cannot distinguish. The command assessment warns that the assigned vessel may be lost."
 epoch_core.4.a:0 "Assign a science ship to investigate the recovered coordinates."
 epoch_core.5.name:0 "Coordinates in the noise"
 epoch_core.5.desc:0 "The narrow trace ends at coordinates beyond the survey route. At that distance, the return is inseparable from a violent spatial distortion. We have a bearing, but no reliable account of the conditions at its end.\n\nAn expedition could examine the source directly. Command cannot promise that the vessel assigned to it will return."
 epoch_core.5.a:0 "Send a science ship of your choosing along the recovered bearing."
 epoch_core.6.name:0 "The missing expedition"
 epoch_core.6.desc.cautious:0 "The search vessel reaches the final telemetry and finds no beacon. A pulse continues just beyond the missing ship's last position, steady enough to follow but too faint to identify what lies ahead."
 epoch_core.6.desc.aggressive:0 "At the end of the recovered bearing, the instruments register a sharp distortion. The expedition is gone. Its recorder may still be intact, though the return pulse is stronger here."
 epoch_core.6.desc.degraded:0 "The overdriven instruments have lost the narrow trace. The expedition is gone, and only a damaged reading points toward the stronger return pulse."
 epoch_core.6.desc.standard:0 "The expedition's last position is silent. Its final telemetry ends cleanly, without the drift of a failing transmitter. Beyond that point, a narrow pulse continues at the interval we followed here. We must decide what to search for before sending another vessel closer."
 epoch_core.6.a:0 "Search for survivors and their emergency beacon."
 epoch_core.6.b:0 "Recover the recorder and any useful debris."
 epoch_core.6.c:0 "Survey the wider signal wake from a safe distance."
 epoch_core.6.d:0 "End the search and preserve the last position."
 epoch_core.7.name:0 "A gap in the record"
 epoch_core.7.desc.survivors:0 "The recovered personnel were questioned separately. Each account stops at the same point, then resumes with the survey beacon still sounding. Nobody can describe the interval between.\n\nTheir instruments preserve more elapsed time than any of them remembers. Medical examinations provide no explanation for the difference."
 epoch_core.7.desc.recorder:0 "The recorder continues past the last transmission. Under the expedition beacon, a second pulse begins before the ship loses contact. Its interval matches the one that led us here.\n\nThe recovery team has found no surviving crew. The recording preserves the sound of an expedition carrying on after the rest of our evidence falls silent."
 epoch_core.7.desc.survey:0 "The survey resolves a brief fold in the surrounding readings. Its duration matches the First Echo closely enough to survive independent analysis. No vessel or crew can be distinguished inside it.\n\nWe have mapped the disturbance around the expedition's disappearance. The expedition itself remains beyond our reach."
 epoch_core.7.desc.failed:0 "The search returns fragments too damaged to establish whether anyone survived. The expedition's vessel remains missing, and the records do not explain the gap."
 epoch_core.7.desc.abandoned:0 "The sealed report preserves the last known position and the moment contact ended. The expedition remains unresolved, but its loss is now part of the record."
 epoch_core.7.a:0 "Preserve the account for future study."
 epoch_first_echo_investigation:0 "The First Echo"
 epoch_first_echo_investigation_desc:0 "A repeating pulse, an uncertain bearing, and measurements that disagree with their own records. Our analysts are assembling the evidence while field teams investigate each lead."
 epoch_first_echo_investigation_monthly_change_tooltip:0 "The observation protocol determines the pace of analysis. Field reports and outstanding decisions must also be resolved."
 epoch_first_echo_waiting_objective:0 "The analysts need the outstanding field report or a decision on the inquiry before they can proceed."
 epoch_first_echo_waiting_progress:0 "The field record is complete. Comparative analysis is still under way."
 epoch_first_echo_status_active:0 "Observatories are comparing the available records under the selected protocol."
 epoch_echo_progress_cautious:0 "Careful observation"
 epoch_echo_progress_intensive:0 "Intensive observation"
 epoch_echo_progress_containment:0 "Active containment"
 epoch_echo_progress_minimal:0 "Minimal operation"
 epoch_first_echo_phase_echo:0 "Complete the signal measurements with a science ship and scientist, or formally set aside the follow-up inquiry."
 epoch_first_echo_phase_expedition:0 "The expedition awaits a science ship and scientist. The approach is dangerous; command expects the vessel to be lost. Any search report must be reviewed before the inquiry can close."
 epoch_first_echo_phase_contamination:0 "Study the affected samples, authorize isolation, or accept the contamination's lasting presence."
 epoch_first_echo_phase_structure:0 "A science ship and scientist must excavate the four layers of the structure. Its final chamber awaits a decision. If access is lost, the surviving excavation record can still be examined remotely."
 epoch_first_echo_phase_report:0 "Review the assembled evidence. Decide whether to keep the inquiry open or seal its records permanently."
 epoch_echo_cautious_approach:0 "Careful observation"
 epoch_echo_cautious_approach_desc:0 "Compare low-power observations over long intervals. The instruments are spared the strain of forced acquisition. Analysis pauses while the teams await a field report."
 epoch_echo_aggressive_approach:0 "Forceful observation"
 epoch_echo_aggressive_approach_desc:0 "Drive the arrays hard enough to catch a moving return. The faster comparison risks damaged readings. Analysis pauses while the teams await a field report."
 epoch_echo_containment_approach:0 "Active containment"
 epoch_echo_containment_approach_desc:0 "Maintain an isolation field around the affected world while the samples are examined. Keeping the field active requires continuing supplies, even while the teams await their results."
 epoch_echo_minimal_approach:0 "Minimal operation"
 epoch_echo_minimal_approach_desc:0 "Keep only the essential receivers operating. The reduced observations leave long intervals between reliable comparisons. Work pauses while a field report is outstanding."
 EPOCH_FIRST_ECHO_CAUTIOUS:0 "Establish a quiet baseline"
 EPOCH_FIRST_ECHO_CAUTIOUS_DESC:0 "A long, low-power observation will separate the repeating pulse from local background noise."
 EPOCH_FIRST_ECHO_AGGRESSIVE:0 "Triangulate the moving signal"
 EPOCH_FIRST_ECHO_AGGRESSIVE_DESC:0 "A rapid, high-power sweep may catch the signal before it shifts again."
 EPOCH_ECHO_CALIBRATION:0 "Calibrate the long baseline"
 EPOCH_ECHO_CALIBRATION_DESC:0 "A careful calibration isolates a faint second interval in the signal."
 EPOCH_ECHO_BASELINE:0 "Continue the passive comparison"
 EPOCH_ECHO_BASELINE_DESC:0 "A slower comparison preserves a broad record without stressing the instruments."
 EPOCH_ECHO_OVERDRIVE:0 "Force a narrow signal lock"
 EPOCH_ECHO_OVERDRIVE_DESC:0 "A short, powerful sweep may reveal the source's bearing before it moves."
 EPOCH_ECHO_THROTTLED:0 "Trace the weakened return"
 EPOCH_ECHO_THROTTLED_DESC:0 "A reduced-power scan follows the wider, less certain return."
 EPOCH_MISSING_EXPEDITION:0 "Expedition into the signal wake"
 EPOCH_MISSING_EXPEDITION_DESC:0 "A science ship must carry its instruments into the distortion along the recovered bearing. Remote measurements cannot establish a safe approach. Command's assessment is explicit: the assigned vessel will be lost during this expedition."
 EPOCH_EXPEDITION_RESCUE:0 "Search for the missing crew"
 EPOCH_EXPEDITION_RESCUE_DESC:0 "A patient search will prioritize emergency beacons and survivable wreckage."
 EPOCH_EXPEDITION_SALVAGE:0 "Recover the expedition recorder"
 EPOCH_EXPEDITION_SALVAGE_DESC:0 "A focused recovery sweep may find the recorder before the signal shifts again."
 EPOCH_EXPEDITION_SURVEY:0 "Survey the signal wake"
 EPOCH_EXPEDITION_SURVEY_DESC:0 "A broad, slow survey will map the wake while keeping the ship at a distance."
 epoch_first_echo_investigation_type:0 "Signal Investigation"
 stage_signal_analysis:0 "Signal Analysis"
