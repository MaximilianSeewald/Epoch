 epoch_frontiers.10.name:0 "The Anchor Below"
 epoch_frontiers.10.desc:0 "The wreck's gravitic braces are still intact. Our engineers can tie them into the local starbase, creating room for additional defense platforms. The platforms themselves will have to be built."
 epoch_frontiers.10.ok:0 "Send the plans to the starbase."
 epoch_frontiers_bulwark:0 "Anchor Bulwark"
 epoch_frontiers_bulwark_desc:0 "Recovered anchor braces reinforce the station's platform berths. Additional defense platforms must be built and paid for separately."
 epoch_frontiers.requires_operational_starport:0 "Requires a starport or larger starbase under its owner's control."
