 EPOCH_FRONTIERS_SURVEY_4_DESC:0 "The wreck of a Nullwarden anchor has drifted into a stable orbit. A science ship with a scientist can trace the surviving power conduits and see whether they can be reused."
 epoch_frontiers.10.name:0 "The Anchor Below"
 epoch_frontiers.10.desc:0 "The wreck's gravitic braces are still intact. Our engineers can tie them into the local starbase, creating room for additional defense platforms. The platforms themselves will have to be built. An alternative is to install a relay and recover what remains inside the wreck."
 epoch_frontiers.10.ok:0 "Send the plans to the starbase."
 epoch_frontiers_bulwark:0 "Anchor Bulwark"
 epoch_frontiers_bulwark_desc:0 "Recovered anchor braces reinforce the station's platform berths. Additional defense platforms must be built and paid for separately."
 epoch_frontiers.requires_operational_starport:0 "Requires a starport or larger starbase under its owner's control."
 EPOCH_FRONTIERS_SALVAGE_1:0 "Recover the Anchor Wreck"
 EPOCH_FRONTIERS_SALVAGE_1_DESC:0 "A science ship with a scientist can retrieve a payload from the wreck. Recovery can proceed while the relay is operational and the starbase is under its owner’s control."
 EPOCH_FRONTIERS_SALVAGE_2:0 "Recover the Anchor Wreck"
 EPOCH_FRONTIERS_SALVAGE_2_DESC:0 "A science ship with a scientist can retrieve a payload from the wreck. Recovery can proceed while the relay is operational and the starbase is under its owner’s control."
 EPOCH_FRONTIERS_SALVAGE_3:0 "Recover the Anchor Wreck"
 EPOCH_FRONTIERS_SALVAGE_3_DESC:0 "A science ship with a scientist can retrieve a payload from the wreck. Recovery can proceed while the relay is operational and the starbase is under its owner’s control."
 EPOCH_FRONTIERS_SALVAGE_4:0 "Recover the Anchor Wreck"
 EPOCH_FRONTIERS_SALVAGE_4_DESC:0 "A science ship with a scientist can retrieve a payload from the wreck. Recovery can proceed while the relay is operational and the starbase is under its owner’s control."
 epoch_frontiers.21.name:0 "The Wreck Is Open"
 epoch_frontiers.21.desc:0 "The recovery team has reached the first sealed compartment. We can reclaim its structural alloys or preserve the damaged machinery for research."
 epoch_frontiers.22.name:0 "The Wreck Is Open"
 epoch_frontiers.22.desc:0 "The last sealed compartment is open. Once its payload is taken, the relay will stand down and its energy upkeep will end."
 epoch_frontiers.take_alloys:0 "Reclaim the alloys."
 epoch_frontiers.take_research:0 "Preserve the machinery for research."
 epoch_frontiers.leave_report:0 "Set the report aside."
 epoch_frontiers.30.name:0 "A Damaged Installation"
 epoch_frontiers.30.desc:0 "The inherited installation needs repairs before it can operate. Restore it with alloys, or dismantle it in the starbase and pay the full construction cost for a replacement."
 epoch_frontiers.30.repair:0 "Pay for repairs."
 epoch_frontiers.30.defer:0 "Leave the installation as it is."
 epoch_frontiers_salvage_relay:0 "Anchor Salvage Relay"
 epoch_frontiers_salvage_relay_desc:0 "A relay coordinates two science ship expeditions into the surveyed ruin. Each expedition can yield alloys or engineering research. The station draws energy until both wreck compartments have been cleared."
 epoch_frontiers.exclusive:0 "This ruin can support one frontier installation. Dismantle the existing installation before building a replacement."
 epoch_frontiers.wrecks_exhausted:0 "Both wreck compartments at this ruin have already been recovered."
