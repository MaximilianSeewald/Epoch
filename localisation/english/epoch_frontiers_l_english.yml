 EPOCH_FRONTIERS_SURVEY_1:0 "Survey the Anchor Ruin"
 EPOCH_FRONTIERS_SURVEY_1_DESC:0 "The wreck of a Nullwarden anchor has drifted into a stable orbit. A science ship with a scientist can trace the surviving power conduits and see whether they can be reused."
