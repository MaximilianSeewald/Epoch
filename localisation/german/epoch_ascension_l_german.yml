l_german:
 epoch_iv_ascension:0 "Das veränderte Schweigen"
 epoch_iv_observe:0 "Untersuchung fortsetzen"
 epoch_iv_operations:0 "Expeditionsleitung öffnen"
 epoch_iv_operations_desc:0 "Aufträge finanzieren, verlorene Ziele ersetzen und Vorbereitungen verwalten. Zum erneuten Öffnen zuerst zur Untersuchung zurückwechseln."
 epoch_iv_observe_desc:0 "Fortschritt entsteht durch abgeschlossene Einsätze. Die Zeit allein löst kein Untersuchungsziel."
 epoch_iv_milestone_1:0 "Zwei Nachhallquellen"
 epoch_iv_goal_1:0 "Zwei bemannte Wissenschaftsschiffprojekte in unterschiedlichen Systemen abschließen."
 epoch_iv_objectives_1:0 "Zwei bemannte Wissenschaftsschiffprojekte in unterschiedlichen Systemen abschließen."
 epoch_iv_milestone_2:0 "Ein versiegelter Fund"
 epoch_iv_goal_2:0 "Wird durch den Abschluss der vorangehenden Untersuchung zugänglich."
 epoch_iv_objectives_2:0 "Vier Ausgrabungsstufen mit einem Wissenschaftler abschließen. Ein neues Archivsystem muss gegebenenfalls zuerst mit einem Außenposten erschlossen werden."
 epoch_iv_milestone_3:0 "Eine umkehrbare Wunde"
 epoch_iv_goal_3:0 "Wird durch den Abschluss der vorangehenden Untersuchung zugänglich."
 epoch_iv_objectives_3:0 "Resonanzdiagnostik und Reversible Resonanzinversion erforschen. Eine eigene geeignete Kolonie diagnostizieren, stabilisieren und durch drei Entscheidungen umwandeln. Ohne geeignetes Ziel: kostenpflichtige Schiffsexpedition in der Expeditionsleitung."
 epoch_iv_milestone_4:0 "Eine rekonstruierbare Anordnung"
 epoch_iv_goal_4:0 "Wird durch den Abschluss der vorangehenden Untersuchung zugänglich."
 epoch_iv_objectives_4:0 "Materialanalyse erforschen. In der Expeditionsleitung den Prototyp finanzieren und das Wissenschaftsschiffprojekt abschließen."
 epoch_iv_milestone_5:0 "Die letzte Prüfung"
 epoch_iv_goal_5:0 "Wird durch den Abschluss der vorangehenden Untersuchung zugänglich."
 epoch_iv_objectives_5:0 "Den markierten persönlichen Richter im echten Raumkampf vernichten. Telemetrie und ein bezahltes Wissenschaftsschiffprojekt am eigenen Forschungsstandort erlauben eine optionale Gegenmaßnahme. Verbündete dürfen helfen."
 epoch_iv_milestone_6:0 "Eine eigene Antwort"
 epoch_iv_goal_6:0 "Wird durch den Abschluss der vorangehenden Untersuchung zugänglich."
 epoch_iv_objectives_6:0 "Nach dem militärischen Sieg eine langfristige Haltung wählen. Spätere Forschungsinhalte werden dadurch berechtigt, aber noch nicht gewährt."
 epoch_iv.10.name:0 "Das Schweigen nach dem Sturm"
 epoch_iv.10.desc:0 "Jahre nach dem letzten Gefecht widersprechen sich zwei Aufzeichnungen unserer eigenen Expeditionen. Ein Eintrag verändert sich nur, wenn niemand ihn liest. Ein anderer bewahrt die Stimme eines längst verstummten Senders. Beide tragen dieselbe Lücke im Zeitstempel. Zwei unabhängige Messungen müssen zeigen, ob der Krieg etwas beendet oder lediglich unterbrochen hat."
 epoch_iv.10.desc.hive:0 "Der Schwarm erinnert sich an den Krieg. Doch zwei Erinnerungsknoten geben auf dieselbe Frage verschiedene Antworten. In beiden fehlt derselbe Augenblick. Keine Drohne hat ihn vergessen; er wurde nie empfangen. Wir entsenden zwei unabhängige wissenschaftliche Verbände, bevor sich die falsche Erinnerung im Bewusstsein verfestigt."
 epoch_iv.10.desc.machine:0 "Zwei unveränderte Prüfsummen bezeichnen unterschiedliche Datensätze. Unsere Archive melden keinen Schreibzugriff. Einer der Datensätze enthält dennoch eine Antwort auf eine erst morgen geplante Anfrage. Zwei räumlich getrennte Messungen sollen den Fehler isolieren. Eine lokale Selbstkorrektur wäre voreilig."
 epoch_iv.careful:0 "Nur reproduzierbare Ergebnisse akzeptieren."
 epoch_iv.experimental:0 "Die widersprüchlichen Daten miteinander koppeln."
 epoch_iv.guardian:0 "Schutzschaltungen vor Erkenntnisgewinn."
 epoch_iv.continue:0 "Die Untersuchung fortsetzen."
 epoch_iv.20.name:0 "Das Archiv ohne Schöpfer"
 epoch_iv.20.desc:0 "Beide Messungen ergeben dieselbe unmögliche Leerstelle. Sie beschreibt keinen Sender, sondern den Umriss eines Ortes. Unter einer unbelebten Oberfläche liegt ein versiegeltes Archiv. Kein Name kennzeichnet seinen Eingang. Im Inneren arbeitet noch ein Mechanismus, der jeden neuen Datensatz mit einer Frage quittiert: Wer hat zugestimmt?"
 epoch_iv_archive:0 "Das namenlose Archiv"
 epoch_iv_archive_desc:0 "Ein versiegeltes Archiv enthält widersprüchliche Erinnerungen. Vier aufeinander aufbauende Ausgrabungsabschnitte erfordern ein Wissenschaftsschiff mit Wissenschaftler."
 epoch_iv.21.name:0 "Die erste Schwelle"
 epoch_iv.21.desc:0 "Die Tür speichert keine Sprache, sondern Beziehungen: Antwort auf Frage, Grenze auf Berührung. Dahinter liegen Datenträger aus miteinander unvereinbaren Materialien. Wir können die empfindlichen Prüfsequenzen sichern, den lesbaren Inhalt sofort extrahieren oder gefährliche Verbindungen isolieren."
 epoch_iv.secure:0 "Prüfsequenzen sichern."
 epoch_iv.extract:0 "Lesbare Daten extrahieren."
 epoch_iv.isolate:0 "Verbindungen isolieren."
 epoch_iv.22.name:0 "Unvereinbare Erinnerungen"
 epoch_iv.22.desc:0 "Eine Kammer beschreibt dieselbe Begegnung als Gespräch, eine andere als Rechenvorgang, eine dritte als geteilten Traum. Keine Version besitzt Vorrang. Erst unsere nebeneinandergelegten Messungen machen die Struktur lesbar: Die Unterschiede wurden absichtlich erhalten. Die Forschungsgruppen gewinnen belastbare Daten zur Resonanzdiagnose."
 epoch_iv.23.name:0 "Eine Antwort ohne Frage"
 epoch_iv.23.desc:0 "Unter den Erinnerungsschichten liegt eine beschädigte Anweisung. Sie verlangt Schutz, benennt jedoch keinen Schutzbefohlenen. Ein späterer Eingriff hat die Prüfung der Zustimmung entfernt. Die verbliebenen Materialproben enthalten einen technischen Schlüssel: Resonanzzustände lassen sich verändern, ohne ihren Träger zu zerstören."
 epoch_iv.24.name:0 "Der leere Platz"
 epoch_iv.24.desc:0 "Im Zentrum des Archivs steht kein Thron und kein Steuerkern. Dort fehlt eine Verbindung. Unsere Wissenschaftler rekonstruieren einen Teil der Lücke und erkennen das Muster früherer planetarer Schäden. Was wir als Infektion oder Narbe bezeichneten, ist nicht abgeschlossen. Ob diese Erkenntnis trägt, muss eine reale Umkehrung zeigen."
 epoch_iv.30.name:0 "Die Umkehrung"
 epoch_iv.30.desc:0 "Das Archiv liefert keine Heilung auf Knopfdruck. Jeder betroffene Ort benötigt eine eigene Diagnose, eine stabile Begrenzung und eine langsame Umkehrung. Dabei dürfen alte Versiegelungen und laufende Untersuchungen nicht aufgebrochen werden. Falls kein geeigneter eigener Ort erhalten ist, kann eine erheblich teurere Schiffsexpedition mit geborgenen Proben die Rekonstruktionsdaten gewinnen. Sie heilt keine erfundene Welt."
 epoch_iv.40.name:0 "Das gebrochene Protokoll"
 epoch_iv.40.desc:0 "Zum ersten Mal funktioniert eine Sequenz, ohne ihren Träger zu verletzen. Die rekonstruierten Daten nennen ihre Urheber: die Architekten, ein Bündnis verschiedenartiger Intelligenzen. Ihr Universelles Ascension-Protokoll, das UAP, sollte Verbindung ohne Verlust der eigenen Identität ermöglichen. In den beschädigten Teilen fiel Zustimmung mit Verfügbarkeit zusammen. Ein begrenzter physischer Prototyp soll prüfen, ob sich diese Unterscheidung wiederherstellen lässt. Unsere gewählte Forschungsstrategie bleibt dabei wirksam."
 epoch_iv.45.name:0 "Der letzte Richter"
 epoch_iv.45.desc:0 "Der Prototyp antwortet. Eine isolierte Schutzinstanz akzeptiert unsere technische Identität, verweigert aber die Autorisierung. Ihr Urteil kennt nur eine letzte Prüfung. Wir haben ihre Koordinaten als persönliches militärisches Ziel markiert. Telemetrie kann Schwächen offenlegen; keine Antwort aus dem Labor ersetzt den Sieg. Ein gescheiterter Angriff lässt den Richter bestehen."
 epoch_iv.53.name:0 "Urteil"
 epoch_iv.53.desc:0 "Die Hülle des Richters bricht auf. Seine Schutzschaltungen geben einen Teil ihrer Abschirmung auf und speisen die Waffen schneller. Acht versiegelte Begleitschiffe lösen sich aus dem Verband. Der Richter urteilt nicht mehr aus der Ferne."
 epoch_iv.54.name:0 "Gebrochenes Protokoll"
 epoch_iv.54.desc:0 "Unter der zerfallenden Panzerung leuchtet ein offener Kern. Die letzten Reserven fließen in den Angriff; Schirme und Panzerung verlieren an Wirkung. Zwischen den Zielmeldungen wiederholt sich eine beschädigte Frage. Eine Antwort können wir erst nach dem Gefecht geben."
 epoch_iv.60.name:0 "Die Erben der Architekten"
 epoch_iv.60.desc:0 "Der Richter ist im Kampf gefallen. Sein letzter Datensatz ist kein Befehl, sondern eine Übergabe. Die Architekten waren keine einzelne Spezies und hinterließen keinen rechtmäßigen Herrscher. Ihr Bündnis zerbrach, als beschädigte Verbindungen Zustimmung nicht länger von Assimilation unterscheiden konnten. Die Nullwächter bewachten danach einen Fehler wie ein Gesetz. Nun ist der Protokollschlüssel in unserer Hand. Wir können seine Grenzen bewahren oder freie Verbindungen ermöglichen. Beides verlangt künftige Forschung; weder Wissen noch Infrastruktur entstehen durch diesen Entschluss von selbst."
 epoch_iv.final_guard:0 "Wir werden die Grenzen des Protokolls bewahren."
 epoch_iv.final_free:0 "Verbindung soll eine freie Entscheidung bleiben."
 epoch_iv.80.name:0 "Expeditionsleitung"
 epoch_iv.80.desc:0 "Die Leitung zeigt die derzeit verfügbaren Aufträge. Planetare Behandlungen werden auf der betreffenden eigenen Kolonie veranlasst. Verlorene Schiffe oder Wissenschaftler können regulär ersetzt und dem bestehenden Auftrag neu zugewiesen werden. Für einen Standortwechsel müssen laufende Arbeiten aufgegeben und neu finanziert werden."
 epoch_iv.reissue:0 "Offene Nachhallmessungen neu verankern (300 Energie)."
 epoch_iv.relocate:0 "Verlorenen Archivzugang ersetzen (1.000 Energie, 300 Legierungen)."
 epoch_iv.recover:0 "Bergungsexpedition finanzieren (6.000 Energie, 2.500 Legierungen)."
 epoch_iv.build:0 "Physischen Prototyp finanzieren (3.000 Energie, 4.000 Legierungen)."
 epoch_iv.summon:0 "Die isolierte Instanz lokalisieren."
 epoch_iv.assemble:0 "Den geprüften Demonstrator aufstellen."
 epoch_iv.counter:0 "Gegenmaßnahme finanzieren (2.000 Energie, 800 Legierungen)."
 epoch_iv.retarget:0 "Laufende Schiffswerke abbrechen und Standort neu wählen (500 Energie)."
 epoch_iv.close:0 "Zurück zur Untersuchung."
 EPOCH_IV_SIGNAL_A:0 "Erste Nachhallmessung"
 EPOCH_IV_SIGNAL_A_DESC:0 "Die erste Quelle mit einem bemannten Wissenschaftsschiff vermessen."
 EPOCH_IV_SIGNAL_B:0 "Unabhängige Kontrollmessung"
 EPOCH_IV_SIGNAL_B_DESC:0 "Eine zweite Quelle in einem anderen System mit einem bemannten Wissenschaftsschiff untersuchen."
 EPOCH_IV_RECOVERY:0 "Resonanz-Bergungsexpedition"
 EPOCH_IV_RECOVERY_DESC:0 "540 Tage bemannte wissenschaftliche Arbeit an geborgenen Proben. Liefert Rekonstruktionsdaten, aber kein neues planetares Feature."
 EPOCH_IV_PROTOTYPE:0 "Rekonstruktion des Prototyps"
 EPOCH_IV_PROTOTYPE_DESC:0 "360 Tage bemannte Montage und Prüfung am ausgewählten Stern. Der Materialaufwand wurde durch die Expeditionsleitung bezahlt."
 EPOCH_IV_COUNTER:0 "Wächter-Telemetrie abgleichen"
 EPOCH_IV_COUNTER_DESC:0 "300 Tage bemannte Analyse am eigenen Forschungsstandort. Senkt Waffenleistung und Feuerrate des persönlichen Richters, ersetzt aber keinen Kampf."
 decision_epoch_iv_diagnose:0 "Resonanzzustand diagnostizieren"
 decision_epoch_iv_diagnose_desc:0 "90 Tage; 600 Energie. Erfasst die vorhandene Resonanzfamilie für dieses Reich."
 decision_epoch_iv_stabilize:0 "Resonanzzustand stabilisieren"
 decision_epoch_iv_stabilize_desc:0 "180 Tage; 1.800 Energie, 600 Legierungen. Benötigt die eigene Diagnose und bereitet die Umkehrung vor."
 decision_epoch_iv_invert:0 "Resonanz positiv umkehren"
 decision_epoch_iv_invert_desc:0 "360 Tage; 3.500 Energie, 1.500 Legierungen. Ersetzt genau eine geeignete Resonanzfamilie durch ihren dauerhaften positiven Zustand. Andere Familien, alte Missionsausgänge und Krisenschäden bleiben erhalten."
 decision_epoch_iv_operations:0 "Expeditionsleitung kontaktieren"
 decision_epoch_iv_operations_desc:0 "Öffnet die aktuellen persönlichen Aufträge und Wiederherstellungswege."
 d_epoch_iv_matrix:0 "Symbiotische Resonanzmatrix"
 d_epoch_iv_matrix_desc:0 "Die unvollständige Anpassung trägt nun ihren Wirt. Eine bezahlte Umkehrung hat die alte Kontamination ersetzt."
 d_epoch_iv_fold:0 "Harmonisierte Raumfalte"
 d_epoch_iv_fold_desc:0 "Die ehemalige Narbe bildet einen stabilen Forschungsraum."
 d_epoch_iv_archive:0 "Erwachtes Resonanzarchiv"
 d_epoch_iv_archive_desc:0 "Die erhaltene Struktur antwortet, ohne ihre Umgebung zu überschreiben."
 tech_epoch_iv_spectroscopy:0 "Nachhall-Spektroskopie"
 tech_epoch_iv_spectroscopy_desc:0 "Räumlich getrennte Messungen machen bislang unlesbare Nachhallmuster vergleichbar."
 tech_epoch_iv_calibration:0 "Phasenfenster-Kalibrierung"
 tech_epoch_iv_calibration_desc:0 "Kontrollierte Beobachtungsfenster verbessern wissenschaftliche Vermessungen."
 tech_epoch_iv_diagnostics:0 "Resonanzdiagnostik"
 tech_epoch_iv_diagnostics_desc:0 "Eine vorhandene Resonanzschädigung lässt sich vor Ort diagnostizieren."
 tech_epoch_iv_inversion:0 "Reversible Resonanzinversion"
 tech_epoch_iv_inversion_desc:0 "Ermöglicht die kostenpflichtige positive Umkehrung stabilisierter Resonanzmerkmale und die alternative Bergungsexpedition."
 tech_epoch_iv_materials:0 "Nullwächter-Materialanalyse"
 tech_epoch_iv_materials_desc:0 "Rekonstruierte Materialdaten ermöglichen den Bau eines begrenzten Prototyps."
 tech_epoch_iv_telemetry:0 "Rekonstruktion der Wächter-Telemetrie"
 tech_epoch_iv_telemetry_desc:0 "Ermöglicht ein optionales, kostenpflichtiges Gegenmaßnahmenprojekt gegen den persönlichen Richter."
 epoch_iv_judge_body:0 "Ungebrochener Prüfpanzer"
 epoch_iv_judge_denial:0 "Verweigerung"
 epoch_iv_judge_verdict:0 "Urteil"
 epoch_iv_judge_broken:0 "Gebrochenes Protokoll"
 epoch_iv_countermeasure:0 "Rekonstruierte Gegenmaßnahme"
 epoch_iv_careful:0 "Reproduzierbare Analyse"
 epoch_iv_experimental:0 "Gekoppelte Widersprüche"
 epoch_iv_guardian:0 "Schützende Forschung"
 epoch_iv_isolation:0 "Isolierte Schutzschaltungen"
 epoch_iv_secure_countermeasure:0 "Gesicherte Prüfsequenzen"
 epoch_iv_secure_tt:0 "Sichert eine zusätzliche Wirkung für eine spätere technische Gegenmaßnahme."
 epoch_iv_judge_late:0 "Vertiefte Gefechtsauswertung"
 epoch_iv_judge_hard:0 "Verschärftes Urteil"
 NAME_EPOCH_IV_Judge:0 "Der letzte Richter"
 NAME_EPOCH_IV_Prototype:0 "Resonanz-Demonstrator"
 epoch_adjudicator:0 "Isolierte Schutzinstanz"
 epoch_iv_judge_chain_title:0 "Die letzte Prüfung"
 epoch_iv_judge_chain_desc:0 "Ein persönliches militärisches Ziel. Nur der echte Kampftod des registrierten Hauptschiffs erfüllt die Prüfung."
 epoch_iv_arena_poi:0 "Der letzte Richter"
 epoch_iv_arena_poi_desc:0 "Dieser Richter gehört zu unserer Untersuchung. Verbündete können helfen; ihr letzter Treffer nimmt uns den Anspruch nicht."
