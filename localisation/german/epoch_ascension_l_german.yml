 EPOCH_IV_DEMONSTRATOR:0 "Die Rekonstruktion des Demonstrators"
 EPOCH_IV_DEMONSTRATOR_DESC:0 "Die geheilte Welt hat gezeigt, dass das Protokoll seinen Wirt erhalten kann. Nun müssen unsere Ingenieure aus den geborgenen Plänen eine Verbindung schaffen, die unterschiedliche Bewusstseine zusammenführt, ohne ihre Grenzen aufzulösen.\n\nDieses reichsweite Ingenieurforschungsprojekt benötigt weder einen Standort noch ein Wissenschaftsschiff. Nach Abschluss wird der physische Demonstrator errichtet und die nächste Prüfung beginnt. Die Materialanalyse verbessert unsere Ingenieurforschung, ist aber keine Voraussetzung."
