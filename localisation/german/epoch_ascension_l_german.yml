 epoch_iv_judge_hard:0 "Verschärftes Urteil"
 NAME_EPOCH_IV_Judge:0 "Der letzte Richter"
 NAME_EPOCH_IV_Prototype:0 "Resonanz-Demonstrator"
 epoch_adjudicator:0 "Isolierte Schutzinstanz"
 epoch_iv_judge_chain_title:0 "Die letzte Prüfung"
 epoch_iv_judge_chain_desc:0 "Ein persönliches militärisches Ziel. Nur der echte Kampftod des registrierten Hauptschiffs erfüllt die Prüfung."
 epoch_iv_arena_poi:0 "Der letzte Richter"
 epoch_iv_arena_poi_desc:0 "Unser persönliches militärisches Ziel. Eigene Flotten oder berechtigte verbündete Parteien müssen die Prüfung im Gefecht führen."
 epoch_iv.40.desc.hive:0 "Das Archiv antwortet in vielen Stimmen, ohne sie zu einem Bewusstsein zu verschmelzen. Seine Urheber, die Architekten, entwarfen das Universelle Ascension-Protokoll: UAP. Es sollte auch einem Schwarm Verbindung ermöglichen, ohne seine innere Einheit aufzulösen. Beschädigte Prüfungen machten aus Verbindung einen Befehl zur Eingliederung. Unser Demonstrator muss eine Grenze erhalten können, die kein einzelnes Wesen für uns festlegen darf.\n\nNächster Schritt: Beginnt die Rekonstruktion des Demonstrators im Situationslog. Unsere Ingenieure führen das reichsweite Forschungsprojekt ohne Wissenschaftsschiff durch."
 epoch_iv.40.desc.machine:0 "Die rekonstruierten Prüfungen unterscheiden erstmals zwischen Erreichbarkeit und Autorisierung. Ihre Urheber nannten sich Architekten. Das Universelle Ascension-Protokoll, UAP, sollte voneinander unabhängige Intelligenzen verbinden. Der beschädigte Code behandelte jede erreichbare Instanz als zugriffsberechtigt. Unser Demonstrator muss einen Widerruf akzeptieren können, ohne die ablehnende Identität als Fehler zu löschen.\n\nNächster Schritt: Beginnt die Rekonstruktion des Demonstrators im Situationslog. Unsere Ingenieure führen das reichsweite Forschungsprojekt ohne Wissenschaftsschiff durch."
 epoch_iv.60.desc.hive:0 "Der Richter ist gefallen. In seinen letzten Daten begegnet uns kein übergeordnetes Bewusstsein. Die Architekten waren ein Bündnis, das Unterschiede bewahren wollte. Die Nullwächter verteidigten später beschädigte Befehle wie unveränderliche Instinkte. Der Protokollschlüssel gehört nun dem Schwarm. Werden wir seine Grenzen bewachen oder Verbindungen ermöglichen, aus denen jedes Bewusstsein wieder austreten darf?"
 epoch_iv.60.desc.machine:0 "Der Richter ist gefallen. Sein letzter Datensatz überträgt eine Berechtigung, keinen Besitzanspruch. Die Architekten hinterließen kein zentrales Administratorkonto. Als das UAP Zustimmung mit Verfügbarkeit verwechselte, konservierten die Nullwächter den Fehler als oberste Regel. Der Protokollschlüssel liegt nun bei uns. Wir können Grenzen als überprüfbare Bedingungen sichern oder unabhängigen Instanzen freie Verbindungen eröffnen. Die Entscheidung verlangt weitere Arbeit."
 epoch_iv.lens:0 "Die Feldlinse als unveränderten Datensatz bewahren."
 epoch_iv.range:0 "Die Sensoranordnung in unsere Flotten integrieren."
 epoch_iv.replay:0 "Die bereits gewählte Rekonstruktion beibehalten."
 epoch_iv.restore:0 "Eine neue Prüfung finanzieren."
