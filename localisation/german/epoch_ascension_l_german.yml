 epoch_iv_ascension_monthly_change_tooltip:0 "Der Abschluss des aktuellen Auftrags führt weiter. Warten allein bringt die Untersuchung nicht voran."



 epoch_iv.46.name:0 "Ein unbeantwortetes Urteil"

 epoch_iv.46.desc:0 "Der Richter ist verschwunden, doch ein belegbarer Sieg wurde nicht geborgen. Wir können seinen Protokollschlüssel nicht beanspruchen. Die Expeditionsleitung kann die Prüfung für 2.000 Energie und 4.000 Legierungen höchstens zweimal rekonstruieren. Der Ersatz muss im Kampf besiegt werden."

 epoch_iv.diagnose.tt:0 "Erfasst das betroffene Merkmal und ermöglicht seine Stabilisierung. Belastungen bleiben zunächst bestehen. Dauer: 90 Tage; Kosten: 600 Energie."

 epoch_iv.stabilize.tt:0 "Sichert das diagnostizierte Merkmal für die Inversion. Die Vorbereitung allein gewährt keinen Produktionsbonus. Dauer: 180 Tage; Kosten: 1.800 Energie und 600 Legierungen."

 epoch_iv.invert.tt:0 "Ersetzt das diagnostizierte, stabilisierte Merkmal durch seine geheilte Form und entfernt zugehörige Belastungen. Unabhängige Notfallschäden bleiben bestehen. Dauer: 360 Tage; Kosten: 3.500 Energie und 1.500 Legierungen."

