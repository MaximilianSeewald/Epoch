 epoch_iv_escort_body_desc:0 "Ein begrenztes Verteidigungskontingent des Richters."
 epoch_iv.positive.matrix:0 "Geheiltes Merkmal: +10% Ressourcen durch Arbeitsplätze, +5 Stabilität und +5% Bewohnbarkeit."
 epoch_iv.positive.fold:0 "Geheiltes Merkmal: +15% Physik-, Gesellschafts- und Ingenieursforschung durch Arbeitsplätze sowie +5 Stabilität."
