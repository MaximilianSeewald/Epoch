 ap_epoch_guard:0 "Erbe der Nullwächter"
 ap_epoch_guard_desc:0 "Wir vertiefen die bereits nach dem Richterkampf gewählte Philosophie. Diese Wahl eröffnet keine neue Gegenphilosophie. Protokollgeprägt wird über Speziesmodifikation verfügbar."
