 decision_epoch_c_symbiotic_world:0 "Symbiotische Weltentwicklung"
 decision_epoch_c_symbiotic_world_desc:0 "Eine bereits harmonisierte Welt erhält dauerhafte Symbiose: +10 % Ressourcen aus Tätigkeiten und +5 % Bewohnbarkeit. Kostet Energie, Legierungen und Protokollkerne."
