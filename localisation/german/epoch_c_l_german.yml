 trait_epoch_imprinted:0 "Protokollgeprägt"
 trait_epoch_imprinted_desc:0 "Ein Protokoll, das die Eigenart seiner Träger bewahrt: Maschinen erhalten +5 % Arbeitskraft, Schwärme -15 % Annehmlichkeitsverbrauch (Wilderness stattdessen +10 % Bewohnbarkeit) und organische Individuen +10 % Forscher-Arbeitskraft."
