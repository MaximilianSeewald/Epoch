l_german:
 tradition_epoch_legacy:0 "Das Vermächtnis"
 tradition_epoch_legacy_desc:0 "Unser Erbe ist unvollständig. Wir müssen lernen, seine Fragmente zu erforschen, mit ihnen zu bauen und Verantwortung für ihre Nutzung zu tragen."
 tr_epoch_legacy_adopt:0 "Das Vermächtnis - Adoption"
 tr_epoch_legacy_adopt_desc:0 "Der persönliche Schlüssel gewährt Zugang; gemeinsame Methoden machen ihn nutzbar. Unabhängige Disziplinen können Befunde vergleichen, die zuvor unlesbar blieben."
 tr_epoch_legacy_finish:0 "Das Vermächtnis - Abschluss"
 tr_epoch_legacy_finish_desc:0 "Rekonstruktion ist unsere eigene Disziplin geworden. Wir können gewaltige Strukturen schneller errichten und eine weitere Aufstiegswahl erschließen, ohne unser Urteil der Vergangenheit zu überlassen."
 tr_epoch_legacy_chronicles:0 "Fragmentierte Chroniken"
 tr_epoch_legacy_chronicles_desc:0 "Widersprüchliche Berichte stehen in unseren Chroniken nebeneinander. Eine gemeinsame Geschichte braucht keine einheitliche Stimme; diese Erkenntnis stärkt unseren Zusammenhalt."
 tr_epoch_legacy_reconstruction:0 "Gesicherte Rekonstruktion"
 tr_epoch_legacy_reconstruction_desc:0 "Wir bewahren Baufolgen, die sich sicher wiederholen lassen. Gebäude benötigen weniger vergeudetes Material, wenn jeder fehlgeschlagene Aufbau uns etwas lehren kann."
 tr_epoch_legacy_discipline:0 "Kausale Disziplin"
 tr_epoch_legacy_discipline_desc:0 "Eine überzeugende Antwort muss Alternativen standhalten. Unsere Forschungseinrichtungen halten mehr konkurrierende Untersuchungsansätze offen, bevor sie sich auf eine Entdeckung festlegen."
 tr_epoch_legacy_harmonization:0 "Operative Harmonisierung"
 tr_epoch_legacy_harmonization_desc:0 "Resonanz ist dort am sichersten, wo örtliche Bedürfnisse den größeren Entwurf korrigieren können. Verlässliche Rückmeldungen stabilisieren unsere Welten, ohne sie einander anzugleichen."
 tr_epoch_legacy_wardens:0 "Erbe der Nullwächter"
 tr_epoch_legacy_wardens_desc:0 "Die Nullwächter bewahrten Befehle, lange nachdem ihr Sinn verloren war. Wir übernehmen ihre Wachsamkeit und unterstellen eine größere Flotte einer Verantwortung, die wir selbst bestimmen."
 tradition_epoch_symbiosis:0 "Symbiotische Transzendenz"
 tradition_epoch_symbiosis_desc:0 "Lebende Körper müssen nicht gleich werden, um eine Zukunft zu teilen. Resonanz ermöglicht bewusste biologische Veränderung, in der jedes Individuum ein eigenes Selbst bleibt."
 tr_epoch_symbiosis_adopt:0 "Symbiotische Transzendenz - Adoption"
 tr_epoch_symbiosis_adopt_desc:0 "Wir beginnen an der Grenze zwischen Körper und Umwelt. Kontrollierte Resonanz hilft lebendem Gewebe, Bedingungen zu ertragen, die eine Welt einst unwirtlich machten."
 tr_epoch_symbiosis_finish:0 "Symbiotische Transzendenz - Abschluss"
 tr_epoch_symbiosis_finish_desc:0 "Wir verändern Lebensformen, ohne sie als austauschbare Entwürfe zu behandeln. Weitere biologische und lithoide Anpassungen sowie eine zusätzliche Aufstiegswahl werden möglich."
 tr_epoch_symbiosis_adaptation:0 "Perfekte Adaptation"
 tr_epoch_symbiosis_adaptation_desc:0 "Anpassung wartet nicht länger auf Generationen blinder Auslese. Bewusst gewählte physiologische Reaktionen erlauben unserer Bevölkerung, vielfältigere Umwelten zu bewohnen."
 tr_epoch_symbiosis_architecture:0 "Lebende Architektur"
 tr_epoch_symbiosis_architecture_desc:0 "Reaktionsfähige Bauten wachsen um ihre Bewohner. Ihr Aufbau benötigt weniger Zeit, ohne das Leben in ihnen vorzugeben."
 tr_epoch_symbiosis_regeneration:0 "Regenerative Symbiose"
 tr_epoch_symbiosis_regeneration_desc:0 "Lebende Schutzsysteme verteilen Verletzungen auf widerstandsfähige Gewebe. Unsere Armeen ertragen größere Belastungen, bevor Wunden unumkehrbar werden."
 tr_epoch_symbiosis_evolution:0 "Bewusste Evolution"
 tr_epoch_symbiosis_evolution_desc:0 "Wachstum wird zu einer bewussten Beziehung zwischen Bevölkerung und Umwelt. Wo die Bedingungen es zulassen, hilft Resonanz neuem Leben, Fuß zu fassen."
 tr_epoch_symbiosis_sovereignty:0 "Organische Souveränität"
 tr_epoch_symbiosis_sovereignty_desc:0 "Keine Verwandlung ist vollendet, wenn ihre Träger sich selbst nicht mehr erkennen. Achtung vor körperlicher Identität gibt unserer Bevölkerung mehr Vertrauen in ihr verändertes Leben."
 tradition_epoch_convergence:0 "Schwarmkonvergenz"
 tradition_epoch_convergence_desc:0 "Das Ganze kann mehr wahrnehmen, ohne den eigenen Gedanken zu übertönen. Resonanz verbindet ferne Wahrnehmungen zu einem weiteren Bewusstsein, getragen von beweglichen Körpern oder einer lebenden Landschaft."
 tr_epoch_convergence_adopt:0 "Schwarmkonvergenz - Adoption"
 tr_epoch_convergence_adopt_desc:0 "Wir unterscheiden den zurückkehrenden Nachhall vom eigenen Impuls. Gemeinsame Wahrnehmung wird klarer und stärkt den Zusammenhalt des Kollektivs."
 tr_epoch_convergence_finish:0 "Schwarmkonvergenz - Abschluss"
 tr_epoch_convergence_finish_desc:0 "Wir verändern die Formen, die uns tragen, und bewahren dabei die Kontinuität des Ganzen. Weitere biologische und lithoide Anpassungen sowie eine zusätzliche Aufstiegswahl werden möglich."
 tr_epoch_convergence_expansion:0 "Neuronale Expansion"
 tr_epoch_convergence_expansion_desc:0 "Die Erinnerung an einen Bedarf reist weiter als der Rohstoff selbst. Erweiterte Reserven erlauben dem Kollektiv, größere Vorräte für die Bedürfnisse seiner fernen Ausläufer zu halten."
 tr_epoch_convergence_drones:0 "Resonante Drohnen"
 tr_epoch_convergence_drones_desc:0 "Jeder arbeitende Körper spürt den Rhythmus der anderen. Zwischen Absicht und Handlung gehen weniger Impulse verloren; unsere Drohnen erwirtschaften mehr."
 tr_epoch_convergence_nodes:0 "Autonome Knoten"
 tr_epoch_convergence_nodes_desc:0 "Örtliche Knoten lösen Störungen, bevor sie das Ganze durchlaufen. Unsere Welten bleiben stabiler, wenn nicht jede Abweichung die Aufmerksamkeit des gesamten Bewusstseins beansprucht."
 tr_epoch_convergence_adaptation:0 "Synchronisierte Anpassung"
 tr_epoch_convergence_adaptation_desc:0 "Wir spüren eine Welt durch viele Sinne zugleich. Abgestimmte Anpassung macht ihre Umwelten verträglicher und senkt die Kosten ihrer Umgestaltung."
 tr_epoch_convergence_consciousness:0 "Ungeteiltes Bewusstsein"
 tr_epoch_convergence_consciousness_desc:0 "Entfernung unterbricht nicht länger den Rhythmus einer Feuerlösung. Unsere Schiffe handeln aus einer gemeinsamen Wahrnehmung des Gefechts und setzen ihre Waffen rascher ein."
 tradition_epoch_network:0 "Souveränes Netzwerk"
 tradition_epoch_network_desc:0 "Ein Netzwerk ist souverän, solange es die Regeln seiner Verbindungen prüfen kann. Überprüfbare Anweisungen und verteilte Kontrolle stellen Resonanz in den Dienst eigenständiger Maschinenidentität."
 tr_epoch_network_adopt:0 "Souveränes Netzwerk - Adoption"
 tr_epoch_network_adopt_desc:0 "Jede neu montierte Einheit erhält einen überprüften Platz in unserem Netzwerk. Verlässliche Einbindung lässt unsere Montagesysteme rascher wachsen."
 tr_epoch_network_finish:0 "Souveränes Netzwerk - Abschluss"
 tr_epoch_network_finish_desc:0 "Wir gestalten unsere Maschinenformen nach eigenen Regeln um. Erweiterte Anpassungsmöglichkeiten und eine zusätzliche Aufstiegswahl machen Souveränität zu einer dauerhaften Praxis."
 tr_epoch_network_correction:0 "Selbstkorrigierende Systeme"
 tr_epoch_network_correction_desc:0 "Wir verfolgen Verschwendung bis zu ihrer Quelle, statt sie hinter redundanten Anfragen zu verbergen. Arbeitsprozesse verbrauchen weniger Ressourcen, wenn Korrekturen unter unserer Kontrolle bleiben."
 tr_epoch_network_intelligence:0 "Verteilte Intelligenz"
 tr_epoch_network_intelligence_desc:0 "Unabhängige Analysen bewahren ihre Unterschiede, bis die Belege sie auflösen. Verteilte Prüfung beschleunigt Forschung, ohne einem fremden Signal Macht über unsere Schlüsse zu geben."
 tr_epoch_network_architecture:0 "Rekursive Architektur"
 tr_epoch_network_architecture_desc:0 "Bausysteme prüfen kleinere Baugruppen, während der größere Entwurf Gestalt annimmt. Dieses rekursive Verfahren verkürzt die planetare Bauzeit."
 tr_epoch_network_independence:0 "Protokoll-Unabhängigkeit"
 tr_epoch_network_independence_desc:0 "Jede externe Anweisung muss eine Grenze passieren, die wir prüfen können. Örtliche Kontrolle bleibt verlässlich, auch wenn eine ferne Quelle widersprüchliche Forderungen sendet."
 tr_epoch_network_sovereignty:0 "Nullwächter-Souveränität"
 tr_epoch_network_sovereignty_desc:0 "Unsere Flotten behalten nur Abhängigkeiten, die sie warten und prüfen können. Der Abbau überlieferter Redundanzen senkt den Schiffsunterhalt, ohne die Befehlsgewalt abzugeben."
 ap_epoch_living:0 "Lebendiger Aufstieg"
 ap_epoch_living_desc:0 "Unsere Körper können sich verändern, ohne unsere Identitäten austauschbar zu machen. Der Lebendige Aufstieg stärkt unsere Arbeitskraft und erschließt Resonante Physiologie sowie Symbiotische Intelligenz über Speziesvorlagen und finanzierte Anpassungsprojekte."
 ap_epoch_hive:0 "Ein Bewusstsein, tausend Möglichkeiten"
 ap_epoch_hive_desc:0 "Tausend Formen tragen einen ununterbrochenen Gedanken. Der Schwarm vertieft Produktionskoordination und Flottenkapazität; eine lebende Wildnis beschleunigt stattdessen den Megastrukturbau. Konvergente Drohnen werden über Speziesvorlagen und finanzierte Anpassungsprojekte verfügbar."
 ap_epoch_machine:0 "Das souveräne Protokoll"
 ap_epoch_machine_desc:0 "Wir werden ein gültiges Signal nie wieder mit einem rechtmäßigen Befehl verwechseln. Schnellere Montage und koordiniertes Flottenfeuer dienen einem Netzwerk, das seine Autorität selbst bestimmt. Der Nullwächter-Kern wird über Speziesvorlagen und finanzierte Anpassungsprojekte verfügbar."
 ap_epoch_guard:0 "Erbe der Nullwächter"
 ap_epoch_guard_desc:0 "Wir stehen für die Grenzen ein, deren Schutz wir gewählt haben. Größere Flottenkapazität und stärkeres Feuer im eigenen Raum geben dieser Pflicht Gewicht, bei erhöhtem Schiffsunterhalt. Protokollgeprägt wird durch bezahlte Speziesanpassung verfügbar. Unsere persönliche Wächterentscheidung bleibt bindend."
 ap_epoch_free:0 "Freie Konvergenz"
 ap_epoch_free_desc:0 "Eine Verbindung muss etwas bleiben, das ihre Teilnehmer verlassen dürfen. Wir vertiefen unsere gewählte Philosophie durch schnellere Forschung, günstigere Terraformung und sparsamere Arbeit. Protokollgeprägt wird durch bezahlte Speziesanpassung verfügbar. Unsere persönliche Entscheidung für freie Konvergenz bleibt bindend."
 trait_epoch_physiology:0 "Resonante Physiologie"
 trait_epoch_physiology_desc:0 "Resonante Gewebe reagieren auf Umweltbelastung, bevor dauerhafte Schäden entstehen. Der Körper verträgt unwirtlichere Lebensräume und widersteht Verletzungen besser."
 trait_epoch_intelligence:0 "Symbiotische Intelligenz"
 trait_epoch_intelligence_desc:0 "Denken und Resonanz bilden einen wechselseitigen Austausch, ohne getrennte Persönlichkeiten zu verschmelzen. Diese Geister entfalten mehr wissenschaftliche Arbeitskraft in Forschungs- und Kohärenzlaboren."
 trait_epoch_drones:0 "Konvergente Drohnen"
 trait_epoch_drones_desc:0 "Lebende Formen teilen sensorische Anpassungen im Kollektiv. Ihre Arbeit wird wirksamer, ihre Umweltverträglichkeit steigt; Schwarmdrohnen benötigen zudem weniger Annehmlichkeiten. Dieselbe Anpassung kann das verteilte Leben einer Wildnis durchziehen."
 trait_epoch_core:0 "Nullwächter-Kern"
 trait_epoch_core_desc:0 "Ein rekonstruierter Schutzkern prüft eingehende Forderungen an der Identität seines Trägers. Schlankere Koordination steigert die Arbeitskraft der Maschinen und senkt ihren Bedarf an Annehmlichkeiten."
 trait_epoch_imprinted:0 "Protokollgeprägt"
 trait_epoch_imprinted_desc:0 "Das Protokoll wird als Grenze des Selbst getragen: im lebenden Denken, in kollektiver Wahrnehmung oder in geprüfter Maschinenidentität. Maschinen erhalten +5% Arbeitskraft; Schwärme benötigen 15% weniger Annehmlichkeiten; die Wildnis erhält +10% Bewohnbarkeit; organische Individuen erhalten +10% wissenschaftliche Arbeitskraft in Forschungs- und Kohärenzlaboren."
 epoch_nexus_1:0 "Erstes Erwachen (Stufe 1/3)"
 epoch_nexus_1_DESC:0 "Die ersten Instrumente halten ein Resonanzfeld für dauerhafte Forschung in allen drei Disziplinen stabil. Ein kleiner Protokollkernüberschuss trägt weitere Arbeiten; Harmonisierung beginnt mit bescheidenen Verbesserungen bei planetarer Stabilität und Terraformung. Der Besitz mehrerer Nexusse setzt ihre Vorteile aus, bis überschüssige Anlagen demontiert sind."
 epoch_nexus_1_MEGASTRUCTURE_DETAILS:0 "$epoch_nexus_1_DESC$"
 epoch_nexus_1_CONSTRUCTION_INFO_DELAYED:0 "$epoch_nexus_1_DESC$"
 epoch_nexus_2:0 "Chor der Erinnerung (Stufe 2/3)"
 epoch_nexus_2_DESC:0 "Verbundene Beobachtungskammern vergleichen unterschiedliche Aufzeichnungen, ohne sie in einen einzigen Bericht zu zwingen. Forschung und Protokollkernüberschuss steigen; stärkere Harmonisierung festigt unsere Welten und senkt die Terraformungskosten weiter. Der Besitz mehrerer Nexusse setzt ihre Vorteile aus, bis überschüssige Anlagen demontiert sind."
 epoch_nexus_2_MEGASTRUCTURE_DETAILS:0 "$epoch_nexus_2_DESC$"
 epoch_nexus_2_CONSTRUCTION_INFO_DELAYED:0 "$epoch_nexus_2_DESC$"
 epoch_nexus_3:0 "Bewusstsein der Architekten (Stufe 3/3)"
 epoch_nexus_3_DESC:0 "Der vollendete Nexus trägt einen Chor unvereinbarer Modelle, ohne ihre Unterschiede auszulöschen. Volle Forschungskapazität, ein größerer Kernüberschuss und die stärkste Harmonisierung machen die geborgene Architektur zu unserem eigenen Instrument der Entdeckung. Der Besitz mehrerer Nexusse setzt ihre Vorteile aus, bis überschüssige Anlagen demontiert sind."
 epoch_nexus_3_MEGASTRUCTURE_DETAILS:0 "$epoch_nexus_3_DESC$"
 epoch_nexus_3_CONSTRUCTION_INFO_DELAYED:0 "$epoch_nexus_3_DESC$"
 epoch_forge_1:0 "Funke der Architekten (Stufe 1/3)"
 epoch_forge_1_DESC:0 "Die ersten Fertigungskammern binden Resonanz in industriell nutzbare Materie. Energie und Mineralien speisen eine arbeitende Quelle für Legierungen und Protokollkerne. Schon die erste Stufe trägt einen Teil unserer industriellen Versorgung."
 epoch_forge_1_MEGASTRUCTURE_DETAILS:0 "$epoch_forge_1_DESC$"
 epoch_forge_1_CONSTRUCTION_INFO_DELAYED:0 "$epoch_forge_1_DESC$"
 epoch_forge_2:0 "Sternenschmelze (Stufe 2/3)"
 epoch_forge_2_DESC:0 "Parallele Gießereiringe halten instabile Zwischenformen getrennt, bis sie sicher verbunden werden können. Der Ausstoß an Legierungen und Protokollkernen verdoppelt sich, ebenso der nötige Einsatz an Energie und Mineralien."
 epoch_forge_2_MEGASTRUCTURE_DETAILS:0 "$epoch_forge_2_DESC$"
 epoch_forge_2_CONSTRUCTION_INFO_DELAYED:0 "$epoch_forge_2_DESC$"
 epoch_forge_3:0 "Schöpfungstiegel (Stufe 3/3)"
 epoch_forge_3_DESC:0 "Der vollendete Schmelztiegel führt die Fertigung aus einzelnen Kammern in einen stetigen industriellen Fluss. Er erreicht den höchsten Ausstoß der Baureihe an Legierungen und Protokollkernen, getragen von gewaltigen Energie- und Mineralienlieferungen."
 epoch_forge_3_MEGASTRUCTURE_DETAILS:0 "$epoch_forge_3_DESC$"
 epoch_forge_3_CONSTRUCTION_INFO_DELAYED:0 "$epoch_forge_3_DESC$"
 epoch_uap_1:0 "Offene Schwelle (Stufe 1/4)"
 epoch_uap_1_DESC:0 "Ein schmaler Kanal öffnet sich unter unserer Autorisierung. Wächter erhalten Legierungsnachschub, Flottenkapazität und defensive Feuerkoordination; freie Reiche gewinnen Forschung, Einigkeit und effizientere Terraformung. Schon diese erste Verbindung benötigt Energie und Protokollkerne. Es gilt ausschließlich die persönlich gewählte Philosophie. Mehrere Interfaces setzen ihre Vorteile aus, bis überschüssige Anlagen demontiert sind."
 epoch_uap_1_MEGASTRUCTURE_DETAILS:0 "$epoch_uap_1_DESC$"
 epoch_uap_1_CONSTRUCTION_INFO_DELAYED:0 "$epoch_uap_1_DESC$"
 epoch_uap_2:0 "Resonanzbrücke (Stufe 2/4)"
 epoch_uap_2_DESC:0 "Der Kanal weitet sich zu einer stabilen Brücke. Unsere gewählte Rolle verdoppelt ihren Umfang: stärkere Flottenversorgung und Raumverteidigung für Wächter oder vertiefter wissenschaftlicher Austausch und günstigere Terraformung für freie Reiche. Der Betriebsbedarf wächst mit dieser Reichweite. Es gilt ausschließlich die persönlich gewählte Philosophie. Mehrere Interfaces setzen ihre Vorteile aus, bis überschüssige Anlagen demontiert sind."
 epoch_uap_2_MEGASTRUCTURE_DETAILS:0 "$epoch_uap_2_DESC$"
 epoch_uap_2_CONSTRUCTION_INFO_DELAYED:0 "$epoch_uap_2_DESC$"
 epoch_uap_3:0 "Rat der Horizonte (Stufe 3/4)"
 epoch_uap_3_DESC:0 "Getrennte Kanäle tragen einen Austausch, ohne in einer einzigen Autorität aufzugehen. Der dritte Ausbau stärkt unsere gewählte defensive oder wissenschaftliche Rolle erneut, mit mehr Legierungsnachschub oder Forschung und Einigkeit, bei höherem Energie- und Kernunterhalt. Es gilt ausschließlich die persönlich gewählte Philosophie. Mehrere Interfaces setzen ihre Vorteile aus, bis überschüssige Anlagen demontiert sind."
 epoch_uap_3_MEGASTRUCTURE_DETAILS:0 "$epoch_uap_3_DESC$"
 epoch_uap_3_CONSTRUCTION_INFO_DELAYED:0 "$epoch_uap_3_DESC$"
 epoch_uap_4:0 "Souveräner Kosmos (Stufe 4/4)"
 epoch_uap_4_DESC:0 "Bei voller Reichweite bleibt das Interface seinem Besitzer verantwortlich. Wächter tragen ihre größte Flottenkapazität und Feuerunterstützung im eigenen Raum; freie Reiche ihre stärksten Forschungs- und Terraformungsvorteile. Diese vollendete Verbindung verlangt den höchsten Energie- und Kerneinsatz der Baureihe. Es gilt ausschließlich die persönlich gewählte Philosophie. Mehrere Interfaces setzen ihre Vorteile aus, bis überschüssige Anlagen demontiert sind."
 epoch_uap_4_MEGASTRUCTURE_DETAILS:0 "$epoch_uap_4_DESC$"
 epoch_uap_4_CONSTRUCTION_INFO_DELAYED:0 "$epoch_uap_4_DESC$"
 decision_epoch_c_symbiotic_world:0 "Symbiotische Weltentwicklung"
 decision_epoch_c_symbiotic_world_desc:0 "Eine bereits harmonisierte Welt vertieft die freiwillige Verbindung zwischen Bevölkerung und Resonanznetz."
 epoch_c_symbiotic_world:0 "Symbiotische Welt"
 epoch_c_symbiotic_world_desc:0 "Freiwillige Resonanzanpassung ergänzt die abgeschlossene Harmonisierung."
 tr_epoch_convergence_drones_wilderness:0 "Resonante Lebensnetze"
 tr_epoch_convergence_drones_wilderness_desc:0 "Unsere lebenden Landschaften dehnen ihre Koordination über die Atmosphäre hinaus aus. Gewaltige Orbitalstrukturen entstehen schneller, während das gesamte Ökosystem ihren Aufbau trägt."
 tr_epoch_convergence_nodes_wilderness:0 "Autonome Wurzelknoten"
 tr_epoch_convergence_nodes_wilderness_desc:0 "Wurzeln und ferne Auswüchse tauschen örtliche Bedürfnisse aus, ohne auf einen zentralen Impuls zu warten. Planetare Bauten entwickeln sich schneller im lebenden Gelände."
 decision_epoch_c_network_inversion:0 "Netzgestützte Resonanzinversion"
 decision_epoch_c_network_inversion_desc:0 "Ein aktiver Resonanz-Nexus oder ein freies UAP-Interface unterstützt die Behandlung einer diagnostizierten und stabilisierten Welt. Das freie Interface senkt die Kosten weiter."
 epoch_c_network_inversion_effect:0 "Wandelt ein diagnostiziertes und stabilisiertes Resonanzmerkmal in seinen harmonisierten Endzustand um. Laufende Untersuchungen müssen zuvor abgeschlossen werden."
