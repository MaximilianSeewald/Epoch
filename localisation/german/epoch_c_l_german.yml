 ap_epoch_living:0 "Lebende Ascension"
 ap_epoch_living_desc:0 "Ein freiwilliger, klassenverträglicher Aufstieg. Neue Merkmale werden über Speziesvorlagen und bezahlte Modifikationsprojekte angewendet; bestehende Aufstiege bleiben erhalten."
