l_german:
 epoch_echoes.2.name:0 "Ein Signal ohne Ursprung"
 epoch_echoes.2.desc:0 "Aus dem kartografierten System dringt ein wiederkehrender Impuls. Sein Rhythmus erinnert an den Notruf eines Forschungsschiffs, doch auf unsere Anfrage meldet sich kein Register. Die Spur ist schwach, aber stabil genug, um ihr zu folgen."
 epoch_echoes.2.a:0 "Ein Wissenschaftsschiff soll die Spur verfolgen"
 epoch_echoes.2.b:0 "Das Signal verklingen lassen"
 epoch_echoes.3.name:0 "Das stille Schiff"
 epoch_echoes.3.desc:0 "Der Notruf führt zu einem verlassenen Forschungsschiff. Einschläge haben den Rumpf gezeichnet, doch Teile des Archivs sind noch aktiv. Wir können die Systeme isolieren und die Daten langsam auslesen oder den beschädigten Kern gewaltsam öffnen, bevor er endgültig versagt."
 epoch_echoes.3.a:0 "Die Aufzeichnungen vorsichtig bergen"
 epoch_echoes.3.b:0 "Den Kern gewaltsam öffnen"
 epoch_echoes.5.name:0 "Eine Stimme im Rauschen"
 epoch_echoes.5.desc:0 "Das geborgene Archiv verzeichnet Versorgungslager entlang der letzten Route des Schiffs. Einige Behälter könnten noch intakt sein. Die wissenschaftlichen Aufzeichnungen geben unserer Forschung zudem einen vorübergehenden Ansatzpunkt."
 epoch_echoes.5.a:0 "Dem Frachtverzeichnis folgen"
 epoch_echoes.8.name:0 "Instabile Aufzeichnungen"
 epoch_echoes.8.desc:0 "Die gewaltsame Bergung hat das Schiffsarchiv in widersprüchliche Zustände versetzt. Ein Wissenschaftsteam kann den instabilen Datensatz isolieren und die verbliebenen Informationen sichern. Ohne Eingriff wäre der Fund verloren."
 epoch_echoes.8.a:0 "Die Daten stabilisieren"
 epoch_echoes.10.name:0 "Aus dem Takt geratene Kolonie"
 epoch_echoes.10.desc:0 "Auf einer unserer Kolonien geraten die Produktionsabläufe aus dem Takt. Die örtlichen Arbeitskräfte berichten von einem tiefen Vibrieren unter der Oberfläche. Die Störung breitet sich bislang nicht aus, beeinträchtigt die Arbeit aber bereits."
 epoch_echoes.10.a:0 "Die verfügbaren Maßnahmen prüfen"
 epoch_echoes.6.name:0 "Das letzte Relais"
 epoch_echoes.6.desc:0 "In einem unserer untersuchten Systeme wurde ein verlassenes Relais entdeckt. Seine ruhenden Instrumente antworten noch immer auf einen fernen Impuls. Ein Verteidigungsnetz schützt den Steuerkern. Ein Forschungsschiff könnte seine verbliebenen Sicherungen kartieren."
 epoch_echoes.6.a:0 "Das Relais untersuchen"
 epoch_echoes.7.name:0 "Eine bewachte Verbindung"
 epoch_echoes.7.desc:0 "Das Verteidigungsnetz hat unser Schiff erkannt. Wir können die verbliebene Wache in einem echten Gefecht stellen oder die Steuerverbindungen kartieren und das Netz von einem Wissenschaftsschiff aus abschalten."
 epoch_echoes.7.a:0 "Die Verteidiger angreifen"
 epoch_echoes.7.b:0 "Einen technischen Weg suchen"
 epoch_echoes.9.name:0 "Das gesicherte Relais"
 epoch_echoes.9.desc:0 "Das Relais ist gesichert. Seine Instrumente können einen kleinen Horchposten unterstützen, solange wir seine Energieversorgung aufrechterhalten. Stattdessen könnten wir die Maschinen zu Legierungen zerlegen oder die Station dauerhaft stilllegen."
 epoch_echoes.9.a:0 "Relais aktivieren"
 epoch_echoes.9.b:0 "Die Station ausschlachten"
 epoch_echoes.9.c:0 "Dauerhaft stilllegen"
 EPOCH_ECHOES_GHOST_TRACE:0 "Dem wiederkehrenden Signal folgen"
 EPOCH_ECHOES_GHOST_TRACE_DESC:0 "Ein bemanntes Wissenschaftsschiff folgt dem Impuls zu einem verlassenen Forschungsschiff."
 EPOCH_ECHOES_GHOST_CAUTIOUS:0 "Vorsichtige Bergung des Archivs"
 EPOCH_ECHOES_GHOST_CAUTIOUS_DESC:0 "Ein längerer, risikoarmer Versuch, die verbliebenen Aufzeichnungen des Schiffs zu isolieren."
 EPOCH_ECHOES_GHOST_FORCED:0 "Gewaltsame Bergung des Archivs"
 EPOCH_ECHOES_GHOST_FORCED_DESC:0 "Eine schnelle Bergung, die Energie und Legierungen kostet und das Archiv destabilisieren kann."
 EPOCH_ECHOES_GHOST_STABILIZE:0 "Das beschädigte Archiv stabilisieren"
 EPOCH_ECHOES_GHOST_STABILIZE_DESC:0 "Ein Wissenschaftsschiff isoliert nach der gewaltsamen Bergung die instabilen Aufzeichnungen."
 EPOCH_ECHOES_RELAY_SURVEY:0 "Das alte Relais untersuchen"
 EPOCH_ECHOES_RELAY_SURVEY_DESC:0 "Ein bemanntes Wissenschaftsschiff kartiert Verteidigung und Steuerverbindungen des Relais."
 EPOCH_ECHOES_RELAY_DEFUSE:0 "Das Verteidigungsnetz kartieren"
 EPOCH_ECHOES_RELAY_DEFUSE_DESC:0 "Eine aufwendige wissenschaftliche Untersuchung soll das aktive Verteidigungsnetz abschalten."
 EPOCH_ECHOES_RELAY_DEFUSE_AIDED:0 "Die Resonanzspur nutzen"
 EPOCH_ECHOES_RELAY_DEFUSE_AIDED_DESC:0 "Frühere Entdeckungen zeigen einen kürzeren Weg durch die Steuerverbindungen des Relais."
 decision_epoch_echoes_recover:0 "Den beschädigten Produktionsrhythmus reparieren"
 decision_epoch_echoes_recover_desc:0 "Die durch die gescheiterte Ausbeutung verursachten Produktions- und Stabilitätsschäden reparieren."
 epoch_echoes_ghost_insight:0 "Geborgene Signalfragmente"
 epoch_echoes_ghost_insight_desc:0 "Das Archiv liefert der Physikforschung vorübergehend neue Hinweise."
 epoch_echoes_unquiet_organic:0 "Produktion aus dem Takt"
 epoch_echoes_unquiet_organic_desc:0 "Eine anhaltende Resonanz stört die Arbeitsabläufe dieser Kolonie."
 epoch_echoes_unquiet_hive:0 "Dissonante synaptische Zyklen"
 epoch_echoes_unquiet_hive_desc:0 "Ein wiederkehrender Impuls stört die koordinierte Arbeit der Drohnen."
 epoch_echoes_unquiet_machine:0 "Desynchronisierte Fertigung"
 epoch_echoes_unquiet_machine_desc:0 "Ein wiederkehrendes Signal stört die Fertigungsabläufe dieser Maschinenkolonie."
 epoch_echoes_unquiet_research:0 "Resonanzforschungsstation"
 epoch_echoes_unquiet_research_desc:0 "Die abgeschlossene Untersuchung verbessert die örtliche Physikforschung aus Arbeit."
 epoch_echoes_unquiet_surge:0 "Genutzte Resonanz"
 epoch_echoes_unquiet_surge_desc:0 "Eine kontrollierte Resonanz erhöht die örtliche Produktion vorübergehend."
 epoch_echoes_unquiet_backlash:0 "Resonanzrückschlag"
 epoch_echoes_unquiet_backlash_desc:0 "Eine gescheiterte Ausbeutung hat Produktion und Stabilität beeinträchtigt. Die beschädigten Anlagen müssen repariert werden."
 epoch_echoes_relay_active:0 "Aktives Relais"
 epoch_echoes_relay_active_desc:0 "Ein betriebener Horchposten. Seine Instrumente benötigen eine verlässliche Energieversorgung."
 NAME_EPOCH_Relay_Sentinels:0 "Relaiswächter"
 NAME_EPOCH_Relay_Defenders:0 "Ruhende Verteidiger"
 epoch_echoes.poi_relay:0 "Das letzte Relais"
 epoch_echoes.poi_relay.desc:0 "Ein altes Relais antwortet auf ein wiederkehrendes Signal."
 epoch_echoes_side_stories_title:0 "Echos in der Dunkelheit"
 epoch_echoes_side_stories_desc:0 "Optionale Entdeckungen am Rand unserer frühen Nachforschungen. Jede nimmt ihren eigenen Verlauf."
 epoch_echoes.11.name:0 "Den Rhythmus wiederherstellen"
 epoch_echoes.11.desc:0 "Die Störung lässt sich isolieren, unter kontrollierten Bedingungen erforschen oder für die Produktion anzapfen. Jeder Ansatz beansprucht örtliche Anlagen, bis die Arbeiten abgeschlossen sind. Ein Versuch, den Impuls auszunutzen, könnte bleibende Schäden verursachen."
 epoch_echoes.11.containment:0 "Die Störung isolieren"
 epoch_echoes.11.research:0 "Den Impuls erforschen"
 epoch_echoes.11.exploit:0 "Für die Produktion nutzen"
 epoch_echoes.11.wait:0 "Die Arbeiten verschieben"
 decision_epoch_echoes_investigate:0 "Störung untersuchen"
 decision_epoch_echoes_investigate_desc:0 "Eine Behandlung für die Störung auf dieser Kolonie wählen."
 epoch_echoes.trace.tt:0 "Beginnt eine §Y90-tägige§! Untersuchung durch ein Forschungsschiff mit Wissenschaftler am Signal."
 epoch_echoes.cautious.tt:0 "Ein Forschungsschiff mit Wissenschaftler birgt das Archiv in §Y180 Tagen§!. Das Frachtverzeichnis bleibt erhalten und ermöglicht später eine größere Materialbergung."
 epoch_echoes.forced.tt:0 "Ein Forschungsschiff mit Wissenschaftler öffnet den Kern in §Y60 Tagen§!. Mit §Y35 %§! Wahrscheinlichkeit ist eine weitere §Y90-tägige§! Stabilisierung nötig. Schäden am Verzeichnis verringern die spätere Frachtbergung."
 epoch_echoes.stabilize.tt:0 "Ein Forschungsschiff mit Wissenschaftler muss das Archiv §Y90 Tage§! stabilisieren, bevor es geborgen werden kann."
 epoch_echoes.cache.tt:0 "Ein §Y120-tägiges§! Bergungsprojekt für ein Forschungsschiff markiert verwertbare Fracht auf der Karte. Vorsichtige Bergung erhält §Y250 Legierungen und 350 Mineralien§!, gewaltsame Bergung §Y150 Legierungen und 200 Mineralien§!."
 epoch_echoes.investigate.tt:0 "Öffnet die Wahl zwischen Eindämmung, Forschung und Ausbeutung. Die Behandlung beginnt erst, wenn die benötigten Ressourcen bereitgestellt sind."
 epoch_echoes.containment.tt:0 "§Y60 Tage§! Behandlung. Die Störung bleibt währenddessen bestehen; die örtliche Arbeitsproduktion sinkt zusätzlich um §Y2 %§!. Eindämmung entfernt die Störung zuverlässig, ohne bleibenden Bonus."
 epoch_echoes.research.tt:0 "§Y120 Tage§! Behandlung mit zusätzlich §Y2 %§! weniger örtlicher Arbeitsproduktion. Der Abschluss entfernt die Störung, gewährt §Y180 Physik- und 180 Sozialforschung§! und erhöht örtliche Physikforschung aus Arbeit für §Y10 Jahre um 5 %§!."
 epoch_echoes.exploit.tt:0 "§Y45 Tage§! Behandlung mit zusätzlich §Y2 %§! weniger örtlicher Arbeitsproduktion. §Y65 %§! Chance: §Y150 Legierungen, 150 Energie§! und §Y+5 % Arbeitsproduktion für 5 Jahre§!. §Y35 %§! Chance: §Y−10 % Arbeitsproduktion, −5 Stabilität§! bis zur Reparatur."
 epoch_echoes.relay_survey.tt:0 "Beginnt eine §Y90-tägige§! Untersuchung durch ein Forschungsschiff mit Wissenschaftler am Relais."
 epoch_echoes.combat.tt:0 "Erweckt zwei feindliche Verteidiger in diesem System. Ihre Flotte muss tatsächlich zerstört werden, um das Relais zu sichern."
 epoch_echoes.defuse.tt:0 "Ein Forschungsschiff mit Wissenschaftler deaktiviert die Sicherungen in §Y180 Tagen§!. Ein geborgenes Archiv oder erfolgreiche Eindämmung beziehungsweise Erforschung der Koloniestörung verkürzt dies auf §Y90 Tage§!, beides zusammen auf §Y45 Tage§!."
 epoch_echoes.activate.tt:0 "Stellt das sichtbare Relais als dauerhafte Infrastruktur wieder her: monatlich §Y6 Physikforschung§! bei §Y4 Energie Unterhalt§!. Bei Energiemangel, Verlust des Systems oder endgültiger Aufgabe der Nachforschungen endet die Produktion. Über das Bauwerksmenü ist eine dauerhafte Stilllegung ohne weiteren Unterhalt möglich."
 epoch_echoes.salvage.tt:0 "Das Relais bleibt als ausgeschlachtete, dauerhaft funktionslose Hülle zurück. Es hat keinen Unterhalt."
 epoch_echoes.disable.tt:0 "Das Relais bleibt sichtbar und dauerhaft inaktiv. Es gewährt keinen Vorteil und verursacht keinen Unterhalt."
 EPOCH_ECHOES_GHOST_CACHE:0 "Die verlorene Fracht bergen"
 EPOCH_ECHOES_GHOST_CACHE_DESC:0 "Ein Forschungsschiff mit Wissenschaftler folgt dem geborgenen Verzeichnis und birgt die verbliebene Fracht. Ein unversehrtes Verzeichnis ermöglicht eine vollständigere Bergung."
 epoch_echoes_unquiet_treatment:0 "Anlagen für die Behandlung gebunden"
 epoch_echoes_unquiet_treatment_desc:0 "Örtliche Anlagen sind mit der Behandlung der Störung beschäftigt. Bis zum Abschluss sinkt die Arbeitsproduktion."
 epoch_echoes_relay_dormant:0 "Ruhendes Relais"
 epoch_echoes_relay_dormant_DESC:0 "Ein stiller Horchposten, geschützt durch ein altes Verteidigungsnetz."
 epoch_echoes_relay_active_DESC:0 "Ein betriebener Horchposten. Seine Instrumente benötigen eine verlässliche Energieversorgung."
 epoch_echoes_relay_disabled:0 "Stillgelegtes Relais"
 epoch_echoes_relay_disabled_DESC:0 "Ein inaktives Relais. Es liefert keine Forschung und benötigt keinen Energieunterhalt. Die Stilllegung ist unumkehrbar."
 epoch_echoes_relay_salvaged:0 "Ausgeschlachtetes Relais"
 epoch_echoes_relay_salvaged_DESC:0 "Die Maschinen des Relais wurden geborgen. Die leere Hülle bleibt in der Umlaufbahn."
 epoch_echoes.10.desc.hive:0 "Eine tiefe Schwingung unter einer unserer Kolonien stört die Koordination ihrer Drohnen. Die Produktionszyklen geraten immer wieder aus dem Takt. Die Dissonanz bleibt örtlich begrenzt, doch die betroffenen Anlagen benötigen Aufmerksamkeit."
 epoch_echoes.10.desc.machine:0 "Ein wiederkehrender Impuls stört die Produktionsplanung auf einer unserer Kolonien. Örtliche Einheiten verlieren immer wieder die Synchronisation. Die Störung bleibt örtlich begrenzt, doch die betroffenen Anlagen benötigen Aufmerksamkeit."

 EPOCH_ECHOES_RELAY_DEFUSE_LINKED:0 "Relaisprotokoll rekonstruieren"
 EPOCH_ECHOES_RELAY_DEFUSE_LINKED_DESC:0 "Das geborgene Archiv und die Messungen der Kolonie zeigen gemeinsam einen direkten Weg durch das Steuerungsnetz."
 epoch_echoes_relay_dormant_MEGASTRUCTURE_DETAILS:0 "$epoch_echoes_relay_dormant_DESC$"
 epoch_echoes_relay_dormant_CONSTRUCTION_INFO_DELAYED:0 "$epoch_echoes_relay_dormant_DESC$"
 epoch_echoes_relay_active_MEGASTRUCTURE_DETAILS:0 "$epoch_echoes_relay_active_DESC$"
 epoch_echoes_relay_active_CONSTRUCTION_INFO_DELAYED:0 "$epoch_echoes_relay_active_DESC$"
 epoch_echoes_relay_disabled_MEGASTRUCTURE_DETAILS:0 "$epoch_echoes_relay_disabled_DESC$"
 epoch_echoes_relay_disabled_CONSTRUCTION_INFO_DELAYED:0 "$epoch_echoes_relay_disabled_DESC$"
 epoch_echoes_relay_salvaged_MEGASTRUCTURE_DETAILS:0 "$epoch_echoes_relay_salvaged_DESC$"
 epoch_echoes_relay_salvaged_CONSTRUCTION_INFO_DELAYED:0 "$epoch_echoes_relay_salvaged_DESC$"
