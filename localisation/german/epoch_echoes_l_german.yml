l_german:
 epoch_echoes.2.name:0 "Ein Signal ohne Ursprung"
 epoch_echoes.2.desc:0 "Aus dem kartografierten System dringt ein wiederkehrender Impuls. Sein Rhythmus erinnert an den Notruf eines Forschungsschiffs, doch auf unsere Anfrage meldet sich kein Register. Die Spur ist schwach, aber stabil genug, um ihr zu folgen."
 epoch_echoes.2.a:0 "Ein Wissenschaftsschiff soll die Spur verfolgen"
 epoch_echoes.2.b:0 "Das Signal verklingen lassen"
 epoch_echoes.3.name:0 "Das stille Schiff"
 epoch_echoes.3.desc:0 "Der Notruf führt zu einem verlassenen Forschungsschiff. Einschläge haben den Rumpf gezeichnet, doch Teile des Archivs sind noch aktiv. Wir können die Systeme isolieren und die Daten langsam auslesen oder den beschädigten Kern gewaltsam öffnen, bevor er endgültig versagt."
 epoch_echoes.3.a:0 "Die Aufzeichnungen vorsichtig bergen"
 epoch_echoes.3.b:0 "Den Kern gewaltsam öffnen"
 epoch_echoes.5.name:0 "Eine Stimme im Rauschen"
 epoch_echoes.5.desc:0 "Die geborgenen Fragmente berichten von einer Besatzung, die denselben Impuls lange vor unserer ersten Übertragung hörte. Ihre Aufzeichnungen brechen mitten im Satz ab. Die Daten sind lückenhaft, doch sie geben unserer Forschung vorübergehend eine neue Richtung."
 epoch_echoes.5.a:0 "Die Fragmente sichern"
 epoch_echoes.8.name:0 "Instabile Aufzeichnungen"
 epoch_echoes.8.desc:0 "Die gewaltsame Bergung hat das Schiffsarchiv in widersprüchliche Zustände versetzt. Ein Wissenschaftsteam kann den instabilen Datensatz isolieren und die verbliebenen Informationen sichern. Ohne Eingriff wäre der Fund verloren."
 epoch_echoes.8.a:0 "Die Daten stabilisieren"
 epoch_echoes.10.name:0 "Aus dem Takt geratene Kolonie"
 epoch_echoes.10.desc:0 "Auf einer unserer Kolonien geraten die Produktionsabläufe aus dem Takt. Die örtlichen Arbeitskräfte berichten von einem tiefen Vibrieren unter der Oberfläche. Die Störung breitet sich bislang nicht aus, beeinträchtigt die Arbeit aber bereits."
 epoch_echoes.10.a:0 "Die verfügbaren Maßnahmen prüfen"
 epoch_echoes.6.name:0 "Das letzte Relais"
 epoch_echoes.6.desc:0 "Der Impuls führt zu einer alten Relaisstation im selben System. Ihr Signal deckt sich mit Einzelheiten aus den geborgenen Aufzeichnungen. Ein Verteidigungsnetz schützt die Anlage noch immer. Eine gründliche technische Untersuchung könnte einen Weg daran vorbei aufzeigen."
 epoch_echoes.6.a:0 "Das Relais untersuchen"
 epoch_echoes.7.name:0 "Eine bewachte Verbindung"
 epoch_echoes.7.desc:0 "Das Verteidigungsnetz hat unser Schiff erkannt. Wir können die verbliebene Wache in einem echten Gefecht stellen oder die Steuerverbindungen kartieren und das Netz von einem Wissenschaftsschiff aus abschalten."
 epoch_echoes.7.a:0 "Die Verteidiger angreifen"
 epoch_echoes.7.b:0 "Einen technischen Weg suchen"
 epoch_echoes.9.name:0 "Das Relais verstummt"
 epoch_echoes.9.desc:0 "Das Relais ist gesichert. Wir können seinen Kern für eine begrenzte Zeit betreiben, die Anlage für brauchbare Materialien zerlegen oder sie deaktiviert lassen, damit sich das System beruhigt."
 epoch_echoes.9.a:0 "In Betrieb nehmen"
 epoch_echoes.9.b:0 "Die Station ausschlachten"
 epoch_echoes.9.c:0 "Deaktiviert lassen"
 EPOCH_ECHOES_GHOST_TRACE:0 "Dem wiederkehrenden Signal folgen"
 EPOCH_ECHOES_GHOST_TRACE_DESC:0 "Ein bemanntes Wissenschaftsschiff folgt dem Impuls zu einem verlassenen Forschungsschiff."
 EPOCH_ECHOES_GHOST_CAUTIOUS:0 "Vorsichtige Bergung des Archivs"
 EPOCH_ECHOES_GHOST_CAUTIOUS_DESC:0 "Ein längerer, risikoarmer Versuch, die verbliebenen Aufzeichnungen des Schiffs zu isolieren."
 EPOCH_ECHOES_GHOST_FORCED:0 "Gewaltsame Bergung des Archivs"
 EPOCH_ECHOES_GHOST_FORCED_DESC:0 "Eine schnelle Bergung, die Energie und Legierungen kostet und das Archiv destabilisieren kann."
 EPOCH_ECHOES_GHOST_STABILIZE:0 "Das beschädigte Archiv stabilisieren"
 EPOCH_ECHOES_GHOST_STABILIZE_DESC:0 "Ein Wissenschaftsschiff isoliert nach der gewaltsamen Bergung die instabilen Aufzeichnungen."
 EPOCH_ECHOES_RELAY_SURVEY:0 "Das alte Relais untersuchen"
 EPOCH_ECHOES_RELAY_SURVEY_DESC:0 "Ein bemanntes Wissenschaftsschiff kartiert Verteidigung und Steuerverbindungen des Relais."
 EPOCH_ECHOES_RELAY_DEFUSE:0 "Das Verteidigungsnetz kartieren"
 EPOCH_ECHOES_RELAY_DEFUSE_DESC:0 "Eine aufwendige wissenschaftliche Untersuchung soll das aktive Verteidigungsnetz abschalten."
 EPOCH_ECHOES_RELAY_DEFUSE_AIDED:0 "Die Resonanzspur nutzen"
 EPOCH_ECHOES_RELAY_DEFUSE_AIDED_DESC:0 "Frühere Entdeckungen zeigen einen kürzeren Weg durch die Steuerverbindungen des Relais."
 decision_epoch_echoes_containment:0 "Die Koloniestörung eindämmen"
 decision_epoch_echoes_containment_desc:0 "Die Resonanz mit einem verlässlichen, begrenzten Eingriff dämpfen."
 decision_epoch_echoes_research:0 "Die Koloniestörung untersuchen"
 decision_epoch_echoes_research_desc:0 "Eine gezielte Untersuchung finanzieren, die Forschung und zeitweilig einen lokalen Forschungsbonus einbringt."
 decision_epoch_echoes_exploit:0 "Die Koloniestörung nutzen"
 decision_epoch_echoes_exploit_desc:0 "Versuchen, aus der Resonanz einen kurzen wirtschaftlichen Vorteil zu ziehen und einen behebbaren Rückschlag riskieren."
 decision_epoch_echoes_recover:0 "Den beschädigten Produktionsrhythmus reparieren"
 decision_epoch_echoes_recover_desc:0 "Die zeitweiligen wirtschaftlichen und stabilitätsbezogenen Schäden der fehlgeschlagenen Nutzung beheben."
 epoch_echoes_ghost_insight:0 "Geborgene Signalfragmente"
 epoch_echoes_ghost_insight_desc:0 "Das Archiv liefert der Physikforschung vorübergehend neue Hinweise."
 epoch_echoes_unquiet_organic:0 "Produktion aus dem Takt"
 epoch_echoes_unquiet_organic_desc:0 "Eine anhaltende Resonanz stört die Arbeitsabläufe dieser Kolonie."
 epoch_echoes_unquiet_hive:0 "Dissonante synaptische Zyklen"
 epoch_echoes_unquiet_hive_desc:0 "Ein wiederkehrender Impuls stört die koordinierte Arbeit der Drohnen."
 epoch_echoes_unquiet_machine:0 "Desynchronisierte Fertigung"
 epoch_echoes_unquiet_machine_desc:0 "Ein wiederkehrendes Signal stört die Fertigungsabläufe dieser Maschinenkolonie."
 epoch_echoes_unquiet_research:0 "Resonanzforschungsstation"
 epoch_echoes_unquiet_research_desc:0 "Die abgeschlossene Untersuchung verbessert vorübergehend die lokale Gesellschaftsforschung."
 epoch_echoes_unquiet_surge:0 "Genutzte Resonanz"
 epoch_echoes_unquiet_surge_desc:0 "Eine kontrollierte Resonanz erhöht die örtliche Produktion vorübergehend."
 epoch_echoes_unquiet_backlash:0 "Resonanzrückschlag"
 epoch_echoes_unquiet_backlash_desc:0 "Die fehlgeschlagene Nutzung beeinträchtigt Produktion und Stabilität vorübergehend."
 epoch_echoes_relay_active:0 "Aktiviertes Relais"
 epoch_echoes_relay_active_desc:0 "Die restaurierte Station vergrößert vorübergehend die Sensorreichweite der Flotten und unterstützt die Physikforschung."
 NAME_EPOCH_Relay_Sentinels:0 "Relaiswächter"
 NAME_EPOCH_Relay_Defenders:0 "Ruhende Verteidiger"
 epoch_echoes.poi_relay:0 "Das letzte Relais"
 epoch_echoes.poi_relay.desc:0 "Ein altes Relais antwortet auf ein wiederkehrendes Signal."
 epoch_echoes_side_stories_title:0 "Echos in der Dunkelheit"
 epoch_echoes_side_stories_desc:0 "Einige Entdeckungen verbinden ein verlassenes Archiv, eine gestörte Kolonie und ein altes Relais."
