 epoch_frontiers.21.name:0 "Das Wrack ist geöffnet"
 epoch_frontiers.21.desc:0 "Das Bergungsteam hat die erste versiegelte Kammer erreicht. Wir können die Legierungen zurückgewinnen oder die beschädigten Maschinen für die Forschung sichern."
 epoch_frontiers.22.name:0 "Das Wrack ist geöffnet"
 epoch_frontiers.22.desc:0 "Die letzte versiegelte Kammer ist geöffnet. Sobald wir ihre Ladung geborgen haben, stellt das Relais den Betrieb ein und sein Energieunterhalt entfällt."
 epoch_frontiers.take_alloys:0 "Gewinnt die Legierungen zurück."
 epoch_frontiers.take_research:0 "Sichert die Maschinen für die Forschung."
 epoch_frontiers.leave_report:0 "Legt den Bericht beiseite."
 epoch_frontiers.30.name:0 "Eine beschädigte Anlage"
 epoch_frontiers.30.desc:0 "Die übernommene Anlage muss repariert werden, bevor sie wieder arbeitet. Setzt sie mit Legierungen instand oder demontiert sie in der Sternenbasis und zahlt den vollen Baupreis für einen Ersatz."
 epoch_frontiers.30.repair:0 "Bezahlt die Reparatur."
 epoch_frontiers.30.defer:0 "Lasst die Anlage vorerst unberührt."
 epoch_frontiers_salvage_relay:0 "Anker-Bergungsrelais"
 epoch_frontiers_salvage_relay_desc:0 "Das Relais koordiniert zwei Expeditionen mit einem Wissenschaftsschiff in die untersuchte Ruine. Jede Bergung kann Legierungen oder Ingenieursforschung liefern. Die Anlage benötigt Energie, bis beide Wrackkammern geräumt sind."
 epoch_frontiers.exclusive:0 "An dieser Ruine ist nur eine Anlage möglich. Demontiert die vorhandene Anlage, bevor ihr einen Ersatz baut."
 epoch_frontiers.wrecks_exhausted:0 "Beide Wrackkammern dieser Ruine wurden bereits geborgen."
