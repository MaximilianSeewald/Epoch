 EPOCH_FRONTIERS_SURVEY_1:0 "Ankerruine untersuchen"
 EPOCH_FRONTIERS_SURVEY_1_DESC:0 "Das Wrack eines Nullwächter-Ankers treibt in einer stabilen Umlaufbahn. Ein bemanntes Wissenschaftsschiff kann die verbliebenen Energieleitungen untersuchen und prüfen, welche sich weiterverwenden lassen."
 EPOCH_FRONTIERS_SURVEY_2:0 "Ankerruine untersuchen"
 EPOCH_FRONTIERS_SURVEY_2_DESC:0 "Das Wrack eines Nullwächter-Ankers treibt in einer stabilen Umlaufbahn. Ein bemanntes Wissenschaftsschiff kann die verbliebenen Energieleitungen untersuchen und prüfen, welche sich weiterverwenden lassen."
