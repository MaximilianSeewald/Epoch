 EPOCH_FRONTIERS_SURVEY_4:0 "Ankerruine untersuchen"
 EPOCH_FRONTIERS_SURVEY_4_DESC:0 "Das Wrack eines Nullwächter-Ankers treibt in einer stabilen Umlaufbahn. Ein bemanntes Wissenschaftsschiff kann die verbliebenen Energieleitungen untersuchen und prüfen, welche sich weiterverwenden lassen."
 epoch_frontiers.10.name:0 "Was vom Anker blieb"
 epoch_frontiers.10.desc:0 "Die Gravitationsstreben des Wracks sind noch intakt. Unsere Ingenieure können sie in die örtliche Sternenbasis einbauen und damit Platz für zusätzliche Verteidigungsplattformen schaffen. Die Plattformen selbst müssen wir noch bauen. Alternativ kann ein Relais die Bergung der Wrackkammern koordinieren."
 epoch_frontiers.10.ok:0 "Schickt die Pläne an die Sternenbasis."
 epoch_frontiers_bulwark:0 "Ankerbollwerk"
 epoch_frontiers_bulwark_desc:0 "Geborgene Ankerstreben verstärken die Andockplätze der Station. Zusätzliche Verteidigungsplattformen müssen eigens gebaut und bezahlt werden."
 epoch_frontiers.requires_operational_starport:0 "Erfordert einen Sternenhafen oder eine größere Sternenbasis unter Kontrolle ihres Besitzers."
 EPOCH_FRONTIERS_SALVAGE_1:0 "Ankerwrack bergen"
 EPOCH_FRONTIERS_SALVAGE_1_DESC:0 "Ein bemanntes Wissenschaftsschiff kann eine Ladung aus dem Wrack bergen. Die Bergung setzt ein betriebsbereites Relais und eine Sternenbasis unter Kontrolle ihres Besitzers voraus."
 EPOCH_FRONTIERS_SALVAGE_2:0 "Ankerwrack bergen"
 EPOCH_FRONTIERS_SALVAGE_2_DESC:0 "Ein bemanntes Wissenschaftsschiff kann eine Ladung aus dem Wrack bergen. Die Bergung setzt ein betriebsbereites Relais und eine Sternenbasis unter Kontrolle ihres Besitzers voraus."
