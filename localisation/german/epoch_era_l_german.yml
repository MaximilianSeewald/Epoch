 feature_epoch_era_universal_sovereignty_desc:0 "Schaltet den dauerhaften Erlass Offene Protokollforschung frei und erfüllt die philosophische Forschungsvoraussetzung für das freie UAP-Interface und den Aufstiegsvorteil Freie Konvergenz. Deren übrige Voraussetzungen bleiben bestehen. Erfordert unsere persönliche Entscheidung für freie Konvergenz; die Forschung allein gewährt keinen Aufstiegsvorteil."
 edict_epoch_era_wilderness_cores:0 "Wilderness-Protokollfertigung"
 edict_epoch_era_wilderness_cores_desc:0 "Fertigt ohne Jobs 12 Protokollkerne monatlich für 72 Mineralien, 12 Legierungen und 48 Energie. UAP-Kernkonstruktion verdoppelt Produktion und Unterhalt. Bei einem Defizit der Einsatzstoffe ruht die Produktion. Frei abschaltbar."
 edict_epoch_era_wilderness_integration:0 "Wilderness-Protokollintegration"
 edict_epoch_era_wilderness_integration_desc:0 "Wandelt universelle Infrastruktur-Forschung in direkte Forschungs-, Energie-, Legierungs- und Einigkeitsproduktion um. Benötigt monatlich 3 Kerne und 12 Energie. Ressourcenmangel unterbricht die Produktion. Die einzelnen Beiträge stehen in der Ressourcentabelle."
 epoch_era_tissue_lithoid:0 "Lithoide Gewebekalibrierung"
 epoch_era_tissue_lithoid_desc:0 "Mineralproduktion ersetzt den Nahrungsbonus. Bewohnbarkeit und gegebenenfalls Forschung bleiben erhalten."
 epoch_era_symbiosis_lithoid:0 "Lithoider symbiotischer Lebensraum"
 epoch_era_symbiosis_lithoid_desc:0 "Mineralproduktion ersetzt den Nahrungsbonus. Bewohnbarkeit und gegebenenfalls Forschung bleiben erhalten."
