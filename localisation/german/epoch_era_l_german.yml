 feature_epoch_era_mandate:0 "Protokollentwicklung: Das Nullwächtermandat"
 feature_epoch_era_mandate_desc:0 "Schaltet den dauerhaften Erlass Wächterdoktrin frei und erfüllt die philosophische Forschungsvoraussetzung für das Wächter-UAP-Interface und den Aufstiegsvorteil Erbe der Nullwächter. Deren übrige Voraussetzungen bleiben bestehen. Erfordert unsere persönliche Wächterentscheidung; die Forschung allein gewährt keinen Aufstiegsvorteil."
