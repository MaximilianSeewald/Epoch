 EPOCH_COHERENCE_DRIVE:0 "Kohärenz-Hyperraumantrieb"
 EPOCH_COHERENCE_DRIVE_DESC:0 "Schnellere Hyperraumvorbereitung; behält Rückzugschancen ohne Sprungantriebsabklingzeit."
 EPOCH_TEMPORAL_STABILIZER:0 "Temporaler Stabilisator"
 EPOCH_TEMPORAL_STABILIZER_DESC:0 "Härtet Schilde gegen Durchdringung und verbessert relative Ausweichchance. Belegt einen Hilfsslot; mehrere Einheiten unterliegen bewährten Obergrenzen."
 tech_epoch_iv_sensors_desc:0 "Nullfrequenzortung erweitert die Sensorreichweite und schaltet Kausalitäts-Zielcomputer für alle sechs bewährten Kampfrollen frei."
 tech_epoch_iv_reconstruction_desc:0 "Integriert rekonstruierte Kausaldaten in baubare Kohärenz-Forschungskomplexe. Wilderness: zusätzlicher direkter Ertrag im Erlass Protokollintegration; keine Resonanzgebäude."
 tech_epoch_iv_fields_desc:0 "Bindet planetare Verteidigungsfelder und ermöglicht temporale Stabilisierungstechnik. Wilderness: zusätzlicher direkter Ertrag im Erlass Protokollintegration; keine Resonanzgebäude."
 tech_epoch_iv_storage_desc:0 "Speichert Resonanzenergie für bemannte Nullfeld-Kollektoren. Wilderness: zusätzlicher direkter Ertrag im Erlass Protokollintegration; keine Resonanzgebäude."
 tech_epoch_iv_shields_desc:0 "Protokollbetriebene Schildfelder absorbieren mehr Schaden und benötigen dafür zusätzliche Reaktorleistung und laufende Kernversorgung."
 tech_epoch_iv_phase_emitter_desc:0 "Erschließt mittlere und große Phasenemitter mit besonderer Wirkung gegen Panzerung und verringerter Schildwirkung."
 tech_epoch_iv_lance_desc:0 "Bündelt einen kohärenten Strahl entlang der Achse eines Großkampfschiffs für Langstreckenangriffe gegen Panzerung."
 tech_epoch_iv_torpedoes_desc:0 "Nutzt Nullwellenausbreitung für abfangbare, schildumgehende Sprengköpfe mit stärkerer Wirkung gegen größere Hüllen."
 tech_epoch_iv_hyperdrive_desc:0 "Eine stabilisierte Hyperraumöffnung verkürzt die Antriebsvorbereitung und erhält eine Rückzugschance."
 tech_epoch_iv_transcendent_shields_desc:0 "Erschließt einen dichteren Schildverbund mit höherer Kapazität und Regeneration gegen erhöhten Leistungs- und Kernbedarf."
 tech_epoch_iv_protocol_breaker_desc:0 "Erschließt einen Protokollstrahl im Titanenmaßstab, der einen schweren Eröffnungsschlag mit örtlich begrenzter Explosionswirkung verbindet."
 tech_epoch_iv_coupling_desc:0 "Erschließt Phasengeneratoren der Stufe II mit besetzter planetarer Verteidigung und stärkerem Bombardementschutz. Wilderness: zusätzlicher direkter Ertrag im Erlass Protokollintegration; keine Resonanzgebäude."
 tech_epoch_iv_restoration_desc:0 "Erschließt Harmonisierungsinstitute und senkt nach dem persönlichen Abschluss die Kosten für Diagnose, Stabilisierung und Inversion um 20%."
 tech_epoch_iv_tissue_desc:0 "Schaltet die planetare Entscheidung Gewebekalibrierung frei: zehn Jahre Nahrungsproduktion und Bewohnbarkeitsunterstützung gegen Energie und Protokollkerne. Lithoide Gründerreiche erhalten stattdessen +10%/+20% Mineralproduktion."
 tech_epoch_iv_transcription_desc:0 "Schaltet die planetare Entscheidung Synaptisches Transkriptionsnetz frei: zehn Jahre Gesellschaftsforschung und reduzierte Abweichung gegen Energie und Protokollkerne."
 tech_epoch_iv_ethics_desc:0 "Begründet Kausalitätsarchive und Wächterakademien als nutzbare zivile und militärische Einrichtungen, unabhängig von Ascension-Vorteilen. Wilderness: zusätzlicher direkter Ertrag im Erlass Protokollintegration; keine Resonanzgebäude."
 tech_epoch_iv_symbiosis_desc:0 "Schaltet die planetare Entscheidung Symbiotischer Lebensraum frei. Ersetzt Gewebekalibrierung durch stärkere Nahrungs-, Bewohnbarkeits- und Forschungsunterstützung für zehn Jahre; verleiht keine Speziesmerkmale. Lithoide Gründerreiche erhalten stattdessen +10%/+20% Mineralproduktion."
 tech_epoch_iv_synaptic_nodes_desc:0 "Schaltet die planetare Entscheidung Autonome Synapsenknoten frei. Ersetzt das Transkriptionsnetz durch Forschung, Abweichungskontrolle und Verteidigungsarmeen für zehn Jahre; verleiht keine Speziesmerkmale."
 tech_epoch_iv_self_model_desc:0 "Schaltet die planetare Entscheidung Synthetisches Selbstmodell-Netz frei: zehn Jahre Energieproduktion und Montageunterstützung gegen Energie und Protokollkerne; verleiht keine Speziesmerkmale."
 tech_epoch_iv_harmonization_desc:0 "Schaltet Harmonisierungsinstitute der Stufe II frei. Auf positiv umgewandelten Resonanzwelten erhöhen sie die Forschungsproduktion von Jobs in jeder Disziplin zusätzlich um 5%. Wilderness: zusätzlicher direkter Ertrag im Erlass Protokollintegration; keine Resonanzgebäude."
 tech_epoch_iv_identity_desc:0 "Schaltet Kausalitätsarchive der Stufe II frei und verankert die bezahlten lokalen Klassenentwicklungsprojekte; verleiht weder Ascension-Vorteile noch Merkmale. Wilderness: zusätzlicher direkter Ertrag im Erlass Protokollintegration; keine Resonanzgebäude."
 tech_epoch_iv_sovereignty_desc:0 "Schaltet Wächterakademien der Stufe II für personell besetzte Flottenkoordination und planetare Verteidigung frei. Diese Technologie allein gewährt keinen Klassen-Aufstiegsvorteil. Die Wildnis erhält stattdessen direkte Produktion durch Protokollintegration; Resonanzgebäude mit Arbeitsplätzen bleiben ihr nicht verfügbar."
 tech_epoch_iv_mandate_desc:0 "Schaltet den dauerhaften Erlass Wächterdoktrin frei und erfüllt die philosophische Forschungsvoraussetzung für das Wächter-UAP-Interface und den Aufstiegsvorteil Erbe der Nullwächter. Deren übrige Voraussetzungen bleiben bestehen. Erfordert unsere persönliche Wächterentscheidung; die Forschung allein gewährt keinen Aufstiegsvorteil."
 tech_epoch_iv_universal_sovereignty_desc:0 "Schaltet den dauerhaften Erlass Offene Protokollforschung frei und erfüllt die philosophische Forschungsvoraussetzung für das freie UAP-Interface und den Aufstiegsvorteil Freie Konvergenz. Deren übrige Voraussetzungen bleiben bestehen. Erfordert unsere persönliche Entscheidung für freie Konvergenz; die Forschung allein gewährt keinen Aufstiegsvorteil."
 tech_epoch_iv_steel_desc:0 "Erschließt besetzte Architekten-Schmelzen. Maschinen- und katalytische Fertigungsmethoden behalten ihre jeweiligen Eingaben und Erträge. Wilderness: zusätzlicher direkter Ertrag im Erlass Protokollintegration; keine Resonanzgebäude."
 tech_epoch_iv_cores_desc:0 "Erschließt Protokollkern-Fabriken, die strategische Prozessoren aus Mineralien, Legierungen und Energie fertigen. Zum Start werden keine Kerne benötigt. Wilderness: schaltet jobfreie Protokollfertigung frei bzw. verdoppelt sie."
 tech_epoch_iv_laboratories_desc:0 "Erschließt Kohärenz-Forschungskomplexe der Stufe II mit erweiterter Forschungskapazität und strategischem Unterhalt. Wilderness: zusätzlicher direkter Ertrag im Erlass Protokollintegration; keine Resonanzgebäude."
 tech_epoch_iv_collectors_desc:0 "Erschließt Nullfeld-Kollektoren der Stufe II und erweitert die besetzte Energieproduktion gegen laufenden Kern- und Mineralienverbrauch. Wilderness: zusätzlicher direkter Ertrag im Erlass Protokollintegration; keine Resonanzgebäude."
 tech_epoch_iv_artillery_desc:0 "Erschließt schwere schildbrechende Artillerie und Architekten-Schmelzen der Stufe II zur Versorgung fortgeschrittener Flotten. Wilderness: zusätzlicher direkter Ertrag im Erlass Protokollintegration; keine Resonanzgebäude."
 tech_epoch_iv_reactor_desc:0 "Erschließt an die Hülle angepasste Protokollreaktoren mit höherer Leistung als Dunkle-Materie-Kerne und laufendem Prozessorbedarf."
 tech_epoch_iv_armor_desc:0 "Erschließt verstärkte Phasenpanzerung, deren Platten täglich eine geringe feste Menge Panzerung reparieren."
 tech_epoch_iv_fighters_desc:0 "Erschließt autonome schildumgehende Jäger für Trägerhangars, die weiterhin durch Flak bekämpft werden können."
 tech_epoch_iv_point_defense_desc:0 "Erschließt fraktale Abfangsysteme für eigene Punktverteidigungsslots gegen Raketen und Raumjäger."
 tech_epoch_iv_fabrication_desc:0 "Schaltet Architekten-Schmelzen der Stufe III frei. Ermöglicht zusammen mit Mega-Strukturtechnik und dem errungenen persönlichen Protokollschlüssel den Bau der Architekten-Schmiede. Die Wildnis erhält stattdessen zusätzliche direkte Produktion durch Protokollintegration; Resonanzgebäude mit Arbeitsplätzen bleiben ihr nicht verfügbar."
 tech_epoch_iv_nexus_desc:0 "Schaltet Kohärenz-Forschungskomplexe der Stufe III frei. Der Bau eines Resonanz-Nexus erfordert zusätzlich Universelle Feldkopplung, Mega-Strukturtechnik und den errungenen persönlichen Protokollschlüssel. Die Wildnis erhält stattdessen zusätzliche direkte Produktion durch Protokollintegration; Resonanzgebäude mit Arbeitsplätzen bleiben ihr nicht verfügbar."
 tech_epoch_iv_uap_core_desc:0 "Schaltet Protokollkern-Fabriken der Stufe II frei. Der Bau eines UAP-Interfaces erfordert zusätzlich Universelle Feldkopplung, Mega-Strukturtechnik, den errungenen persönlichen Protokollschlüssel und die Erforschung der persönlich gewählten Philosophie. Die Wildnis erschließt oder verdoppelt die Protokollfertigung ohne Arbeitsplätze."
