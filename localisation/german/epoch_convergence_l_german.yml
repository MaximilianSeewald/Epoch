 stage_epoch_iii_answer:0 "Die Gegenantwort"
 epoch_iii_first_offensive_stage_epoch_iii_answer:0 "$stage_epoch_iii_answer$"
 epoch_iii.answer_goal:0 "Feindkontakte sind an den markierten Fronten aufgetaucht. Die gemeinsame Beobachtung verfolgt ihren ersten Grenzübertritt oder ihren ersten bestätigten Verlust im Gefecht."
 epoch_iii.local_response:0 "Dieser Ansatz verändert unsere eigene Verteidigung und ihre Kosten. Die galaktischen Lageberichte wechseln gemeinsam, sobald die Kämpfe einen neuen Wendepunkt erreichen."
 epoch_iii_mobilize:0 "Werften mobilisieren"
 epoch_iii_mobilize_desc:0 "Beschleunigt den Schiffbau. Höherer Flottenunterhalt und monatliche Zuteilungen an Energie und Legierungen tragen die Mobilisierung."
 epoch_iii_analyze:0 "Feindliche Systeme analysieren"
 epoch_iii_analyze_desc:0 "Beschleunigt die Forschung und öffnet den Vorschlag zur Gegenharmonik. Die Energieversorgung der Labore und langsamerer Schiffbau konkurrieren mit der sofortigen Mobilisierung."
 epoch_iii_shield:0 "Planetare Abschirmung priorisieren"
 epoch_iii_shield_desc:0 "Isolierte Steuerkreise verbessern Stabilität und Produktion unserer Welten gegen monatliche Energie- und Mineralienkosten. Die Flottenkoordination wird aufwendiger. Dauerhafte Signalabschirmung bleibt eine eigene planetare Entscheidung."
 epoch_iii_counterattack:0 "Koordinierte Gegenoffensive vorbereiten"
 epoch_iii_counterattack_desc:0 "Monatliche Energie- und Legierungszuteilungen erhöhen Geschwindigkeit und Feuerrate unserer Schiffe bei höherem Unterhalt. Andere Reiche wählen ihre eigene Reaktion."
 epoch_iii_command_pressure:0 "Der Befehlsrhythmus"
 epoch_iii_command_pressure_desc:0 "Mit dem Kommandoschiff beschleunigen sich Bewegung und Feuer der Nullwächter. Die verbleibenden Verbände folgen dem letzten Befehl."
 epoch_iii_interdiction_field:0 "Verbundene Schilde"
 epoch_iii_interdiction_field_desc:0 "Der erste Sperrknoten verstärkt die Schilde aller Nullwächterverbände. Seine Zerstörung unterbricht das Feld."
 epoch_iii.11.machine:0 "Fremde Befehlsfolgen kollidieren mit unseren Steuerkreisen. Wir können den wiederkehrenden Takt isolieren, ohne ihn auszuführen. $epoch_iii.11.desc$"
 epoch_iii.11.hive:0 "Die Störung legt einen fremden Takt über unsere Wahrnehmung. Abgeschirmte Drohnen vergleichen die Unterbrechungen. $epoch_iii.11.desc$"
 epoch_iii.11.veteran:0 "Unsere eigenen Aufzeichnungen aus dem stillen Netzwerk enthalten denselben Abstand zwischen den Impulsen. Das gibt uns einen Vergleich, aber keine Erklärung für diesen Angriff. $epoch_iii.11.desc$"
