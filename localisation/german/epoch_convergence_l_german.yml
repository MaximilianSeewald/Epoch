 epoch_iii_listen:0 "Die Wache halten"
 epoch_iii_listen_desc:0 "Den Betrieb aufrechterhalten und über Vorsorge entscheiden."
 epoch_iii_prepare_report:0 "Messstationen besprechen"
 epoch_iii_prepare_report_desc:0 "Vorschlag und Finanzierung erneut öffnen."
 epoch_iii_watch:0 "Die Routen verteidigen"
 epoch_iii_watch_desc:0 "Flotten wiederaufbauen und feindliche Verbände bekämpfen."
 epoch_iii_briefing:0 "Lagebericht zur Verteidigung"
 epoch_iii_briefing_desc:0 "Militärische Ziele prüfen und Gegenharmonikforschung finanzieren."
 epoch_iii_pressure_prepared:0 "Gedämpfte Störung"
 epoch_iii_pressure_experienced:0 "Resonante Störung"
 epoch_iii_pressure_unprepared:0 "Ungeschützte Störung"
 epoch_iii_pressure_buffered:0 "Getrennte Steueranlagen"
 epoch_iii_mobile_disruption:0 "Gestörte Flottenkoordination"
 epoch_iii_counterharmonics:0 "Gegenharmonische Kalibrierung"
 epoch_iii_pressure_prepared_desc:0 "Unabhängige Empfänger begrenzen die Störung, verhindern aber nicht jede Unterbrechung."
 epoch_iii_pressure_experienced_desc:0 "Vertraute Abstände kehren in planetaren Steueranlagen wieder. Wissen allein schirmt sie nicht ab."
 epoch_iii_pressure_unprepared_desc:0 "Das wiederholte Signal erreicht ungeschützte Steueranlagen und unterbricht Arbeit und Koordination."
 epoch_iii_pressure_buffered_desc:0 "Getrennte Steuerkreise verringern die zusätzliche Störung. Ältere planetare Schäden bleiben erhalten."
 epoch_iii_mobile_disruption_desc:0 "Wiederholte falsche Anweisungen erhöhen den Aufwand zur Versorgung unserer Flotten."
 epoch_iii_counterharmonics_desc:0 "Die Kenntnis des wiederkehrenden Abstands verbessert unsere Waffenkalibrierung."
 decision_epoch_iii_briefing:0 "Gegenharmonik erforschen"
 decision_epoch_iii_briefing_desc:0 "Den Forschungsvorschlag erneut öffnen. Er bleibt nach Ende der Kämpfe verfügbar, damit geschädigte Welten Signalabschirmung erhalten können."
 epoch_iii_mobile_disruption_experienced:0 "Erkannte Signalstörung"
 epoch_iii_mobile_disruption_experienced_desc:0 "Die Kenntnis des Signals begrenzt den zusätzlichen Versorgungsaufwand unserer Flotten."
 epoch_iii_mobile_disruption_prepared:0 "Gedämpfte Flottenkoordination"
 epoch_iii_mobile_disruption_prepared_desc:0 "Unabhängige Empfänger begrenzen den zusätzlichen Versorgungsaufwand unserer Flotten."

 NAME_EPOCH_III_Warden:0 "Nullwächter"
 NAME_EPOCH_III_Wardens:0 "Nullwächter"
 NAME_EPOCH_III_Bastion:0 "Sperrbastion"
 NAME_EPOCH_III_Garrison:0 "Nullwächtergarnison"
 NAME_EPOCH_III_Command:0 "Der schweigende Befehl"
 NAME_EPOCH_III_Commandant:0 "Schweigender Kommandant"
 epoch_iii.transmission:0 "Der Kanal öffnet sich ohne Anfrage. Aus schmalen Lichtbändern setzt sich ein Bild zusammen. Die Stimme kennt keinen Atem, keine Pause für eine Antwort.\n\n„Grenzbedingung überschritten. Unabhängige Anweisungen erkannt. Eindämmungsgitter: unvollständig.\n\nDie Wache wieder aufnehmen. Die Abweichung isolieren. Den Befehl bewahren.“\n\nHinter der Übertragung überschreiten mehrere bewaffnete Verbände zugleich die Grenze. Die Verbindung bricht ab. Ihre Waffen bleiben aktiv."
 epoch_iii.10.decode:0 "Jedes Intervall aufzeichnen."
 epoch_iii.decode.tt:0 "Auswertungsteams erhöhen fünf Jahre lang die Forschungsgeschwindigkeit um 10 %. Die Übertragung bietet keinen Waffenstillstand an."
 epoch_iii.12.science:0 "Die letzten bewaffneten Verbände sind im Kampf gefallen. Unsere Vergleiche der geborgenen Aufzeichnungen hatten Schwächen im Befehlsnetz offengelegt; unsere Flotten mussten es dennoch brechen. Das Kommandoschiff und alle befestigten Knoten sind zerstört.\n\nDie Welten behalten ihre Narben. Eine geborgene Anweisung endet vor ihrem letzten Wort. Die Aufzeichnungen verraten nicht, wen sie schützen sollte."
 epoch_iii.12.joint:0 "Getrennte Flottenberichte bestätigen dieselbe Stille. Schiffe mehrerer Reiche haben die Nullwächterverbände gebrochen. Alle befestigten Knoten sind zerstört; das Kommandoschiff ist im Kampf gefallen.\n\nKein einzelner Empfänger hält die ganze letzte Nachricht fest. Wo sich die Aufzeichnungen überschneiden, wiederholen sie eine unvollendete Anweisung. Die beschädigten Welten werden mehr als einen gemeinsamen Sieg brauchen."
 epoch_iii.50.name:0 "Die drei Brennpunkte"
 epoch_iii.50.desc:0 "Die ersten geborgenen Gefechtsdaten lassen drei verschiedene Rhythmen erkennen. Befestigte Knoten sperren die Routen. Ein zweites Muster stört nahe Welten. Ein drittes begleitet das Eintreffen neuer Schiffe.\n\nDiese Funktionen greifen ineinander. Die Zerstörung des Signalrelais begrenzt auch den Nachschub anderer Verbände. Die Zerstörung des Narbenknotens verhindert weitere planetare Schläge. Trümmer hinter unseren Flotten können zeigen, wie sich das übrige Netz schwächen lässt."
 epoch_iii.51.name:0 "Die Konvergenz"
 epoch_iii.51.desc:0 "Entlang der bedrohten Routen ändern die Nullwächter gleichzeitig den Kurs. Ein Kommandoschiff ist unter ihnen erschienen. Ihre Triebwerke beschleunigen; die Pausen zwischen den Salven schrumpfen. Nahe bewohnte Systeme ziehen ihre Aufmerksamkeit auf sich. Die verbliebenen Anker versorgen weiterhin die Offensive."
 epoch_iii.52.name:0 "Der letzte Befehl"
 epoch_iii.52.desc:0 "Jeder befestigte Knoten ist gefallen. Die überlebenden Nullwächter wenden sich der ersten markierten Front zu. Dort wird der letzte Befehl weiter wiederholt. Unsere Flotten können sie dort abfangen. Das Kommandoschiff und seine Begleiter müssen besiegt werden; eine Kapitulation wurde nicht übermittelt."
 epoch_iii.fronts.tt:0 "Die Sperrfront kontrolliert Routen, der Narbenknoten bedroht nahe Welten, das Signalrelais koordiniert begrenzten Nachschub. Kleine Netze vereinen Narben- und Signalfunktion an einem Standort."
 epoch_iii.command.tt:0 "Das Kommandoschiff ist ein militärisches Ziel. Zwei gesicherte Trümmeruntersuchungen schwächen das Netz, zerstören aber keine Schiffe."
 epoch_iii.listen.tt:0 "Die Beobachtung fortsetzen. Kein automatischer Fortschritt oder Schutz; Vorsorge erfordert das Messstationsprojekt."
 epoch_iii.watch.tt:0 "Bestätigte militärische Ergebnisse verfolgen. Flotten an den markierten Fronten und Forschungsschiffe an gesicherten Fundorten einsetzen. Abwarten bringt keinen Sieg."
 epoch_iii_preparations_type:0 "Vorsorgliche Wache"
 epoch_iii_preparations_monthly_change_tooltip:0 "Fortschritt entsteht durch abgeschlossene Vorsorge, nicht durch verstrichene Zeit."
 epoch_iii_first_offensive_type:0 "Nullwächterkonvergenz"
 epoch_iii_first_offensive_monthly_change_tooltip:0 "Alle Reiche verfolgen dieselben galaktischen Wendepunkte: feindlicher Grenzkontakt, bestätigte Gefechtsverluste, ein durchbrochener Knoten und die Kommandoflotte, schließlich der Fall aller Knoten. Forschung und lokale Reaktionen treiben diese Berichte nicht voran."
 epoch_iii_front_marker:0 "Nullwächterfront"
 epoch_iii_front_marker_type:0 "Befestigter Konvergenzknoten"
 epoch_iii_front_marker_desc:0 "Bei [Target.GetName] steht eine verteidigte Anlage. Ihre Zerstörung stoppt den örtlichen Nachschub und öffnet das Trümmerfeld für wissenschaftliche Untersuchungen. Die Situationsmarkierung führt zum System."
 epoch_iii_front_marker_monthly_change_tooltip:0 "Dieses Ziel bleibt bestehen, bis sein verteidigter Knoten im Kampf zerstört wurde."
 stage_epoch_iii_front:0 "Verteidigter Knoten"
 epoch_iii_front_marker_stage_epoch_iii_front:0 "$stage_epoch_iii_front$"
 epoch_iii_emergency:0 "Notmobilisierung der Werften"
 epoch_iii_emergency_desc:0 "Nach der feindlichen Übertragung beschleunigen die Werften den Wiederaufbau."
 epoch_iii_decoding:0 "Aufgezeichnete Intervalle"
 epoch_iii_decoding_desc:0 "Eigene Teams vergleichen die wiederkehrenden Intervalle der Übertragung."
 epoch_iii_disrupted_network:0 "Gestörter Befehlsrhythmus"
 epoch_iii_disrupted_network_desc:0 "Untersuchungen zweier gesicherter Standorte haben Schwächen in Waffen und Schilden des verbliebenen Netzes offengelegt."
 epoch_iii_scar_pressure:0 "Resonanzschlag"
 epoch_iii_scar_pressure_desc:0 "Ein naher Narbenknoten stört Arbeit und Koordination. Signalpufferung kann diese zusätzliche Belastung senken."
 epoch_iii_scar_shielded:0 "Gepufferter Resonanzschlag"
 epoch_iii_scar_shielded_desc:0 "Frühere Vorsorge begrenzt die Störungen eines nahen Knotens. Signalpufferung kann den übrigen Schaden senken."
 epoch_iii_veterans:0 "Veteranen der schweigenden Grenzen"
 epoch_iii_veterans_desc:0 "Besatzungen, die am Sieg über die Nullwächter beteiligt waren, behalten ihre Kampferfahrung."
