l_german:
 NAME_EPOCH_III_Convergence:0 "Die schweigende Konvergenz"
 NAME_EPOCH_III_Interdiction:0 "Sperrfront"
 NAME_EPOCH_III_Scar_Node:0 "Resonanznarbenknoten"
 NAME_EPOCH_III_Signal_Relay:0 "Signalrelais"
 NAME_EPOCH_III_Reserve:0 "Reserveanker"
 epoch_iii.front.interdiction:0 "Dieser Knoten verstärkt auch die Schilde sämtlicher Nullwächter um 20%. Seine Zerstörung schwächt die übrigen Fronten. Die Bastion bei [Target.GetName] sperrt die Routen und versorgt Angriffsverbände. Ihren bewaffneten Knoten im Kampf zerstören, um seinen Nachschub zu stoppen und eine Trümmeruntersuchung zu ermöglichen. Andere Fronten bleiben aktiv."
 epoch_iii.front.scar:0 "Der Knoten bei [Target.GetName] trifft Welten benachbarter Reiche. Die Zerstörung seines bewaffneten Knotens verhindert weitere Schläge. In kleineren Netzen koordiniert er zugleich den Nachschub der anderen Fronten. Signalpufferung schützt betroffene Welten; bestehender Schaden bleibt."
 epoch_iii.front.signal:0 "Das Relais bei [Target.GetName] koordiniert Ankünfte im gesamten Netz. Seine Zerstörung stoppt den örtlichen Nachschub und begrenzt jede andere Quelle auf insgesamt drei Einsätze. Bereits entsandte Verbände bleiben gefährlich."
 epoch_iii.front.reserve:0 "Der Reserveanker bei [Target.GetName] versorgt eine weitere eigenständige Angriffsfront. Er hängt weiterhin vom Signalnetz ab. Seine Zerstörung im Kampf stoppt örtlichen Nachschub und öffnet das Trümmerfeld."
 NAME_EPOCH_III_Hunters:0 "Nullwächter-Vorhut"
 NAME_EPOCH_III_Enforcer:0 "Nullwächter-Vollstrecker"
 NAME_EPOCH_III_Anchor:0 "Konvergenzanker"
 epoch_iii.5.name:0 "Eine Antwort ohne Stimme"
 epoch_iii.5.desc:0 "Die Aufzeichnungen aus dem schweigenden Netz haben sich verändert. Lücken, die zufällig schienen, kehren nun in genauen Abständen wieder. Jeder Empfänger hört dieselbe Leere. Jemand auf der Wache nennt es eine Antwort. Niemand weiß, welche Frage gestellt wurde.\n\nUnsere Forscher schlagen unabhängige Messstationen und getrennte Steuerkreise vor. Sie können nicht vorhersagen, was kommt. Aber sie können verhindern, dass eine Störung alle Anlagen gleichzeitig erreicht."
 epoch_iii.10.name:0 "Die Gegenantwort"
 epoch_iii.10.desc:0 "Auf voneinander unabhängigen Welten berichtigen Messgeräte Werte, die nie falsch waren. Ernteanlagen halten im gleichen Augenblick an. Stromnetze wiederholen Befehle unbekannter Herkunft.\n\nBei [epoch_iii_front_location.GetName] ist ein bewaffneter Verband erschienen. Seine Schiffe ignorieren Funksprüche und rücken entlang der Hyperraumrouten vor. Hinter ihnen hängt eine unbewegliche Konstruktion. Mit jedem ihrer Impulse verstummen ferne Empfänger. Für diese Schiffe hat sich ein Name eingebürgert: Nullwächter."
 epoch_iii.10.hive:0 "Eine Stille ist in unseren gemeinsamen Rhythmus eingedrungen. Drohnen auf fernen Welten halten gleichzeitig inne und erwarten einen Impuls, der nicht zu uns gehört. Die Trennung kostet Kraft.\n\nEin bewaffneter Verband rückt von [epoch_iii_front_location.GetName] aus vor. Eine unbewegliche Konstruktion bleibt zurück und wiederholt denselben Abstand. Die Schiffe, die wir Nullwächter nennen, beantworten weder Warnung noch Einladung."
 epoch_iii.10.machine:0 "Unabhängige Rechenknoten melden identische Berichtigungen eines unbekannten Absenders. Die Prüfsummen stimmen überein. Die Anweisungen widersprechen einander. Die Trennung betroffener Schaltkreise verringert unsere Leistung.\n\nBewaffnete Schiffe rücken von [epoch_iii_front_location.GetName] aus vor. Eine unbewegliche Konstruktion wiederholt hinter ihnen die Störung. Die Bezeichnung Nullwächter wurde zugewiesen. Herkunft und Absicht bleiben ungeklärt."
 epoch_iii.10.respond:0 "Die Werften mobilisieren."
 epoch_iii.11.desc:0 "In den geborgenen Zieldaten erscheinen unsere Kolonien als Unterbrechungen eines sonst regelmäßigen Musters. Die Besatzungen schalten zwischen den Wachen ihre Empfänger ab. Derselbe Abstand liegt nun auch in der Stille zwischen den Triebwerkszyklen.\n\nDie Labore streiten über seine Bedeutung. Dass er messbar ist, bezweifelt niemand."
 epoch_iii.12.name:0 "Der unvollendete Befehl"
 epoch_iii.12.desc:0 "Das Kommandoschiff zerbricht. Entlang der alten Fronten wenden sich die überlebenden Nullwächter ab. Ihre Waffen suchen keine Ziele mehr. Einige folgen den Hyperraumrouten zu den schweigenden Konstruktionen; andere zerstreuen sich jenseits unserer Ortungsreichweite.\n\nDie beschädigten Welten bleiben zurück. In den Trümmern wiederholt sich eine Anweisung ohne Empfänger: Bewahren... Danach kommt nichts. Die übrigen Stellungen erlöschen."
 epoch_iii.12.continue:0 "Weiter lauschen."
 epoch_iii.acknowledge:0 "Verstanden."
 epoch_iii.prepare:0 "Unabhängige Messstationen errichten."
 epoch_iii.prepare.tt:0 "Eröffnet ein Projekt für 900 Physikforschung. Es muss vor Beginn der Störung abgeschlossen werden. Vollendete Vorsorge verringert die anfängliche planetare Belastung und erlaubt sofortige Signalabschirmung; feindliche Flotten hält sie nicht auf."
 epoch_iii.research:0 "Den wiederkehrenden Abstand untersuchen."
 epoch_iii.research.tt:0 "Öffnet ein Projekt für 1200 Physikforschung. Gewährt während der Krise für höchstens zehn Jahre +10% Schaden gegen Nullwächter und schaltet Signalabschirmung frei. Entfernt den zusätzlichen Flottenunterhalt mobiler Reiche."
 epoch_iii.first_objectives:0 "Alle markierten Anker und das einzigartige Kommandoschiff im Kampf zerstören. Untersuchungen gesicherter Trümmer schwächen Waffen und Nachschub. Restverbände ziehen sich nach dem Zusammenbruch der Kommandostruktur zurück."
 epoch_iii.anchor_goal:0 "Befestigte Knoten versorgen mehrere mobile Verbände. Die Zerstörung eines Knotens stoppt seinen Nachschub; das Signalrelais begrenzt zusätzlich andere Knoten."
 epoch_iii.remaining_goal:0 "Das einzigartige Kommandoschiff im Kampf zerstören. Sind es und alle Anker vernichtet, endet die Krise und überlebende Verbände ziehen sich zurück. Kleine Restflotten müssen nicht aufgespürt werden."
 epoch_iii.buffer.tt:0 "Nur die zusätzliche Signalstörung wird verringert. Bestehende planetare Besonderheiten, Untersuchungen und dauerhafte Schäden bleiben erhalten."
 EPOCH_III_PREPARE:0 "Unabhängige Messstationen"
 EPOCH_III_PREPARE_DESC:0 "Getrennte Empfängerkreise vergleichen ihre Messungen mit geborgenen Netzaufzeichnungen. Die Arbeit muss vor der erwarteten Störung enden; unfertige Stationen bieten keinen Schutz."
 EPOCH_III_COUNTERHARMONICS:0 "Der wiederkehrende Abstand"
 EPOCH_III_COUNTERHARMONICS_DESC:0 "Unabhängige Labore untersuchen die Störung. Kalibrierte Waffen gewinnen 10% Schaden gegen Nullwächter; betroffene Welten können Signalabschirmung einrichten. Diese Forschung vernichtet keine feindlichen Schiffe."
 decision_epoch_iii_buffer:0 "Signalabschirmung"
 decision_epoch_iii_buffer_desc:0 "Die planetaren Steueranlagen vom wiederholten Signal trennen. Während der Krise sind Messstationen oder Gegenharmonikforschung erforderlich; danach unmittelbar verfügbar. Stoppt weitere Eskalation und mindert die anfängliche Störung. Bereits eingetretene Eskalation und ältere Schäden benötigen Behandlung."
 epoch_iii_preparations:0 "Die wartende Wache"
 epoch_iii_preparations_desc:0 "Die Abstände im schweigenden Netz verändern sich. Über die Besprechung der Messstationen lässt sich Vorsorge finanzieren, solange Zeit bleibt. Die Vorbereitung erfordert Forschung; Abwarten bietet keinen Schutz."
 epoch_iii_first_offensive:0 "Die Nullwächterkonvergenz"
 epoch_iii_first_offensive_desc:0 "Entlang der bedrohten Routen wiederholen die Nullwächter einen Befehl, an dessen Erteilung sich niemand erinnert. Die Konstruktionen antworten einander. Die Welten dazwischen beginnen ebenfalls zu antworten."
