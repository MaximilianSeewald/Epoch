 epoch_iii_listen:0 "Die Wache halten"
 epoch_iii_listen_desc:0 "Den Betrieb aufrechterhalten und über Vorsorge entscheiden."
 epoch_iii_prepare_report:0 "Messstationen besprechen"
 epoch_iii_prepare_report_desc:0 "Vorschlag und Finanzierung erneut öffnen."
 epoch_iii_watch:0 "Die Routen verteidigen"
 epoch_iii_watch_desc:0 "Flotten wiederaufbauen und feindliche Verbände bekämpfen."
 epoch_iii_briefing:0 "Lagebericht zur Verteidigung"
 epoch_iii_briefing_desc:0 "Militärische Ziele prüfen und Gegenharmonikforschung finanzieren."
 epoch_iii_pressure_prepared:0 "Gedämpfte Störung"
 epoch_iii_pressure_experienced:0 "Resonante Störung"
 epoch_iii_pressure_unprepared:0 "Ungeschützte Störung"
 epoch_iii_pressure_buffered:0 "Getrennte Steueranlagen"
 epoch_iii_mobile_disruption:0 "Gestörte Flottenkoordination"
 epoch_iii_counterharmonics:0 "Gegenharmonische Kalibrierung"
 epoch_iii_pressure_prepared_desc:0 "Unabhängige Empfänger begrenzen die Störung, verhindern aber nicht jede Unterbrechung."
 epoch_iii_pressure_experienced_desc:0 "Vertraute Abstände kehren in planetaren Steueranlagen wieder. Wissen allein schirmt sie nicht ab."
 epoch_iii_pressure_unprepared_desc:0 "Das wiederholte Signal erreicht ungeschützte Steueranlagen und unterbricht Arbeit und Koordination."
 epoch_iii_pressure_buffered_desc:0 "Getrennte Steuerkreise verringern die zusätzliche Störung. Ältere planetare Schäden bleiben erhalten."
 epoch_iii_mobile_disruption_desc:0 "Wiederholte falsche Anweisungen erhöhen den Aufwand zur Versorgung unserer Flotten."
 epoch_iii_counterharmonics_desc:0 "Die Kenntnis des wiederkehrenden Abstands verbessert unsere Waffenkalibrierung."
 decision_epoch_iii_briefing:0 "Gegenharmonik erforschen"
 decision_epoch_iii_briefing_desc:0 "Den Forschungsvorschlag erneut öffnen. Er bleibt nach Ende der Kämpfe verfügbar, damit geschädigte Welten Signalabschirmung erhalten können."
 epoch_iii_mobile_disruption_experienced:0 "Erkannte Signalstörung"
 epoch_iii_mobile_disruption_experienced_desc:0 "Die Kenntnis des Signals begrenzt den zusätzlichen Versorgungsaufwand unserer Flotten."
 epoch_iii_mobile_disruption_prepared:0 "Gedämpfte Flottenkoordination"
 epoch_iii_mobile_disruption_prepared_desc:0 "Unabhängige Empfänger begrenzen den zusätzlichen Versorgungsaufwand unserer Flotten."
