 EPOCH_III_SITE_1:0 "Gesicherter Knoten: Trümmeranalyse"
 EPOCH_III_SITE_1_DESC:0 "Ein Forschungsschiff mit Wissenschaftler untersucht die gesicherten Trümmer 90 Tage lang. Ein Standort senkt Nullwächter-Waffenschaden um 10% und begrenzt Nachschub; zwei ersetzen dies durch -20% Waffenschaden und Schilde. Alle Anker und das einzigartige Kommandoschiff im Kampf zerstören, um das Kommandonetz zum Einsturz zu bringen. Kleine Restverbände ziehen sich danach zurück."
 EPOCH_III_SITE_2:0 "Gesicherter Knoten: Trümmeranalyse"
 EPOCH_III_SITE_2_DESC:0 "Ein Forschungsschiff mit Wissenschaftler untersucht die gesicherten Trümmer 90 Tage lang. Ein Standort senkt Nullwächter-Waffenschaden um 10% und begrenzt Nachschub; zwei ersetzen dies durch -20% Waffenschaden und Schilde. Alle Anker und das einzigartige Kommandoschiff im Kampf zerstören, um das Kommandonetz zum Einsturz zu bringen. Kleine Restverbände ziehen sich danach zurück."
 EPOCH_III_SITE_3:0 "Gesicherter Knoten: Trümmeranalyse"
 EPOCH_III_SITE_3_DESC:0 "Ein Forschungsschiff mit Wissenschaftler untersucht die gesicherten Trümmer 90 Tage lang. Ein Standort senkt Nullwächter-Waffenschaden um 10% und begrenzt Nachschub; zwei ersetzen dies durch -20% Waffenschaden und Schilde. Alle Anker und das einzigartige Kommandoschiff im Kampf zerstören, um das Kommandonetz zum Einsturz zu bringen. Kleine Restverbände ziehen sich danach zurück."
 EPOCH_III_SITE_4:0 "Gesicherter Knoten: Trümmeranalyse"
 EPOCH_III_SITE_4_DESC:0 "Ein Forschungsschiff mit Wissenschaftler untersucht die gesicherten Trümmer 90 Tage lang. Ein Standort senkt Nullwächter-Waffenschaden um 10% und begrenzt Nachschub; zwei ersetzen dies durch -20% Waffenschaden und Schilde. Alle Anker und das einzigartige Kommandoschiff im Kampf zerstören, um das Kommandonetz zum Einsturz zu bringen. Kleine Restverbände ziehen sich danach zurück."

 stage_epoch_iii_answer:0 "Die Gegenantwort"
 epoch_iii_first_offensive_stage_epoch_iii_answer:0 "$stage_epoch_iii_answer$"
 epoch_iii.answer_goal:0 "Feindkontakte sind an den markierten Fronten aufgetaucht. Die gemeinsame Beobachtung verfolgt ihren ersten Grenzübertritt oder ihren ersten bestätigten Verlust im Gefecht."
 epoch_iii.local_response:0 "Dieser Ansatz verändert unsere eigene Verteidigung. Monatliche Zuteilungen verdoppeln sich ab 8 Kolonien, vervierfachen sich ab 20 und erreichen ab 40 den achtfachen Grundbetrag. Galaktische Lageberichte folgen weiterhin gemeinsamen militärischen Wendepunkten."
 epoch_iii_mobilize:0 "Werften mobilisieren"
 epoch_iii_mobilize_desc:0 "Beschleunigt den Werftbau von Schiffen um 10%, erhöht aber ihre Baukosten um 10% und ihren Unterhalt um 5%. Die monatlichen Zuteilungen steigen mit der Koloniezahl. Diese Kosten gelten auch beim Wiederaufbau nach einer Niederlage."
 epoch_iii_analyze:0 "Feindliche Systeme analysieren"
 epoch_iii_analyze_desc:0 "Die Zielanalyse erhöht den Schaden ausschließlich gegen Nullwächter um 10%. Abgezogene Fachkräfte senken Forschungsgeschwindigkeit um 5% und Schiffbaugeschwindigkeit um 10%. Öffnet den kostenpflichtigen Vorschlag zur Gegenharmonik. Der monatliche Energiebedarf steigt mit der Koloniezahl."
 epoch_iii_shield:0 "Planetare Abschirmung priorisieren"
 epoch_iii_shield_desc:0 "Lindert zusätzliche Signalstörungen ausschließlich auf betroffenen Welten. Die Vorsorge bindet reichsweit 2% der Produktion aus Tätigkeiten und verbraucht monatlich Energie und Mineralien, abhängig von der Koloniezahl. Dauerhafte Signalabschirmung bleibt eine eigene planetare Entscheidung."
 epoch_iii_counterattack:0 "Koordinierte Gegenoffensive vorbereiten"
 epoch_iii_counterattack_desc:0 "Gezielte Feuerleitung erhöht den Schaden ausschließlich gegen Nullwächter um 20%. Der Schiffsunterhalt steigt um 15%, die Forschungsgeschwindigkeit sinkt um 10%. Monatliche Energie- und Legierungszuteilungen steigen mit der Koloniezahl."
 epoch_iii_command_pressure:0 "Der Befehlsrhythmus"
 epoch_iii_command_pressure_desc:0 "Das aktive Kommandoschiff beschleunigt Bewegung und Feuer der Nullwächter. Seine Zerstörung bricht diese Koordination."
 epoch_iii_interdiction_field:0 "Verbundene Schilde"
 epoch_iii_interdiction_field_desc:0 "Der erste Sperrknoten verstärkt die Schilde aller Nullwächterverbände. Seine Zerstörung unterbricht das Feld."
 epoch_iii.11.machine:0 "Der empfangene Befehl besitzt eine gültige Struktur und eine unbekannte Autorität. Isolierte Knoten bestätigen ihn noch nach der Trennung ihrer Außenverbindungen. Wir leeren ihre Warteschlangen. Die Bestätigung kehrt zurück.\n\nEin Vergleich der Waffentelemetrie zeigt denselben Abstand. Etwas lauscht innerhalb der Antwort."
 epoch_iii.11.hive:0 "Der fremde Abstand drängt gegen unseren gemeinsamen Rhythmus. Mehrere Drohnen erwarten einen Impuls, den wir nicht ausgesandt haben. Wir halten ihre Gedanken getrennt, bis der Zwang nachlässt.\n\nIm leeren Raum antworten die feindlichen Konstruktionen einander. Ihr Takt ist vollkommen. Die Stille dazwischen ist schlimmer."
 epoch_iii.11.veteran:0 "Eine Analystin erkennt eine Lücke in der Aufzeichnung. Sie entspricht einem Abstand, den wir schon im schweigenden Netz gehört haben. Diesmal folgt darauf Waffenfeuer.\n\nDie Besatzungen fragen, ob unsere damalige Antwort endlich ihr Ziel erreicht hat. Wir können es ihnen nicht sagen."

 epoch_iii.shield_effects:0 "Auf ungeschützten Welten mit Signalstörungen werden je nach Schaden bis zu 5% Produktion aus Tätigkeiten und 3 Stabilität wiederhergestellt. Unversehrte und dauerhaft abgeschirmte Welten erhalten keinen Bonus. Die Entlastung endet beim Wechsel des Ansatzes."
 epoch_iii_defense_light:0 "Isolierte Empfangsteams"
 epoch_iii_defense_light_desc:0 "Zeitweilig eingesetzte Teams lindern einen kleinen Teil der zusätzlichen Signalstörung dieser Welt."
 epoch_iii_defense_medium:0 "Getrennte Steuerkreise"
 epoch_iii_defense_medium_desc:0 "Zeitweilige Steuerkreise lindern einen Teil der zusätzlichen Signalstörung. Ältere Planetenschäden bleiben bestehen."
 epoch_iii_defense_heavy:0 "Signalabschirmung im Notbetrieb"
 epoch_iii_defense_heavy_desc:0 "Spezialteams lindern schwere Signalstörungen. Ihre Unterstützung endet, sobald das Reich einen anderen Verteidigungsansatz wählt."
 epoch_iii_studied_network:0 "Entschlüsselte Feuerintervalle"
 epoch_iii_studied_network_desc:0 "Die erste Untersuchung gesicherter Trümmer reduziert den Waffenschaden der Nullwächter um 10%. Ein zweiter untersuchter Standort ersetzt dies durch eine tiefere Störung."
 mod_damage_vs_country_type_epoch_convergence_mult:0 "Schaden gegen Nullwächter"
 epoch_iii.final_location:0 "Bei [Target.GetName] wurden Nullwächterverbände beobachtet. Diese Markierung führt zum Abfangpunkt. Im letzten Gefecht sammeln sie sich an der ersten für sie erreichbaren alten Front; abgeschnittene Gruppen bleiben an ihren Haltepunkten markiert. Das Kommandoschiff verstärkt bedrohte Knoten, solange noch welche bestehen."

 epoch_iii_sites_title:0 "Unklassifizierte Konstruktionen"

 epoch_iii_sites_desc:0 "Erfasste Standorte unbeweglicher Nullwächterkonstruktionen. Gefechtsbeobachtungen erschließen ihre Funktionen. Zerstörte Kontakte werden entfernt."

 epoch_iii.poi.unknown:0 "Unklassifizierte Nullwächterkonstruktion"

 epoch_iii.poi.unknown.desc:0 "Eine unbewegliche bewaffnete Konstruktion wiederholt das Signal. Ihre Funktion ist unbekannt."

 epoch_iii.poi.1:0 "Sperranker"

 epoch_iii.poi.1.desc:0 "Trägt feindliche Schilde (+20%) und örtlichen Nachschub. Militärische Zerstörung stoppt diese Quelle und entfernt die Schildunterstützung."

 epoch_iii.poi.2:0 "Kontaminationsanker"

 epoch_iii.poi.2.desc:0 "Treibt planetare Resonanzschläge und die jährliche Verschlimmerung unbehandelter Belastung an. Zerstörung stoppt beides; Schäden bleiben. In Netzen aus zwei Ankern überträgt er auch Nachschubsignale."

 epoch_iii.poi.3:0 "Signalrelais"

 epoch_iii.poi.3.desc:0 "Koordiniert Nachschub. Zerstörung begrenzt jede andere Quelle auf insgesamt drei Einsätze; bereits entsandte Schiffe bleiben."

 epoch_iii.poi.4:0 "Reserveanker"

 epoch_iii.poi.4.desc:0 "Versorgt eine weitere eigenständige Angriffsfront. Zerstörung beendet seinen Nachschub."

 decision_epoch_iii_contain:0 "Resonanzbelastung eindämmen"

 decision_epoch_iii_contain_desc:0 "Betroffene Habitate, Drohnenbahnen und Verarbeitungskreise isolieren. Stoppt weitere örtliche Verschlimmerung bei einem Verlust von 2% Arbeitsplatzproduktion; bestehender Schaden bleibt."

 decision_epoch_iii_investigate:0 "Aktive Resonanz untersuchen"

 decision_epoch_iii_investigate_desc:0 "Einen isolierten Empfänger lange genug geöffnet halten, um seine Antwort zu verfolgen."

 epoch_iii.sample.tt:0 "Einmal je Welt: +400 Physikforschung. Eingedämmte Welten gewähren zusätzlich zwei Jahre lang +5% Physikforschungstempo. Ohne Eindämmung: 70% Chance auf diese Erkenntnis, 30% Chance auf 10 Verwüstung und schwere örtliche Störung. Keine militärischen Ziele werden erfüllt."

 decision_epoch_iii_treat:0 "Resonanzschäden stabilisieren"

 decision_epoch_iii_treat_desc:0 "Kompromittierte Steuerkreise ersetzen und betroffene Habitate stabilisieren. Die Behandlung bleibt nach dem Ende des Signals verfügbar."

 epoch_iii.treat.tt:0 "Stoppt weitere örtliche Verschlimmerung, entfernt zusätzliche Eskalations- und Eindämmungsabzüge und reduziert die anfängliche Störung auf -1 Stabilität und -1% Arbeitsplatzproduktion. Dämmt unberührte Kontamination dieser Krise ein. Ältere Features, aktive Untersuchungen und Verwüstung bleiben erhalten."

 epoch_iii_force_base:0 "Konvergenter Verband"

 epoch_iii_force_base_desc:0 "Konvergenter Verband."

 epoch_iii_force_late:0 "Verstärkter konvergenter Verband"

 epoch_iii_force_late_desc:0 "Verstärkter konvergenter Verband."

 epoch_iii_force_hard:0 "Gehärteter konvergenter Verband"

 epoch_iii_force_hard_desc:0 "Gehärteter konvergenter Verband."

 epoch_iii_bastion_hull:0 "Befestigter Anker"

 epoch_iii_bastion_hull_desc:0 "Befestigter Anker."

 epoch_iii_contamination_rising:0 "Ausgreifende Resonanz"

 epoch_iii_contamination_rising_desc:0 "Der wiederkehrende Abstand hat die örtlichen Arbeitsabläufe erreicht. Unbehandelte Belastung kann sich nach zwölf Monaten ein weiteres Mal verschlimmern, solange der Kontaminationsanker besteht. Eindämmung oder Signalabschirmung stoppt weitere Verschlimmerung; Stabilisierung behandelt den zusätzlichen Schaden."

 epoch_iii_contamination_severe:0 "Festgesetzte Resonanz"

 epoch_iii_contamination_severe_desc:0 "Die örtliche Resonanz hat sich festgesetzt. Dies ist die letzte Eskalationsstufe. Die Zerstörung des Kontaminationsankers verhindert weitere Verschlimmerung, heilt aber keinen Schaden. Planetare Stabilisierung bleibt nach dem Sieg verfügbar."

 epoch_iii_containment:0 "Resonanzeindämmung"

 epoch_iii_containment_desc:0 "Isolierte Habitate, Drohnenbahnen und Verarbeitungskreise verhindern weitere örtliche Eskalation. Die Trennung bindet planetare Arbeitsleistung. Stabilisierung kann diese Belastung beseitigen."

 epoch_iii_sample_insight:0 "Isolierte Resonanzproben"

 epoch_iii_sample_insight_desc:0 "Sicher isolierte Proben zeigen, wie sich das Signal innerhalb physischer Systeme wiederholt."

 NAME_EPOCH_III_Fortification:0 "Nullwächterbefestigung"
