 EPOCH_III_SITE_1:0 "Gesicherter Knoten: Trümmeranalyse"
 EPOCH_III_SITE_1_DESC:0 "Ein Forschungsschiff mit Wissenschaftler untersucht 180 Tage lang die Trümmer dieses Standorts. Ein untersuchter Standort begrenzt weiteren Nachschub; zwei legen Schwächen in allen verbliebenen Nullwächterwaffen und -schilden offen. Die überlebenden Schiffe müssen weiterhin militärisch besiegt werden."
 EPOCH_III_SITE_2:0 "Gesicherter Knoten: Trümmeranalyse"
 EPOCH_III_SITE_2_DESC:0 "Ein Forschungsschiff mit Wissenschaftler untersucht 180 Tage lang die Trümmer dieses Standorts. Ein untersuchter Standort begrenzt weiteren Nachschub; zwei legen Schwächen in allen verbliebenen Nullwächterwaffen und -schilden offen. Die überlebenden Schiffe müssen weiterhin militärisch besiegt werden."
