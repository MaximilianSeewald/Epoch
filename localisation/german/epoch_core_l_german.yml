l_german:
 epoch_core.2.name:0 "Das erste Echo"
 epoch_core.2.desc:0 "Bei einer routinemäßigen Erkundung zeichnet eines unserer Forschungsschiffe einen schmalen Impuls in diesem System auf. Er wiederholt sich mit einer Präzision, die keine natürliche Quelle dauerhaft halten dürfte, und verschwindet dann zwischen den Messungen. Das Schiff kann für eine sorgfältige Untersuchung bleiben oder die Quelle sofort triangulieren."
 epoch_core.2.a:0 "Den Impuls geduldig kartieren und alle Messwerte sichern."
 epoch_core.2.b:0 "Die Quelle rasch triangulieren, bevor sich das Signal erneut verlagert."
 epoch_core.2.c:0 "Das Signal nicht weiter untersuchen."
 epoch_core.3.name:0 "Ein zweiter Abstand"
 epoch_core.3.desc.cautious:0 "Die ersten Messungen haben ein schwaches Echo unter dem Hauptimpuls sichtbar gemacht. Wir können mehr Zeit in die Kalibrierung investieren oder die breite Vergleichsbasis bewahren und das Schiff langsamer weiterarbeiten lassen."
 epoch_core.3.desc.aggressive:0 "Der schnelle Durchlauf hat eine wandernde Antwort im Signal erfasst. Wir können das Array für eine schmale Spur in den Overdrive treiben und dabei eine beschädigte Messung riskieren oder es drosseln und eine breitere, langsamere Suche akzeptieren."
 epoch_core.3.a:0 "Für eine klarere und sichere Messung kalibrieren."
 epoch_core.3.b:0 "Die breite Vergleichsbasis beibehalten und vorsichtig fortfahren."
 epoch_core.3.c:0 "Das Array in den Overdrive treiben."
 epoch_core.3.d:0 "Drosseln, bevor die Instrumente überlastet werden."
 epoch_core.4.name:0 "Ein geduldiges Muster"
 epoch_core.4.desc:0 "Der ruhige Vergleich enthüllt einen zweiten Impuls, verborgen zwischen den Wiederholungen. Er enthält keine klare Botschaft, nur einen exakten Abstand, den unsere Instrumente nun wiedererkennen. Derselbe Abstand taucht in einem Fragment der letzten Übertragung einer Forschungsexpedition auf."
 epoch_core.4.a:0 "Die eigens zusammengestellte Expedition der letzten Spur folgen lassen."
 epoch_core.5.name:0 "Koordinaten im Rauschen"
 epoch_core.5.desc:0 "Der energische Durchlauf grenzt eine schmale Peilung und einen Teil eines wiederkehrenden Koordinatenmusters ein. Eine Forschungsexpedition folgte der Spur, bevor sie sich verlagerte; ihre letzte Übertragung bricht mitten in einem Schwall Energiewerte ab."
 epoch_core.5.a:0 "Die eigens zusammengestellte Expedition entlang der geborgenen Peilung entsenden."
 epoch_core.6.name:0 "Die vermisste Expedition"
 epoch_core.6.desc.cautious:0 "Das Suchschiff erreicht die letzte Telemetrie, findet aber keinen Peilsender. Jenseits der letzten Position des vermissten Schiffs pulsiert ein Signal weiter – gleichmäßig genug, um ihm zu folgen, doch zu schwach, um sein Ziel zu erkennen."
 epoch_core.6.desc.aggressive:0 "Am Ende der geborgenen Peilung messen die Instrumente eine scharfe Verzerrung. Die Expedition ist verschwunden. Ihr Datenrekorder könnte noch intakt sein, doch hier ist das Rücksignal stärker."
 epoch_core.6.desc.degraded:0 "Die übersteuerten Instrumente haben die schmale Spur verloren. Die Expedition ist verschwunden, und nur eine beschädigte Messung weist auf das stärkere Rücksignal."
 epoch_core.6.desc.standard:0 "An der letzten Position der Expedition herrscht Stille. Jenseits des Endes ihrer Telemetrie pulsiert ein schmaler Impuls weiter."
 epoch_core.6.a:0 "Nach Überlebenden und ihrem Notrufpeilsender suchen."
 epoch_core.6.b:0 "Den Datenrekorder und brauchbare Trümmer bergen."
 epoch_core.6.c:0 "Die weitere Signalspur aus sicherer Entfernung untersuchen."
 epoch_core.6.d:0 "Die Suche beenden und die letzte Position sichern."
 epoch_core.7.name:0 "Eine Lücke im Protokoll"
 epoch_core.7.desc.survivors:0 "Die gerettete Besatzung beschreibt unabhängig voneinander dieselbe fehlende Zeitspanne. Niemand erinnert sich, was darin geschah, doch alle hörten den Signalgeber weiter pulsieren."
 epoch_core.7.desc.recorder:0 "Der geborgene Rekorder isoliert einen zweiten Impuls, der schon vor dem Kontaktverlust der Expedition beginnt – als hätte das Signal ihre Route vorausgesehen."
 epoch_core.7.desc.survey:0 "Die weiträumige Untersuchung findet weder Schiff noch Besatzung, zeichnet aber eine kurze Verzerrung mit demselben zeitlichen Muster wie das erste Echo auf."
 epoch_core.7.desc.failed:0 "Die Suche liefert nur Fragmente, die zu beschädigt sind, um ein Überleben festzustellen. Das Expeditionsschiff bleibt vermisst, und die Aufzeichnungen erklären die Lücke nicht."
 epoch_core.7.desc.abandoned:0 "Der versiegelte Bericht hält die letzte bekannte Position und den Zeitpunkt des Kontaktverlusts fest. Die Expedition bleibt ungeklärt, doch ihr Verlust ist nun dokumentiert."
 epoch_core.7.a:0 "Den Bericht für spätere Untersuchungen sichern."
 epoch_first_echo_investigation:0 "Das erste Echo"
 epoch_first_echo_investigation_desc:0 "Ein bei einer routinemäßigen Erkundung entdecktes Signal widersetzt sich jeder Erklärung. Jedes abgeschlossene Bordprojekt ergänzt ein weiteres Zeitintervall und grenzt das Suchgebiet ein – der Ursprung bleibt jedoch knapp außerhalb unserer Gewissheit."
 epoch_first_echo_phase_signal:0 "Die Impulsabstände vergleichen und den Umgang mit dem Signalarray festlegen."
 epoch_first_echo_phase_source:0 "Der Spur des Signals und der vermissten Forschungsexpedition folgen."
 EPOCH_FIRST_ECHO_CAUTIOUS:0 "Eine ruhige Vergleichsbasis erstellen"
 EPOCH_FIRST_ECHO_CAUTIOUS_DESC:0 "Eine lange Beobachtung mit geringer Leistung trennt den wiederkehrenden Impuls vom örtlichen Hintergrundrauschen."
 EPOCH_FIRST_ECHO_AGGRESSIVE:0 "Das wandernde Signal triangulieren"
 EPOCH_FIRST_ECHO_AGGRESSIVE_DESC:0 "Ein schneller Hochleistungsdurchlauf könnte das Signal erfassen, bevor es sich erneut verlagert."
 EPOCH_ECHO_CALIBRATION:0 "Die Langbasis kalibrieren"
 EPOCH_ECHO_CALIBRATION_DESC:0 "Eine sorgfältige Kalibrierung isoliert ein schwaches zweites Zeitintervall im Signal."
 EPOCH_ECHO_BASELINE:0 "Den passiven Vergleich fortsetzen"
 EPOCH_ECHO_BASELINE_DESC:0 "Ein langsamerer Vergleich bewahrt eine breite Aufzeichnung, ohne die Instrumente zu belasten."
 EPOCH_ECHO_OVERDRIVE:0 "Das Signal scharf verriegeln"
 EPOCH_ECHO_OVERDRIVE_DESC:0 "Ein kurzer, leistungsstarker Durchlauf könnte die Peilung der Quelle enthüllen, bevor sie sich bewegt."
 EPOCH_ECHO_THROTTLED:0 "Der schwachen Antwort folgen"
 EPOCH_ECHO_THROTTLED_DESC:0 "Ein Scan mit reduzierter Leistung folgt der breiteren und unsichereren Antwort."
 EPOCH_MISSING_EXPEDITION:0 "Die letzte Spur der Expedition untersuchen"
 EPOCH_MISSING_EXPEDITION_DESC:0 "Dem Impuls bis über den Punkt folgen, an dem die Forschungsexpedition verstummte."
 EPOCH_EXPEDITION_RESCUE:0 "Nach der vermissten Besatzung suchen"
 EPOCH_EXPEDITION_RESCUE_DESC:0 "Eine geduldige Suche konzentriert sich auf Notrufsender und überlebensfähige Wrackteile."
 EPOCH_EXPEDITION_SALVAGE:0 "Den Expeditionsrekorder bergen"
 EPOCH_EXPEDITION_SALVAGE_DESC:0 "Ein gezielter Bergungsscan könnte den Rekorder finden, bevor sich das Signal erneut verlagert."
 EPOCH_EXPEDITION_SURVEY:0 "Die Signalspur kartieren"
 EPOCH_EXPEDITION_SURVEY_DESC:0 "Eine breite, langsame Untersuchung kartiert die Spur und hält das Schiff auf Abstand."
 epoch_first_echo_investigation_type:0 "Signalsuche"
 epoch_first_echo_investigation_monthly_change_tooltip:0 "$situation_monthly_change_tooltip_no_control$"
 stage_signal_analysis:0 "Signalanalyse"
 stage_source_analysis:0 "Quellenanalyse"
 epoch_core.20.name:0 "Eine Veränderung ohne erkennbare Quelle"
 epoch_core.20.desc.organic:0 "Zellen aus den letzten Proben der Expedition stimmen nicht mehr mit ihren früheren Aufzeichnungen überein. Ähnliche Veränderungen treten auch bei Organismen auf unserer Hauptwelt auf. Wir können die betroffenen Orte untersuchen, sie unter hohen Kosten isolieren oder das Muster unbehelligt lassen. Eine Erklärung für die Übereinstimmung fehlt."
 epoch_core.20.desc.hive:0 "Einige lokale biologische Abläufe wiederholen nun ein Signalintervall, das im Rest des Schwarms nicht vorkommt. Wir können die betroffenen Knoten untersuchen, sie unter hohen Kosten isolieren oder die Abweichung fortbestehen lassen. Die Ursache fehlt in unseren Aufzeichnungen."
 epoch_core.20.desc.machine:0 "Prozesse auf unserer Hauptwelt geben Datenstrukturen zurück, die in ihrem ursprünglichen Zustand nicht vorkamen. Wir können die betroffenen Systeme untersuchen, sie unter hohen Kosten isolieren oder den Prozess fortbestehen lassen. Eine Quelle wurde nicht gefunden."
 epoch_core.20.a:0 "Die Veränderungen in einer gezielten Studie verfolgen."
 epoch_core.20.b:0 "Die betroffenen Orte sofort isolieren."
 epoch_core.20.c:0 "Den Prozess unbehelligt lassen."
 epoch_core.22.name:0 "Die stille Struktur"
 epoch_core.22.desc.organic:0 "Das veränderte Material auf unserer Hauptwelt bildet eine regelmäßige Grenze um einen versiegelten Hohlraum. Seine Oberflächen wiederholen dasselbe Intervall wie das Signal und die Aufzeichnungen der Expedition. Kein Instrument kann feststellen, wie die Zeichen entstanden. Wir können die Struktur untersuchen, den Zugang sichern oder die freigelegten Überreste zerstören."
 epoch_core.22.desc.hive:0 "Unter dem veränderten biologischen Netzwerk wurde eine Struktur gefunden. Ihre Grenzen wiederholen dasselbe Intervall wie das Signal und die Aufzeichnungen der vermissten Expedition. Der Schwarm kann nicht feststellen, ob sie aktiv ist. Wir können sie untersuchen, sichern oder zerstören."
 epoch_core.22.desc.machine:0 "Unter den beschädigten Prozessen ist eine vergrabene Struktur sichtbar geworden. Ihre Oberfläche trägt das Intervall aus dem Signal und den Expeditionsaufzeichnungen, doch es gibt keinen passenden Bauplan. Wir können sie analysieren, sichern oder zerstören."
 epoch_core.22.a:0 "Die Struktur und ihre wiederkehrenden Zeichen untersuchen."
 epoch_core.22.b:0 "Den Ort für kontrollierten Zugang sichern."
 epoch_core.22.c:0 "Die freigelegte Struktur zerstören."
 epoch_core.23.name:0 "Ein unvollständiger Bericht"
 epoch_core.23.desc.organic:0 "Die versiegelten Berichte stimmen darin überein, was sich verändert hat, nicht aber warum. Die betroffene Welt bleibt verändert. Unsere Instrumente bewahren mehrere Fragmente mit einem gemeinsamen Zeitmuster, doch keines zeigt, wer oder was sie hervorgebracht hat oder ob es aufgehört hat."
 epoch_core.23.desc.hive:0 "Im Netzwerk der betroffenen Welt bleibt eine dauerhafte Unterbrechung bestehen. Die geborgenen Intervalle stimmen überein, doch ihr Ursprung und ihr Zusammenhang bleiben ungeklärt. Der Schwarm kann nicht feststellen, ob das Muster beendet ist."
 epoch_core.23.desc.machine:0 "In den Produktionssystemen der betroffenen Welt bleibt ein dauerhafter Defekt. Die geborgenen Aufzeichnungen enthalten ein wiederkehrendes Intervall, doch keine Spur weist auf Urheber, Zweck oder gegenwärtigen Zustand hin."
 epoch_core.23.desc.ruined:0 "Die freigelegte Struktur ist zerstört und der Ort zu stark beschädigt, um ihn weiter zu untersuchen. Der Verlust der Expedition und die Veränderungen auf dieser Welt sind dokumentiert, doch keine erhaltene Spur erklärt ihre Ursache."
 epoch_core.23.desc.secured:0 "Die Struktur ist hinter einem kontrollierten Zugang versiegelt. Wir bargen Fragmente der Expedition und der betroffenen Welt, doch ihre wiederkehrenden Intervalle erklären weder Ursprung noch Ende des Prozesses."
 epoch_core.23.desc.studied:0 "Die Zeichen der Struktur stimmen mit Fragmenten der vermissten Expedition und der betroffenen Welt überein. Diese Übereinstimmung lässt sich messen, doch Ursache, Urheber und Zweck bleiben unbekannt. Der Bericht ist unvollständig."
 epoch_core.23.a:0 "Die Instrumente weiter betreiben und den Spuren folgen."
 epoch_core.23.b:0 "Die Aufzeichnungen versiegeln und weiteren Zugang untersagen."
 EPOCH_CONTAMINATION_STUDY:0 "Die veränderten Prozesse untersuchen"
 EPOCH_CONTAMINATION_STUDY_DESC:0 "Betroffene Proben und Systeme vergleichen, ohne eine gemeinsame Ursache vorauszusetzen."
 EPOCH_STRUCTURE_ANALYSIS:0 "Die stille Struktur analysieren"
 EPOCH_STRUCTURE_ANALYSIS_DESC:0 "Geometrie und wiederkehrende Zeichen der Struktur mit früheren Beobachtungen vergleichen."
 epoch_core_contamination_active:0 "Instabile lokale Prozesse"
 epoch_core_contamination_active_desc:0 "Eine unerklärte Veränderung beeinträchtigt lokale Produktion und Stabilität."
 epoch_core_contamination_worsened:0 "Schwere lokale Störung"
 epoch_core_contamination_worsened_desc:0 "Die unerklärte Veränderung hat sich verstärkt und stört Produktion und Stabilität."
 epoch_core_silent_structure:0 "Stille Struktur"
 epoch_core_silent_structure_desc:0 "Auf dieser Welt wurde eine unerklärte Struktur freigelegt."
 epoch_core_structure_secured:0 "Gesicherte Struktur"
 epoch_core_structure_secured_desc:0 "Kontrollierter Zugang zur Struktur unterstützt technische Arbeiten."
 epoch_core_structure_ruins:0 "Strukturüberreste"
 epoch_core_structure_ruins_desc:0 "Die freigelegte Struktur wurde zerstört und hinterließ einen beschädigten Ort."
 epoch_core_permanent_scar_organic:0 "Anhaltender biologischer Schaden"
 epoch_core_permanent_scar_organic_desc:0 "Eine dauerhafte biologische Veränderung beeinträchtigt weiterhin die Produktion auf dieser Welt."
 epoch_core_permanent_scar_hive:0 "Anhaltender Netzwerkschaden"
 epoch_core_permanent_scar_hive_desc:0 "Eine dauerhafte Unterbrechung beeinträchtigt weiterhin die Arbeit des Schwarms auf dieser Welt."
 epoch_core_permanent_scar_machine:0 "Anhaltender Prozessschaden"
 epoch_core_permanent_scar_machine_desc:0 "Ein dauerhafter Prozessdefekt beeinträchtigt weiterhin die Produktion auf dieser Welt."
 epoch_core_permanent_scar_exacerbated:0 "Schwerer anhaltender Schaden"
 epoch_core_permanent_scar_exacerbated_desc:0 "Verluste und Störungen der Untersuchung haben diese Welt zusätzlich und dauerhaft belastet."
 epoch_core_permanent_scar_fallback:0 "Anhaltende reichsweite Störung"
 epoch_core_permanent_scar_fallback_desc:0 "Ein dauerhafter Systemfehler verringert weiterhin die Energieproduktion des Reiches."
 epoch_core_permanent_scar_exacerbated_fallback:0 "Schwerer anhaltender Systemschaden"
 epoch_core_permanent_scar_exacerbated_fallback_desc:0 "Verluste und Störungen verringern zusätzlich und dauerhaft die Energieproduktion."
 NAME_EPOCH_Expedition:0 "Signalsuchschiff"
 NAME_EPOCH_Expedition_Ship:0 "Letzter Meridian"
