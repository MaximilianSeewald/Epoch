 d_epoch_resonance_latent_desc:0 "Eine latente Spur eröffnet eine geringe Forschungsgelegenheit bei geringen wirtschaftlichen Folgen."
 d_epoch_resonance_active:0 "Resonanznarbe"
 d_epoch_resonance_active_desc:0 "Aktive Resonanz steigert die Physikforschung, stört jedoch Produktion und Stabilität der Welt."
 d_epoch_resonance_unstable:0 "Gebrochene Resonanz"
 d_epoch_resonance_unstable_desc:0 "Das zerklüftete Muster erzeugt starke Messwerte und stört zugleich die örtliche Produktion und Stabilität."
 d_epoch_resonance_controlled:0 "Gebundene Resonanz"
 d_epoch_resonance_controlled_desc:0 "Eine kontrollierte Narbe verbessert Forschung und Produktivität und stabilisiert die Welt."
 epoch_ii_resonance_latent:0 "Latente Echo-Narbe"
 epoch_ii_resonance_latent_desc:0 "Die latente Resonanzspur eröffnet eine geringe Chance auf Physikforschung bei geringen wirtschaftlichen Folgen."
 epoch_ii_resonance_active:0 "Aktive Resonanznarbe"
 epoch_ii_resonance_active_desc:0 "Aktive Resonanz steigert die Physikforschung, senkt jedoch planetaren Ertrag und Stabilität."
 epoch_ii_resonance_unstable:0 "Gebrochene Resonanz"
 epoch_ii_resonance_unstable_desc:0 "Instabile Resonanz liefert starke Forschung und senkt Ertrag und Stabilität der Welt erheblich."
 epoch_ii_resonance_controlled:0 "Gebundene Resonanz"
 epoch_ii_resonance_controlled_desc:0 "Die gebundene Narbe verbessert Forschung, planetaren Ertrag und Stabilität."
 epoch_ii_breakthrough_sacrifice:0 "Ertragsverlust am Durchbruchsort"
 epoch_ii_breakthrough_sacrifice_desc:0 "Dauerhafte lokale Produktionseinbußen bewahren die Messdaten des Kontaminationsdurchbruchs."
epoch_ii_ending_boundary:0 "Überwachungsprotokoll der Grenze"
epoch_ii_ending_boundary_desc:0 "Fortlaufende Überwachung unterdrückt den lokalen Kanal und kostet Energie sowie Forschung."
epoch_ii_ending_guarded_listening:0 "Bewachter Resonanzkanal"
epoch_ii_ending_guarded_listening_desc:0 "Der aktive Kanal verbessert die Forschung, erfordert jedoch Sicherheitsausgaben und birgt Zwischenfallrisiken."
epoch_ii_ending_outward_signal:0 "Ausrichtung des Außensignals"
epoch_ii_ending_outward_signal_desc:0 "Das umgeleitete Signal verbessert Ortung und Feuerleitsysteme, macht das Reich sichtbarer und senkt die Stabilität."
epoch_ii_ending_broken_instrument:0 "Aufzeichnung der zerstörten Kammer"
epoch_ii_ending_broken_instrument_desc:0 "Das Instrument ist zerbrochen. Forschung und Legierungsertrag sinken; die Ursprungswelt trägt eine dauerhafte Ruine."
epoch_ii_ch7_crisis_scars:0 "Resonanznarben der Krise"
epoch_ii_ch7_crisis_scars_desc:0 "Planetare Abläufe bleiben nach dem Kammerschub beeinträchtigt."
epoch_ii_chamber_ruin:0 "Ruine der Resonanzkammer"
epoch_ii_chamber_ruin_desc:0 "Die Kammer wurde zerstört. Beschädigte Infrastruktur senkt dauerhaft Forschung und Energieertrag."
d_epoch_chamber_ruin:0 "Zerstörte Resonanzkammer"

tech_epoch_contamination_neutral_infrastructure:0 "Kontaminationsneutrale Infrastruktur"
tech_epoch_contamination_neutral_infrastructure_desc:0 "Ein modulares Normenpaket isoliert kontaminierte Prozesse in gewöhnlichen Industrie- und Forschungsnetzen, statt sie weiter zu versorgen. Die Gebäude helfen auf jeder Welt und bieten zusätzliche Eindämmungs- oder Resonanzeffekte an veränderten Standorten."
building_epoch_containment_infrastructure:0 "Eindämmungsinfrastruktur"
building_epoch_containment_infrastructure_desc:0 "Lokale Isolationsanlagen verbessern Gesellschaftsforschung und Stabilität. Sie ermöglichen saubere Resonanzproben ohne Quarantäne."
d_epoch_resonance_contamination_active:0 "Aktive Resonanzkontamination"
d_epoch_resonance_contamination_active_desc:0 "Die aktive Kontamination senkt die Stabilität und die Produktion lokaler Arbeitsplätze."
d_epoch_resonance_contamination_worsened:0 "Verschlimmerte Resonanzkontamination"
d_epoch_resonance_contamination_worsened_desc:0 "Nach einer gescheiterten oder vernachlässigten Untersuchung hat sich die Kontamination verschärft. Ihre Folgen sind schwerwiegender und können sich ausbreiten."
d_epoch_resonance_contamination_studied:0 "Untersuchte Resonanzkontamination"
d_epoch_resonance_contamination_studied_desc:0 "Die hier genommenen Proben haben einen Teil der Störung offengelegt. Trotz der abgeschwächten Auswirkungen hält sich ein Restmuster in örtlichen Prozessen."
d_epoch_resonance_contamination_contained:0 "Eingedämmte Resonanzkontamination"
d_epoch_resonance_contamination_contained_desc:0 "Die aktive Kontamination wurde eingedämmt. Ihre Geschichte bleibt hier verzeichnet; die früheren planetaren Mali sind aufgehoben."
d_epoch_resonance_contamination_latent:0 "Latente Resonanz"
d_epoch_resonance_contamination_latent_desc:0 "Eine latente Resonanz steigert die Physikforschung leicht und senkt die Stabilität. Eine ungelöste Kontamination aus früheren Untersuchungen wirkt weiter."
d_epoch_resonance_contamination_resonant:0 "Aktive Resonanz"
d_epoch_resonance_contamination_resonant_desc:0 "Die Resonanz steigert die Physikforschung, senkt jedoch Stabilität und allgemeine Arbeitsproduktion. Eine ungelöste Kontamination aus früheren Untersuchungen wirkt weiter."
d_epoch_resonance_contamination_unstable:0 "Instabile Resonanz"
d_epoch_resonance_contamination_unstable_desc:0 "Die instabile Resonanz steigert die Physikforschung stark, senkt aber Stabilität und Arbeitsproduktion erheblich. Eine ungelöste Kontamination aus früheren Untersuchungen wirkt weiter."
d_epoch_resonance_contamination_controlled:0 "Kontrollierte Resonanz"
d_epoch_resonance_contamination_controlled_desc:0 "Die kontrollierte Resonanz verbessert Physikforschung, allgemeine Arbeitsproduktion und Stabilität. Eine ungelöste Kontamination aus früheren Untersuchungen wirkt weiter."
d_epoch_resonance_scar:0 "Aktive Resonanznarbe"
 d_epoch_resonance_scar_desc:0 "Eine dauerhafte Spur stört die Produktionsrhythmen und die Stabilität dieser Welt."
d_epoch_resonance_scar_altered:0 "Veränderte Resonanznarbe"
d_epoch_resonance_scar_altered_desc:0 "Die Narbe hat sich verändert. Ihre Folgen sind geringer, doch der ursprüngliche Schaden ist nicht vollständig geheilt."
d_epoch_resonance_scar_healed:0 "Geheilte Resonanznarbe"
d_epoch_resonance_scar_healed_desc:0 "Die Resonanznarbe ist verheilt. Das dauerhafte planetare Produktionsmali wirkt nicht länger."
d_epoch_silent_structure_unsecured:0 "Ungesicherte stille Struktur"
d_epoch_silent_structure_unsecured_desc:0 "Die unerklärte Struktur ist noch nicht untersucht. Sie steigert die Physikforschung leicht."
d_epoch_silent_structure_secured:0 "Gesicherte stille Struktur"
d_epoch_silent_structure_secured_desc:0 "Die Struktur ist gesichert. Ihre Vermessung und technische Arbeit unterstützen die Forschung."
d_epoch_silent_structure_investigated:0 "Untersuchte stille Struktur"
d_epoch_silent_structure_investigated_desc:0 "Die Struktur wurde untersucht; die Aufzeichnungen ermöglichen weitere Forschung."
d_epoch_silent_structure_destroyed:0 "Zerstörte stille Struktur"
d_epoch_silent_structure_destroyed_desc:0 "Die Struktur wurde zerstört. Der beschädigte Standort senkt die planetare Stabilität."
epoch_res.exit:0 "Unsere Untersuchung dauerhaft beenden."
epoch_res.ack:0 "Verstanden."
epoch_res.90.name:0 "Eine abgeschlossene Akte"
epoch_res.90.desc:0 "Die erhaltenen Resonanzaufzeichnungen tragen keine erneute Expedition. Die Einsatzleitung hat die zugehörigen Arbeiten ausgesetzt und die unvollständige Vermessung versiegelt. Die Folgen auf unseren Welten bleiben bestehen."
epoch_res.begin:0 "Die Untersuchung der Narbe finanzieren."
epoch_res.archive:0 "Das ferne Signal bei unserer Hauptstadt rekonstruieren."
epoch_res.later:0 "Den Antrag zur weiteren Prüfung zurückstellen."
epoch_res.1.name:0 "Die Narbe erwacht"
epoch_res.1.desc:0 "Die Empfänger an der alten Fundstelle folgen wieder dem vertrauten Intervall. Ihre neuen Messungen passen so genau zur archivierten Spur, dass unsere Analysten zuerst die Uhren und dann das Signal überprüften. Beides war fehlerfrei.\n\n[Root.GetEpochEchoSummary] [Root.GetEpochExpeditionSummary]\n\n[Root.GetEpochContaminationSummary] [Root.GetEpochStructureSummary] [Root.GetEpochScarSummary]\n\n[Root.GetEpochResonanceClass] Eine erneute Vermessung könnte feststellen, was sich verändert hat, seit die Instrumente zuletzt verstummten."
epoch_res.recon:0 "Das Zielmuster analysieren."
epoch_res.fight:0 "Unsere Flotten und Verteidigung vorbereiten."
epoch_res.20.name:0 "Die ersten Jäger"
epoch_res.20.desc:0 "[Root.GetEpochHunterLocation]\n\nDie unabhängigen Messungen lösen eine bewegliche Formation dort auf, wo sich das Signal zurückfaltet. Unsere Rufe bleiben unbeantwortet. Ihre Schiffe wenden gleichzeitig, und jeder Waffenscan hinterlässt dieselbe schmale Lücke in der Hintergrundübertragung.\n\nDie Einsatzleitung hat einen bewachten Bereich ausgemacht. Der wissenschaftliche Stab schlägt eine Untersuchung des Zielrhythmus vor, während sich unsere Flotten auf die Begegnung vorbereiten."
epoch_res.salvage:0 "Die Gefechtsfragmente bergen."
epoch_res.battle_archive:0 "Gesicherte Gefechtsdaten rekonstruieren."
epoch_res.30.name:0 "Der gebrochene Code"
epoch_res.30.desc:0 "Das letzte feindliche Echo ist von der taktischen Anzeige verschwunden. Zwischen den Wracks setzt ein Sender eine Folge fort, die keinem Notruf gleicht: Er wiederholt Korrekturen für ein Signal, das nicht mehr vorhanden ist.\n\n[Root.GetEpochBattleSummary]\n\nDie erhaltenen Fragmente treiben auseinander. Ein Bergungsteam könnte ihre Aufzeichnungen sichern, bevor Entfernung und Schäden die Folge unlesbar machen."
epoch_res.careful:0 "Die Aufzeichnungen vorsichtig vergleichen."
epoch_res.risk:0 "Synchronisation erzwingen."
epoch_res.31.name:0 "Ein Muster gegen das Signal"
epoch_res.31.desc:0 "Die isolierte Signatur passt in die Lücken unserer frühesten Aufzeichnungen. Jeder Vergleich macht die Korrekturfolge deutlicher, doch die Empfangsanlage wiederholt inzwischen Teile davon, nachdem der Versuch bereits beendet ist.\n\nDas Archivteam kann mit abgeschirmten Vergleichen fortfahren. Eine erzwungene Synchronisierung würde mehr von der Folge erfassen und zugleich unsere Systeme dem Verhalten aussetzen, das wir messen wollen."
epoch_res.40.name:0 "Die zweite Infektion"
epoch_res.40.desc:0 "[Root.GetEpochInfectedLocation]\n\nDas aus den Wracks geborgene Intervall erscheint nun in örtlichen Produktionsaufzeichnungen. Anlagen ohne gemeinsame Verbindung beginnen ihren Zyklus im selben Augenblick; das Muster bleibt bestehen, wenn einzelne Einrichtungen abgeschaltet werden.\n\n[Root.GetEpochResonanceClass]\n\nDie planetaren Teams benötigen die Befugnis, die betroffenen Bezirke zu kartieren und den Zugang zu kontrollieren. Ihre Maßnahmen stehen in den planetaren Entscheidungen bereit."
epoch_res.listen:0 "Das Netzwerk stillhalten."
epoch_res.pulse:0 "Einen kontrollierten Impuls senden."
epoch_res.repeat:0 "Das Muster der Jäger wiederholen."
epoch_res.50.name:0 "Das Netzwerk der Stille"
epoch_res.50.desc:0 "Nachdem die örtliche Reaktion eingedämmt ist, können die Observatorien drei entfernte Echos trennen, die darunter verborgen lagen. Eines trifft verspätet ein. Eines entfernt Teile der umgebenden Übertragung. Das dritte bricht mitten in einer wiederkehrenden Folge ab.\n\nAlle drei sind zur Untersuchung markiert. Unsere Empfänger können still bleiben, einen dosierten Impuls senden oder das von den Jägern geborgene Muster wiederholen. Der letzte Vorschlag würde die Folge erneut in einen offenen Kanal geben."
epoch_res.51.name:0 "Eine verzögerte Reflexion"
epoch_res.51.desc:0 "An der ersten Station wiederholen sich Zeitmarken in derselben Reihenfolge in Aufnahmen, die Jahre auseinanderliegen. Die Anlage leitet eine Übertragung weiter, die älter als unsere Expedition ist. Ihre Verzögerungen folgen einem messbaren Pfad statt der örtlichen Entfernung.\n\n[Root.GetEpochReflectionSummary]\n\nDas Team hat die Intervalle gesichert. Eine lesbare Kennung enthält die erhaltene Übertragung nicht."
epoch_res.52.name:0 "Ein Motor der Stille"
epoch_res.52.desc:0 "Die zweite Station erzeugt ihre Stille selbst. Instrumente auf beiden Seiten erfassen eine unversehrt eintretende Übertragung, die auf der anderen Seite stets ohne dieselben schmalen Frequenzen austritt. Die Steuerstruktur entspricht der Korrekturfolge aus den Wracks der Jäger.\n\n[Root.GetEpochSilenceSummary]\n\nDas Team kann beschreiben, was die Station entfernt. Es hat keine Aufzeichnung gefunden, die erklärt, warum gerade diese Frequenzen ausgewählt wurden."
epoch_res.60.name:0 "Jenseits des Schutzbereichs"
epoch_res.60.desc:0 "Auf der abschließenden Messkarte zieht sich das Intervall der alten Narbe durch die Gefechtsaufzeichnungen, die veränderte Welt und alle drei Stationen. Die Beobachtungen lassen sich nun aufeinander ausrichten. Wer den Austausch begann, verraten sie weiterhin nicht.\n\n[Root.GetEpochBattleSummary] [Root.GetEpochContaminationSummary] [Root.GetEpochStructureSummary]\n\nDie örtliche Reaktion ist eingedämmt. Die Formation, die unseren Zugang sperrte, ist vernichtet. Doch rechnet man ihre Korrekturen aus den Aufzeichnungen heraus, bleibt eine Übertragung mit Pausen dort, wo unsere Instrumente eine Antwort erwarten. Weitere Echos liegen im Rauschen, zu schwach, um sie zu lesen.\n\nDie zusammengetragenen Belege liegen vor uns. Wir können weiter lauschen oder die Untersuchung dauerhaft versiegeln. Keiner der beiden Befehle wird rückgängig machen, was diese Untersuchungen hinterlassen haben.\n\n[Root.GetEpochContainmentSummary] [Root.GetEpochNetworkChoiceSummary]\n\n[Root.GetEpochClosingClass]"
epoch_res.retry_reflection:0 "Das Vor-Ort-Projekt erneut ansetzen."
epoch_res.remote_reflection:0 "Fernmessungen finanzieren."
epoch_res.70.name:0 "Eine Messung wiederherstellen"
epoch_res.70.desc:0 "Der Kontakt zum Messteam brach ab, bevor das Echo der Station aufgelöst werden konnte. Die markierte Beobachtung kann vor Ort wiederholt werden. Geht der Zugang verloren, kann ein Forschungsschiff die erhaltenen Aufzeichnungen an der Hauptstadt untersuchen."
epoch_res.retry_silence:0 "Das Vor-Ort-Projekt erneut ansetzen."
epoch_res.remote_silence:0 "Fernmessungen finanzieren."
epoch_res.71.name:0 "Eine Messung wiederherstellen"
epoch_res.71.desc:0 "Der Kontakt zum Messteam brach ab, bevor das Echo der Station aufgelöst werden konnte. Die markierte Beobachtung kann vor Ort wiederholt werden. Geht der Zugang verloren, kann ein Forschungsschiff die erhaltenen Aufzeichnungen an der Hauptstadt untersuchen."
