l_german:
 epoch_core.2.name:0 "Das erste Echo"
 epoch_core.2.desc:0 "Bei einer routinemäßigen Erkundung zeichnet eines unserer Forschungsschiffe einen schmalen Impuls in diesem System auf. Er wiederholt sich mit einer Präzision, die keine natürliche Quelle dauerhaft halten dürfte, und verschwindet dann zwischen den Messungen. Das Schiff kann für eine sorgfältige Untersuchung bleiben oder die Quelle sofort triangulieren."
 epoch_core.2.a:0 "Den Impuls geduldig kartieren und alle Messwerte sichern."
 epoch_core.2.b:0 "Die Quelle rasch triangulieren, bevor sich das Signal erneut verlagert."
 epoch_core.2.c:0 "Das Signal nicht weiter untersuchen."
 epoch_core.3.name:0 "Ein zweiter Abstand"
 epoch_core.3.desc.cautious:0 "Die ersten Messungen haben ein schwaches Echo unter dem Hauptimpuls sichtbar gemacht. Wir können mehr Zeit in die Kalibrierung investieren oder die breite Vergleichsbasis bewahren und das Schiff langsamer weiterarbeiten lassen."
 epoch_core.3.desc.aggressive:0 "Der schnelle Durchlauf hat eine wandernde Antwort im Signal erfasst. Wir können das Array für eine schmale Spur in den Overdrive treiben und dabei eine beschädigte Messung riskieren oder es drosseln und eine breitere, langsamere Suche akzeptieren."
 epoch_core.3.a:0 "Für eine klarere und sichere Messung kalibrieren."
 epoch_core.3.b:0 "Die breite Vergleichsbasis beibehalten und vorsichtig fortfahren."
 epoch_core.3.c:0 "Das Array in den Overdrive treiben."
 epoch_core.3.d:0 "Drosseln, bevor die Instrumente überlastet werden."
 epoch_core.4.name:0 "Ein geduldiges Muster"
 epoch_core.4.desc:0 "Der ruhige Vergleich enthüllt einen zweiten Impuls, verborgen zwischen den Wiederholungen. Er enthält keine klare Botschaft, nur einen exakten Abstand, den unsere Instrumente nun wiedererkennen. Derselbe Abstand taucht in einem Fragment der letzten Übertragung einer Forschungsexpedition auf."
 epoch_core.4.a:0 "Ein Wissenschaftsschiff unserer Wahl der letzten Spur folgen lassen."
 epoch_core.5.name:0 "Koordinaten im Rauschen"
 epoch_core.5.desc:0 "Der energische Durchlauf grenzt eine schmale Peilung und einen Teil eines wiederkehrenden Koordinatenmusters ein. Eine Forschungsexpedition folgte der Spur, bevor sie sich verlagerte; ihre letzte Übertragung bricht mitten in einem Schwall Energiewerte ab."
 epoch_core.5.a:0 "Ein Wissenschaftsschiff unserer Wahl entlang der geborgenen Peilung entsenden."
 epoch_core.6.name:0 "Die vermisste Expedition"
 epoch_core.6.desc.cautious:0 "Das Suchschiff erreicht die letzte Telemetrie, findet aber keinen Peilsender. Jenseits der letzten Position des vermissten Schiffs pulsiert ein Signal weiter – gleichmäßig genug, um ihm zu folgen, doch zu schwach, um sein Ziel zu erkennen."
 epoch_core.6.desc.aggressive:0 "Am Ende der geborgenen Peilung messen die Instrumente eine scharfe Verzerrung. Die Expedition ist verschwunden. Ihr Datenrekorder könnte noch intakt sein, doch hier ist das Rücksignal stärker."
 epoch_core.6.desc.degraded:0 "Die übersteuerten Instrumente haben die schmale Spur verloren. Die Expedition ist verschwunden, und nur eine beschädigte Messung weist auf das stärkere Rücksignal."
 epoch_core.6.desc.standard:0 "An der letzten Position der Expedition herrscht Stille. Jenseits des Endes ihrer Telemetrie pulsiert ein schmaler Impuls weiter."
 epoch_core.6.a:0 "Nach Überlebenden und ihrem Notrufpeilsender suchen."
 epoch_core.6.b:0 "Den Datenrekorder und brauchbare Trümmer bergen."
 epoch_core.6.c:0 "Die weitere Signalspur aus sicherer Entfernung untersuchen."
 epoch_core.6.d:0 "Die Suche beenden und die letzte Position sichern."
 epoch_core.7.name:0 "Eine Lücke im Protokoll"
 epoch_core.7.desc.survivors:0 "Die gerettete Besatzung beschreibt unabhängig voneinander dieselbe fehlende Zeitspanne. Niemand erinnert sich, was darin geschah, doch alle hörten den Signalgeber weiter pulsieren."
 epoch_core.7.desc.recorder:0 "Der geborgene Rekorder isoliert einen zweiten Impuls, der schon vor dem Kontaktverlust der Expedition beginnt – als hätte das Signal ihre Route vorausgesehen."
 epoch_core.7.desc.survey:0 "Die weiträumige Untersuchung findet weder Schiff noch Besatzung, zeichnet aber eine kurze Verzerrung mit demselben zeitlichen Muster wie das erste Echo auf."
 epoch_core.7.desc.failed:0 "Die Suche liefert nur Fragmente, die zu beschädigt sind, um ein Überleben festzustellen. Das Expeditionsschiff bleibt vermisst, und die Aufzeichnungen erklären die Lücke nicht."
 epoch_core.7.desc.abandoned:0 "Der versiegelte Bericht hält die letzte bekannte Position und den Zeitpunkt des Kontaktverlusts fest. Die Expedition bleibt ungeklärt, doch ihr Verlust ist nun dokumentiert."
 epoch_core.7.a:0 "Den Bericht für spätere Untersuchungen sichern."
 epoch_first_echo_investigation:0 "Das erste Echo"
 epoch_first_echo_investigation_desc:0 "Die Untersuchung führt durch fünf miteinander verbundene Abschnitte. Der gewählte Ansatz bestimmt den monatlichen Fortschritt; jeder Abschnitt wartet zusätzlich auf seinen erforderlichen Bericht oder Beschluss."
 epoch_first_echo_investigation_monthly_change_tooltip:0 "Der gewählte Ansatz bestimmt das monatliche Tempo. Jeder Abschnitt verlangt außerdem die angezeigte Untersuchung oder Entscheidung, bevor der nächste beginnt."
 epoch_first_echo_waiting_objective:0 "Der Fortschritt hat die Grenze dieses Abschnitts erreicht. Schließe die Untersuchung ab oder wähle eine ausdrückliche Auflösung, um fortzufahren."
 epoch_first_echo_waiting_progress:0 "Der erforderliche Beschluss liegt vor. Der gewählte Ansatz muss weiteren Fortschritt erzeugen, bevor der nächste Abschnitt beginnt."
 epoch_first_echo_status_active:0 "Der gewählte Ansatz bringt diese Untersuchung voran. Für den nächsten Abschnitt ist außerdem der angezeigte Bericht oder Beschluss erforderlich."
 epoch_echo_progress_cautious:0 "Vorsichtige Beobachtung"
 epoch_echo_progress_intensive:0 "Intensive Beobachtung"
 epoch_echo_progress_containment:0 "Aktive Eindämmung"
 epoch_echo_progress_minimal:0 "Minimalbetrieb"
 epoch_first_echo_phase_echo:0 "Beide First-Echo-Untersuchungen abschließen oder die Folgeuntersuchung ausdrücklich aufgeben."
 epoch_first_echo_phase_expedition:0 "Den letzten Koordinaten der vermissten Besatzung folgen und die Suchergebnisse festhalten."
 epoch_first_echo_phase_contamination:0 "Die fremden Veränderungen untersuchen, eindämmen oder das Risiko ihrer Ausbreitung hinnehmen."
 epoch_first_echo_phase_structure:0 "Die vergrabene Struktur Schicht für Schicht ausgraben und über die Kammer entscheiden."
 epoch_first_echo_phase_report:0 "Die Beweise abwägen und entscheiden, ob die Beobachtung fortgesetzt oder abgeschlossen wird."
 epoch_echo_cautious_approach:0 "Vorsichtige Beobachtung"
 epoch_echo_cautious_approach_desc:0 "Erzeuge stetig Fortschritt bei geringem Unterhalt und einem kleinen Bonus auf Physikforschung."
 epoch_echo_aggressive_approach:0 "Forcierte Beobachtung"
 epoch_echo_aggressive_approach_desc:0 "Erzeuge schnell Fortschritt bei hohen Kosten. Intensive Arbeit birgt in jedem aktiven Abschnitt einmalig ein Rückschlagsrisiko."
 epoch_echo_containment_approach:0 "Aktive Eindämmung"
 epoch_echo_containment_approach_desc:0 "Erzeuge Fortschritt in mittlerem Tempo. Solange dieser Ansatz gilt, wird die betroffene Welt geschützt und Gesellschaftsforschung leicht erhöht."
 epoch_echo_minimal_approach:0 "Minimalbetrieb"
 epoch_echo_minimal_approach_desc:0 "Erzeuge sehr langsam Fortschritt bei minimalem Unterhalt, jedoch mit geringerer Physikausbeute."
 EPOCH_FIRST_ECHO_CAUTIOUS:0 "Eine ruhige Vergleichsbasis erstellen"
 EPOCH_FIRST_ECHO_CAUTIOUS_DESC:0 "Eine lange Beobachtung mit geringer Leistung trennt den wiederkehrenden Impuls vom örtlichen Hintergrundrauschen."
 EPOCH_FIRST_ECHO_AGGRESSIVE:0 "Das wandernde Signal triangulieren"
 EPOCH_FIRST_ECHO_AGGRESSIVE_DESC:0 "Ein schneller Hochleistungsdurchlauf könnte das Signal erfassen, bevor es sich erneut verlagert."
 EPOCH_ECHO_CALIBRATION:0 "Die Langbasis kalibrieren"
 EPOCH_ECHO_CALIBRATION_DESC:0 "Eine sorgfältige Kalibrierung isoliert ein schwaches zweites Zeitintervall im Signal."
 EPOCH_ECHO_BASELINE:0 "Den passiven Vergleich fortsetzen"
 EPOCH_ECHO_BASELINE_DESC:0 "Ein langsamerer Vergleich bewahrt eine breite Aufzeichnung, ohne die Instrumente zu belasten."
 EPOCH_ECHO_OVERDRIVE:0 "Das Signal scharf verriegeln"
 EPOCH_ECHO_OVERDRIVE_DESC:0 "Ein kurzer, leistungsstarker Durchlauf könnte die Peilung der Quelle enthüllen, bevor sie sich bewegt."
 EPOCH_ECHO_THROTTLED:0 "Der schwachen Antwort folgen"
 EPOCH_ECHO_THROTTLED_DESC:0 "Ein Scan mit reduzierter Leistung folgt der breiteren und unsichereren Antwort."
 EPOCH_MISSING_EXPEDITION:0 "Die letzte Spur der Expedition untersuchen"
 EPOCH_MISSING_EXPEDITION_DESC:0 "Dem Impuls bis über den Punkt folgen, an dem die Forschungsexpedition verstummte."
 EPOCH_EXPEDITION_RESCUE:0 "Nach der vermissten Besatzung suchen"
 EPOCH_EXPEDITION_RESCUE_DESC:0 "Eine geduldige Suche konzentriert sich auf Notrufsender und überlebensfähige Wrackteile."
 EPOCH_EXPEDITION_SALVAGE:0 "Den Expeditionsrekorder bergen"
 EPOCH_EXPEDITION_SALVAGE_DESC:0 "Ein gezielter Bergungsscan könnte den Rekorder finden, bevor sich das Signal erneut verlagert."
 EPOCH_EXPEDITION_SURVEY:0 "Die Signalspur kartieren"
 EPOCH_EXPEDITION_SURVEY_DESC:0 "Eine breite, langsame Untersuchung kartiert die Spur und hält das Schiff auf Abstand."
 epoch_first_echo_investigation_type:0 "Signalsuche"
 stage_signal_analysis:0 "Signalanalyse"
 stage_source_analysis:0 "Vermisste Expedition"
 stage_contamination:0 "Fremde Veränderungen"
 stage_excavation:0 "Die vergrabene Struktur"
 stage_report:0 "Ein unvollständiger Bericht"
 epoch_core.20.name:0 "Eine Veränderung ohne erkennbare Quelle"
 epoch_core.20.desc.organic:0 "Zellen aus den letzten Proben der Expedition stimmen nicht mehr mit ihren früheren Aufzeichnungen überein. Ähnliche Veränderungen treten auch bei Organismen auf unserer Hauptwelt auf. Wir können die betroffenen Orte untersuchen, sie isolieren oder das Muster unbehelligt lassen. Eine Erklärung für die Übereinstimmung fehlt."
 epoch_core.20.desc.hive:0 "Einige lokale biologische Abläufe wiederholen nun ein Signalintervall, das im Rest des Schwarms nicht vorkommt. Wir können die betroffenen Knoten untersuchen, sie isolieren oder die Abweichung fortbestehen lassen. Die Ursache fehlt in unseren Aufzeichnungen."
 epoch_core.20.desc.machine:0 "Prozesse auf unserer Hauptwelt geben Datenstrukturen zurück, die in ihrem ursprünglichen Zustand nicht vorkamen. Wir können die betroffenen Systeme untersuchen, sie isolieren oder den Prozess fortbestehen lassen. Eine Quelle wurde nicht gefunden."
 epoch_core.20.a:0 "Ein bemanntes Wissenschaftsschiff zur Untersuchung entsenden."
 epoch_core.20.b:0 "Die betroffenen Orte sofort isolieren."
 epoch_core.20.a.tooltip:0 "Ein bemanntes Wissenschaftsschiff muss die Kontaminationsstudie abschließen, bevor die Situation fortschreiten kann."
 epoch_core.20.b.tooltip:0 "Kosten: 500 Energie und 300 Mineralien. Die Eindämmung verringert die aktiven Auswirkungen und ermöglicht die Untersuchung der Struktur."
 epoch_core.20.c.tooltip:0 "Vernachlässigung verschärft die Schäden und kann sie auf eine weitere eigene Welt ausbreiten."
 epoch_core.20.c:0 "Den Prozess unbehelligt lassen und eine Verschärfung riskieren."
 epoch_core.26.name:0 "Die Proben konnten nicht gesichert werden"
 epoch_core.26.desc:0 "Die Studienausrüstung versagte, bevor ein verlässliches Ergebnis feststand. Die betroffenen Abläufe bleiben aktiv. Ein weiteres bemanntes Wissenschaftsschiff kann die Untersuchung wiederholen, oder wir fahren mit der Struktur fort und nehmen die ungelösten Schäden in Kauf."
 epoch_core.26.a:0 "Ein weiteres Wissenschaftsschiff zur Wiederholung entsenden."
 epoch_core.26.b:0 "Die Studie abbrechen und mit den ungelösten Auswirkungen fortfahren."
 epoch_core.28.name:0 "Das Signal ist verstummt"
 epoch_core.28.desc:0 "Die Vermessung konnte das Signal nicht zuverlässig weiterverfolgen. Die letzte Spur der Expedition bleibt ungewiss."
 epoch_core.28.a:0 "Die Vermessung wiederholen."
 epoch_core.28.b:0 "Dieses Vermessungsprojekt abbrechen."
 epoch_core.30.name:0 "Das Suchteam hat die Spur verloren"
 epoch_core.30.desc:0 "Die letzte Suche brachte keine verlässliche neue Spur. Ein weiteres bemanntes Schiff kann die gewählte Suche fortsetzen, oder wir halten die Ungewissheit fest und gehen weiter."
 epoch_core.30.a:0 "Ein weiteres Wissenschaftsschiff für die Suche entsenden."
 epoch_core.30.b:0 "Die Suche abbrechen und den unvollständigen Bericht sichern."
 epoch_core.31.name:0 "Die erste Signalanalyse wurde unterbrochen"
 epoch_core.31.desc:0 "Die zugewiesene Untersuchung kann nicht fortgesetzt werden. Ein Ersatzschiff könnte sie wiederholen; andernfalls müssen wir diesen Untersuchungsweg ausdrücklich aufgeben."
 epoch_core.31.a:0 "Ein weiteres Wissenschaftsschiff zur Wiederholung entsenden."
 epoch_core.31.b:0 "Die Untersuchung hier beenden."
 epoch_core.7.desc.project_abandoned:0 "Das Vermessungsprojekt wurde abgebrochen, bevor es klären konnte, was mit der Expedition geschah. Es wurde kein Expeditionsschiff als vermisst eingestuft."
 epoch_core.32.name:0 "Die Folgeanalyse wurde unterbrochen"
 epoch_core.32.desc:0 "Die Folgeuntersuchung endete, bevor ein Ergebnis feststand. Ein weiteres Wissenschaftsschiff kann die Arbeit übernehmen, oder wir geben sie ausdrücklich auf und fahren mit den vorhandenen Erkenntnissen fort."
 epoch_core.32.a:0 "Ein weiteres Wissenschaftsschiff zur Wiederholung entsenden."
 epoch_core.32.b:0 "Die Untersuchung abbrechen und zur Expedition übergehen."
 epoch_core.44.name:0 "Die Ausgrabungsstätte ist nicht mehr verfügbar"
 epoch_core.44.desc:0 "Die Zielwelt oder ihre Ausgrabungsstätte ist nicht mehr erreichbar. Ein bemanntes Wissenschaftsschiff kann die erhaltenen Vermessungsdaten aus der Ferne untersuchen, oder wir archivieren die unvollständigen Erkenntnisse und schließen die Untersuchung."
 epoch_core.44.a:0 "Ein Wissenschaftsschiff zur Fernanalyse entsenden."
 epoch_core.44.b:0 "Die unvollständigen Erkenntnisse archivieren und die Untersuchung schließen."
 epoch_core.46.name:0 "Die Fernanalyse wurde unterbrochen"
 epoch_core.46.desc:0 "Die Fernanalyse endete, bevor ein Ergebnis feststand. Ein weiteres bemanntes Wissenschaftsschiff kann die Untersuchung wiederholen, oder wir archivieren die unvollständigen Erkenntnisse und schließen die Untersuchung."
 epoch_core.46.a:0 "Ein weiteres Wissenschaftsschiff zur Wiederholung entsenden."
 epoch_core.46.b:0 "Die unvollständigen Erkenntnisse archivieren und die Untersuchung schließen."
 epoch_core.22.name:0 "Die stille Struktur"
 epoch_core.22.desc.organic:0 "Das veränderte Material bildet eine regelmäßige Grenze um einen versiegelten Hohlraum. Die umliegenden Organismen wiederholen ein Intervall aus dem Signal und den Aufzeichnungen der Expedition. Keine Probe erklärt, wie das Muster begann."
 epoch_core.22.desc.hive:0 "Unter dem veränderten biologischen Netzwerk ist eine Struktur freigelegt worden. Ihre Grenze wiederholt ein Intervall aus dem Signal und den Aufzeichnungen der vermissten Expedition. Der Schwarm kann nicht feststellen, ob sie aktiv ist."
 epoch_core.22.desc.machine:0 "Unter den beschädigten Prozessen ist eine vergrabene Struktur sichtbar. Ihre Oberfläche trägt ein Intervall aus dem Signal und den Expeditionsaufzeichnungen, doch kein bekannter Bauplan stimmt damit überein."
 epoch_core.22.a:0 "Eine bemannte Ausgrabung am Fundort genehmigen."
 epoch_core.40.name:0 "Eine wiederkehrende Grenze"
 epoch_core.40.desc:0 "Die erste freigelegte Schicht folgt einer präzisen Kurve unter dem umliegenden Material. Proben auf beiden Seiten zeigen dasselbe schwache Intervall, obwohl ihre messbare Zusammensetzung verschieden ist."
 epoch_core.40.a:0 "Die Grenze vermessen, bevor weiteres Material entfernt wird."
 epoch_core.40.b:0 "Einen direkten Zugang zum Zentrum freilegen."
 epoch_core.41.name:0 "Die veränderte Schicht"
 epoch_core.41.desc.spread:0 "Die Ablagerungen tragen dieselben Störungen, die bereits auf anderen Welten festgestellt wurden. Die Ausgrabungsinstrumente reagieren, sobald sich die betroffenen Schichten berühren."
 epoch_core.41.desc.contained:0 "Die isolierten Proben bleiben stabil, doch die äußere Schicht der Struktur enthält Spuren der früheren Kontamination."
 epoch_core.41.desc.standard:0 "Unter der Grenze liegt eine zweite Schicht. Ihre Oberfläche ist intakt, aber die Messgeräte registrieren Veränderungen, sobald sich ein Werkzeug nähert."
 epoch_core.41.a:0 "Die Schicht mit den isolierten Proben vergleichen."
 epoch_core.41.b:0 "Durchbrechen, bevor sich die Messwerte erneut ändern."
 epoch_core.42.name:0 "Ein bekanntes Intervall"
 epoch_core.42.desc.degraded:0 "Die geborgenen Koordinaten sind unvollständig. Das Muster in der unteren Kammer stimmt fast mit ihnen überein, doch eine Lücke macht den Vergleich unsicher."
 epoch_core.42.desc.recovered:0 "Der aus der Expedition geborgene Rekorder wiederholt das Intervall, das nun in der Kammer sichtbar ist. Das Gerät kann nicht feststellen, ob die Quelle nah oder fern war."
 epoch_core.42.desc.standard:0 "In der unteren Kammer stehen Zeichen in regelmäßigen Abständen. Ihr Abstand stimmt mit einem Teil des Signals überein, der Rest bleibt unlesbar."
 epoch_core.42.a:0 "Die Übereinstimmung aufzeichnen und die Instrumente bewahren."
 epoch_core.42.b:0 "Den Mechanismus öffnen, solange das Signal anhält."
 epoch_core.43.name:0 "Die versiegelte Kammer"
 epoch_core.43.desc.risk:0 "Der freigelegte Mechanismus ist nach den früheren Schnitten instabil. Wir können die Kammer versiegeln, zerlegen oder sie unter größerem Risiko weiter untersuchen."
 epoch_core.43.desc.careful:0 "Die letzte Schicht gibt ohne erkennbaren Übergang nach. Die Kammer ist zugänglich, doch ihre Zeichen nennen weder Urheber noch Zweck."
 epoch_core.43.desc.standard:0 "Die letzte Schicht öffnet sich zu einer stillen Kammer. Ihre Oberfläche wiederholt dasselbe Intervall, ohne Urheber oder Zweck zu benennen."
 epoch_core.43.a:0 "Die Kammer versiegeln und den Zugang kontrollieren."
 epoch_core.43.b:0 "Die freigelegte Struktur zerstören."
 epoch_core.43.c:0 "Die Untersuchung abschließen und die Kammer unberührt lassen."
 site_epoch_core_silent_structure:0 "Die stille Struktur"
 site_epoch_core_silent_structure_desc:0 "Unter [From.Planet.GetName] wurde eine vergrabene Struktur entdeckt. Ihre Oberflächen wiederholen ein Intervall aus den jüngsten Aufzeichnungen. Keine bekannte Bauweise passt zu der freigelegten Geometrie."
 epoch_core.23.name:0 "Ein unvollständiger Bericht"
 epoch_core.23.desc.organic:0 "Die versiegelten Berichte stimmen darin überein, was sich verändert hat, nicht aber warum. Die betroffene Welt bleibt verändert. Unsere Instrumente bewahren mehrere Fragmente mit einem gemeinsamen Zeitmuster, doch keines zeigt, wer oder was sie hervorgebracht hat oder ob es aufgehört hat."
 epoch_core.23.desc.hive:0 "Im Netzwerk der betroffenen Welt bleibt eine dauerhafte Unterbrechung bestehen. Die geborgenen Intervalle stimmen überein, doch ihr Ursprung und ihr Zusammenhang bleiben ungeklärt. Der Schwarm kann nicht feststellen, ob das Muster beendet ist."
 epoch_core.23.desc.machine:0 "In den Produktionssystemen der betroffenen Welt bleibt ein dauerhafter Defekt. Die geborgenen Aufzeichnungen enthalten ein wiederkehrendes Intervall, doch keine Spur weist auf Urheber, Zweck oder gegenwärtigen Zustand hin."
 epoch_core.23.desc.ruined:0 "Die freigelegte Struktur ist zerstört und der Ort zu stark beschädigt, um ihn weiter zu untersuchen. Der Verlust der Expedition und die Veränderungen auf dieser Welt sind dokumentiert, doch keine erhaltene Spur erklärt ihre Ursache."
 epoch_core.23.desc.secured:0 "Die Struktur ist hinter einem kontrollierten Zugang versiegelt. Wir bargen Fragmente der Expedition und der betroffenen Welt, doch ihre wiederkehrenden Intervalle erklären weder Ursprung noch Ende des Prozesses."
 epoch_core.23.desc.studied:0 "Die Zeichen der Struktur stimmen mit Fragmenten der vermissten Expedition und der betroffenen Welt überein. Diese Übereinstimmung lässt sich messen, doch Ursache, Urheber und Zweck bleiben unbekannt. Der Bericht ist unvollständig."
 epoch_core.23.a:0 "Die Instrumente weiter betreiben und den Spuren folgen."
 epoch_core.23.b:0 "Die Aufzeichnungen versiegeln und weiteren Zugang untersagen."
 EPOCH_CONTAMINATION_STUDY:0 "Die veränderten Prozesse untersuchen"
 EPOCH_CONTAMINATION_STUDY_DESC:0 "Betroffene Proben und Systeme vergleichen, ohne eine gemeinsame Ursache vorauszusetzen."
 EPOCH_STRUCTURE_REMOTE_STUDY:0 "Die Ausgrabungsdaten aus der Ferne analysieren"
 EPOCH_STRUCTURE_REMOTE_STUDY_DESC:0 "Die erhaltenen Vermessungs- und Ausgrabungsdaten vergleichen, um die äußeren Merkmale der Struktur zu erfassen."
 epoch_core_contamination_active:0 "Instabile lokale Prozesse"
 epoch_core_containment_buffered:0 "Eindämmungsfeld"
 epoch_core_containment_buffered_desc:0 "Ein aktives Eindämmungsfeld stabilisiert die betroffene Welt, solange der Eindämmungsansatz gewählt ist."
 epoch_core_contamination_active_desc:0 "Eine unerklärte Veränderung beeinträchtigt lokale Produktion und Stabilität."
 epoch_core_contamination_worsened:0 "Schwere lokale Störung"
 epoch_core_contamination_worsened_desc:0 "Die unerklärte Veränderung hat sich verstärkt und stört Produktion und Stabilität."
 epoch_core_contamination_active_organic:0 "Biologische Kontamination"
 epoch_core_contamination_active_organic_desc:0 "Eine unerklärte biologische Veränderung mindert Nahrungsproduktion und Stabilität."
 epoch_core_contamination_active_hive:0 "Gestörtes biologisches Netzwerk"
 epoch_core_contamination_active_hive_desc:0 "Ein fremdes Intervall stört die lokalen biologischen Abläufe des Schwarms."
 epoch_core_contamination_active_machine:0 "Fremdes Prozessmuster"
 epoch_core_contamination_active_machine_desc:0 "Ein fremdes Datenmuster mindert Energieproduktion und Stabilität."
 epoch_core_contamination_worsened_organic:0 "Schwere biologische Kontamination"
 epoch_core_contamination_worsened_organic_desc:0 "Die biologische Veränderung schädigt nun Nahrungsproduktion und Stabilität."
 epoch_core_contamination_worsened_hive:0 "Schwere Netzwerkstörung"
 epoch_core_contamination_worsened_hive_desc:0 "Das fremde Intervall stört nun Einheit und biologische Abläufe."
 epoch_core_contamination_worsened_machine:0 "Schwere Prozesskorruption"
 epoch_core_contamination_worsened_machine_desc:0 "Das fremde Datenmuster schädigt nun Energieproduktion und Stabilität."
 epoch_core_contamination_studied_organic:0 "Anhaltende biologische Spur"
 epoch_core_contamination_studied_organic_desc:0 "Die Untersuchung verringerte die biologische Störung, doch eine Spur bleibt."
 epoch_core_contamination_studied_hive:0 "Anhaltende Netzwerkspur"
