 epoch_res.hunter_location_missing:0 "Unsere Empfänger liefern keine verlässliche Peilung der Formation. Die Einsatzleitung benötigt eine zugängliche Route, bevor die Suche fortgesetzt werden kann."
 epoch_res.infected_location:0 "Die Reaktion konzentriert sich auf [epoch_res_infected_world.GetName]."
 epoch_res.infected_location_missing:0 "Derzeit kann keine besiedelte Welt die Eindämmungsteams aufnehmen. Die Arbeiten müssen warten, bis eine geeignete Kolonie verfügbar ist."
epoch_res.21.name:0 "Eine Lücke im Zielmuster"
epoch_res.21.desc:0 "Die Zielscans überlagern sich in einem vorhersagbaren Intervall. Durch den Vergleich mit unserer unabhängigen Referenz haben die Forscher Zeitfenster erkannt, in denen die Waffen der Formation einem veränderten Echo nicht folgen können.\n\nDie korrigierten Feuerleitdaten liegen unseren Kommandanten bereits vor. Der Vorteil hält nur so lange an, wie das Muster unverändert bleibt."
 epoch_res.continue:0 "Die Observatorien sollen weiter lauschen. Den verbliebenen Spuren folgen."
 epoch_res.stop:0 "Die Aufzeichnungen versiegeln. Keine weiteren Untersuchungen genehmigen."
