EPOCH_RES_SCAR:0 "Die wiederkehrende Narbe untersuchen"
EPOCH_RES_SCAR_DESC:0 "Die wiederkehrende Narbe untersuchen. Benötigt ein Wissenschaftsschiff mit Wissenschaftler am markierten Ort. Unterbrochene Expeditionen können neu zugewiesen werden; bei Verlust der Fundstelle Ziele wiederherstellen nutzen."
EPOCH_RES_RECON:0 "Das Zielmuster der Jäger analysieren"
EPOCH_RES_RECON_DESC:0 "Das Zielmuster der Jäger analysieren. Benötigt ein Wissenschaftsschiff mit Wissenschaftler am markierten Ort. Unterbrochene Expeditionen können neu zugewiesen werden; bei Verlust der Fundstelle Ziele wiederherstellen nutzen."
EPOCH_RES_WRECK:0 "Gefechtsfragmente der Jäger bergen"
EPOCH_RES_WRECK_DESC:0 "Gefechtsfragmente der Jäger bergen. Benötigt ein Wissenschaftsschiff mit Wissenschaftler am markierten Ort. Unterbrochene Expeditionen können neu zugewiesen werden; bei Verlust der Fundstelle Ziele wiederherstellen nutzen."
EPOCH_RES_COMPARE:0 "Den Korrekturcode vergleichen"
EPOCH_RES_COMPARE_DESC:0 "Den Korrekturcode vergleichen. Benötigt ein Wissenschaftsschiff mit Wissenschaftler am markierten Ort. Unterbrochene Expeditionen können neu zugewiesen werden; bei Verlust der Fundstelle Ziele wiederherstellen nutzen."
EPOCH_RES_REFLECTION:0 "Die verzögerte Reflexion messen"
EPOCH_RES_REFLECTION_DESC:0 "Die verzögerte Reflexion messen. Benötigt ein Wissenschaftsschiff mit Wissenschaftler am markierten Ort. Unterbrochene Expeditionen können neu zugewiesen werden; bei Verlust der Fundstelle Ziele wiederherstellen nutzen."
EPOCH_RES_SILENCE:0 "Die Unterdrückungsstation untersuchen"
EPOCH_RES_SILENCE_DESC:0 "Die Unterdrückungsstation untersuchen. Benötigt ein Wissenschaftsschiff mit Wissenschaftler am markierten Ort. Unterbrochene Expeditionen können neu zugewiesen werden; bei Verlust der Fundstelle Ziele wiederherstellen nutzen."
decision_epoch_res_quarantine:0 "Resonanzquarantäne errichten"
decision_epoch_res_quarantine_desc:0 "Schränkt die Produktion ein und senkt die Kontamination auf einen latenten Zustand. Für sorgfältige Stabilisierung erforderlich."
decision_epoch_res_localize:0 "Infektion lokalisieren"
decision_epoch_res_localize_desc:0 "Kartiert die betroffenen Bezirke vor Probenanalyse oder Notfalleindämmung."
decision_epoch_res_sample:0 "Resonanzproben untersuchen"
decision_epoch_res_sample_desc:0 "Quarantäne oder Eindämmungsinfrastruktur liefert saubere Daten. Ungesicherte Proben machen die Fundstelle instabil und verursachen Verwüstung."
decision_epoch_res_exploit:0 "Resonanz ausnutzen"
decision_epoch_res_exploit_desc:0 "Gewinnt sofort Forschung und Legierungen und steigert die Physikproduktion für ein Jahr. Die Fundstelle wird instabil und erleidet Verwüstung."
decision_epoch_res_stabilize:0 "Lokalisiertes Muster stabilisieren"
decision_epoch_res_stabilize_desc:0 "Schließt die Eindämmung einer lokalisierten, quarantänisierten und nicht instabilen Fundstelle ab. Erhält die Wirtschaft und setzt die Untersuchung fort."
decision_epoch_res_emergency:0 "Notfalleindämmung"
decision_epoch_res_emergency_desc:0 "Schaltet das Muster zu hohen Kosten ab. Schließt die Eindämmung ab, hinterlässt aber permanente Wirtschaftsschäden und Verwüstung."
decision_epoch_res_isolate:0 "Instabile Bezirke isolieren"
decision_epoch_res_isolate_desc:0 "Versetzt ein quarantänisiertes instabiles Feature zurück in den latenten Zustand. Einige Bezirke werden verwüstet; sorgfältige Stabilisierung wird wieder möglich."
epoch_res_quarantine:0 "Resonanzquarantäne"
epoch_res_permanent_damage:0 "Eindämmungsschäden"
epoch_res_extraction:0 "Resonanzausnutzung"
epoch_res_targeting_flaw:0 "Aufgedecktes Zielmuster"
epoch_res.recontact:0 "Kontakt wiederherstellen: Ein neuer Kampf ist erforderlich."
decision_epoch_res_resume:0 "Resonanzoperationen fortsetzen"
decision_epoch_res_resume_desc:0 "Öffnet den aktuellen Bericht oder finanziert Fernforschung. Diese Aktion schließt kein Ziel ab."
epoch_res.11.name:0 "Eine Frequenz jenseits der Narbe"
epoch_res.11.desc:0 "Die Untersuchung erfasst eine zweite Komponente. Bewegt ein bemanntes Wissenschaftsschiff von der alten Fundstelle weg und erstellt eine unabhängige Referenzmessung. Erst dann unterscheiden wir ein nahendes Schiff von einem Echo. Eine Fernrekonstruktion kostet mehr und verliert Einzelheiten."
epoch_res.baseline:0 "Die unabhängige Expedition finanzieren."
epoch_res.baseline_remote:0 "Eine Archivreferenz finanzieren."
epoch_res.32.name:0 "Im Inneren der Korrektur"
epoch_res.32.desc:0 "Die Wrackfragmente enthalten verschachtelte Anweisungen. Ein zweiter wissenschaftlicher Durchgang muss die Zielsignatur isolieren, bevor unser Archiv sie sicher vergleichen kann. Bei Verlust der Fundstelle können gesicherte Fragmente gegen Mehrkosten bei der Hauptstadt untersucht werden."
epoch_res.signature:0 "Die Signatur vor Ort isolieren."
epoch_res.signature_remote:0 "Gesicherte Fragmente aus der Ferne untersuchen."
epoch_res.72.name:0 "Das unterbrochene Signal wiederherstellen"
epoch_res.72.desc:0 "Die dritte Station verzeichnet eine unterbrochene Übertragung. Setzt ihre Expedition neu an oder finanziert ungenauere Fernmessungen bei der Hauptstadt. Beide Wege benötigen ein bemanntes Wissenschaftsschiff."
epoch_res.retry_interrupted:0 "Das Vor-Ort-Projekt erneut ansetzen."
epoch_res.remote_interrupted:0 "Fernmessungen finanzieren."
epoch_res.53.name:0 "Ein unterbrochener Befehl"
epoch_res.53.desc:0 "Die dritte Station verstummte mitten in einer Anweisung. Der erhaltene Kopf nennt weder Absender noch Ziel, verweist aber auf Verbände jenseits des lokalen Schutzbereichs. Wir haben den Rand eines Konflikts gefunden, nicht seinen Anfang."
