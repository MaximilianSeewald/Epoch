epoch_res.class.machine:0 "Beschädigte Prozesse suchen eine unbefugte Synchronisation."
epoch_res.class.hive:0 "Drohnen verlieren den Rhythmus des Kollektivs."
epoch_res.class.organic:0 "Biologische Zyklen und lokale Ökosysteme geraten aus dem Takt."
epoch_res.battle.loss:0 "Unsere früheren Verluste bleiben in der Gefechtsakte."
epoch_res.battle.win:0 "Die Gefechtsaufzeichnung bewahrt die letzte von der Formation gesendete Folge."
epoch_res.reflect.remote:0 "Fernmessungen lassen Lücken in den Zeitstempeln."
epoch_res.reflect.prepared:0 "Die alte gesicherte Struktur liefert eine passende Zeitbasis."
epoch_res.reflect.base:0 "Die geborgenen Fragmente zeigen ein wiederkehrendes Intervall."
epoch_res.silence.exposed:0 "Unser wiederholtes Muster hat eine ferne Antwort ausgelöst."
epoch_res.silence.clean:0 "Unsere sauberen planetaren Proben unterscheiden Unterdrückung von Beschädigung."
epoch_res.silence.base:0 "Die entfernten Frequenzen kehren in der Korrekturfolge der Jäger wieder."
epoch_resonance_protocol:0 "Resonanz"
epoch_resonance_protocol_type:0 "Resonanz"
epoch_resonance_protocol_desc:0 "Das alte Intervall ist zurückgekehrt. Die neuen Beobachtungen mit den erhaltenen Expeditions- und Grabungsaufzeichnungen vergleichen."
epoch_resonance_protocol_monthly_change_tooltip:0 "Die Untersuchung schreitet durch Ergebnisse der Außenteams und Entscheidungen der Einsatzleitung voran."
epoch_res_objectives:0 "Unsere Observatorien führen die laufenden Vermessungsaufzeichnungen. Spezialprojekte markieren Außeneinsätze. Planetare Teams erwarten Befehle über die Entscheidungen ihrer Welt; unterbrochene Arbeiten können auf der Hauptstadt geprüft werden."
epoch_res_observe:0 "Ziele verfolgen"
epoch_res_observe_desc:0 "Eingehende Berichte mit den gesicherten Resonanzaufzeichnungen vergleichen."
epoch_res_recover:0 "Ziele wiederherstellen"
epoch_res_recover_desc:0 "Öffnet den aktuellen Bericht erneut. Abgeschlossene Arbeiten bleiben abgeschlossen. Fernforschung kostet mehr und liefert ungenauere Aufzeichnungen."
stage_res_scar:0 "Die Narbe erwacht"
epoch_res_goal_scar:0 "Die alte Fundstelle vermessen und anschließend eine unabhängige Referenz außerhalb ihres Einflusses aufnehmen."
stage_res_hunters:0 "Die ersten Jäger"
epoch_res_goal_hunters:0 "Die bewaffnete Formation stellen. Ihr Zielmuster kann vor dem Gefecht untersucht werden."
stage_res_code:0 "Der gebrochene Code"
epoch_res_goal_code:0 "Die Gefechtsfragmente bergen, ihre Signatur isolieren und mit dem Archiv vergleichen."
stage_res_infection:0 "Die zweite Infektion"
epoch_res_goal_infection:0 "Maßnahmen über die Entscheidungen der betroffenen Welt anordnen. Die Reaktion lokalisieren und unter Kontrolle bringen."
stage_res_network:0 "Das Netzwerk der Stille"
epoch_res_goal_network:0 "Die unabhängigen Messungen an allen drei markierten Stationen abschließen."
EPOCH_RES_SCAR:0 "Die wiederkehrende Narbe untersuchen"
EPOCH_RES_SCAR_DESC:0 "Neue Messungen an der alten Fundstelle mit dem Intervall unserer frühesten Vermessung vergleichen. Ein Forschungsschiff mit Wissenschaftler muss das Echo unmittelbar beobachten."
EPOCH_RES_RECON:0 "Das Zielmuster der Jäger analysieren"
EPOCH_RES_RECON_DESC:0 "Unsere Physikteams vergleichen aufeinanderfolgende Zielscans mit der unabhängigen Referenz. Die Studie nutzt unmittelbar das Forschungsnetz; ein Außenschiff wird nicht benötigt. Eine erkannte Schwäche muss genutzt werden, bevor die Formation ihr Muster verändert."
EPOCH_RES_WRECK:0 "Gefechtsfragmente der Jäger bergen"
EPOCH_RES_WRECK_DESC:0 "Die beschädigten Sender und Gefechtsaufzeichnungen bergen, bevor sich die Wracks zerstreuen. Ein Forschungsschiff mit Wissenschaftler muss die Fragmente für den Vergleich sichern."
EPOCH_RES_COMPARE:0 "Den Korrekturcode vergleichen"
EPOCH_RES_COMPARE_DESC:0 "Die isolierte Folge mit den Lücken unseres Expeditionsarchivs vergleichen. Ein Forschungsschiff mit Wissenschaftler führt das genehmigte Beobachtungsprotokoll an unserer Hauptstadt durch."
EPOCH_RES_REFLECTION:0 "Die verzögerte Reflexion messen"
EPOCH_RES_REFLECTION_DESC:0 "Die Verzögerung zwischen aufeinanderfolgenden Echos an der ersten Station messen. Ein Forschungsschiff soll feststellen, welche Intervalle zum Relais statt zur Übertragung gehören."
EPOCH_RES_SILENCE:0 "Die Unterdrückungsstation untersuchen"
EPOCH_RES_SILENCE_DESC:0 "Unabhängige Empfänger entlang des Übertragungswegs der zweiten Station aufstellen. Das eintretende Signal mit dem vergleichen, was auf der anderen Seite übrig bleibt."
decision_epoch_res_quarantine:0 "Resonanzquarantäne errichten"
decision_epoch_res_quarantine_desc:0 "Den Verkehr durch die betroffenen Bezirke beschränken und die Produktion überwachen. Eine instabile Reaktion lässt sich allein durch Zugangskontrollen nicht beruhigen."
decision_epoch_res_localize:0 "Infektion lokalisieren"
decision_epoch_res_localize_desc:0 "Bezirksuhren und Produktionsprotokolle vergleichen, um die Grenzen der Reaktion zu verfolgen. Die Teams benötigen eine verlässliche Karte, bevor sie sich ihrem Zentrum nähern."
decision_epoch_res_sample:0 "Resonanzproben untersuchen"
decision_epoch_res_sample_desc:0 "Material aus den kartierten Bezirken unter Beobachtung bergen. Quarantäne oder besondere Isolationsanlagen schützen die Proben; ein ungesicherter Zugang könnte die Reaktion aufrühren."
decision_epoch_res_exploit:0 "Resonanz ausnutzen"
decision_epoch_res_exploit_desc:0 "Verwertbares Material und Messdaten unmittelbar aus der Reaktion gewinnen. Die Förderteams rechnen mit schweren Störungen im Bereich der Entnahmestellen."
decision_epoch_res_stabilize:0 "Lokalisiertes Muster stabilisieren"
decision_epoch_res_stabilize_desc:0 "Die isolierten Anlagen unter fortlaufender Beobachtung auf das kartierte Intervall abstimmen. Die Teams können dies nur versuchen, solange die Reaktion ruhig bleibt."
decision_epoch_res_emergency:0 "Notfalleindämmung"
decision_epoch_res_emergency_desc:0 "Die kartierte Reaktion von der umgebenden Infrastruktur trennen. Die Abschaltung kann sie eindämmen, hinterlässt aber verwüstete Bezirke und dauerhafte Schäden."
decision_epoch_res_isolate:0 "Instabile Bezirke isolieren"
decision_epoch_res_isolate_desc:0 "Die instabilen Bezirke vom unter Quarantäne stehenden Netz trennen. Um die Reaktion zu beruhigen, müssen örtliche Anlagen geopfert werden."
epoch_res_quarantine:0 "Resonanzquarantäne"
epoch_res_permanent_damage:0 "Eindämmungsschäden"
epoch_res_extraction:0 "Resonanzausnutzung"
epoch_res_targeting_flaw:0 "Aufgedecktes Zielmuster"
epoch_res.recontact:0 "Eine erneute Suche nach der bewaffneten Formation finanzieren."
decision_epoch_res_resume:0 "Resonanzoperationen fortsetzen"
decision_epoch_res_resume_desc:0 "Die Teams auf der Hauptstadt zusammenrufen, um den laufenden Auftrag zu prüfen und den Kontakt zu unterbrochenen Expeditionen wiederherzustellen."
epoch_res.11.name:0 "Eine Frequenz jenseits der Narbe"
epoch_res.11.desc:0 "Unter dem zurückgekehrten Impuls hat das Vermessungsteam eine zweite Komponente isoliert. Gegen die alte Fundstelle gemessen verschiebt sie sich; gegen die Schiffsuhr hält sie ihr Intervall. Die Narbe beeinflusst die Beobachtung selbst.\n\nDie Wissenschaftler beantragen eine unabhängige Messung fern dieser Welt. Ohne sie können sie nicht feststellen, ob die Veränderung zur Quelle gehört oder zu dem Ort, von dem aus wir lauschen."
epoch_res.baseline:0 "Die unabhängige Expedition finanzieren."
epoch_res.baseline_remote:0 "Eine Archivreferenz finanzieren."
epoch_res.32.name:0 "Im Inneren der Korrektur"
epoch_res.32.desc:0 "Die geborgenen Fragmente enthalten Anweisungen, verschachtelt in Korrekturen anderer Anweisungen. Mehrere Folgen beginnen dort, wo die älteren Signalaufzeichnungen unlesbar werden. Die scheinbare Übereinstimmung hält dem Vergleich stand, doch ihre Bedeutung bleibt ungewiss.\n\nDas Team erbittet eine genauere Untersuchung der Zielsignatur. Bis wir verstehen, worauf sich die Korrekturen beziehen, bleibt der beschädigte Sender vom übrigen Archiv isoliert."
epoch_res.signature:0 "Die Signatur vor Ort isolieren."
epoch_res.signature_remote:0 "Gesicherte Fragmente aus der Ferne untersuchen."
epoch_res.72.name:0 "Das unterbrochene Signal wiederherstellen"
epoch_res.72.desc:0 "Die unterbrochenen Aufzeichnungen der dritten Station sind noch unvollständig. Ein Forschungsschiff kann zur markierten Stätte zurückkehren oder die erhaltenen Beobachtungen von der Hauptstadt aus untersuchen. Keiner der beiden Wege kann Daten bergen, die nie aufgezeichnet wurden."
epoch_res.retry_interrupted:0 "Das Vor-Ort-Projekt erneut ansetzen."
epoch_res.remote_interrupted:0 "Fernmessungen finanzieren."
epoch_res.53.name:0 "Ein unterbrochener Befehl"
epoch_res.53.desc:0 "Die dritte Station verstummte mitten in einer Anweisung. Der erhaltene Kopf enthält weder einen lesbaren Absender noch ein Ziel. Der Abbruch ist in jeder geborgenen Kopie identisch erhalten.\n\nDie Analysten haben das Fragment neben die Korrekturen der Jäger gelegt. Beide setzen einen Austausch voraus, dessen andere Seite in unseren Aufzeichnungen fehlt."
epoch_res_signal_strain:0 "Ferne Signalinterferenz"
EPOCH_RES_BASELINE:0 "Unabhängige Resonanzreferenz"
EPOCH_RES_BASELINE_DESC:0 "Außerhalb des Einflusses der alten Fundstelle eine Referenz aufnehmen. Unabhängige Instrumente sollen ein wanderndes Signal von einer Verzerrung der Beobachtung unterscheiden."
EPOCH_RES_SIGNATURE:0 "Korrektursignatur isolieren"
EPOCH_RES_SIGNATURE_DESC:0 "Die Zielfolge von den umgebenden Korrekturen trennen. Der beschädigte Sender muss isoliert bleiben, während ein Forschungsschiff seine Signatur untersucht."
EPOCH_RES_INTERRUPTED:0 "Unterbrochene Übertragung bergen"
EPOCH_RES_INTERRUPTED_DESC:0 "Die erhaltenen Aufzeichnungen der dritten Station bergen, ohne ihre unterbrochene Anweisung zu vervollständigen. Vor der Deutung des Fragments die einzelnen Kopien vergleichen."
