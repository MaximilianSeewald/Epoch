l_german:
 epoch_core.2.name:0 "Das erste Echo"
 epoch_core.2.desc:0 "Der Vermessungsempfänger wiederholt einen Impuls, der längst im Hintergrundrauschen hätte versinken müssen. Zwischen den Wiederholungen liegt stets dieselbe Stille; zwischen den Messungen ist nichts zu finden. Die Besatzung hat die Uhr mit unabhängigen Instrumenten abgeglichen. Alle stimmen überein.\n\nEine behutsame Beobachtung könnte die wenigen Spuren sichern. Eine rasche Peilung könnte die Quelle erfassen, bevor sie erneut verschwindet."
 epoch_core.2.a:0 "Den Impuls geduldig kartieren und alle Messwerte sichern."
 epoch_core.2.b:0 "Die Quelle rasch triangulieren, bevor sich das Signal erneut verlagert."
 epoch_core.2.c:0 "Das Signal nicht weiter untersuchen."
 epoch_core.3.name:0 "Ein zweiter Abstand"
 epoch_core.3.desc.cautious:0 "Die lange Beobachtung hat unter dem Impuls ein schwächeres Intervall freigelegt. Es übersteht jede Korrektur der Instrumentendrift. Selbst wenn das Team das Hauptsignal herausrechnet, hält das schwache Echo seinen Takt.\n\nEine genauere Kalibrierung könnte beide trennen. Die breitere Aufzeichnung würde die Anlage schonen, ließe aber mehr Unsicherheit im Vergleich."
 epoch_core.3.desc.aggressive:0 "Die schnelle Abtastung hat ein Echo erfasst, das über die Empfangsanlage wandert. Seine Peilung verändert sich zwischen den Messungen, während das Intervall exakt bleibt. Die Ingenieure können eine engere Erfassung erzwingen, doch der Empfänger arbeitet bereits außerhalb seiner üblichen Toleranzen.\n\nWeniger Leistung würde die Instrumente schonen, allerdings eine ungenauere Spur hinterlassen."
 epoch_core.3.a:0 "Für eine klarere und sichere Messung kalibrieren."
 epoch_core.3.b:0 "Die breite Vergleichsbasis beibehalten und vorsichtig fortfahren."
 epoch_core.3.c:0 "Das Array in den Overdrive treiben."
 epoch_core.3.d:0 "Drosseln, bevor die Instrumente überlastet werden."
 epoch_core.4.name:0 "Ein geduldiges Muster"
 epoch_core.4.desc:0 "Der geduldige Vergleich hat die verstreuten Peilungen auf Koordinaten jenseits der Vermessungsroute eingegrenzt. Ferninstrumente registrieren dort eine heftige Verzerrung; auch wiederholte Messungen können keine sichere Passage nachweisen.\n\nEine Expedition müsste nahe genug heranfliegen, um zu erfassen, was die entfernten Empfänger nicht unterscheiden können. Die Einsatzbewertung warnt vor dem Verlust des entsandten Schiffs."
 epoch_core.4.a:0 "Ein Forschungsschiff zur Untersuchung der geborgenen Koordinaten entsenden."
 epoch_core.5.name:0 "Koordinaten im Rauschen"
 epoch_core.5.desc:0 "Die schmale Spur endet an Koordinaten jenseits der Vermessungsroute. Aus dieser Entfernung lässt sich das Echo nicht von einer heftigen räumlichen Verzerrung trennen. Wir haben eine Peilung, aber keinen verlässlichen Bericht über die Bedingungen an ihrem Ende.\n\nEine Expedition könnte die Quelle unmittelbar untersuchen. Die Einsatzleitung kann die Rückkehr des entsandten Schiffs nicht zusichern."
 epoch_core.5.a:0 "Ein Wissenschaftsschiff unserer Wahl entlang der geborgenen Peilung entsenden."
 epoch_core.6.name:0 "Die vermisste Expedition"
 epoch_core.6.desc.cautious:0 "Das Suchschiff erreicht die letzte Telemetrie, findet aber keinen Peilsender. Jenseits der letzten Position des vermissten Schiffs pulsiert ein Signal weiter  -  gleichmäßig genug, um ihm zu folgen, doch zu schwach, um sein Ziel zu erkennen."
 epoch_core.6.desc.aggressive:0 "Am Ende der geborgenen Peilung messen die Instrumente eine scharfe Verzerrung. Die Expedition ist verschwunden. Ihr Datenrekorder könnte noch intakt sein, doch hier ist das Rücksignal stärker."
 epoch_core.6.desc.degraded:0 "Die übersteuerten Instrumente haben die schmale Spur verloren. Die Expedition ist verschwunden, und nur eine beschädigte Messung weist auf das stärkere Rücksignal."
 epoch_core.6.desc.standard:0 "Die letzte Position der Expedition schweigt. Ihre abschließende Telemetrie endet sauber, ohne die Drift eines ausfallenden Senders. Dahinter setzt sich ein schmaler Puls in jenem Intervall fort, dem wir hierher gefolgt sind. Wir müssen entscheiden, wonach wir suchen, bevor ein weiteres Schiff näher heranfliegt."
 epoch_core.6.a:0 "Nach Überlebenden und ihrem Notrufpeilsender suchen."
 epoch_core.6.b:0 "Den Datenrekorder und brauchbare Trümmer bergen."
 epoch_core.6.c:0 "Die weitere Signalspur aus sicherer Entfernung untersuchen."
 epoch_core.6.d:0 "Die Suche beenden und die letzte Position sichern."
 epoch_core.7.name:0 "Eine Lücke im Protokoll"
 epoch_core.7.desc.survivors:0 "Die geborgenen Expeditionsmitglieder wurden getrennt befragt. Jeder Bericht bricht an derselben Stelle ab und setzt wieder ein, während das Vermessungssignal noch ertönt. Niemand kann das Intervall dazwischen beschreiben.\n\nIhre Instrumente verzeichnen mehr verstrichene Zeit, als irgendjemand erinnert. Die medizinischen Untersuchungen erklären den Unterschied nicht."
 epoch_core.7.desc.recorder:0 "Der Rekorder läuft über die letzte Übertragung hinaus weiter. Unter dem Expeditionssignal beginnt noch vor dem Kontaktabbruch ein zweiter Impuls. Sein Intervall entspricht jenem, das uns hierhergeführt hat.\n\nDas Bergungsteam hat keine überlebende Besatzung gefunden. Die Aufnahme bewahrt den Klang einer Expedition, die weiterarbeitet, nachdem alle übrigen Spuren verstummen."
 epoch_core.7.desc.survey:0 "Die Vermessung löst eine kurze Faltung in den umgebenden Messwerten auf. Ihre Dauer stimmt auch bei unabhängiger Prüfung mit dem Ersten Echo überein. Weder Schiff noch Besatzung lassen sich darin erkennen.\n\nWir haben die Störung um das Verschwinden der Expedition kartiert. Die Expedition selbst bleibt unerreichbar."
 epoch_core.7.desc.failed:0 "Die Suche liefert nur Fragmente, die zu beschädigt sind, um ein Überleben festzustellen. Das Expeditionsschiff bleibt vermisst, und die Aufzeichnungen erklären die Lücke nicht."
 epoch_core.7.desc.abandoned:0 "Der versiegelte Bericht hält die letzte bekannte Position und den Zeitpunkt des Kontaktverlusts fest. Die Expedition bleibt ungeklärt, doch ihr Verlust ist nun dokumentiert."
 epoch_core.7.a:0 "Den Bericht für spätere Untersuchungen sichern."
 epoch_first_echo_investigation:0 "Das erste Echo"
 epoch_first_echo_investigation_desc:0 "Ein wiederkehrender Impuls, eine unsichere Peilung und Messungen, die ihren eigenen Aufzeichnungen widersprechen. Unsere Analysten führen die Belege zusammen, während Außenteams den einzelnen Spuren nachgehen."
 epoch_first_echo_investigation_monthly_change_tooltip:0 "Das Beobachtungsprotokoll bestimmt das Tempo der Auswertung. Außenberichte und ausstehende Entscheidungen müssen ebenfalls geklärt werden."
 epoch_first_echo_waiting_objective:0 "Die Analysten benötigen den ausstehenden Außenbericht oder eine Entscheidung zur Untersuchung, bevor sie fortfahren können."
 epoch_first_echo_waiting_progress:0 "Der Außenbericht liegt vollständig vor. Die vergleichende Auswertung läuft noch."
 epoch_first_echo_status_active:0 "Die Observatorien vergleichen die vorliegenden Aufzeichnungen nach dem gewählten Protokoll."
 epoch_echo_progress_cautious:0 "Vorsichtige Beobachtung"
 epoch_echo_progress_intensive:0 "Intensive Beobachtung"
 epoch_echo_progress_containment:0 "Aktive Eindämmung"
 epoch_echo_progress_minimal:0 "Minimalbetrieb"
 epoch_first_echo_phase_echo:0 "Die Signalmessungen benötigen ein Forschungsschiff mit Wissenschaftler. Alternativ kann die weiterführende Untersuchung ausdrücklich eingestellt werden."
 epoch_first_echo_phase_expedition:0 "Die Expedition wartet auf ein Forschungsschiff mit Wissenschaftler. Die Annäherung ist gefährlich; die Einsatzleitung rechnet mit dem Verlust des Schiffs. Ein anschließender Suchbericht muss vor Abschluss der Untersuchung geprüft werden."
 epoch_first_echo_phase_contamination:0 "Die betroffenen Proben untersuchen, die Isolation anordnen oder das dauerhafte Fortbestehen der Kontamination hinnehmen."
 epoch_first_echo_phase_structure:0 "Ein Forschungsschiff mit Wissenschaftler muss die vier Schichten der Struktur freilegen. Über die letzte Kammer ist eine Entscheidung zu treffen. Geht der Zugang verloren, lassen sich die erhaltenen Grabungsaufzeichnungen aus der Ferne untersuchen."
 epoch_first_echo_phase_report:0 "Die zusammengetragenen Belege prüfen. Entscheiden, ob die Untersuchung offenbleibt oder ihre Akten dauerhaft versiegelt werden."
 epoch_echo_cautious_approach:0 "Vorsichtige Beobachtung"
 epoch_echo_cautious_approach_desc:0 "Messungen geringer Leistung über lange Intervalle vergleichen. Die Instrumente werden durch die behutsame Erfassung geschont. Die Auswertung pausiert, solange die Teams auf einen Außenbericht warten."
 epoch_echo_aggressive_approach:0 "Forcierte Beobachtung"
 epoch_echo_aggressive_approach_desc:0 "Die Empfangsanlagen bis an ihre Grenzen belasten, um ein wanderndes Echo einzufangen. Der schnellere Vergleich birgt das Risiko beschädigter Messungen. Die Auswertung pausiert, solange die Teams auf einen Außenbericht warten."
 epoch_echo_containment_approach:0 "Aktive Eindämmung"
 epoch_echo_containment_approach_desc:0 "Während der Probenuntersuchung ein Isolationsfeld um die betroffene Welt aufrechterhalten. Der Betrieb benötigt fortlaufend Nachschub, auch während die Teams auf Ergebnisse warten."
 epoch_echo_minimal_approach:0 "Minimalbetrieb"
 epoch_echo_minimal_approach_desc:0 "Nur die wichtigsten Empfänger betreiben. Die eingeschränkten Beobachtungen lassen lange Abstände zwischen verlässlichen Vergleichen. Solange ein Außenbericht fehlt, ruht die Arbeit."
 EPOCH_FIRST_ECHO_CAUTIOUS:0 "Eine ruhige Vergleichsbasis erstellen"
 EPOCH_FIRST_ECHO_CAUTIOUS_DESC:0 "Eine lange Beobachtung mit geringer Leistung trennt den wiederkehrenden Impuls vom örtlichen Hintergrundrauschen."
 EPOCH_FIRST_ECHO_AGGRESSIVE:0 "Das wandernde Signal triangulieren"
 EPOCH_FIRST_ECHO_AGGRESSIVE_DESC:0 "Ein schneller Hochleistungsdurchlauf könnte das Signal erfassen, bevor es sich erneut verlagert."
 EPOCH_ECHO_CALIBRATION:0 "Die Langbasis kalibrieren"
 EPOCH_ECHO_CALIBRATION_DESC:0 "Eine sorgfältige Kalibrierung isoliert ein schwaches zweites Zeitintervall im Signal."
 EPOCH_ECHO_BASELINE:0 "Den passiven Vergleich fortsetzen"
 EPOCH_ECHO_BASELINE_DESC:0 "Ein langsamerer Vergleich bewahrt eine breite Aufzeichnung, ohne die Instrumente zu belasten."
 EPOCH_ECHO_OVERDRIVE:0 "Das Signal scharf verriegeln"
 EPOCH_ECHO_OVERDRIVE_DESC:0 "Ein kurzer, leistungsstarker Durchlauf könnte die Peilung der Quelle enthüllen, bevor sie sich bewegt."
 EPOCH_ECHO_THROTTLED:0 "Der schwachen Antwort folgen"
 EPOCH_ECHO_THROTTLED_DESC:0 "Ein Scan mit reduzierter Leistung folgt der breiteren und unsichereren Antwort."
 EPOCH_MISSING_EXPEDITION:0 "Expedition in die Signalspur"
 EPOCH_MISSING_EXPEDITION_DESC:0 "Ein Forschungsschiff muss seine Instrumente entlang der ermittelten Peilung in die Verzerrung bringen. Fernmessungen erlauben keine sichere Annäherung. Die Einschätzung der Einsatzleitung ist eindeutig: Das eingesetzte Schiff wird während dieser Expedition verloren gehen."
 EPOCH_EXPEDITION_RESCUE:0 "Nach der vermissten Besatzung suchen"
 EPOCH_EXPEDITION_RESCUE_DESC:0 "Eine geduldige Suche konzentriert sich auf Notrufsender und überlebensfähige Wrackteile."
 EPOCH_EXPEDITION_SALVAGE:0 "Den Expeditionsrekorder bergen"
 EPOCH_EXPEDITION_SALVAGE_DESC:0 "Ein gezielter Bergungsscan könnte den Rekorder finden, bevor sich das Signal erneut verlagert."
 EPOCH_EXPEDITION_SURVEY:0 "Die Signalspur kartieren"
 EPOCH_EXPEDITION_SURVEY_DESC:0 "Eine breite, langsame Untersuchung kartiert die Spur und hält das Schiff auf Abstand."
 epoch_first_echo_investigation_type:0 "Signalsuche"
 stage_signal_analysis:0 "Signalanalyse"
 stage_source_analysis:0 "Vermisste Expedition"
 stage_contamination:0 "Fremde Veränderungen"
 stage_excavation:0 "Die vergrabene Struktur"
 stage_report:0 "Ein unvollständiger Bericht"
 epoch_core.20.name:0 "Eine Veränderung ohne erkennbare Quelle"
 epoch_core.20.desc.organic:0 "Die Expeditionsproben gleichen nicht mehr den Organismen, die in den Behältern versiegelt wurden. Zellgrenzen haben sich zu wiederkehrenden Anordnungen verschoben. Frische Proben von unserer Hauptstadt zeigen dieselben Veränderungen, obwohl keine Übertragung zwischen beiden dokumentiert ist.\n\nDie betroffenen Organismen leben weiter. Ihre Zyklen folgen nun einem Intervall aus den Vermessungsaufnahmen. Die örtlichen Teams bitten um eine Entscheidung: untersuchen, isolieren oder unberührt lassen."
 epoch_core.20.desc.hive:0 "Ein Teil des biologischen Netzes der Hauptstadt antwortet im falschen Intervall. Die Drohnen bleiben verbunden, doch örtliche Prozesse wiederholen sich, bevor das Kollektiv den zugehörigen Impuls aussendet. Die Abweichung entspricht einer Lücke in den Expeditionsaufzeichnungen.\n\nWir können unsere Aufmerksamkeit in die betroffenen Knoten lenken, ihren örtlichen Austausch unterbrechen oder die Abweichung fortbestehen lassen. Ihre Quelle kann das Kollektiv bislang nicht lokalisieren."
 epoch_core.20.desc.machine:0 "Unabhängige Prozesse auf unserer Hauptstadt liefern identische Strukturen, die in ihren geprüften Anweisungen fehlen. Eine Wiederherstellung des letzten sauberen Zustands entfernt sie nicht. Das Muster kehrt in einem Intervall aus der Expeditionstelemetrie zurück.\n\nKein protokollierter Schreibzugriff verbindet die betroffenen Systeme. Wir können die Prozesse unter Beobachtung verfolgen, ihre Verbindungen isolieren oder ihre Ausführung unter Sicherung der Aufzeichnungen fortsetzen."
 epoch_core.20.a:0 "Ein wissenschaftlich geleitetes Wissenschaftsschiff zur Untersuchung entsenden."
 epoch_core.20.b:0 "Die betroffenen Orte sofort isolieren."
 epoch_core.20.a.tooltip:0 "Ein Forschungsschiff mit Wissenschaftler soll die betroffenen Proben vergleichen."
 epoch_core.20.b.tooltip:0 "Die betroffenen Bereiche werden versiegelt. Die tieferen Schäden bleiben bestehen."
 epoch_core.20.c.tooltip:0 "Die Störung bleibt unkontrolliert und könnte eine weitere unserer Welten erreichen."
 epoch_core.20.c:0 "Den Prozess unbehelligt lassen und eine Verschärfung riskieren."
 epoch_core.26.name:0 "Die Proben konnten nicht gesichert werden"
 epoch_core.26.desc:0 "Die Probenanalyse konnte nicht abgeschlossen werden oder der betroffene Ort steht nicht mehr unter unserer Kontrolle. Die Störung bleibt ungelöst. Die Untersuchung kann an einem verfügbaren Ort wiederholt oder unter Hinnahme der dauerhaften Schäden geschlossen werden."
 epoch_core.26.a:0 "Ein weiteres Wissenschaftsschiff zur Wiederholung entsenden."
 epoch_core.26.b:0 "Die Studie abbrechen und mit den ungelösten Auswirkungen fortfahren."
 epoch_core.28.name:0 "Das Signal ist verstummt"
 epoch_core.28.desc:0 "Die Vermessung konnte das Signal nicht zuverlässig weiterverfolgen. Die letzte Spur der Expedition bleibt ungewiss."
 epoch_core.28.a:0 "Die Vermessung wiederholen."
 epoch_core.28.b:0 "Dieses Vermessungsprojekt abbrechen."
 epoch_core.30.name:0 "Das Suchteam hat die Spur verloren"
 epoch_core.30.desc:0 "Die letzte Suche brachte keine verlässliche neue Spur. Ein weiteres wissenschaftlich geleitetes Schiff kann die gewählte Suche fortsetzen, oder wir halten die Ungewissheit fest und gehen weiter."
 epoch_core.30.a:0 "Ein weiteres Wissenschaftsschiff für die Suche entsenden."
 epoch_core.30.b:0 "Die Suche abbrechen und den unvollständigen Bericht sichern."
 epoch_core.31.name:0 "Die erste Signalanalyse wurde unterbrochen"
 epoch_core.31.desc:0 "Die zugewiesene Untersuchung kann nicht fortgesetzt werden. Ein Ersatzschiff könnte sie wiederholen; andernfalls müssen wir diesen Untersuchungsweg ausdrücklich aufgeben."
 epoch_core.31.a:0 "Ein weiteres Wissenschaftsschiff zur Wiederholung entsenden."
 epoch_core.31.b:0 "Die Untersuchung hier beenden."
 epoch_core.7.desc.project_abandoned:0 "Das Vermessungsprojekt wurde abgebrochen, bevor es klären konnte, was mit der Expedition geschah. Es wurde kein Expeditionsschiff als vermisst eingestuft."
 epoch_core.32.name:0 "Die Folgeanalyse wurde unterbrochen"
 epoch_core.32.desc:0 "Die Folgeuntersuchung endete, bevor ein Ergebnis feststand. Ein weiteres Wissenschaftsschiff kann die Arbeit übernehmen, oder wir geben sie ausdrücklich auf und fahren mit den vorhandenen Erkenntnissen fort."
 epoch_core.32.a:0 "Ein weiteres Wissenschaftsschiff zur Wiederholung entsenden."
 epoch_core.32.b:0 "Die Untersuchung abbrechen und zur Expedition übergehen."
 epoch_core.44.name:0 "Die Ausgrabungsstätte ist nicht mehr verfügbar"
 epoch_core.44.desc:0 "Das Grabungsteam kann die Kammer nicht mehr erreichen. Geblieben sind Vermessungsaufzeichnungen: gemessene Kurven, beprobte Schichten und Lücken dort, wo die unmittelbare Beobachtung endete.\n\nEin Forschungsschiff könnte diese Aufzeichnungen an einem sicheren Standort untersuchen. Die Rekonstruktion würde das noch Erkennbare bewahren; die Stätte selbst kann sie nicht ersetzen."
 epoch_core.44.a:0 "Ein Wissenschaftsschiff zur Fernanalyse entsenden."
 epoch_core.44.b:0 "Die unvollständigen Erkenntnisse archivieren und die Untersuchung schließen."
 epoch_core.46.name:0 "Die Fernanalyse wurde unterbrochen"
 epoch_core.46.desc:0 "Der Fernvergleich ist zum Erliegen gekommen, bevor die Geometrie der Kammer geklärt werden konnte. Die geborgenen Beobachtungen bleiben erhalten. Ein anderes Forschungsschiff könnte die Auswertung übernehmen, oder wir versiegeln die unvollständigen Aufzeichnungen."
 epoch_core.46.a:0 "Ein weiteres Wissenschaftsschiff zur Wiederholung entsenden."
 epoch_core.46.b:0 "Die unvollständigen Erkenntnisse archivieren und die Untersuchung schließen."
 epoch_core.22.name:0 "Die stille Struktur"
 epoch_core.22.desc.organic:0 "Das veränderte Material bildet eine regelmäßige Grenze um einen versiegelten Hohlraum. Die umliegenden Organismen wiederholen ein Intervall aus dem Signal und den Aufzeichnungen der Expedition. Keine Probe erklärt, wie das Muster begann."
 epoch_core.22.desc.hive:0 "Unter dem veränderten biologischen Netzwerk ist eine Struktur freigelegt worden. Ihre Grenze wiederholt ein Intervall aus dem Signal und den Aufzeichnungen der vermissten Expedition. Der Schwarm kann nicht feststellen, ob sie aktiv ist."
 epoch_core.22.desc.machine:0 "Unter den beschädigten Prozessen ist eine vergrabene Struktur sichtbar. Ihre Oberfläche trägt ein Intervall aus dem Signal und den Expeditionsaufzeichnungen, doch kein bekannter Bauplan stimmt damit überein."
 epoch_core.22.a:0 "Eine wissenschaftlich geleitete Ausgrabung am Fundort genehmigen."
 epoch_core.40.name:0 "Eine wiederkehrende Grenze"
 epoch_core.40.desc:0 "Die erste freigelegte Schicht zieht sich ohne sichtbare Fuge unter das umgebende Material. Proben von gegenüberliegenden Seiten teilen weder Zusammensetzung noch Herkunft, wiederholen aber dasselbe schwache Intervall.\n\nDas Grabungsteam hat die Kurve im Vermessungsplan verzeichnet. Sie setzt sich über jeden bisher freigelegten Punkt hinaus fort."
 epoch_core.40.a:0 "Die Grenze vermessen, bevor weiteres Material entfernt wird."
 epoch_core.40.b:0 "Einen direkten Zugang zum Zentrum freilegen."
 epoch_core.41.name:0 "Die veränderte Schicht"
 epoch_core.41.desc.spread:0 "Die Ablagerungen tragen dieselben Störungen, die bereits auf anderen Welten festgestellt wurden. Die Ausgrabungsinstrumente reagieren, sobald sich die betroffenen Schichten berühren."
 epoch_core.41.desc.contained:0 "Die isolierten Proben bleiben stabil, doch die äußere Schicht der Struktur enthält Spuren der früheren Kontamination."
 epoch_core.41.desc.standard:0 "Unter der Grenze liegt eine zweite Schicht. Ihre Oberfläche ist intakt, aber die Messgeräte registrieren Veränderungen, sobald sich ein Werkzeug nähert."
 epoch_core.41.a:0 "Die Schicht mit den isolierten Proben vergleichen."
 epoch_core.41.b:0 "Durchbrechen, bevor sich die Messwerte erneut ändern."
 epoch_core.42.name:0 "Ein bekanntes Intervall"
 epoch_core.42.desc.degraded:0 "Die geborgenen Koordinaten sind unvollständig. Das Muster in der unteren Kammer stimmt fast mit ihnen überein, doch eine Lücke macht den Vergleich unsicher."
 epoch_core.42.desc.recovered:0 "Der Expeditionsrekorder wiederholt das Intervall, das nun in der unteren Kammer gemessen wird. Legt das Team beide Aufzeichnungen übereinander, fällt die fehlende Passage der einen auf eine unversehrte Markierung der anderen.\n\nDie Übereinstimmung übersteht jede Neukalibrierung. Sie erlaubt einen Vergleich, aber keine Verortung der beiden Quellen."
 epoch_core.42.desc.standard:0 "In der unteren Kammer stehen Zeichen in regelmäßigen Abständen. Ihr Abstand stimmt mit einem Teil des Signals überein, der Rest bleibt unlesbar."
 epoch_core.42.a:0 "Die Übereinstimmung aufzeichnen und die Instrumente bewahren."
 epoch_core.42.b:0 "Den Mechanismus öffnen, solange das Signal anhält."
 epoch_core.43.name:0 "Die versiegelte Kammer"
 epoch_core.43.desc.risk:0 "Die Schnitte durch die äußeren Schichten bewegen sich. Bei jeder Verschiebung des freigelegten Mechanismus verlieren die Instrumente ihre Kalibrierung; eine sichere Untersuchung können die Teams nicht länger zusagen.\n\nWir können die Kammer unter kontrolliertem Zugang versiegeln, das Freigelegte zerstören oder versuchen, die Aufzeichnung vor dem Rückzug abzuschließen. Jeder Befehl wird auf dieser Welt Spuren hinterlassen."
 epoch_core.43.desc.careful:0 "Die letzte Schicht öffnet sich, ohne die Instrumente zu stören. Im Inneren setzen sich die Markierungen über die Kammerwände fort; sie unterbrechen sich nur dort, wo der Messstrahl über sie hinweggeht. Es gibt keine lesbare Inschrift, keinen Hinweis auf Bewohner und keine Auskunft über einen Erbauer.\n\nDie Teams haben den Zugang abgeschlossen. Nun benötigen sie einen Befehl: die Kammer sichern, zerstören oder die messbaren Befunde abschließend aufzeichnen und sie unversehrt lassen."
 epoch_core.43.desc.standard:0 "Hinter der letzten Schicht liegt eine stille Kammer. Ihre Markierungen wiederholen das von unseren Schiffen aufgezeichnete Intervall, doch keine Oberfläche liefert eine lesbare Erklärung der Struktur. Die Grabung hat das Zentrum erreicht, ohne eine Antwort zu finden.\n\nDie Teams warten auf Anweisungen zur Sicherung, Zerstörung oder abschließenden Untersuchung der Kammer."
 epoch_core.43.a:0 "Die Kammer versiegeln und den Zugang kontrollieren."
 epoch_core.43.b:0 "Die freigelegte Struktur zerstören."
 epoch_core.43.c:0 "Die Untersuchung abschließen und die Kammer unberührt lassen."
 site_epoch_core_silent_structure:0 "Die stille Struktur"
 site_epoch_core_silent_structure_desc:0 "Unter [From.Planet.GetName] umschließt eine regelmäßige Grenze ein Material, das keiner verzeichneten Bauweise entspricht. Sobald Instrumente die freigelegte Oberfläche überqueren, erfassen sie das Intervall aus unseren Vermessungsaufzeichnungen."
 epoch_core.23.name:0 "Ein unvollständiger Bericht"
 epoch_core.23.desc.organic:0 "Die Berichte liegen zusammengeführt vor, doch die betroffene Welt hat nicht zu ihren früheren Rhythmen zurückgefunden. Lebende Systeme tragen eine dauerhafte Spur der Störung. Vermessung, Expedition und Kammer teilen ein Intervall, das keiner unserer Spezialisten einordnen kann.\n\n[Root.GetEpochEchoSummary]\n\n[Root.GetEpochExpeditionSummary]\n\n[Root.GetEpochContaminationSummary]\n\nWir müssen entscheiden, ob diese Aufzeichnungen eine offene Untersuchung bleiben oder zum versiegelten Bericht über das werden, was wir bereits verloren haben."
 epoch_core.23.desc.hive:0 "Das Kollektiv hat die erhaltenen Beobachtungen verbunden. Auf der betroffenen Welt bleibt eine Unterbrechung bestehen, die gewöhnliche Regeneration nicht erreicht. Sie teilt das Intervall der Expedition, doch kein Impuls in uns erklärt sie.\n\n[Root.GetEpochEchoSummary]\n\n[Root.GetEpochExpeditionSummary]\n\n[Root.GetEpochContaminationSummary]\n\nWir können unsere Aufmerksamkeit auf das ungeklärte Muster richten oder den Zugang dazu im gesamten Kollektiv schließen."
 epoch_core.23.desc.machine:0 "Die erhaltenen Aufzeichnungen stimmen innerhalb ihrer Messtoleranzen überein. Den dauerhaften Fehler in den Prozessen der betroffenen Welt erklären sie nicht. Dasselbe Intervall tritt in unabhängigen Systemen ohne verzeichneten Austausch auf.\n\n[Root.GetEpochEchoSummary]\n\n[Root.GetEpochExpeditionSummary]\n\n[Root.GetEpochContaminationSummary]\n\nWeitere Beobachtungen benötigen eine Autorisierung. Eine Versiegelung des Archivs beendet diese Untersuchung dauerhaft; ihre Folgen bleiben bestehen."
 epoch_core.23.desc.ruined:0 "Die freigelegte Struktur ist zerstört und der Ort zu stark beschädigt, um ihn weiter zu untersuchen. Die Expeditionsaufzeichnungen und die Veränderungen auf dieser Welt sind dokumentiert, doch keine erhaltene Spur erklärt ihre Ursache.\n\n[Root.GetEpochEchoSummary]\n\n[Root.GetEpochExpeditionSummary]\n\n[Root.GetEpochContaminationSummary]"
 epoch_core.23.desc.secured:0 "Die Struktur ist hinter einem kontrollierten Zugang versiegelt. Wir bargen Fragmente der Expedition und der betroffenen Welt, doch ihre wiederkehrenden Intervalle erklären weder Ursprung noch Ende des Prozesses.\n\n[Root.GetEpochEchoSummary]\n\n[Root.GetEpochExpeditionSummary]\n\n[Root.GetEpochContaminationSummary]"
 epoch_core.23.desc.studied:0 "Die Zeichen der Struktur stimmen mit Fragmenten der vermissten Expedition und der betroffenen Welt überein. Diese Übereinstimmung lässt sich messen, doch Ursache, Urheber und Zweck bleiben unbekannt. Der Bericht ist unvollständig.\n\n[Root.GetEpochEchoSummary]\n\n[Root.GetEpochExpeditionSummary]\n\n[Root.GetEpochContaminationSummary]"
 epoch_core.23.a:0 "Die Instrumente weiter betreiben und den Spuren folgen."
 epoch_core.23.b:0 "Die Aufzeichnungen versiegeln und weiteren Zugang untersagen."
 EPOCH_CONTAMINATION_STUDY:0 "Die veränderten Prozesse untersuchen"
