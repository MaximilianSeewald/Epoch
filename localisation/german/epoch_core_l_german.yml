 epoch_first_echo_phase_echo_research:0 "Den Impuls analysieren. Ab 15 Fortschritt ein Wissenschaftsschiff mit wissenschaftlicher Leitung zur ersten Untersuchung entsenden."
 epoch_first_echo_phase_expedition_research:0 "Die geborgenen Intervalle vergleichen. Ab 25 Fortschritt eine Expedition zu den Signalkoordinaten genehmigen."
 epoch_first_echo_phase_contamination_research:0 "Den Expeditionsbericht mit lokalen Proben vergleichen. Ab 35 Fortschritt über den Umgang mit der Kontamination entscheiden."
 epoch_first_echo_phase_structure_research:0 "Die Quelle unter den veränderten Schichten lokalisieren. Ab 45 Fortschritt die Ausgrabung genehmigen."
 epoch_first_echo_phase_report_research:0 "Expeditions-, Proben- und Ausgrabungsdaten zusammenführen. Ab 55 Fortschritt den Abschlussbericht prüfen."
 epoch_core.23.a.tooltip:0 "Die erhaltenen Erkenntnisse für weitere Untersuchungen zugänglich halten. Der dokumentierte Schaden bleibt bestehen."
 epoch_core.23.b.tooltip:0 "Diese Untersuchung endgültig schließen. Keine weiteren Expeditionen werden genehmigt; Schäden und Entdeckungen bleiben bestehen."
 epoch_core.summary.echo_abandoned:0 "Der zweite Vergleich wurde aufgegeben; die Signalaufzeichnung bleibt unvollständig."
 epoch_core.summary.echo_degraded:0 "Die erzwungene Signalerfassung hinterließ eine beschädigte Referenz, die unsere Schlüsse weiterhin begrenzt."
 epoch_core.summary.echo_cautious:0 "Die geduldige Vergleichsmessung bewahrt ein zuverlässiges Intervall, jedoch keinen erkennbaren Absender."
 epoch_core.summary.echo_aggressive:0 "Der schnelle Durchlauf lieferte eine Peilung, ohne die Antwort zu erklären."
 epoch_core.summary.expedition_cancelled:0 "Die Expedition wurde vor einem Kontaktverlust zurückgerufen; nur Fernmessungen verbinden sie mit diesem Ort."
 epoch_core.summary.expedition_rescued:0 "Die geborgenen Expeditionsteilnehmer melden dieselbe Lücke, die unsere Instrumente nicht erklären können."
 epoch_core.summary.expedition_recorder:0 "Nur der Expeditionsrekorder kehrte zurück. Sein wiederkehrendes Intervall überdauerte die Expedition."
 epoch_core.summary.expedition_wake:0 "Die Fernvermessung bewahrte die Verzerrung, doch die Expedition kehrte nicht zurück."
 epoch_core.summary.expedition_lost:0 "Die vermisste Expedition gilt als verloren. Ihr Schweigen bleibt Teil der Beweislage."
 epoch_core.summary.contamination_contained:0 "Die Isolation beendete die aktive lokale Störung. Den tieferen Schaden erklärte sie nicht."
 epoch_core.summary.contamination_studied:0 "Die Probenanalyse verringerte die Störung, doch ihre Spur bleibt in den lokalen Abläufen bestehen."
 epoch_core.summary.contamination_neglected:0 "Die ungelöste Kontamination bleibt eine dauerhafte Belastung; der Abschlussbericht wird sie nicht beseitigen."
 stage_echo_resolution:0 "Erstes Echo: Untersuchungen ausstehend"
 epoch_resonance_protocol:0 "Resonanzprotokoll"
 epoch_ii_situation_desc:0 "Der alte Kontaminationsbericht antwortet auf ein Signal, das das Reich für verstummt hielt. Die Resonanzstabilität beginnt bei 60 auf einer Skala von 0 bis 100; Entscheidungen, Forschungsansätze und der Angriff der Jäger verändern ihren Wert. Schließe jede Untersuchung ab, bevor das Protokoll fortschreitet."
 epoch_ii_controlled_approach:0 "Kontrollierte Analyse"
 epoch_ii_intensive_approach:0 "Intensive Forschung"
 epoch_ii_suppress_approach:0 "Resonanz eindämmen"
 epoch_ii_exploit_approach:0 "Resonanz ausnutzen"
 epoch_ii_progress_controlled:0 "Kontrollierte Analyse"
 epoch_ii_progress_intensive:0 "Intensive Forschung"
 epoch_ii_progress_suppress:0 "Eindämmungsprotokoll"
 epoch_ii_progress_exploit:0 "Resonanzauswertung"
 epoch_ii_stability_bonus:0 "Hohe Resonanzstabilität unterstützt die kontrollierte Analyse."
 epoch_ii_stability_recovery:0 "Niedrige Resonanzstabilität verlangsamt den Fortschritt; Eindämmung hilft, die Kontrolle wiederzugewinnen."
 epoch_ii_stability_risk:0 "Bei niedriger Resonanzstabilität ist die Auswertung unberechenbar."
 epoch_ii_stage_scar:0 "Kapitel 1 — Das Erwachen der Narbe: Wähle eine Untersuchungsstrategie."
 epoch_ii_stage_scar_report:0 "Kapitel 1 — Weise ein bemanntes Wissenschaftsschiff zur Untersuchung der Narbe zu oder nutze das Archiv."
 epoch_ii_stage_hunters:0 "Kapitel 2 — Entscheide, wie du auf die unbekannte Flotte reagierst."
 epoch_ii_stage_hunters_resolution:0 "Kapitel 2 — Bewältige die Bedrohung durch Verteidigung, Ablenkung oder einen dokumentierten Rückzug."
 epoch_ii_stage_code:0 "Kapitel 3 — Wähle eine Methode zur Analyse des Signals oder Wracks."
 epoch_ii_stage_handoff:0 "Kapitel 3 — Werte den Bericht zum Gegenmuster aus, um Block A abzuschließen."
 epoch_ii.1.name:0 "Das Erwachen der Narbe"
 epoch_ii.1.desc.organic:0 "Auf der alten Kontaminationswelt berichten schlafende Gemeinschaften denselben Traum: ein Puls, der durch Erde, Wasser und Knochen läuft. Die Narbe hat eine Geometrie angenommen, die keine frühere Untersuchung verzeichnete. Jenseits des Systems hat etwas auf das Signal geantwortet."
 epoch_ii.1.desc.hive:0 "Randdrohnen registrieren einen Rhythmus außerhalb des synaptischen Netzes. Er wiederholt sich in Brutkammern und Mineralschichten und entspricht dem alten Kontaminationsbericht. Die Narbe antwortet auf ein fernes Signal."
 epoch_ii.1.desc.machine:0 "Taktabweichungen und umgeordnete Speicheradressen führen zu den archivierten Kontaminationskoordinaten. Die Anomalie ist keine biologische Infektion, sondern ein geordnetes Fehlermuster, das auf ein externes Signal antwortet."
 epoch_ii.1.a:0 "Den Bericht wieder öffnen."
 epoch_ii.2.name:0 "Ein Muster in der Narbe"
 epoch_ii.2.desc.organic:0 "Der alte Schaden wiederholt sich nun in präzisen Intervallen. Die Untersuchungsteams sind uneins: aus der Ferne beobachten, einen Forschungsperimeter errichten oder das Signal eindämmen, bevor es sich ausbreitet."
 epoch_ii.2.desc.hive:0 "Eine Kadenz dringt in das Kollektiv ein. Isolieren, innerhalb eines begrenzten Perimeters untersuchen oder dämpfen, bevor weitere Drohnen synchronisiert werden."
 epoch_ii.2.desc.machine:0 "Ein wiederkehrender Taktfehler erscheint in den archivierten Standortdaten. Wähle passive Beobachtung, einen begrenzten Forschungssandkasten oder eine Notabschaltung des Signals."
 epoch_ii.2.a:0 "Aus der Ferne beobachten."
 epoch_ii.2.b:0 "Einen begrenzten Forschungsperimeter einrichten."
 epoch_ii.2.c:0 "Die Resonanz notfallmäßig eindämmen."
 epoch_ii.3.name:0 "Ausgangsmessung abgeschlossen"
 epoch_ii.3.desc:0 "Die Untersuchung entdeckt eine Antwort im alten Signalband der Narbe. Die Messungen lassen sich mit dem früheren Bericht vergleichen, doch sie identifizieren keinen Absender."
 epoch_ii.3.desc.archive:0 "Das Archiv bewahrt genug vom alten Signal, um eine Antwort zu bestätigen. Die Messungen sind unvollständig und identifizieren keinen Absender."
 epoch_ii.3.a:0 "Die Ausgangsmessung sichern und fortfahren."
 epoch_ii.4.name:0 "Die ersten Jäger"
 epoch_ii.4.desc.organic:0 "Eine kompakte Formation dringt in das Narbensystem ein. Ihre unterbrochenen Impulse entsprechen dem alten Bericht, und ihre Waffen richten sich auf den antwortenden Ort. Die Formation sendet keine verständliche Warnung."
 epoch_ii.4.desc.hive:0 "Unbekannte Rümpfe erreichen das Narbensystem. Ihre Emissionen löschen dieselben Intervalle aus, die in der fremden Kadenz enthalten sind. Sie bewegen sich auf deren Quelle zu."
 epoch_ii.4.desc.machine:0 "Eine unbekannte Formation erreicht das System und nimmt die Resonanzquelle ins Visier. Ihre Emissionen versuchen, dasselbe Signal auszulöschen, das im alten Kontaminationsarchiv verzeichnet ist."
 epoch_ii.4.desc.remote:0 "Eine unbekannte Formation erreicht das System und nimmt den Horchposten ins Visier, der unsere überlieferten Aufzeichnungen schützt. Ihre unterbrochenen Impulse entsprechen dem Signal der verlorenen Kontaminationswelt."
 epoch_ii.4.combat:0 "Unsere Streitkräfte greifen die unbekannten Schiffe an. Ihre Waffen sind real, ihre Formation kompakt, doch die vorliegenden Hinweise erklären ihre Absicht nicht. Dokumentiere das Gefecht und sichere alles, was übrig bleibt."
 epoch_ii.4.combat_report:0 "Unsere Streitkräfte haben die unbekannte Flotte abgefangen. Die Formation greift weiterhin die Resonanzquelle an. Wir müssen einen Ausgang des Gefechts oder einen Rückzug festhalten, bevor die Untersuchung weitergeht."
 epoch_ii.4.defense:0 "Die Formation nähert sich dem Resonanzstandort. Unsere Verteidigungsausgaben verschaffen Zeit, eine echte Flotte im System zusammenzuziehen. Nur mit genügend Schiffen können wir sie zurückdrängen; andernfalls müssen wir empfindliche Aufzeichnungen evakuieren oder unter Beschuss abziehen."
 epoch_ii.4.diversion:0 "Ein wissenschaftliches Ablenkungssignal könnte die Formation von der Narbe fortlocken. Die Vorbereitung kostet Zeit und setzt unser Forschungsschiff einem Risiko aus."
 epoch_ii.4.a:0 "Die Formation angreifen."
 epoch_ii.4.b:0 "Legierungen, Energie und eine Flotte für die Verteidigung aufwenden."
 epoch_ii.4.c:0 "Eine wissenschaftliche Ablenkung vorbereiten."
 epoch_ii.4.d:0 "Zurückziehen und ein entferntes Signalfragment sichern."
 epoch_ii.4.win:0 "Gefecht gewonnen: Wrackteile bergen."
 epoch_ii.4.loss:0 "Rückzug anordnen und das Signal sichern."
 epoch_ii.4.hold:0 "Den Verteidigungsring halten, bis die Formation aufbricht."
 epoch_ii.4.defense_loss:0 "Den Verteidigungsring aufgeben und den Rückzug antreten."
 epoch_ii.15.evacuate:0 "Empfindliche Aufzeichnungen evakuieren und den Rückzug antreten."
 epoch_ii.11.name:0 "Die Beweise sind unvollständig"
 epoch_ii.11.desc:0 "Das Signal lässt sich aus dem Wrack oder der Spur rekonstruieren, doch die Analyse benötigt ein bemanntes Wissenschaftsschiff. Ein kostspieliger Archivvergleich kann es ersetzen; alternativ warten wir auf ein Schiff."
 epoch_ii.11.a:0 "Energie und Legierungen für die Fernanalyse aufwenden."
 epoch_ii.11.b:0 "Auf ein bemanntes Wissenschaftsschiff warten."
 epoch_ii.7.name:0 "Der gebrochene Code"
 epoch_ii.7.desc.wreck:0 "Das geborgene Wrack wiederholt eine Korrekturfolge, keine Sprache. Jeder Versuch, den Puls der Narbe auszulöschen, erzeugt andernorts ein kleineres Echo."
 epoch_ii.7.desc.signal:0 "Das abgefangene Signal wiederholt eine Korrekturfolge, keine Sprache. Es reagiert auf Abweichungen im Puls der Narbe."
 epoch_ii.7.desc.archive:0 "Die Archivrekonstruktion ist unvollständig, doch ihre erhaltenen Intervalle bilden eine Korrekturfolge. Das Wrack und der ursprüngliche Standort sind für uns nicht erreichbar."
 epoch_ii.7.a:0 "Eine vorsichtige forensische Analyse durchführen."
 epoch_ii.7.b:0 "Das Muster intensiv rekonstruieren."
 epoch_ii.7.c:0 "Einen langsameren Archivvergleich durchführen."
 epoch_ii.7.report.name:0 "Gegenmuster"
 epoch_ii.7.report.desc:0 "Der Vergleich bestätigt ein Gegenmuster, das Narbe und Angreifersignal gemeinsam haben. Die Forschenden übernehmen die vorläufige Bezeichnung Nullwächter für die unbekannte Formation. Die Resonanzspektroskopie kann nun regulär erforscht werden, doch die Analyse erklärt nicht, wer eines der Muster erschaffen hat."
 epoch_ii.7.report.a:0 "Ergebnis festhalten und Block A abschließen."
 epoch_ii.recovery.name:0 "Untersuchungsweg unterbrochen"
 epoch_ii.recovery.desc:0 "Die ursprüngliche Welt, das Forschungsschiff oder die physischen Beweise sind nicht verfügbar. Das Archiv enthält genügend Signalfragmente, um mit geringerer Ausbeute fortzufahren oder den Verlust zu dokumentieren und die Untersuchung zu schließen."
 epoch_ii.recovery.a:0 "Mit dem beschädigten Archiv fortfahren."
 epoch_ii.recovery.wait:0 "Warten, bis ein Wissenschaftsschiff verfügbar ist."
 epoch_ii.c1_recovery.desc:0 "Das Forschungsschiff konnte die Vermessung nicht abschließen. Der Standort bleibt unverändert, doch sein Signal lässt sich mit einem unvollständigen Archiv untersuchen oder die Akten lassen sich versiegeln."
 epoch_ii.18.name:0 "Die Ablenkung scheitert"
 epoch_ii.18.desc:0 "Die Signalsimulation hat die unbekannte Formation nicht fortgelockt. Sie bewegt sich weiter auf die Narbe zu. Wir können einen kostspieligen Rückzug anordnen und das Signal sichern oder die Untersuchung beenden."
 epoch_ii.18.a:0 "Die Verteidigung zurückziehen und die Signalspur sichern."
 epoch_ii.refuse:0 "Die Akten versiegeln und die Untersuchung beenden."
 epoch_ii.science_ship_missing:0 "Kein bemanntes Wissenschaftsschiff steht für die Untersuchung der Narbe bereit. Nutze das unvollständige Archiv oder warte, bis ein Schiff und eine Wissenschaftlerin oder ein Wissenschaftler verfügbar sind."
 tech_epoch_resonance_spectroscopy:0 "Resonanzspektroskopie"
 tech_epoch_resonance_spectroscopy_desc:0 "Der Spektralvergleich isoliert wiederkehrende Auslöschungsintervalle in anomalen Signalen. Die Methode verbessert die reguläre Physikforschung und ermöglicht weitere Resonanzanalysen."
 tech_epoch_adaptive_resonance_armor:0 "Adaptive Resonanzpanzerung"
 tech_epoch_adaptive_resonance_armor_desc:0 "Mehrschichtige adaptive Panzerung verteilt geordnete Energieimpulse über ein defensives Schiffsnetz. Sie erhöht Panzerung und Hüllenresistenz in regulären Gefechten."
 SMALL_EPOCH_RESONANCE_ARMOR:0 "Adaptive Resonanzpanzerung"
 SMALL_EPOCH_RESONANCE_ARMOR_DESC:0 "Eine Panzerungskomponente für kleine Schiffe, verstärkt gegen wiederkehrende Energiemuster."
 EPOCH_RESONANCE_ARMOR:0 "Adaptive Resonanzpanzerung"
 EPOCH_RESONANCE_ARMOR_DESC:0 "Ein modulares Panzerset, das gegen wiederkehrende Resonanzmuster ausgelegt ist."
 d_epoch_contamination_active:0 "Resonanter Kontaminationsstandort"
 d_epoch_contamination_active_desc:0 "Der ursprüngliche Kontaminationsstandort bleibt im historischen Bericht verzeichnet. Seine früheren Folgen bestehen fort."
 d_epoch_contamination_worsened:0 "Verschlimmerter Kontaminationsstandort"
 d_epoch_contamination_worsened_desc:0 "Der ursprüngliche Standort weist das verschlimmerte Ergebnis und dessen anhaltende lokale Folgen auf."
 d_epoch_contamination_studied:0 "Untersuchter Kontaminationsstandort"
 d_epoch_contamination_studied_desc:0 "Die Probenahme veränderte den erfassten Zustand, beseitigte aber nicht die Folgen des ursprünglichen Standorts."
 d_epoch_contamination_contained:0 "Eingedämmter Kontaminationsstandort"
 d_epoch_contamination_contained_desc:0 "Die aktiven Auswirkungen des ursprünglichen Standorts wurden eingedämmt; seine Geschichte und Spuren bleiben erhalten."
 d_epoch_conclusion_scar_organic:0 "Dauerhafte Abschlussnarbe"
 d_epoch_conclusion_scar_organic_desc:0 "Die dauerhafte organische Narbe aus der früheren Untersuchung verbleibt auf dieser Welt."
 d_epoch_conclusion_scar_hive:0 "Dauerhafte Abschlussnarbe"
 d_epoch_conclusion_scar_hive_desc:0 "Die dauerhafte Schwarmnarbe aus der früheren Untersuchung verbleibt auf dieser Welt."
 d_epoch_conclusion_scar_machine:0 "Dauerhafte Abschlussnarbe"
 d_epoch_conclusion_scar_machine_desc:0 "Die dauerhafte Maschinennarbe aus der früheren Untersuchung verbleibt auf dieser Welt."
 NAME_EPOCH_Unknown_Force:0 "Unbekannte Unterdrückungsflotte"
 NAME_EPOCH_Unknown_Patrol:0 "Unbekannte Patrouille"
 NAME_EPOCH_Unknown_Skirmisher:0 "Unbekanntes Jagdschiff"
 EPOCH_II_SCAR_SURVEY:0 "Vermessung des Resonanzstandorts"
 EPOCH_II_SCAR_SURVEY_DESC:0 "Miss die Veränderungen am ursprünglichen Kontaminationsstandort und vergleiche sie mit dem archivierten Expeditionsbericht."
 EPOCH_II_SIGNAL_DIVERSION:0 "Signalablenkung vorbereiten"
 EPOCH_II_SIGNAL_DIVERSION_DESC:0 "Erzeuge eine kontrollierte Nachbildung des Narbensignals, um die unbekannte Flotte von seiner Quelle fortzulocken."
 EPOCH_II_CODE_ARCHIVE:0 "Signal aus Archiven rekonstruieren"
 EPOCH_II_CODE_ARCHIVE_DESC:0 "Vergleiche die geborgenen Intervalle mit den archivierten Kontaminations- und Expeditionsberichten des Reichs."
 EPOCH_II_CODE_FORENSICS:0 "Forensische Wrackanalyse"
 EPOCH_II_CODE_FORENSICS_DESC:0 "Untersuche geborgene Bauteile und kartiere die wiederkehrende Korrekturfolge, ohne das gesamte Wrack zu zerlegen."
 EPOCH_II_CODE_RECONSTRUCTION:0 "Intensive Musterrekonstruktion"
 EPOCH_II_CODE_RECONSTRUCTION_DESC:0 "Rekonstruiere die Korrekturfolge rasch und nimm zusätzliche Kosten sowie sinkende Resonanzstabilität in Kauf."
 epoch_ii.16.no_target:0 "Keine eigene Welt kann die Ablenkung aufnehmen. Sichere die Quellenaufzeichnungen und ziehe dich zurück."
 epoch_ii.c1_project_failed.desc:0 "Die Vermessung scheiterte, bevor sie eine verlässliche Ausgangslage liefern konnte. Der Standort kann erneut untersucht oder dieses Kapitel anhand der archivierten Aufzeichnungen abgeschlossen werden."
 epoch_ii.c1_project_cancelled.desc:0 "Die Vermessung wurde vor ihrem Abschluss abgebrochen. Wir können sie erneut versuchen oder das Kapitel anhand der archivierten Aufzeichnungen beenden."
 epoch_ii.project.retry:0 "Einen weiteren Versuch vorbereiten."
 epoch_ii.18.failed.desc:0 "Die Signalsimulation konnte die feindliche Formation nicht ablenken. Das Projekt hat Verluste verursacht, doch die überlebende Flotte lässt sich gegen weitere Kosten noch fortlocken."
 epoch_ii.18.cancelled.desc:0 "Das Ablenkungsprojekt wurde vor seinem Abschluss abgebrochen. Wir können den Einsatz wiederholen oder die Aufzeichnungen sichern und uns zurückziehen."
 epoch_ii.18.retry:0 "Die Ablenkung neu aufbauen und erneut versuchen."
 epoch_ii.18.withdraw:0 "Die Quelle versiegeln, die Signalspur sichern und abziehen."
 epoch_ii.11.failed.desc:0 "Die Rekonstruktion ergab kein stabiles Muster. Das Forschungsteam kann es erneut versuchen oder das Kapitel durch einen kostspieligen Archivvergleich abschließen."
 epoch_ii.11.cancelled.desc:0 "Die Rekonstruktion wurde vor ihrem Abschluss abgebrochen. Das Projekt kann neu gestartet oder das Kapitel durch einen Archivvergleich beendet werden."
 epoch_ii.11.no_site:0 "Das Kapitel anhand der erhaltenen Fernaufzeichnungen ohne lokalen Forschungsstandort abschließen."
 epoch_ii.11.limited_archive:0 "Das Kapitel mit einer unvollständigen Archivrekonstruktion abschließen."
 epoch_ii_stage_ch4_research:0 "Kapitel 4: Entscheide, ob der zweite Resonanzausdruck eingedämmt, beobachtet oder ausgenutzt wird."
 epoch_ii_stage_ch4_action:0 "Löse zwei planetare Zwischenfälle und lege ein dauerhaftes Protokoll fest."
 epoch_ii_stage_ch5_research:0 "Bereite die interstellare Untersuchung vor."
 epoch_ii_stage_ch5_action:0 "Untersuche zwei reale Systeme oder bezahle für die weniger ergiebige Archivroute."
 epoch_ii_stage_silent_system:0 "Entscheide, wie das Forschungsteam auf die unnatürliche Stille reagiert."
 epoch_ii_stage_ch6_research:0 "Werte die Netzwerkerkenntnisse aus und bereite dich auf eine angepasste Feindflotte vor."
 epoch_ii_stage_ch6_action:0 "Löse die zweite Begegnung durch Kampf, Falle, Gegenmaßnahme oder Rückzug."
 epoch_ii.60.name:0 "Die zweite Infektion"
 epoch_ii.60.desc.organic:0 "Wachstumsringe, Bodenchemie und gleichzeitige Träume zeigen übereinstimmende Muster. Keine gewöhnliche biologische Übertragung verbindet sie. Eine Quarantäne kostet Ertrag, hält aber die Grenze lesbar. Direkte Beobachtung bringt bessere Daten; gezielte Exposition könnte das Muster offenlegen und die Stabilität gefährden."
 epoch_ii.60.desc.hive:0 "Periphere Drohnen wiederholen einen Impuls, den der Schwarm selbst nicht gesendet hat. Isolation begrenzt die Störung, Beobachtung könnte den Takt erfassen, gezielte Exposition verspricht mehr Daten bei Gefahr für die Koordination."
 epoch_ii.60.desc.machine:0 "Speicherzugriffe driften in synchronen Intervallen, während verarbeitete Legierungen wiederkehrende Mikrostrukturen zeigen. Eine Sandbox ist sicherer; direkte Emulation liefert mehr Daten; ein Prozessspiegel kann außergewöhnliche Messwerte bei Stabilitätsverlust erzeugen."
 epoch_ii.60.a:0 "Die Grenze abriegeln. (Sicherer, weniger Erkenntnisse)"
 epoch_ii.60.b:0 "Unter kontrollierten Bedingungen beobachten. (Mittleres Risiko, bessere Daten)"
 epoch_ii.60.c:0 "Die Resonanz ausnutzen. (Hohes Risiko, höchste Ausbeute)"
 epoch_ii.61.name:0 "Resonanzanomalie"
 epoch_ii.61.desc.organic:0 "Eine Minerader pulsiert im Takt entfernter Pflanzen, obwohl kein Organismus oder Träger beide verbindet. Die Anomalie kann beprobt, beruhigt oder als Live-Messinstrument genutzt werden."
 epoch_ii.61.desc.hive:0 "Eine Gruppe Drohnen fällt in einen wiederkehrenden Koordinationstakt. Das Muster ist messbar, doch jede Beobachtung könnte ihm die Struktur des Schwarms offenbaren."
 epoch_ii.61.desc.machine:0 "Ein Verarbeitungssubstrat sendet eine synchrone Taktkorrektur aus, die nie vom Kontrollnetz angefordert wurde. Die Korrektur kann isoliert, untersucht oder verstärkt werden."
 epoch_ii.61.desc.unstable:0 "Die aktive planetare Narbe ist weiter gebrochen. Eine Minerader pulsiert nun gegen entfernte Umweltprozesse und stört die lokale Produktion. Die Anomalie kann gebunden, unter Exposition untersucht oder für eine Live-Messung verstärkt werden."
 epoch_ii.61.a:0 "Die Anomalie eindämmen."
 epoch_ii.61.b:0 "Die Anomalie untersuchen."
 epoch_ii.61.c:0 "Für eine Live-Messung verstärken."
 epoch_ii.62.name:0 "Koordinationsstörung"
 epoch_ii.62.desc.organic:0 "Arbeitsteams und Bestäubungssysteme antizipieren dasselbe Intervall. Die Produktion gerät aus dem Takt."
 epoch_ii.62.desc.hive:0 "Drohnen am Rand der betroffenen Zone verlieren den Anschluss an den zentralen Schwarmrhythmus."
 epoch_ii.62.desc.machine:0 "Fertigung und Materialtransport geraten trotz gültiger Befehle in einen wiederkehrenden Konflikt."
 epoch_ii.62.a:0 "Produktion opfern und die Zone isolieren."
 epoch_ii.62.b:0 "Die Zone beobachten und Messdaten sichern."
 epoch_ii.62.c:0 "Eine Notbergung finanzieren und die Resonanz binden."
 epoch_ii.68.name:0 "Kontaminationsdurchbruch"
 epoch_ii.68.desc.unstable:0 "Die aktive Grenze ist gebrochen. Resonanz verzerrt Produktion und Stabilität der Welt. Wir können dauerhafte wirtschaftliche Verluste für die Messdaten hinnehmen, einen Sicherheits- und Bergungsperimeter finanzieren oder den Durchbruch als Live-Experiment nutzen und eine weitere Fraktur riskieren."
 epoch_ii.68.desc.default:0 "Die Resonanz hat eine stabile Grenze überschritten. Entscheide, ob du Produktion opferst, einen Sicherheitsperimeter finanzierst oder den Durchbruch für Forschung bei sinkender Stabilität ausnutzt."
 epoch_ii.68.a:0 "Lokalen Ertrag opfern und die Durchbruchdaten bewahren. (Dauerhaft 10 % weniger Job-Ertrag auf dem Planeten)"
 epoch_ii.68.b:0 "Sicherheitsmaßnahmen finanzieren und die Resonanz binden."
 epoch_ii.68.c:0 "Den Durchbruch als Live-Experiment nutzen."
 epoch_ii.63.name:0 "Protokoll festgehalten"
 epoch_ii.63.desc:0 "Zwei Zwischenfälle und eine ausdrückliche Reaktion begründen ein dauerhaftes Protokoll. Die Messreihen eröffnen die Forschung an resonanzfesten Infrastrukturen."
 epoch_ii.63.a:0 "Die Forschungsgrundlage zur Infrastruktur erfassen."
 epoch_ii.63.b:0 "Eine kontrollierte Ausbreitung auf eine zweite eigene Welt genehmigen."
 epoch_ii.63.c:0 "Die Resonanz auf den ursprünglichen Standort begrenzen."
 epoch_ii.64.name:0 "Das Netz der Stille"
 epoch_ii.64.desc:0 "Die gebrochene Signalfolge weist auf entfernte Systeme. Wähle eine Expeditionsmethode, bevor die Teams aufbrechen."
 epoch_ii.64.a:0 "Ein Horchfeld aufbauen."
 epoch_ii.64.b:0 "Eine mobile Expedition entsenden. (Höhere Gefährdung)"
 epoch_ii.64.c:0 "Beide Vermessungen koppeln."
 epoch_ii.65.name:0 "Zwei Resonanzknoten"
 epoch_ii.65.desc:0 "Untersuche die verzögerte Reflexion und die unterbrochene Übertragung in erreichbaren Sternensystemen. Bei fehlendem Zugang oder Schiffen stehen reale Systemziele und ein weniger ergiebiges Archiv zur Verfügung."
 epoch_ii.65.a:0 "Wissenschaftsschiffe mit Besatzung zu beiden Knoten entsenden."
 epoch_ii.65.b:0 "Archivtelemetrie verwenden."
 epoch_ii.67.name:0 "Das System, das nicht antwortet"
 epoch_ii.67.desc:0 "Auf einem erreichbaren kahlen Mond entsprechen parallele Furchen in dunklem Fels den Waffenharmonien der Nullwächter. Navigationsbojen, die natürlichen Schwingungen des Sterns und Teilchenrauschen verstummen an derselben Grenze. Eine schwache Kopie des alten Trägerintervalls unterbricht die Auslöschung für einen Herzschlag; eine Antwort stimmt mit dem letzten Bruchstück der Expeditionsarchive überein. Im Regolith liegen ältere Auslöschungsspuren, doch weder Urheber noch Datum sind erkennbar. Die Nullwächter könnten das Signal unterdrücken."
 epoch_ii.67.a:0 "Das System still halten. (Sicher, klare Daten, unvollständige Antwort)"
 epoch_ii.67.b:0 "Den Impuls abgeschirmt wiederholen."
 epoch_ii.67.c:0 "Ein Gegenmuster aussenden. (Taktischer Hinweis, macht uns sichtbar)"
 epoch_ii.70.name:0 "Die Wächter kehren zurück"
 epoch_ii.70.desc:0 "Eine größere Flotte sammelt sich gegen das kartierte Netzwerk. Ihr Unterdrückungsfeld wurde nach der ersten Begegnung angepasst. Panzerung, Phasensensoren, gekoppelte Vermessungen und die Entscheidung im stillen System verändern die Abwehrmöglichkeiten. Die Technologien werden als reguläre Forschung angeboten und nicht kostenlos gewährt."
 epoch_ii.70.a:0 "Forschungsoptionen für Panzerung und Sensoren bereitstellen."
 epoch_ii.71.name:0 "Zweiter Kontakt mit den Nullwächtern"
 epoch_ii.71.desc.default:0 "Eine sechsschiffige Streitmacht steuert auf den Konvergenzknoten zu. Bei erforschter Zerstörertechnik kommen zwei Begleitschiffe hinzu. Waffen und Formation sind real und feindlich."
 epoch_ii.71.desc.exposed:0 "Das ausgesandte Gegenmuster hat eine größere, alarmierte Formation zum Konvergenzknoten gelockt. Das Störfeld verschleiert bereits das äußere System."
 epoch_ii.71.a:0 "Die Flotte im Kampf stellen. (Zum Sieg muss die feindliche Flotte vernichtet werden)"
 epoch_ii.71.b:0 "Eine Falle am Knoten vorbereiten."
 epoch_ii.71.c:0 "Ein Wissenschaftsschiff zum Stören der Operation entsenden."
 epoch_ii.71.d:0 "Abziehen und Aufzeichnungen retten. (Knoten und Konvergenzdaten gehen verloren)"
 epoch_ii.72.name:0 "Konvergenzspur gesichert"
 epoch_ii.72.desc:0 "Die zweite Streitmacht ist vernichtet oder vom Knoten abgedrängt. Die Aufzeichnungen beschreiben ein Unterdrückungsmuster der Nullwächter und weisen auf eine Resonanzkammer hin. Zweck und Urheberschaft bleiben unbekannt. Das Netzwerk ist kartiert, doch das nächste Kapitel beginnt noch nicht."
 epoch_ii.72.a:0 "Den Bericht zu Block B schließen."
 building_epoch_resonance_laboratory:0 "Resonanzlabor"
 building_epoch_resonance_laboratory_desc:0 "Ein planetarisches Labor misst Resonanz unabhängig vom Fortschritt der Situation. Forschungsleistung und lokale Risiken richten sich nach dem gespeicherten Resonanzzustand der Welt."
 tech_epoch_phased_sensors:0 "Phasen-Sensoren"
 tech_epoch_phased_sensors_desc:0 "Auf phasenverschobene Antworten abgestimmte Sensoren verbessern die Ortung und machen Auslöschungsmuster sichtbar."
 d_epoch_resonance_latent:0 "Echo-Narbe"
 d_epoch_resonance_latent_desc:0 "Eine latente Spur eröffnet eine geringe Forschungsgelegenheit bei geringen wirtschaftlichen Folgen."
 d_epoch_resonance_active:0 "Resonanznarbe"
 d_epoch_resonance_active_desc:0 "Aktive Resonanz steigert die Physikforschung, stört jedoch Produktion und Stabilität der Welt."
 d_epoch_resonance_unstable:0 "Gebrochene Resonanz"
 d_epoch_resonance_unstable_desc:0 "Instabile Resonanz liefert starke Messdaten und verursacht schwere Produktions- und Stabilitätseinbußen. Eine Bergung kann sie binden."
 d_epoch_resonance_controlled:0 "Gebundene Resonanz"
 d_epoch_resonance_controlled_desc:0 "Eine kontrollierte Narbe verbessert Forschung und Produktivität und stabilisiert die Welt."
 NAME_EPOCH_Second_Force:0 "Nullwächter-Konvergenzflotte"
 NAME_EPOCH_Heavy_Suppressor:0 "Schwerer Unterdrücker"
 EPOCH_II_NODE_REFLECTION:0 "Vermessung der verzögerten Reflexion"
 EPOCH_II_NODE_REFLECTION_DESC:0 "Platziere Messgeräte am Reflexionsknoten und vergleiche die Antwort mit dem alten Trägersignal."
 epoch_ii_resonance_latent:0 "Latente Echo-Narbe"
 epoch_ii_resonance_latent_desc:0 "Die latente Resonanzspur eröffnet eine geringe Chance auf Physikforschung bei geringen wirtschaftlichen Folgen."
 epoch_ii_resonance_active:0 "Aktive Resonanznarbe"
 epoch_ii_resonance_active_desc:0 "Aktive Resonanz steigert die Physikforschung, senkt jedoch planetaren Ertrag und Stabilität."
 epoch_ii_resonance_unstable:0 "Gebrochene Resonanz"
 epoch_ii_resonance_unstable_desc:0 "Instabile Resonanz liefert starke Forschung und senkt Ertrag und Stabilität der Welt erheblich."
 epoch_ii_resonance_controlled:0 "Gebundene Resonanz"
 epoch_ii_resonance_controlled_desc:0 "Die gebundene Narbe verbessert Forschung, planetaren Ertrag und Stabilität."
 epoch_ii_breakthrough_sacrifice:0 "Ertragsverlust am Durchbruchsort"
 epoch_ii_breakthrough_sacrifice_desc:0 "Dauerhafte lokale Produktionseinbußen bewahren die Messdaten des Kontaminationsdurchbruchs."
 EPOCH_II_NODE_INTERRUPTED:0 "Vermessung der unterbrochenen Übertragung"
 EPOCH_II_NODE_INTERRUPTED_DESC:0 "Verfolge die unterbrochene Übertragung in ihrem Sternensystem und sichere die fehlenden Intervalle."
 EPOCH_II_SILENT_SYSTEM:0 "Das stille System"
 EPOCH_II_SILENT_SYSTEM_DESC:0 "Vermesse die Stillegrenze und untersuche die parallelen Furchen auf dem kahlen Mond."
 EPOCH_II_NODE_TRAP:0 "Falle am Resonanzknoten"
 EPOCH_II_NODE_TRAP_DESC:0 "Nutze die Messreihen beider Knoten, um am bedrohten System ein Gegenmuster vorzubereiten."
 EPOCH_II_SCIENCE_COUNTERMEASURE:0 "Das Unterdrückungsfeld stören"
 EPOCH_II_SCIENCE_COUNTERMEASURE_DESC:0 "Ein bemanntes Wissenschaftsschiff stimmt von einem geschützten Standort ein Gegensignal auf das feindliche Feld ab."
 epoch_ii.77.desc:0 "Ein Wissenschaftsschiff oder zugänglicher Knoten fehlt, oder eine Expedition lieferte keine auswertbaren Messdaten. Archive ermöglichen eine weniger präzise Untersuchung des stillen Systems, kosten jedoch Ressourcen und Stabilität."
 epoch_ii.77.a:0 "Die fehlenden Knoten anhand der Archive auswerten."
 epoch_ii.80.desc:0 "Das Gegenmaßnahmenprojekt ist fehlgeschlagen oder wurde abgebrochen. Die Flotte lebt weiter und bleibt feindlich, bis ein weiterer Einsatz gelingt oder das Reich sich zurückzieht."
 epoch_ii.80.a:0 "200 Energie investieren und das Projekt einmal mit einem bemannten Wissenschaftsschiff wiederholen."
 epoch_ii.80.b:0 "Abziehen, die Aufzeichnungen sichern und den Knoten aufgeben."
epoch_ii_stage_block_b_report:0 "Übergabe aus Block B — meldet den Wardenkontakt und bereitet den Kammereinsatz vor."
epoch_ii_stage_ch7_boundary:0 "Kapitel 7 — vermesst mit einem bemannten Wissenschaftsschiff oder einem kostenpflichtigen Archivpfad die Kammergrenze."
epoch_ii_stage_ch7_counterpattern:0 "Kapitel 7 — vergleicht das Kammersignal mit den ursprünglichen Aufzeichnungen und den Expeditionen des Netzwerks."
epoch_ii_stage_ch7_instability:0 "Kapitel 7 — begrenzt den Resonanzschub. Die Maßnahme kostet Ressourcen und hinterlässt planetare Belastungen."
epoch_ii_stage_ch7_control:0 "Kapitel 7 — stabilisiert oder verkleinert den Kammereinsatz vor der Entscheidung über das Gegenzeichen."
epoch_ii_stage_ch8_countermark:0 "Kapitel 8 — bestimmt und dokumentiert die dauerhafte Beziehung des Reichs zum Netzwerk."
epoch_ii.120.name:0 "Die Resonanzkammer"
epoch_ii.120.desc.organic:0 "Im Konvergenzsystem formen die Messdaten eine künstliche Grenze. Sie ähnelt keiner bekannten Konstruktion. Ein Wissenschaftsschiff kann sie vorsichtig kartieren, mit Phasensensoren durch ihre äußere Schicht messen oder eine schmale Öffnung erzwingen."
epoch_ii.120.desc.hive:0 "Die Konvergenz ist eine Grenzbedingung, keine Stimme. Eine spezialisierte Drohnengruppe kann ihren Rhythmus kartieren; Phaseninstrumente können sie abtasten; ein riskanter Impuls kann Zugang erzwingen."
epoch_ii.120.desc.machine:0 "Eine stabile Grenze umschließt im Konvergenzsystem eine künstliche Struktur. Ihre Geometrie ist unbekannt. Zur Wahl stehen eine bemannte Vermessung, ein Phasensensordurchlauf oder ein riskanter Eingriff."
epoch_ii.120.careful:0 "Die Außengrenze vorsichtig kartieren."
epoch_ii.120.sensor:0 "Phasensensoren für eine abgeschirmte Messung einsetzen."
epoch_ii.120.force:0 "Einen schmalen Zugang erzwingen."
epoch_ii.120.archive:0 "Die Grenze anhand der Aufzeichnungen rekonstruieren."
epoch_ii.121.retry:0 "Die Kammervermessung einmal für 250 Energie wiederholen."
epoch_ii.121.archive:0 "Für 700 Energie eine unvollständige Archivrekonstruktion durchführen."
epoch_ii.131.desc:0 "Die Kammervermessung konnte nicht abgeschlossen werden. Das gespeicherte Konvergenzsystem bleibt das Ziel, sofern es noch erreichbar ist. Ein Wissenschaftsschiff kann einmal erneut entsandt werden; falls Ort oder Schiff fehlen, bleibt die teure Archivrekonstruktion."
epoch_ii.131.retry:0 "Das bemannte Projekt einmal zu den angegebenen Energiekosten wiederholen."
epoch_ii.131.archive:0 "Den unvollständigen Archivpfad für 700 Energie nutzen oder 40 Stabilität verlieren."
epoch_ii.133.retry:0 "Das bemannte Vergleichsprojekt einmal für 300 Energie wiederholen."
epoch_ii.133.archive:0 "Ein Vergleichsarchiv für 800 Energie nutzen oder 45 Stabilität verlieren."
epoch_ii.135.retry:0 "Das bemannte Stabilisierungsprojekt einmal für 400 Energie wiederholen."
epoch_ii.135.archive:0 "Mit Fernaufzeichnungen für 1.500 Energie versiegeln oder 35 Stabilität verlieren."
EPOCH_II_CHAMBER_BOUNDARY:0 "Die Grenze der Resonanzkammer vermessen"
EPOCH_II_CHAMBER_BOUNDARY_DESC:0 "Ein bemanntes Wissenschaftsschiff vermisst die Außengrenze im gespeicherten Konvergenzsystem und sichert konkrete Messwerte."
epoch_ii.122.name:0 "Das Gegenmuster"
epoch_ii.122.desc.organic:0 "Im Inneren wiederholt sich ein Signal mit den Intervallen des kontaminierten Planeten, des stillen Systems und der verlorenen Expedition. Vollständige Daten lassen sich direkt vergleichen; lückenhafte Archive benötigen eine kostenpflichtige Rekonstruktion oder neue Messungen."
epoch_ii.122.desc.hive:0 "Der innere Impuls stimmt mit der ursprünglichen Wunde und dem stillen Mond überein. Geborgene Fragmente erlauben einen Vergleich; fehlende Intervalle erfordern neue Beobachtungen oder eine teure Rekonstruktion."
epoch_ii.122.desc.machine:0 "Die innere Kammersequenz teilt Prüfsummen mit den ursprünglichen Telemetriedaten und den Netzwerkknoten aus Kapitel 5. Vollständige Expeditionen lassen sich direkt vergleichen; andernfalls kann ein Schiff neue Daten sichern."
epoch_ii.122.expedition:0 "Die vollständigen Aufzeichnungen beider in Kapitel 5 untersuchter Knoten verwenden. Bereits geleistete Forschung weiterverwenden."
epoch_ii.122.partial:0 "Den lückenhaften oder archivierten Datensatz rekonstruieren."
epoch_ii.122.ship:0 "Ein bemanntes Vergleichsprojekt zur neuen Überprüfung starten."
epoch_ii.122.emergency:0 "Aus dem beschädigten Archiv rekonstruieren."
EPOCH_II_CHAMBER_COUNTERPATTERN:0 "Das Gegenmuster der Kammer vergleichen"
EPOCH_II_CHAMBER_COUNTERPATTERN_DESC:0 "Ein 240-tägiges, bemanntes Wissenschaftsschiffprojekt überprüft das Kammersignal mit neuen Messungen. Vollständige Aufzeichnungen von zwei in Kapitel 5 untersuchten Knoten können sofort ausgewertet werden; lückenhafte oder archivierte Daten müssen rekonstruiert werden."
epoch_ii.124.name:0 "Das Netzwerk verliert sein Gleichgewicht"
epoch_ii.124.desc.organic:0 "Als die Kammer antwortet, verändert sich der gemessene Zustand des Kontaminationsorts und das Netzwerk schlägt aus. Bevölkerungsgruppen verfallen in synchrone Krämpfe. Instrumente werden beschädigt, das Feld bleibt instabil; kritische Instabilität verwüstet resonanzempfindliche Welten zusätzlich. Quarantäne kostet Nahrung und Energie."
epoch_ii.124.desc.hive:0 "Die Kammer verstärkt die alte Wunde im gesamten Netzwerk. Drohnen verlieren ihren Rhythmus, resonanzempfindliche Welten brechen auf; kritische Instabilität richtet zusätzlichen Schaden an. Die Teilung betroffener Knoten kostet Mineralien und Energie."
epoch_ii.124.desc.machine:0 "Eine Taktkaskade breitet sich von der Kammer auf resonanzempfindliche Welten aus. Planetare Abläufe und Forschungswarteschlangen geraten aus dem Takt; kritische Instabilität verursacht weitere Verwüstung. Die Sandbox-Isolierung kostet Legierungen und Energie."
epoch_ii.124.organic:0 "Die betroffene Biosphäre unter Quarantäne stellen."
epoch_ii.124.hive:0 "Betroffene Drohnengruppen abtrennen."
epoch_ii.124.machine:0 "Die betroffenen Prozesse isolieren."
epoch_ii.124.emergency:0 "Eine einmalige Notfallanlage bauen."
epoch_ii.126.name:0 "Das Kontrollfenster"
epoch_ii.126.desc.organic:0 "Der Schub hält an, doch die Kammer ist kurzzeitig kontrollierbar. Resonanzfeldkontrolle ermöglicht mit geringerem Materialeinsatz ein bemanntes Stabilisierungsprojekt. Ohne die Technologie bleibt eine teure Einmalanlage. Eine Fernbeobachtung ist die letzte sichere Ausweichroute."
epoch_ii.126.desc.hive:0 "Das geteilte Netzwerk gibt ein stabiles Intervall frei. Resonanzfeldkontrolle erlaubt eine kontrollierte Synchronisation; eine Wegwerfanlage ist teurer. Ein Fernprotokoll kann wenigstens ein begrenztes Gegenzeichen sichern."
epoch_ii.126.desc.machine:0 "Für die abschließende Kalibrierung steht ein begrenztes Zeitfenster offen. Resonanzfeldkontrolle senkt den Hardwarebedarf. Eine Einmalanlage kostet mehr und destabilisiert das planetare Netzwerk; eine Archivbeobachtung beendet den Einsatz mit hohem Energieaufwand."
epoch_ii.126.tech:0 "Mit Resonanzfeldkontrolle stabilisieren."
epoch_ii.126.array:0 "Eine Einmalanlage zur Eindämmung bauen."
epoch_ii.126.archive:0 "Die Kammer nach einer Fernbeobachtung versiegeln."
EPOCH_II_CHAMBER_CONTROL:0 "Die Resonanzkammer stabilisieren"
EPOCH_II_CHAMBER_CONTROL_DESC:0 "Ein bemanntes Wissenschaftsschiff stimmt die Kammer mit Feldkontrolle oder teuren Einmalsicherungen ab."
epoch_ii.128.name:0 "Das Gegenzeichen"
epoch_ii.128.desc.organic:0 "Ein Gegenzeichen wiederholt sich in der Hauptstadt-Narbe, an der Kammergrenze und im Unterdrückungssignal der Nullwächter. Die Muster hängen zusammen, doch ihr Ursprung bleibt unbekannt. Diese Entscheidung bestimmt dauerhaft Exposition, Forschung und Sicherheitslage des Reichs."
epoch_ii.128.desc.hive:0 "Das wiederkehrende Intervall passt zur alten Wunde des Schwarms und zum Unterdrückungssignal. Das Muster ist gemeinsam, sein Urheber bleibt unbekannt. Der Schwarm kann den Kanal bewahren, überwachen, umleiten oder trennen."
epoch_ii.128.desc.machine:0 "Das Gegenzeichen bestätigt eine Verbindung zwischen der ursprünglichen Aufzeichnung, der Kammer und dem Unterdrückungsfeld der Nullwächter. Urheber und Zweck bleiben offen. Wähle eine dauerhafte Netzwerkausrichtung."
epoch_ii.128.boundary:0 "Die Grenze bewahren."
epoch_ii.128.listen:0 "Unter Bewachung lauschen."
epoch_ii.128.outward:0 "Das Signal nach außen richten."
epoch_ii.128.break:0 "Das Instrument zerbrechen."
epoch_ii.129.name:0 "Die Kammeraufzeichnung ist versiegelt"
epoch_ii.129.desc.organic:0 "Der Kammereinsatz ist abgeschlossen. Hauptstadt-Narbe und Kontaminationsaufzeichnung bleiben mitsamt der gewählten Lösung erhalten. Das Gegenzeichen belegt ein gemeinsames Muster, nicht dessen Ursprung. Die Aufzeichnungen stehen für spätere Untersuchungen bereit; es wurde kein weiteres Signal geöffnet."
epoch_ii.129.desc.hive:0 "Die Kammer ist stillgelegt und der Schwarm bewahrt die Folgen der ursprünglichen Wunde. Das Gegenzeichen bestätigt ein gemeinsames Muster, aber keinen Urheber. Die Aufzeichnungen sind für spätere Untersuchungen versiegelt."
epoch_ii.129.desc.machine:0 "Der Kammerprozess ist beendet. Historische Kontamination und Abschlussnarbe bleiben unverändert. Das Gegenzeichen wird als ungeklärtes gemeinsames Signal archiviert."
epoch_ii.129.desc.boundary:0 "Die Kammer ist hinter einer überwachten Grenze versiegelt. Die Ursprungswelt ist gebunden, laufende Überwachung begrenzt die Exposition und eine Unterdrückungskarte ist für spätere Untersuchungen gesichert. Die Forschung bleibt eingeschränkt."
epoch_ii.129.desc.listen:0 "Ein bewachter Kanal bleibt mit geringer Leistung geöffnet. Die Ursprungswelt ist kontrolliert, aber verbunden. Forschungserträge steigen; dafür entstehen Sicherheitskosten und gelegentliche Zwischenfälle. Die umfangreichsten lokalen Messdaten bleiben erhalten."
epoch_ii.129.desc.outward:0 "Das Gegenzeichen wurde von der Ursprungswelt weggerichtet. Bereitschaft und Ortung der Flotte verbessern sich, doch das Reich ist nun im Netzwerk sichtbar und die Ursprungswelt bleibt aktiv. Die ausgehende Peilung ist dokumentiert."
epoch_ii.129.desc.break:0 "Das aktive Instrument wurde zerbrochen. Eine dauerhafte Kammer-Ruine mindert die Erträge der Ursprungswelt; frühere Planetenschäden bleiben bestehen. Das Archiv ist beschädigt, doch die unmittelbare Exposition sinkt."
epoch_ii.129.a:0 "Den Kampagnenbericht versiegeln."
epoch_ii.139.name:0 "Ein verbleibendes Intervall"
epoch_ii.139.desc.listen:0 "Der bewachte Kanal sendet ein kurzes, nicht autorisiertes Intervall zurück. Sicherheitskräfte können es mit Reserveenergie dämpfen; eine misslungene Unterdrückung belastet das aktive Überwachungsnetz."
epoch_ii.139.desc.outward:0 "Ein schwaches Echo kehrt entlang der ausgehenden Peilung zurück. Das Signal wurde bemerkt. Eine Neukalibrierung der Flottensensoren kostet Legierungen; ein ungelöster Abdruck birgt weitere Exposition."
epoch_ii.139.desc.break:0 "Ein schwaches Intervall flackert im beschädigten Archiv. Die Kammer ist zerstört, doch die Aufzeichnung koppelt weiterhin an die alte Narbe. Eine kleine Energiereserve kann sie isolieren."
epoch_ii.139.desc.boundary:0 "Die Überwachung registriert ein Restecho an der versiegelten Grenze. Es ist schwach, doch seine Unterdrückung kostet Reserveenergie oder weitere Netzwerkstabilität."
epoch_ii.139.a:0 "Den Nachhall eindämmen und den permanenten Bericht ergänzen."
epoch_ii_ending_boundary:0 "Überwachungsprotokoll der Grenze"
epoch_ii_ending_boundary_desc:0 "Fortlaufende Überwachung unterdrückt den lokalen Kanal und kostet Energie sowie Forschung."
epoch_ii_ending_guarded_listening:0 "Bewachter Resonanzkanal"
epoch_ii_ending_guarded_listening_desc:0 "Der aktive Kanal verbessert die Forschung, erfordert jedoch Sicherheitsausgaben und birgt Zwischenfallrisiken."
epoch_ii_ending_outward_signal:0 "Ausrichtung des Außensignals"
epoch_ii_ending_outward_signal_desc:0 "Das umgeleitete Signal verbessert Ortung und Feuerleitsysteme, macht das Reich sichtbarer und senkt die Stabilität."
epoch_ii_ending_broken_instrument:0 "Aufzeichnung der zerstörten Kammer"
epoch_ii_ending_broken_instrument_desc:0 "Das Instrument ist zerbrochen. Forschung und Legierungsertrag sinken; die Ursprungswelt trägt eine dauerhafte Ruine."
epoch_ii_ch7_crisis_scars:0 "Resonanznarben der Krise"
epoch_ii_ch7_crisis_scars_desc:0 "Planetare Abläufe bleiben nach dem Kammerschub beeinträchtigt."
epoch_ii_chamber_ruin:0 "Ruine der Resonanzkammer"
epoch_ii_chamber_ruin_desc:0 "Die Kammer wurde zerstört. Beschädigte Infrastruktur senkt dauerhaft Forschung und Energieertrag."
d_epoch_chamber_ruin:0 "Zerstörte Resonanzkammer"
tech_epoch_resonance_field_control:0 "Resonanzfeldkontrolle"
tech_epoch_resonance_field_control_desc:0 "Ein synchronisiertes Feldkontrollsystem begrenzt Resonanz, ohne sie vollständig auszulöschen. Es senkt den Hardwarebedarf zur Stabilisierung der Kammer und verbessert dauerhaft die Physikforschung. Das Verfahren eignet sich auch für andere instabile Feldsysteme."

tech_epoch_contamination_neutral_infrastructure:0 "Kontaminationsneutrale Infrastruktur"
tech_epoch_contamination_neutral_infrastructure_desc:0 "Ein modulares Normenpaket isoliert kontaminierte Prozesse in gewöhnlichen Industrie- und Forschungsnetzen, statt sie weiter zu versorgen. Die Gebäude helfen auf jeder Welt und bieten zusätzliche Eindämmungs- oder Resonanzeffekte an veränderten Standorten."
building_epoch_containment_infrastructure:0 "Eindämmungsinfrastruktur"
building_epoch_containment_infrastructure_desc:0 "Ein praktisches Normen- und Isolationszentrum, das die Gesellschaftsforschung des Reiches verbessert und auf lokale Resonanzzustände reagiert. Instabile Standorte liefern mehr Forschung, senken aber die Stabilität."
epoch_ii.66.a:0 "Ein bemanntes Wissenschaftsschiff zum stillen System entsenden."
epoch_ii.66.b:0 "Den Archivpfad nutzen und das System als ungeklärt markieren."
epoch_ii.77.retry_reflection:0 "200 Energie ausgeben, um die Reflexionsvermessung zu wiederholen."
epoch_ii.77.retry_interrupted:0 "200 Energie ausgeben, um die Vermessung des unterbrochenen Signals zu wiederholen."
epoch_ii.77.retry_silent:0 "200 Energie ausgeben, um die Vermessung des stillen Systems zu wiederholen."
epoch_ii.65.c:0 "Notfall-Teilauswertung der Archive."
epoch_ii.66.c:0 "Die Instrumente für eine Notfallauswertung überlasten."
epoch_ii.77.emergency:0 "Eine beschädigte Archivkopie nutzen."
d_epoch_resonance_contamination_active:0 "Aktive Resonanzkontamination"
d_epoch_resonance_contamination_active_desc:0 "Die aktive Kontamination senkt die Stabilität und die Produktion lokaler Arbeitsplätze."
d_epoch_resonance_contamination_worsened:0 "Verschlimmerte Resonanzkontamination"
d_epoch_resonance_contamination_worsened_desc:0 "Nach einer gescheiterten oder vernachlässigten Untersuchung hat sich die Kontamination verschärft. Ihre Folgen sind schwerwiegender und können sich ausbreiten."
d_epoch_resonance_contamination_studied:0 "Untersuchte Resonanzkontamination"
d_epoch_resonance_contamination_studied_desc:0 "Die Probenahme hat die Störung verringert. Eine geringe, reichstypische wirtschaftliche Belastung bleibt bestehen."
d_epoch_resonance_contamination_contained:0 "Eingedämmte Resonanzkontamination"
d_epoch_resonance_contamination_contained_desc:0 "Die aktive Kontamination wurde eingedämmt. Ihre Geschichte bleibt hier verzeichnet; die früheren planetaren Mali sind aufgehoben."
d_epoch_resonance_contamination_latent:0 "Latente Resonanz"
d_epoch_resonance_contamination_latent_desc:0 "Eine latente Resonanz steigert die Physikforschung leicht und senkt die Stabilität. Eine ungelöste Kontamination aus früheren Untersuchungen wirkt weiter."
d_epoch_resonance_contamination_resonant:0 "Aktive Resonanz"
d_epoch_resonance_contamination_resonant_desc:0 "Die Resonanz steigert die Physikforschung, senkt jedoch Stabilität und allgemeine Arbeitsproduktion. Eine ungelöste Kontamination aus früheren Untersuchungen wirkt weiter."
d_epoch_resonance_contamination_unstable:0 "Instabile Resonanz"
d_epoch_resonance_contamination_unstable_desc:0 "Die instabile Resonanz steigert die Physikforschung stark, senkt aber Stabilität und Arbeitsproduktion erheblich. Eine ungelöste Kontamination aus früheren Untersuchungen wirkt weiter."
d_epoch_resonance_contamination_controlled:0 "Kontrollierte Resonanz"
d_epoch_resonance_contamination_controlled_desc:0 "Die kontrollierte Resonanz verbessert Physikforschung, allgemeine Arbeitsproduktion und Stabilität. Eine ungelöste Kontamination aus früheren Untersuchungen wirkt weiter."
d_epoch_resonance_scar:0 "Aktive Resonanznarbe"
d_epoch_resonance_scar_desc:0 "Die dauerhafte Narbe senkt Stabilität und die reichstypische Produktion lokaler Arbeitsplätze."
d_epoch_resonance_scar_altered:0 "Veränderte Resonanznarbe"
d_epoch_resonance_scar_altered_desc:0 "Die Narbe hat sich verändert. Ihre Folgen sind geringer, doch der ursprüngliche Schaden ist nicht vollständig geheilt."
d_epoch_resonance_scar_healed:0 "Geheilte Resonanznarbe"
d_epoch_resonance_scar_healed_desc:0 "Die Resonanznarbe ist verheilt. Das dauerhafte planetare Produktionsmali wirkt nicht länger."
