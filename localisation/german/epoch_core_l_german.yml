l_german:
 epoch_core.2.name:0 "Das erste Echo"
 epoch_core.2.desc:0 "In unseren Tiefraumobservatorien ist ein schmalbandiger Impuls aufgetaucht. Er wiederholt sich in Abständen, die zu gezielt wirken, um bloßes Messrauschen zu sein. Doch jeder Versuch, ihn zurückzuverfolgen, endet im leeren Raum. Vorerst wissen wir nur, dass das Signal zuvor nicht da war."
 epoch_core.2.a:0 "Eine vorsichtige wissenschaftliche Vergleichsbasis erstellen."
 epoch_core.2.b:0 "Die Quelle mit einem Hochleistungsarray triangulieren."
 epoch_core.2.c:0 "Die Akte schließen und die EPOCH-Kampagne verlassen."
 epoch_core.3.name:0 "Das Signal hinterlässt eine Spur"
 epoch_core.3.desc.cautious:0 "Ein schwaches, wiederkehrendes Echo ist in den Aufzeichnungen des Observatoriums geblieben. Wir können Energie in einen kalibrierten Langbasis-Scan investieren oder bei passiven Instrumenten bleiben und die Analyse länger dauern lassen. Die Kalibrierung beschleunigt die Untersuchung und könnte uns später helfen, ein vermisstes Forschungsteam aufzuspüren."
 epoch_core.3.desc.aggressive:0 "Das Array hat das Signal auf einen wandernden Himmelsausschnitt eingegrenzt. Es weiter zu verfolgen kostet Energie und kann unsere Reserven belasten; eine Drosselung ist sicherer, hinterlässt aber eine langsamere und ungenauere Suche."
 epoch_core.3.a:0 "Die Langbasis-Instrumente kalibrieren (100 Energie; +5 monatlicher Fortschritt; schaltet eine Rettungsmethode frei)."
 epoch_core.3.b:0 "Bei der passiven Vergleichsbasis bleiben."
 epoch_core.3.c:0 "Die Hochleistungsverfolgung beibehalten (250 Energie; +10 monatlicher Fortschritt; schaltet eine riskante Bergungsmethode frei)."
 epoch_core.3.d:0 "Das Array drosseln (5 monatlicher Fortschritt; keine laufenden Energiekosten)."
 epoch_core.4.name:0 "Ein geduldiges Muster"
 epoch_core.4.desc:0 "Monatelange sorgfältige Vergleiche enthüllen einen zweiten Impuls, verborgen zwischen den Wiederholungen des ersten. Er enthält keine klare Botschaft, nur einen präzisen Abstand, den unsere Archive nun wiedererkennen."
 epoch_core.4.a:0 "Ein unauffälliges Langbasis-Forschungsteam entsenden."
 epoch_core.5.name:0 "Koordinaten im Rauschen"
 epoch_core.5.desc:0 "Der Hochleistungsscan liefert eine enge Richtung und einen Teil eines wiederkehrenden Koordinatenmusters. Zwischen den Beobachtungen hat sich die Quelle bewegt. Die Daten sind nützlich, doch das Array hat unsere Reserven stark beansprucht."
 epoch_core.5.a:0 "Ein Forschungsschiff entlang der geborgenen Koordinaten entsenden."
 epoch_core.6.name:0 "Die vermisste Expedition"
 epoch_core.6.desc.cautious:0 "Das Langbasis-Forschungsteam hat zwei Rückmeldungen versäumt. Die letzte Telemetrie zeigt ein klares, gleichmäßiges Signal, bis die Übertragung mitten im Satz abbricht. Ein Notruf folgte nicht."
 epoch_core.6.desc.aggressive:0 "Das entlang der geborgenen Peilung entsandte Forschungsschiff ist von allen Sensoren verschwunden. Seine letzte Übertragung endet mit einem Schwall Energiewerten und einer Stille, die nicht zu einem gewöhnlichen Kommunikationsausfall passt."
 epoch_core.6.desc.throttled:0 "Mit gedrosseltem Array ließ sich keine stabile Spur halten. Die letzte Position des Forschungsschiffs ist unsicher, und in der abschließenden Übertragung fehlt ein Stück Navigationsprotokoll."
 epoch_core.6.desc.standard:0 "Das Forschungsschiff hat seine Rückmeldung versäumt. Seine letzte bekannte Position liegt am Rand der verblassenden Signalspur; die Telemetrie endet ohne Notruf und ohne Aufprallspuren."
 epoch_core.6.a:0 "Die letzte bekannte Position rekonstruieren."
 epoch_core.7.name:0 "Die letzte bekannte Position"
 epoch_core.7.desc.calibrated:0 "Die kalibrierten Abstände zeigen einen schmalen Rückkehrpfad. Es gibt keinen Peilsender, nur einen regelmäßigen Impuls knapp hinter den letzten Koordinaten des Schiffs."
 epoch_core.7.desc.overdrive:0 "Die Hochleistungsmessungen weisen auf eine kurzlebige Öffnung in der Signalspur hin. Sie könnte einen Zugang bieten – oder der Grund sein, warum das Forschungsschiff nicht zurückkehrte."
 epoch_core.7.desc.throttled:0 "Mit gedrosseltem Array driften die letzten Koordinaten über ein weites Suchgebiet. Ein schwaches Objekt bewegt sich vor dem lokalen Sternenfeld, zu langsam für ein vorbeifliegendes Schiff."
 epoch_core.7.desc.standard:0 "An den letzten Koordinaten herrscht Stille. Einige Trümmer und eine unerklärliche Lücke in der Telemetrie sind die einzigen Hinweise für die Suche."
 epoch_core.7.a:0 "Mit der kalibrierten Basis eine risikoarme Rettung versuchen (100 Energie)."
 epoch_core.7.b:0 "Ein Hochleistungs-Bergungsfenster erzwingen (250 Energie)."
 epoch_core.7.c:0 "Mit dem gedrosselten Array den driftenden Koordinaten folgen."
 epoch_core.7.d:0 "Das Gebiet langsam absuchen und die Rettungsteams auf Abstand halten."
 epoch_core.7.e:0 "Die Suche abbrechen und die Expedition als vermisst registrieren."
 epoch_core.8.name:0 "Was die Stille zurückließ"
 epoch_core.8.desc.survivors:0 "Die kalibrierte Suche findet das Forschungsteam in einer versiegelten Rettungskapsel. Die Besatzung lebt, ist desorientiert und kann die fehlende Zeitspanne nicht erklären. Das Schiff bleibt verschwunden."
 epoch_core.8.desc.recorder:0 "Die Hochleistungsbergung findet den Datenrekorder des Forschungsschiffs, aber nicht die Besatzung. Das Schiff selbst fehlt an den Koordinaten. Im geborgenen Signalprotokoll erscheint genau beim Kontaktverlust ein zweiter Impuls."
 epoch_core.8.desc.hull:0 "Die driftende Suche findet den leeren Rumpf des Forschungsschiffs. Seine Uhren gehen mehrere Tage auseinander, und im Navigationsprotokoll fehlt dieselbe Zeitspanne wie in der ursprünglichen Telemetrie. Die Besatzung ist nicht an Bord."
 epoch_core.8.desc.survey:0 "Die langsame Suche findet weder Schiff noch Besatzung. Am Rand des Suchgebiets messen die Instrumente eine kurze Verzerrung mit demselben zeitlichen Muster wie das erste Echo."
 epoch_core.8.desc.abandoned:0 "Die Suche wird eingestellt. Die Expedition bleibt vermisst; ihre letzte Position wird ohne weitere Untersuchung im Archiv versiegelt."
 epoch_core.8.a:0 "Die geborgenen Beweise archivieren."
 epoch_core.9.name:0 "Eine Lücke im Protokoll"
 epoch_core.9.desc.survivors:0 "Die gerettete Besatzung beschreibt unabhängig voneinander dieselbe fehlende Zeitspanne. Niemand erinnert sich, was darin geschah, doch alle hörten den Signalgeber weiter pulsieren."
 epoch_core.9.desc.recorder:0 "Eine spätere Auswertung des geborgenen Rekorders isoliert den zweiten Impuls. Er beginnt, bevor die Expedition den Kontakt verliert – als hätte das Signal die Route bereits vorausgesehen."
 epoch_core.9.desc.hull:0 "Die Uhrabweichung des leeren Rumpfs und die Navigationslücke stimmen überein, nicht aber mit den umliegenden Systemen. Die fehlende Zeit ist nun messbarer Teil des Falls."
 epoch_core.9.desc.survey:0 "Die kurze Verzerrung aus der langsamen Suche wiederholt sich in einem engen Zeitfenster. An den Instrumenten bleibt nur der genaue Abstand zwischen den Impulsen zurück."
 epoch_core.9.desc.abandoned:0 "Der versiegelte Bericht hält die letzte bekannte Position und den Zeitpunkt des Kontaktverlusts fest. Die Expedition bleibt ungeklärt, doch ihr Verlust ist nun dokumentiert."
 epoch_core.9.a:0 "Den Bericht der Besatzung archivieren."
 epoch_core.9.b:0 "Die geborgene Signalspur sichern."
 epoch_core.9.c:0 "Die Navigationslücke vermerken."
 epoch_core.9.d:0 "Das Verzerrungsmuster für spätere Vergleiche sichern."
 epoch_core.9.e:0 "Den versiegelten Verlustbericht aufbewahren."
 epoch_first_echo_investigation:0 "Das erste Echo"
 epoch_first_echo_investigation_desc:0 "Der Impuls ist verstummt, doch seine Abstände und schwachen Echos sind noch in den Aufzeichnungen der Observatorien zu finden. Zuerst vergleichen die Analysten die Zeitpunkte, dann grenzen sie anhand des Musters das Suchgebiet ein. Jeder Durchgang bringt neue Hinweise – und lässt den Ursprung doch knapp außerhalb der Gewissheit."
 epoch_first_echo_phase_signal:0 "Phase I: Impulsabstände vergleichen; Kalibrierung, Overdrive und Drosselung verändern Tempo und spätere Expeditionsoptionen."
 epoch_first_echo_phase_source:0 "Phase II: Dem Restmuster folgen; die gewählte Methode bestimmt den Hinweis."
